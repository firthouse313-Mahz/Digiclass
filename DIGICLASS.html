   ]],
   ["Practice with solutions",[
      ["solve",[["Find the principal value of tan⁻¹(√3).", "Principal range of tan⁻¹ is (−π/2, π/2). Which angle there has tan = √3?", ["tan(π/3) = √3 and π/3 lies in (−π/2, π/2)."], "π/3"], ["Find tan⁻¹(1) + cos⁻¹(−1/2) + sin⁻¹(−1/2).", "Use cos⁻¹(−x) = π − cos⁻¹x and sin⁻¹(−x) = −sin⁻¹x.", ["tan⁻¹1 = π/4.", "cos⁻¹(−½) = π − π/3 = 2π/3.", "sin⁻¹(−½) = −π/6.", "Sum = 3π/12 + 8π/12 − 2π/12 = 9π/12."], "3π/4"], ["Find the principal value of cos⁻¹(cos 7π/6).", "cos⁻¹(cos θ) = θ only if θ ∈ [0, π]. 7π/6 is outside, so rewrite.", ["cos(7π/6) = cos(2π − 7π/6) = cos(5π/6).", "5π/6 ∈ [0, π], so cos⁻¹(cos 5π/6) = 5π/6."], "5π/6"], ["State the domain and range of sec⁻¹x.", "sec x = 1/cos x, so |sec x| ≥ 1, and π/2 is excluded.", ["Domain: |x| ≥ 1, i.e. R − (−1, 1).", "Range: [0, π] − {π/2}."], "Domain R − (−1, 1); range [0, π] − {π/2}"]]]
    ]]
  ]},

{ id:"ma12-matrices", unit:2, title:"Matrices",
  intro:"Types of matrices, matrix operations, transpose, symmetric and skew-symmetric matrices, and invertible matrices.",
  sec:[
   ["Order and types",[
     ["p","A matrix with m rows and n columns has **order m × n**. Types: row, column, square, diagonal, scalar, **identity (I)** and **zero (O)**. Two matrices are equal when they have the same order and equal corresponding entries."]
   ]],
   ["Operations",[
     ["ul",["Addition: only for matrices of the same order; add matching entries.","Scalar multiplication: multiply every entry by k.","Multiplication AB: possible when columns of A = rows of B. If A is m × n and B is n × p, AB is m × p."]],
     ["mat",[["A =",[["1","2"],["3","4"]]],["B =",[["2","0"],["1","3"]]]]],
     ["mat",[["AB =",[["4","6"],["10","12"]]],["BA =",[["2","4"],["10","14"]]]]],
     ["p","So AB ≠ BA: matrix multiplication is **not commutative**. Also AB = O is possible even when A ≠ O and B ≠ O."]
   ]],
   ["Transpose, symmetric and skew-symmetric",[
     ["f",["(A′)′ = A,   (A + B)′ = A′ + B′,   (kA)′ = kA′,   (AB)′ = B′A′","Symmetric: A′ = A        Skew-symmetric: A′ = −A","A = ½(A + A′) + ½(A − A′)"]],
     ["p","Every diagonal entry of a skew-symmetric matrix is **0**. Every square matrix is the sum of a symmetric and a skew-symmetric matrix."]
   ]],
   ["Invertible matrices",[
     ["p","A square matrix A is invertible if there is B with **AB = BA = I**. Then B = A⁻¹. The inverse, if it exists, is **unique**: if B and C are both inverses, B = BI = B(AC) = (BA)C = IC = C."]
   ]],
   ["Practice with solutions",[
      ["solve",[["If A is 2 × 3 and B is 3 × 4, what is the order of AB? Is BA defined?", "(m × n)(n × p) = m × p. The inner numbers must match.", ["AB: (2 × 3)(3 × 4) → inner 3 = 3 ✓, order 2 × 4.", "BA: (3 × 4)(2 × 3) → inner 4 ≠ 2 ✗."], "AB is 2 × 4; BA is not defined"], ["Express [[3, 5], [1, −1]] as the sum of a symmetric and a skew-symmetric matrix.", "P = ½(A + A′) is symmetric, Q = ½(A − A′) is skew-symmetric.", ["A′ = [[3, 1], [5, −1]].", "P = ½[[6, 6], [6, −2]] = [[3, 3], [3, −1]].", "Q = ½[[0, 4], [−4, 0]] = [[0, 2], [−2, 0]].", "Check: P + Q = [[3, 5], [1, −1]] = A ✓"], "A = [[3, 3], [3, −1]] + [[0, 2], [−2, 0]]"], ["Give an example of two non-zero 2 × 2 matrices whose product is zero.", "Use matrices with many zeros.", ["Let A = [[0, 1], [0, 0]] and B = [[1, 0], [0, 0]].", "AB: row 1 · col 1 = 0·1 + 1·0 = 0; all other entries are also 0."], "AB = O although A ≠ O and B ≠ O"], ["Show that (AB)′ = B′A′ for two matrices of your choice.", "Pick small 2 × 2 matrices and work out both sides.", ["A = [[1, 2], [3, 4]], B = [[2, 0], [1, 3]].", "AB = [[4, 6], [10, 12]] ⇒ (AB)′ = [[4, 10], [6, 12]].", "B′ = [[2, 1], [0, 3]], A′ = [[1, 3], [2, 4]].", "B′A′ = [[2+2, 6+4], [0+6, 0+12]] = [[4, 10], [6, 12]] ✓"], "(AB)′ = B′A′ verified"]]]
    ]]
  ]},

{ id:"ma12-determinants", unit:2, title:"Determinants",
  intro:"Determinants up to 3 × 3, minors and cofactors, area of a triangle, adjoint and inverse, and solving linear equations.",
  sec:[
   ["Value of a determinant",[
     ["f",["|a b; c d| = ad − bc","3 × 3: expand along any row or column using cofactors"]],
     ["p","**Minor** Mᵢⱼ is the determinant left after deleting row i and column j. **Cofactor** Aᵢⱼ = (−1)ⁱ⁺ʲ Mᵢⱼ."]
   ]],
   ["Area of a triangle",[
     ["f",["Area = ½ | x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) |"]],
     ["p","This is half the absolute value of the determinant with rows (x₁, y₁, 1), (x₂, y₂, 1), (x₃, y₃, 1). If the area is 0, the points are **collinear**."]
   ]],
   ["Adjoint and inverse",[
     ["f",["adj A = transpose of the matrix of cofactors","A (adj A) = (adj A) A = |A| I","A⁻¹ = (1/|A|) adj A,  only if |A| ≠ 0"]],
     ["mat",[["A =",[["2","3"],["1","4"]]],["adj A =",[["4","−3"],["−1","2"]]],["A⁻¹ = ⅕",[["4","−3"],["−1","2"]]]]],
     ["p","A matrix with |A| ≠ 0 is **non-singular**; with |A| = 0 it is **singular** and has no inverse."]
   ]],
   ["Solving linear equations: AX = B",[
     ["ul",["|A| ≠ 0: **consistent** with a unique solution X = A⁻¹B.","|A| = 0 and (adj A)B ≠ O: **inconsistent** (no solution).","|A| = 0 and (adj A)B = O: either infinitely many solutions or none; check further."]],
     ["p","Example: 2x + 5y = 1, 3x + 2y = 7 has |A| = −11, so X = A⁻¹B gives **x = 3, y = −1**."]
   ]],
   ["Practice with solutions",[
      ["solve",[["Evaluate |2 4; −1 2|.", "|a b; c d| = ad − bc.", ["= 2 × 2 − 4 × (−1) = 4 + 4."], "8"], ["Find the area of the triangle with vertices (1, 0), (6, 0) and (4, 3).", "Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|.", ["= ½ |1(0 − 3) + 6(3 − 0) + 4(0 − 0)|", "= ½ |−3 + 18| = 15/2"], "15/2 square units"], ["Find the inverse of [[2, 3], [1, 4]].", "A⁻¹ = (1/|A|) adj A. For 2 × 2: swap a and d, change signs of b and c.", ["|A| = 2 × 4 − 3 × 1 = 5 ≠ 0.", "adj A = [[4, −3], [−1, 2]].", "A⁻¹ = (1/5)[[4, −3], [−1, 2]]."], "A⁻¹ = (1/5)[[4, −3], [−1, 2]]"], ["Solve x − y + z = 4, 2x + y − 3z = 0, x + y + z = 2 using the matrix method.", "Write AX = B, find |A| and adj A, then X = A⁻¹B.", ["A = [[1, −1, 1], [2, 1, −3], [1, 1, 1]], B = [4, 0, 2]ᵀ.", "|A| = 1(1 + 3) + 1(2 + 3) + 1(2 − 1) = 4 + 5 + 1 = 10 ≠ 0.", "adj A = [[4, 2, 2], [−5, 0, 5], [1, −2, 3]].", "X = (1/10)[[4, 2, 2], [−5, 0, 5], [1, −2, 3]][4, 0, 2]ᵀ = (1/10)[20, −10, 10]ᵀ."], "x = 2, y = −1, z = 1"]]]
    ]]
  ]},

{ id:"ma12-continuity", unit:3, title:"Continuity and differentiability",
  intro:"Continuity, differentiability, the chain rule, implicit, logarithmic and parametric differentiation, and second derivatives.",
  sec:[
   ["Continuity",[
     ["p","f is **continuous at c** if lim(x→c) f(x) = f(c), i.e. left-hand limit = right-hand limit = f(c). Every differentiable function is continuous, but not conversely: |x| is continuous at 0 but **not differentiable** there."]
   ]],
   ["Standard derivatives",[
     ["f",["d/dx (eˣ) = eˣ,   d/dx (log x) = 1/x","d/dx (sin⁻¹x) = 1/√(1 − x²)","d/dx (cos⁻¹x) = −1/√(1 − x²)","d/dx (tan⁻¹x) = 1/(1 + x²)","Chain rule: d/dx f(g(x)) = f′(g(x)) · g′(x)"]],
     ["p","Example: d/dx sin(x²) = 2x cos(x²)."]
   ]],
   ["Implicit, logarithmic and parametric",[
     ["ul",["**Implicit**: differentiate both sides with respect to x, treating y as a function of x, then solve for dy/dx.","**Logarithmic**: take log of both sides first. Useful for xˣ or long products. For y = xˣ: log y = x log x, so dy/dx = xˣ(1 + log x).","**Parametric**: if x = f(t), y = g(t), then dy/dx = (dy/dt)/(dx/dt). For x = a cos θ, y = a sin θ: dy/dx = −cot θ."]]
   ]],
   ["Second order derivatives",[
     ["p","d²y/dx² is the derivative of dy/dx. Example: y = x³ gives dy/dx = 3x² and d²y/dx² = 6x."]
   ]],
   ["Practice with solutions",[
      ["solve",[["Find k so that f(x) = kx + 1 (x ≤ 5) and 3x − 5 (x > 5) is continuous at x = 5.", "Continuous at 5 means LHL = RHL = f(5).", ["LHL = f(5) = 5k + 1.", "RHL = 3(5) − 5 = 10.", "5k + 1 = 10 ⇒ k = 9/5."], "k = 9/5"], ["Find dy/dx if x² + xy + y² = 100.", "Differentiate every term with respect to x; y terms get a dy/dx.", ["2x + (x dy/dx + y) + 2y dy/dx = 0", "dy/dx (x + 2y) = −(2x + y)"], "dy/dx = −(2x + y)/(x + 2y)"], ["Differentiate xˣ with respect to x.", "Variable power: take log first (logarithmic differentiation).", ["y = xˣ ⇒ log y = x log x.", "(1/y) dy/dx = x · (1/x) + log x = 1 + log x.", "dy/dx = y(1 + log x)."], "xˣ(1 + log x)"], ["If y = 3 cos(log x) + 4 sin(log x), show that x²y″ + xy′ + y = 0.", "Find y′, multiply by x to clear the fraction, then differentiate again.", ["y′ = [−3 sin(log x) + 4 cos(log x)]/x ⇒ xy′ = −3 sin(log x) + 4 cos(log x).", "Differentiate: xy″ + y′ = [−3 cos(log x) − 4 sin(log x)]/x = −y/x.", "Multiply by x: x²y″ + xy′ = −y ⇒ x²y″ + xy′ + y = 0."], "Proved"]]]
    ]]
  ]},

{ id:"ma12-app-derivatives", unit:3, title:"Applications of derivatives",
  intro:"Rate of change, increasing and decreasing functions, and finding maxima and minima.",
  sec:[
   ["Rate of change",[
     ["p","dy/dx is the rate of change of y with respect to x. If both depend on time t: dy/dt = (dy/dx)(dx/dt)."],
     ["p","Example: the radius of a circle grows at 0.7 cm/s. When r = 4.9 cm, dA/dt = 2πr (dr/dt) = 2π(4.9)(0.7) = **6.86π cm²/s**."]
   ]],
   ["Increasing and decreasing",[
     ["f",["f′(x) > 0 on an interval ⇒ f is increasing","f′(x) < 0 on an interval ⇒ f is decreasing"]],
     ["p","Find the points where f′(x) = 0, split the number line there, and check the sign of f′ in each part."]
   ]],
   ["Maxima and minima",[
     ["ul",["**Critical points**: where f′(c) = 0 (or f′ does not exist).","**First derivative test**: f′ changes + to − ⇒ local maximum; − to + ⇒ local minimum.","**Second derivative test**: f′(c) = 0 and f″(c) < 0 ⇒ local maximum; f″(c) > 0 ⇒ local minimum.","On a closed interval [a, b], compare f at critical points **and** endpoints for the absolute max and min."]],
     ["p","Example: f(x) = x³ − 3x. f′ = 3x² − 3 = 0 at x = ±1. f″ = 6x: at x = 1, local min f = −2; at x = −1, local max f = 2."]
   ]],
   ["Practice with solutions",[
      ["solve",[["Find the intervals where f(x) = x³ − 3x is increasing or decreasing.", "Find f′(x), its zeros, and test the sign in each interval.", ["f′(x) = 3x² − 3 = 3(x − 1)(x + 1); zeros at x = −1, 1.", "x < −1: f′ > 0. −1 < x < 1: f′ < 0. x > 1: f′ > 0."], "Increasing on (−∞, −1) ∪ (1, ∞); decreasing on (−1, 1)"], ["Find two positive numbers whose sum is 24 and whose product is maximum.", "Let one number be x; write the product in one variable, then P′ = 0 and P″ < 0.", ["Numbers x and 24 − x: P = 24x − x².", "P′ = 24 − 2x = 0 ⇒ x = 12.", "P″ = −2 < 0 ⇒ maximum."], "12 and 12 (product 144)"], ["A balloon's volume increases at 25 cm³/s. How fast is the radius increasing when r = 10 cm?", "V = (4/3)πr³. Differentiate with respect to t, then substitute.", ["dV/dt = 4πr² dr/dt.", "25 = 4π(10)² dr/dt = 400π dr/dt.", "dr/dt = 25/(400π)."], "1/(16π) cm/s"], ["Find the absolute maximum and minimum of f(x) = 2x³ − 15x² + 36x + 1 on [1, 5].", "Find critical points inside [1, 5], then compare f at those points and the end points.", ["f′(x) = 6x² − 30x + 36 = 6(x − 2)(x − 3) ⇒ x = 2, 3.", "f(1) = 24, f(2) = 29, f(3) = 28, f(5) = 56."], "Absolute max 56 at x = 5; absolute min 24 at x = 1"]]]
    ]]
  ]},

{ id:"ma12-integrals", unit:3, title:"Integrals",
  intro:"Integration as anti-differentiation, methods of integration, the standard special integrals and definite integrals.",
  sec:[
   ["Standard integrals",[
     ["f",["∫ xⁿ dx = xⁿ⁺¹/(n + 1) + C   (n ≠ −1)","∫ 1/x dx = log|x| + C,   ∫ eˣ dx = eˣ + C","∫ sin x dx = −cos x + C,   ∫ cos x dx = sin x + C,   ∫ sec²x dx = tan x + C"]]
   ]],
   ["Methods of integration",[
     ["ul",["**Substitution**: put t = g(x), so dt = g′(x) dx. Example: ∫ 2x/(1 + x²) dx = log(1 + x²) + C.","**Partial fractions**: split a rational function into simpler fractions before integrating.","**By parts**: ∫ u v dx = u ∫v dx − ∫ (u′ ∫v dx) dx. Choose u using **ILATE** (Inverse, Log, Algebraic, Trig, Exponential). Example: ∫ x eˣ dx = x eˣ − eˣ + C."]]
   ]],
   ["Special integrals",[
     ["f",["∫ dx/(x² + a²) = (1/a) tan⁻¹(x/a) + C","∫ dx/(x² − a²) = (1/2a) log|(x − a)/(x + a)| + C","∫ dx/(a² − x²) = (1/2a) log|(a + x)/(a − x)| + C","∫ dx/√(a² − x²) = sin⁻¹(x/a) + C","∫ dx/√(x² ± a²) = log|x + √(x² ± a²)| + C","∫ √(a² − x²) dx = (x/2)√(a² − x²) + (a²/2) sin⁻¹(x/a) + C","∫ √(x² + a²) dx = (x/2)√(x² + a²) + (a²/2) log|x + √(x² + a²)| + C","∫ √(x² − a²) dx = (x/2)√(x² − a²) − (a²/2) log|x + √(x² − a²)| + C"]],
     ["p","For ax² + bx + c in the denominator or under a root, **complete the square** to reach one of these forms. For (px + q), write px + q = A·d/dx(ax² + bx + c) + B."]
   ]],
   ["Definite integrals",[
     ["f",["∫ₐᵇ f(x) dx = F(b) − F(a)   (Fundamental Theorem of Calculus)","∫ₐᵇ f(x) dx = − ∫ (from b to a) f(x) dx","∫ₐᵇ f(x) dx = ∫ₐᶜ f(x) dx + ∫ (from c to b) f(x) dx","∫ₐᵇ f(x) dx = ∫ₐᵇ f(a + b − x) dx,   ∫₀ᵃ f(x) dx = ∫₀ᵃ f(a − x) dx","∫₋ₐᵃ f(x) dx = 2∫₀ᵃ f(x) dx if f is even;  = 0 if f is odd"]]
   ]],
   ["Practice with solutions",[
      ["solve",[["Find ∫ dx/(x² + 4x + 8).", "Complete the square, then use ∫ dx/(X² + a²) = (1/a) tan⁻¹(X/a).", ["x² + 4x + 8 = (x + 2)² + 4 = (x + 2)² + 2².", "a = 2, X = x + 2."], "½ tan⁻¹((x + 2)/2) + C"], ["Find ∫ x log x dx.", "By parts, ILATE: u = log x (L comes before A), dv = x dx.", ["∫ x log x dx = log x · x²/2 − ∫ (1/x)(x²/2) dx", "= (x²/2) log x − ∫ x/2 dx"], "(x²/2) log x − x²/4 + C"], ["Evaluate ∫₀^(π/2) sin x/(sin x + cos x) dx.", "Use ∫₀ᵃ f(x) dx = ∫₀ᵃ f(a − x) dx, then add the two forms.", ["Replace x by π/2 − x: I = ∫₀^(π/2) cos x/(cos x + sin x) dx.", "Add: 2I = ∫₀^(π/2) (sin x + cos x)/(sin x + cos x) dx = ∫₀^(π/2) 1 dx = π/2."], "I = π/4"], ["Evaluate ∫₋₁¹ x³ dx without integrating.", "If f(−x) = −f(x) (odd function), then ∫₋ₐᵃ f(x) dx = 0.", ["f(x) = x³ ⇒ f(−x) = −x³ = −f(x), so f is odd."], "0"]]]
    ]]
  ]},

{ id:"ma12-app-integrals", unit:3, title:"Applications of integrals",
  intro:"Finding the area under simple curves: lines, circles, parabolas and ellipses in standard form.",
  sec:[
   ["Area under a curve",[
     ["f",["Area between y = f(x), the x-axis, x = a and x = b:  A = ∫ₐᵇ y dx","Area between x = g(y), the y-axis, y = c and y = d:  A = ∫ (from c to d) x dy"]],
     ["p","If the curve lies below the x-axis, the integral is negative; take its **absolute value** for the area."]
   ]],
   ["Standard results",[
     ["f",["Circle x² + y² = a²:  area = πa²","Ellipse x²/a² + y²/b² = 1:  area = 4∫₀ᵃ (b/a)√(a² − x²) dx = πab"]],
     ["tip","Exam habit","Always sketch the region first and use symmetry. Multiply the area of one quadrant by 4 when the curve is symmetric about both axes."]
   ]],
   ["Practice with solutions",[
      ["solve",[["Find the area under y = x² from x = 0 to x = 2.", "Area = ∫ y dx between the limits.", ["∫₀² x² dx = [x³/3]₀² = 8/3 − 0."], "8/3 square units"], ["Find the area bounded by y² = 9x, x = 2, x = 4 and the x-axis in the first quadrant.", "In the first quadrant y = 3√x. Integrate from 2 to 4.", ["Area = ∫₂⁴ 3√x dx = 3 · (2/3)[x^(3/2)]₂⁴.", "= 2(4^(3/2) − 2^(3/2)) = 2(8 − 2√2)."], "16 − 4√2 square units"], ["Find the area of the ellipse x²/16 + y²/9 = 1.", "Area of the ellipse x²/a² + y²/b² = 1 is πab (4 × the first-quadrant area).", ["a = 4, b = 3.", "Area = π × 4 × 3."], "12π square units"], ["Find the area bounded by x² = 4y, y = 2, y = 4 and the y-axis in the first quadrant.", "Region is bounded by the y-axis, so integrate x dy. From x² = 4y, x = 2√y.", ["Area = ∫₂⁴ 2√y dy = 2 · (2/3)[y^(3/2)]₂⁴.", "= (4/3)(8 − 2√2)."], "(32 − 8√2)/3 square units"]]]
    ]]
  ]},

{ id:"ma12-diff-eq", unit:3, title:"Differential equations",
  intro:"Order and degree, general and particular solutions, and solving separable, homogeneous and linear equations.",
  sec:[
   ["Order and degree",[
     ["p","**Order** is the order of the highest derivative. **Degree** is the power of that highest derivative when the equation is a polynomial in its derivatives. If it isn't a polynomial in derivatives (e.g. contains sin(dy/dx)), the degree is **not defined**."],
     ["p","A **general solution** has arbitrary constants; a **particular solution** has values found from given conditions."]
   ]],
   ["Variables separable",[
     ["p","Rewrite as f(y) dy = g(x) dx and integrate both sides."],
     ["f",["dy/dx = (1 + y²)/(1 + x²)  ⇒  tan⁻¹y = tan⁻¹x + C"]]
   ]],
   ["Homogeneous equations",[
     ["p","If dy/dx = F(y/x), put **y = vx**, so dy/dx = v + x dv/dx, then separate the variables v and x."]
   ]],
   ["Linear equations",[
     ["f",["dy/dx + Py = Q:   I.F. = e^(∫P dx),   y · I.F. = ∫ Q · I.F. dx + C","dx/dy + P₁x = Q₁:   I.F. = e^(∫P₁ dy),   x · I.F. = ∫ Q₁ · I.F. dy + C"]],
     ["p","Example: dy/dx + y/x = x². I.F. = e^(log x) = x, so yx = ∫ x³ dx = x⁴/4 + C, giving y = x³/4 + C/x."]
   ]],
   ["Practice with solutions",[
      ["solve",[["Find the order and degree of (y″)³ + (y′)² + sin(y′) + 1 = 0.", "Order = highest derivative. Degree exists only if the equation is a polynomial in the derivatives.", ["Highest derivative is y″ ⇒ order 2.", "sin(y′) is not a polynomial in y′ ⇒ degree not defined."], "Order 2, degree not defined"], ["Solve dy/dx = y/x.", "Variables separable: get y with dy and x with dx.", ["dy/y = dx/x.", "log|y| = log|x| + log C.", "y = Cx."], "y = Cx"], ["Solve (x² + xy) dy = (x² + y²) dx.", "Homogeneous: put y = vx, so dy/dx = v + x dv/dx.", ["dy/dx = (x² + y²)/(x² + xy) = (1 + v²)/(1 + v).", "x dv/dx = (1 + v²)/(1 + v) − v = (1 − v)/(1 + v).", "∫ (1 + v)/(1 − v) dv = ∫ dx/x ⇒ −v − 2 log|1 − v| = log|x| + C.", "Put v = y/x and simplify."], "(x − y)² = Cx e^(−y/x)"], ["Solve dy/dx + 2y = sin x.", "Linear: dy/dx + Py = Q with P = 2. I.F. = e^(∫P dx).", ["I.F. = e^(2x).", "y e^(2x) = ∫ e^(2x) sin x dx = e^(2x)(2 sin x − cos x)/5 + C.", "Divide by e^(2x)."], "y = (2 sin x − cos x)/5 + C e^(−2x)"]]]
    ]]
  ]},

{ id:"ma12-vectors", unit:4, title:"Vectors",
  intro:"Vectors and their components, direction cosines, section formula, and the dot and cross products.",
  sec:[
   ["Basics",[
     ["p","A **vector** has magnitude and direction. Types: zero, unit, equal, collinear (parallel), negative, and position vectors."],
     ["f",["a = a₁î + a₂ĵ + a₃k̂,   |a| = √(a₁² + a₂² + a₃²)","Unit vector â = a/|a|","Direction cosines l, m, n:  l² + m² + n² = 1","Section formula (ratio m : n internally): (m b + n a)/(m + n)"]]
   ]],
   ["Scalar (dot) product",[
     ["f",["a · b = |a||b| cos θ = a₁b₁ + a₂b₂ + a₃b₃","a ⊥ b  ⇔  a · b = 0","Projection of a on b = (a · b)/|b|","î · î = ĵ · ĵ = k̂ · k̂ = 1,   î · ĵ = 0"]]
   ]],
   ["Vector (cross) product",[
     ["f",["a × b = |a||b| sin θ n̂","a × b = −(b × a),   a ∥ b  ⇔  a × b = 0","î × ĵ = k̂,  ĵ × k̂ = î,  k̂ × î = ĵ","Area of parallelogram = |a × b|,  triangle = ½|a × b|"]],

     ["p","For the line through P(x₁, y₁, z₁) and Q(x₂, y₂, z₂), direction ratios are (x₂ − x₁, y₂ − y₁, z₂ − z₁). Divide by PQ to get the direction cosines."]

{ id:"ma12-lpp", unit:5, title:"Linear programming",
  intro:"Constraints, objective functions and the graphical corner-point method for two-variable problems.",
  sec:[
   ["Terminology",[
     ["ul",["**Objective function**: Z = ax + by, to be maximised or minimised.","**Constraints**: linear inequalities the variables must satisfy, plus **non-negativity** x ≥ 0, y ≥ 0.","**Feasible region**: the common region satisfying all constraints. Points in it are **feasible solutions**; the best one is the **optimal feasible solution**.","A feasible region can be **bounded** or **unbounded**."]]
   ]],
   ["Corner point method",[
     ["ul",["Draw the constraints and shade the feasible region.","Find all corner points.","Evaluate Z at each corner point.","Bounded region: the largest value is the max, the smallest is the min.","Unbounded region: check that ax + by > M (or < m) has no point in the feasible region before accepting M (or m)."]],
     ["table",["Corner point","Z = 200x + 500y"],[["(0, 5)","2500"],["(4, 3)","2300 ← minimum"],["(0, 6)","3000"]]],
     ["p","This is for: minimise Z = 200x + 500y subject to x + 2y ≥ 10, 3x + 4y ≤ 24, x, y ≥ 0."]
   ]],
   ["Practice with solutions",[
      ["solve",[["Maximise Z = 3x + 4y subject to x + y ≤ 4, x ≥ 0, y ≥ 0.", "Draw the region, list the corner points and evaluate Z at each.", ["Corners: (0, 0), (4, 0), (0, 4).", "Z = 0, 12, 16."], "Max Z = 16 at (0, 4)"], ["Minimise Z = −3x + 4y subject to x + 2y ≤ 8, 3x + 2y ≤ 12, x, y ≥ 0.", "Find where x + 2y = 8 and 3x + 2y = 12 meet, then check every corner.", ["Subtract: 2x = 4 ⇒ x = 2, y = 3.", "Corners: (0, 0), (4, 0), (2, 3), (0, 4).", "Z = 0, −12, 6, 16."], "Min Z = −12 at (4, 0)"], ["Explain why the optimal value of a bounded LPP occurs at a corner point.", "Think about how the line Z = k moves across the region.", ["The lines Z = k are parallel; increasing k slides them across the region.", "The last point of a convex polygon the line touches is a vertex (or an edge with two vertices)."], "The extreme value is reached at a corner (corner point theorem)"], ["What is an infeasible region?", "What happens if no point satisfies all constraints?", ["If the constraints have no common region, there is no feasible point.", "Then the LPP has no solution."], "A region with no point satisfying all constraints (empty feasible region)"]]]
    ]]
  ]},

{ id:"ma12-probability", unit:6, title:"Probability",
  intro:"Conditional probability, the multiplication theorem, independent events, total probability and Bayes' theorem.",
  sec:[
   ["Conditional probability and multiplication",[
     ["f",["P(E | F) = P(E ∩ F) / P(F),   P(F) ≠ 0","P(E ∩ F) = P(E) · P(F | E) = P(F) · P(E | F)"]],
     ["p","Example: P(E) = 0.6, P(F) = 0.3, P(E ∩ F) = 0.2 give P(E | F) = 2/3 and P(F | E) = 1/3."]
   ]],
   ["Independent events",[
     ["f",["E and F independent  ⇔  P(E ∩ F) = P(E) · P(F)"]],
     ["p","Independent events are **not** the same as mutually exclusive events. Mutually exclusive events with non-zero probabilities can never be independent."]
   ]],
   ["Total probability and Bayes' theorem",[
     ["f",["P(A) = Σ P(Eᵢ) P(A | Eᵢ)   (E₁, E₂, … a partition of S)","P(Eᵢ | A) = P(Eᵢ) P(A | Eᵢ) / Σ P(Eⱼ) P(A | Eⱼ)"]],
     ["p","Bayes' theorem finds the probability of a **cause** (Eᵢ) after an **outcome** (A) has been observed."]
   ]],
   ["Practice with solutions",[
      ["solve",[["If P(A) = 0.5, P(B) = 0.4 and A, B are independent, find P(A ∩ B) and P(A ∪ B).", "Independent: P(A ∩ B) = P(A)P(B).", ["P(A ∩ B) = 0.5 × 0.4 = 0.2.", "P(A ∪ B) = 0.5 + 0.4 − 0.2 = 0.7."], "0.2 and 0.7"], ["Bag I has 3 red and 4 black balls; bag II has 5 red and 6 black. A bag is chosen at random and a red ball is drawn. Find the probability it came from bag II.", "Bayes' theorem: P(E₂|R) = P(E₂)P(R|E₂) / Σ P(Eᵢ)P(R|Eᵢ).", ["P(E₁) = P(E₂) = ½; P(R|E₁) = 3/7, P(R|E₂) = 5/11.", "Numerator = ½ × 5/11 = 5/22.", "Denominator = ½(3/7 + 5/11) = ½ × 68/77 = 34/77.", "P(E₂|R) = (5/22)/(34/77) = 35/68."], "35/68"], ["A die is thrown twice. Find the probability that the sum is 8, given that the first throw is 3.", "Given the first throw is 3, only the second throw is random.", ["Sum 8 with first = 3 needs second = 5.", "P = 1/6. (Or: (1/36)/(6/36).)"], "1/6"], ["Are mutually exclusive events independent? Explain.", "Compare P(A ∩ B) with P(A)P(B).", ["Mutually exclusive ⇒ P(A ∩ B) = 0.", "If P(A), P(B) > 0 then P(A)P(B) > 0 ≠ 0."], "No, they are not independent (unless one has probability 0)"]]]
    ]]
  ]}

  ["Find the direction cosines of the line through (−2, 4, −5) and (1, 2, 3).","Direction ratios: (3, −2, 8). Length = √(9 + 4 + 64) = √77.\nDirection cosines: **(3/√77, −2/√77, 8/√77)**."]],
 "ma12-lpp":[
  ["Maximise Z = 3x + 4y subject to x + y ≤ 4, x ≥ 0, y ≥ 0.","Corner points: (0, 0) → 0, (4, 0) → 12, (0, 4) → 16.\n**Maximum Z = 16 at (0, 4)**."],
  ["Minimise Z = 200x + 500y subject to x + 2y ≥ 10, 3x + 4y ≤ 24, x, y ≥ 0.","Lines meet where x = 10 − 2y and 3(10 − 2y) + 4y = 24, so y = 3, x = 4.\nCorner points: (0, 5) → 2500, (4, 3) → 2300, (0, 6) → 3000.\n**Minimum Z = 2300 at (4, 3)**."]],
 "ma12-probability":[
  ["Bag I: 3 red, 4 black. Bag II: 5 red, 6 black. A bag is chosen at random and a red ball is drawn. Find P(bag II | red).","P(E₁) = P(E₂) = ½. P(R | E₁) = 3/7, P(R | E₂) = 5/11.\nP(E₂ | R) = (½ · 5/11) / (½ · 3/7 + ½ · 5/11) = (5/11)/(68/77) = **35/68**."],
  ["P(E) = 0.6, P(F) = 0.3, P(E ∩ F) = 0.2. Find P(E | F) and P(F | E).","P(E | F) = 0.2/0.3 = **2/3**.\nP(F | E) = 0.2/0.6 = **1/3**."]]
}};

{ id:"mm11-history", unit:2, title:"What is animation? History and techniques",
  intro:"How animation creates the illusion of movement, how it developed from optical toys to computers, and the main techniques used today.",
  sec:[
   ["What is animation?",[
     ["p","**Animation** is a sequence of still images (frames) shown quickly one after another so that we see movement. Film usually runs at **24 frames per second (fps)**."],
     ["ul",["**Persistence of vision**: the eye keeps an image for a fraction of a second after it disappears, so frames blend together.","**Phi phenomenon**: the brain perceives continuous motion between a series of still images shown in quick succession."]]
   ]],
   ["Early origins",[
     ["table",["Device or film","What it did"],[["Thaumatrope (1825)","A spinning disc with a picture on each side that merge into one"],["Phenakistoscope (1832)","A slotted spinning disc showing a looping animation"],["Zoetrope (1834)","A spinning drum with slits and a strip of drawings inside"],["Flip book (1868)","Pages flipped quickly to show motion"],["Praxinoscope (1877)","Used mirrors instead of slits for a clearer image"],["Fantasmagorie (1908), Émile Cohl","One of the first fully hand-drawn animated films"]]]
   ]],
   ["Traditional and digital eras",[
     ["ul",["**Traditional (hand-drawn) era**: every frame was drawn on paper and inked onto transparent **cels**. Milestones include *Gertie the Dinosaur* (1914), *Steamboat Willie* (1928, synchronised sound) and *Snow White and the Seven Dwarfs* (1937, the first full-length cel-animated feature).","**Digital era**: computers took over drawing, colouring and camera work. *Toy Story* (1995) was the first fully computer-animated feature film."]]
   ]],
   ["Modern animation techniques",[
     ["ul",["**2D digital animation**: drawn or vector-based, e.g. in Synfig Studio or Krita.","**3D (CGI) animation**: models built and animated in software like Autodesk Maya.","**Stop motion**: physical objects photographed one frame at a time.","**Motion graphics**: animated text, shapes and graphics for ads and explainers.","**Motion capture**: an actor's real movement is recorded and applied to a digital character."]]
   ]],
   ["Practice questions",[
     ["qs",["Explain persistence of vision in your own words.","Name any three optical toys and explain one.","Why is Toy Story an important milestone?","Differentiate between 2D and 3D animation."]]
   ]]
  ]},

{ id:"mm11-principles", unit:2, title:"The 12 principles of animation",
  intro:"The rules, first described by Disney animators Frank Thomas and Ollie Johnston, that make movement feel real, heavy and full of personality.",
  sec:[
   ["The principles",[
     ["table",["Principle","What it means"],[["1. Squash and stretch","Objects flatten on impact and stretch when moving fast, while keeping the same volume. Shows weight and flexibility."],["2. Anticipation","A small opposite move before the main action, like crouching before a jump."],["3. Staging","Presenting an idea so it is completely clear: pose, camera and layout focus attention."],["4. Straight ahead and pose to pose","Straight ahead: draw frame after frame in order. Pose to pose: draw key poses first, then fill in between."],["5. Follow through and overlapping action","Parts keep moving after the main body stops (hair, clothes, tail) and move at different rates."],["6. Slow in and slow out","More frames near the start and end of a move, so it accelerates and decelerates (easing)."],["7. Arcs","Most natural motion follows curved paths, not straight lines."],["8. Secondary action","Extra actions that support the main one, like swinging arms while walking."],["9. Timing","The number of frames an action takes. Fewer frames = faster; more = slower and heavier."],["10. Exaggeration","Pushing movement or expression beyond reality to make it clearer and more appealing."],["11. Solid drawing","Drawing forms with weight, volume and correct perspective, as if they were 3D."],["12. Appeal","A design and performance the audience finds interesting and believable."]]]
   ]],
   ["Weight and personality",[
     ["p","The same jump looks completely different with different **timing** and **squash and stretch**: a bowling ball barely squashes and falls fast; a rubber ball squashes a lot and bounces high; a balloon drifts slowly. Combining **anticipation**, **exaggeration** and **appeal** gives a character its personality."],
     ["tip","Practical tip","Try one action, like a ball bounce or a jump, three times with different timing. Seeing the difference is the fastest way to learn these principles."]
   ]],
   ["Practice questions",[
     ["qs",["Explain squash and stretch with an example.","Differentiate between straight ahead and pose-to-pose animation.","How does anticipation make an action easier to follow?","Which principle explains why a character's hair keeps moving after it stops?"]]
   ]]
  ]},

{ id:"mm11-stopmotion", unit:2, title:"Stop motion animation",
  intro:"Types of stop motion, the full workflow, and the dos, don'ts and common mistakes.",
  sec:[
   ["Types of stop motion",[
     ["table",["Type","Description"],[["Claymation","Characters made of clay or plasticine"],["Puppet animation","Jointed puppets with wire skeletons (armatures)"],["Cut-out animation","Flat paper or card shapes moved on a surface"],["Object animation","Everyday objects (toys, stationery) brought to life"],["Pixilation","Real people posed and photographed frame by frame"],["Silhouette animation","Black cut-out shapes against a backlit background"]]]
   ]],
   ["Workflow",[
     ["ul",["**Idea and story**: plan a short, simple action.","**Storyboard**: sketch the main shots.","**Build** the set and characters.","**Set up** the camera on a tripod with fixed lighting.","**Shoot** frame by frame, moving objects in very small steps. At 12 fps you need 12 photos for one second.","**Edit** the frames into a video in software.","**Add sound** and music, then export."]]
   ]],
   ["Dos and don'ts",[
     ["table",["Do","Don't"],[["Fix the camera on a tripod","Hold the camera in your hand"],["Use artificial, steady lighting","Rely on sunlight from a window (it changes and causes flicker)"],["Lock focus and exposure (manual mode)","Use auto exposure"],["Move objects in small, even steps","Make big jumps between frames"],["Use onion skin to compare with the previous frame","Leave hands or shadows in the shot"]]],
     ["p","**Common mistakes**: flicker from changing light, a bumped camera making the scene jump, objects moving unevenly, and forgetting continuity (a prop changes position between shots)."]
   ]],
   ["Practice questions",[
     ["qs",["What is pixilation?","List the steps to create a clay-based stop motion animation.","Why should you avoid natural light while shooting stop motion?","How many photos are needed for a 5-second clip at 12 fps?"]]
   ]]
  ]},

{ id:"mm11-2d-preproduction", unit:3, title:"2D pre-production: story, script and storyboard",
  intro:"Turning an idea into a script and storyboard, choosing shots, and building an animatic.",
  sec:[
   ["Story development and scripting",[
     ["ul",["**Idea** → **logline** (one sentence) → **synopsis** (short summary) → **script**.","A script describes each scene: location, action, dialogue and sound.","Keep animation stories short and visual: show actions instead of explaining them."]]
   ]],
   ["Storyboard",[
     ["p","A **storyboard** is a comic-strip-like series of panels showing each shot. Under each panel note the action, dialogue, camera movement and duration."]
   ]],
   ["Shot composition",[
     ["table",["Shot type","Shows"],[["Extreme long shot","A vast setting; characters are tiny"],["Long (wide) shot","The whole character and surroundings"],["Medium shot","Character from the waist up"],["Close-up","The face, to show emotion"],["Extreme close-up","A small detail, like an eye"],["Over-the-shoulder","Looking past one character at another"]]],
     ["p","**Camera angles**: eye level (neutral), high angle (character looks small or weak), low angle (character looks powerful), bird's-eye view. **Camera moves**: pan, tilt, zoom, track."]
   ]],
   ["Animatic",[
     ["p","An **animatic** is the storyboard timed to a soundtrack, played as a rough video. It shows whether the story and pacing work **before** the expensive animation begins."]
   ]],
   ["Practice questions",[
     ["qs",["Differentiate between a script and a storyboard.","When would you use a low-angle shot?","What is an animatic and why is it made?","Write a logline for a 10-second animation."]]
   ]]
  ]},

{ id:"mm11-2d-production", unit:3, title:"2D production in Synfig Studio and Krita",
  intro:"Layout, key poses, breakdowns, in-betweens, clean-up and digital ink and paint.",
  sec:[
   ["Layout: staging and perspective",[
     ["ul",["**Layout** fixes the background, character placement and camera framing for each shot.","**Perspective**: use a horizon line and vanishing points so the scene has depth.","**Staging**: place characters so the main action is clear. The **rule of thirds** helps with balanced framing."]]
   ]],
   ["Keys, breakdowns and in-betweens",[
     ["ul",["**Key poses (keys)**: the most important poses that tell the action.","**Breakdowns**: poses between keys that define how the movement happens (the arc, overlap).","**In-betweens (tweening)**: the frames that fill the gaps smoothly.","**Onion skinning**: shows faint previous and next frames to help you draw in-betweens."]],
     ["p","At 24 fps, a 24–36 frame rough animation (walk, jump or wave) lasts 1 to 1.5 seconds."]
   ]],
   ["Clean-up and digital ink and paint",[
     ["p","**Clean-up** turns rough sketches into clear, consistent final lines. **Digital ink and paint** fills the lines with flat colours, then adds shading and highlights, following the character's colour model sheet."]
   ]],
   ["Synfig Studio and Krita",[
     ["table",["","Synfig Studio","Krita"],[["Type","Vector-based 2D animation","Raster (painting) frame-by-frame animation"],["How motion is made","Set waypoints in Animation Mode; the software tweens between them","Draw each frame on the animation timeline"],["Useful panels","Canvas, Layers, Params, Timetrack","Timeline, Onion Skins docker, Layers"]]],
     ["tip","In Synfig","Turn on **Animation Mode** (the canvas gets a red border) before changing anything you want animated, otherwise you'll change the shape at every frame."]
   ]],
   ["Practice questions",[
     ["qs",["Differentiate between key poses and in-betweens.","What is onion skinning?","Explain what clean-up means in 2D animation.","List the stages of a 2D animation workflow from script to final colour."]]
   ]]
  ]},

{ id:"mm11-3d-pipeline", unit:4, title:"The 3D animation production pipeline",
  intro:"How a 3D film moves from idea to final render, and who does what in a studio.",
  sec:[
   ["Pre-production → production → post-production",[
     ["table",["Stage","Main tasks"],[["Pre-production","Story and script, storyboard and shot list, character design, model sheets, animatic"],["Production","Modeling, texturing, rigging, layout, animation, lighting, effects"],["Post-production","Rendering, compositing, colour correction, sound design and Foley, final output"]]]
   ]],
   ["Model sheets and the shot list",[
     ["p","A **model sheet** shows a character from fixed views (front, side, back, three-quarter) with proportions and expressions, so every artist builds and draws it the same way. A **shot list** lists every shot with its number, type, camera and duration."]
   ]],
   ["The box concept (UV logic)",[
     ["p","Imagine unfolding a cardboard box flat. A 3D model's surface is unfolded the same way into a flat 2D layout called **UVs**. A 2D texture image is painted on this layout and then wraps back onto the 3D model."]
   ]],
   ["Studio roles",[
     ["table",["Role","Job"],[["Modeler","Builds the 3D shapes of characters, props and sets"],["Texture artist","Paints surface detail: colour, rust, metal, skin"],["Rigger","Adds bones and controls so the model can move"],["Animator","Sets keyframes to make characters act"],["Lighting artist","Places lights to create mood"],["Compositor","Combines all layers into the final image"]]]
   ]],
   ["Post-production terms",[
     ["ul",["**Rendering**: the computer calculates final images with lights, shadows and materials.","**Compositing**: layering characters, backgrounds and effects.","**Colour correction**: adjusting colour and brightness for a consistent look.","**Foley**: recording everyday sounds (footsteps, doors) in sync with the picture."]]
   ]],
   ["Practice questions",[
     ["qs",["List the three stages of the 3D pipeline with two tasks each.","What is a model sheet?","Explain the box concept of UV mapping.","What does a rigger do?"]]
   ]]
  ]},

{ id:"mm11-maya", unit:4, title:"Autodesk Maya: interface and basics",
  intro:"Finding your way around Maya, navigating the camera, creating primitives and transforming objects.",
  sec:[
   ["The Maya workspace",[
     ["table",["Part","Use"],[["Menu sets","Switch the menus for Modeling, Rigging, Animation, FX or Rendering"],["Status line and Shelf","Quick-access icons for common tools"],["Toolbox","Select, Move, Rotate and Scale tools"],["Viewports","Perspective, Top, Front and Side views"],["Channel Box","Exact values for translate, rotate and scale"],["Outliner","Lists every object in the scene and its hierarchy"],["Time slider","Frames and keys for animation"],["Attribute Editor","All settings of the selected object"]]]
   ]],
   ["Camera navigation",[
     ["table",["Action","Shortcut"],[["Tumble (rotate view)","Alt + left mouse drag"],["Track (pan)","Alt + middle mouse drag"],["Dolly (zoom)","Alt + right mouse drag, or scroll"],["Frame selected object","F"],["Frame everything","A"],["Wireframe / shaded / textured","4 / 5 / 6"]]]
   ]],
   ["Primitives and transforms",[
     ["p","Create basic shapes from **Create > Polygon Primitives**: cube, sphere, cylinder, cone, plane, torus. Combine several primitives to build a structure (a table, a house, a robot)."],
     ["table",["Tool","Shortcut"],[["Select","Q"],["Move (translate)","W"],["Rotate","E"],["Scale","R"]]]
   ]],
   ["Naming and file management",[
     ["ul",["Name every object clearly in the Outliner, e.g. **table_top_geo**, **chair_leg_L_geo**. Avoid spaces and default names like pCube1.","Save versions: **scene_v001.ma**, **scene_v002.ma**.","Set a **project** so scenes, images and textures go into the right folders.","Maya files: **.ma** (Maya ASCII, readable text) and **.mb** (Maya Binary, smaller and faster)."]]
   ]],
   ["Practice questions",[
     ["qs",["What is the Outliner used for?","Write the shortcuts for move, rotate and scale.","How do you tumble the camera in Maya?","Why are naming conventions important in a studio?"]]
   ]]
  ]}
],

EXTRA.mm11 = { bank:{
 "mm11-history":[
  ["Explain persistence of vision and the phi phenomenon.","**Persistence of vision**: the eye retains an image for a fraction of a second after it disappears, so quickly shown frames overlap.\n**Phi phenomenon**: the brain fills in the gaps and perceives smooth, continuous motion between still images.\nTogether they make animation appear to move."],
  ["Name three optical toys and explain one.","Thaumatrope, phenakistoscope, zoetrope (also flip book, praxinoscope).\n**Zoetrope**: a drum with slits around the top and a strip of sequential drawings inside. When it spins, looking through the slits shows the drawings as a moving loop."]],
 "mm11-principles":[
  ["Explain squash and stretch using a bouncing ball.","When the ball hits the ground it **squashes** (flattens), and while falling or rising fast it **stretches** along its path. Its volume stays the same. This shows the ball's weight and flexibility and makes the bounce feel real."],
  ["Differentiate between straight ahead and pose-to-pose animation.","- **Straight ahead**: frames are drawn one after another from start to end. Good for fluid, unpredictable action like fire or water.\n- **Pose to pose**: key poses are drawn first, then breakdowns and in-betweens. Gives more control over timing and acting."]],
 "mm11-stopmotion":[
  ["List the steps to make a clay-based stop motion animation.","1. Plan a short story and storyboard.\n2. Make clay characters and a small set.\n3. Fix the camera on a tripod and use steady artificial lights.\n4. Lock focus and exposure.\n5. Move the clay a little and take a photo; repeat.\n6. Import the photos into software at 12 or 24 fps.\n7. Add sound and export the video."],
  ["Give three common mistakes in stop motion and how to avoid them.","- **Flicker**: avoid daylight; use fixed lamps and manual exposure.\n- **Camera jumps**: use a tripod and a remote or timer to take photos.\n- **Jerky motion**: move objects in small, even steps and use onion skin."]],
 "mm11-2d-preproduction":[
  ["Differentiate between a script and a storyboard.","- A **script** is written: it describes scenes, actions and dialogue in words.\n- A **storyboard** is visual: panels show each shot, framing and camera movement, with notes underneath."],
  ["What is an animatic? Why is it made?","An animatic is a storyboard timed to the soundtrack and played as a rough video. It checks the story flow, timing and pacing before full animation starts, saving time and money."]],
 "mm11-2d-production":[
  ["Explain key poses, breakdowns and in-betweens.","- **Key poses**: the main poses that define the action.\n- **Breakdowns**: poses between keys that decide how the motion travels (its arc and overlap).\n- **In-betweens**: frames that fill the remaining gaps for smooth motion."],
  ["Compare Synfig Studio and Krita for 2D animation.","- **Synfig Studio** is vector-based; you set waypoints in Animation Mode and it creates the in-betweens automatically.\n- **Krita** is raster-based; you draw each frame by hand on the timeline, using onion skins.\nBoth are free."]],
 "mm11-3d-pipeline":[
  ["Explain the three stages of the 3D production pipeline.","- **Pre-production**: story, script, storyboard, shot list, character design, model sheets, animatic.\n- **Production**: modeling, texturing, rigging, layout, animation, lighting.\n- **Post-production**: rendering, compositing, colour correction, sound and Foley, final output."],
  ["Explain the box concept of UV mapping.","If you cut a cardboard box along its edges and flatten it, you get a 2D layout of all its faces. UV mapping does the same to a 3D model. A texture is painted on the flat UV layout, then wraps back onto the 3D surface correctly."]],
 "mm11-maya":[
  ["Name any five parts of the Maya interface and their use.","- **Menu sets**: switch menus for Modeling, Rigging, Animation, FX, Rendering.\n- **Shelf**: one-click tools.\n- **Toolbox**: select, move, rotate, scale.\n- **Outliner**: lists all scene objects.\n- **Channel Box**: exact transform values.\n(Also viewports, time slider, Attribute Editor.)"],
  ["How would you build a simple table in Maya?","1. Create > Polygon Primitives > Cube for the top; scale it flat (R).\n2. Create four thin cubes or cylinders for legs.\n3. Move (W) them under the corners.\n4. Name them in the Outliner (table_top_geo, table_leg_01_geo …).\n5. Group them (Ctrl + G) and save the scene."]]
}};

{ id:"mm12-syllabus", unit:0, title:"Syllabus and marks",
  intro:"How Multimedia (821), job role Animator, is assessed in Class 12.",

   ["Marks at a glance (100)",[

{ id:"mm12-employability", unit:1, title:"Employability Skills IV",
  intro:"The five Part A units shared by all skill subjects, worth 2 marks each.",
  sec:[
   ["The five units",[
     ["table",["Unit","Hours","Marks"],[["Communication Skills IV","10","2"],["Self-Management Skills IV","10","2"],["ICT Skills IV","10","2"],["Entrepreneurial Skills IV","15","2"],["Green Skills IV","05","2"]]],
     ["p","CBSE publishes the detailed topics for Part A separately as a common Employability Skills curriculum. Your teacher will share the textbook for these units."],
     ["tip","Easy marks","These 10 marks are mostly short, direct questions. A little regular revision goes a long way."]
   ]]

{ id:"mm12-preproduction", unit:2, title:"Pre-production and texturing",
  intro:"Storyboards, layouts, model sheets and animatics, and texturing 3D models using Photoshop and Maya.",
  sec:[
   ["Pre-production activities",[
     ["table",["Item","Purpose"],[["Storyboard","Panels showing every shot, camera and action"],["Layouts","Detailed drawings of each shot: background, staging, camera position"],["Model sheets","Character turnarounds and expressions so the model stays consistent"],["Animatic","Storyboard timed to sound to check pacing"]]],
     ["p","Basic drawing tools used in pre-production software include geometric shapes, line, pen, brush, text, stroke, fill, point and eraser."]
   ]],
   ["Modeling and texturing standards",[
     ["ul",["Keep **clean topology**: mostly four-sided polygons (quads), with no stray or overlapping faces.","**Name** every object clearly and **freeze transformations** before handing a model on.","UVs should not **overlap** or **stretch**.","Use texture sizes in powers of two (1024, 2048, 4096 pixels)."]]
   ]],
   ["UV mapping and texturing with Photoshop",[
     ["ul",["In Maya, unwrap the model in the **UV Editor**.","Export a **UV snapshot** (an image of the UV layout).","Open the snapshot in **Photoshop** and paint the texture on a new layer over the UV lines.","Save the texture (PNG, TIFF or JPG) in the project's sourceimages folder.","In Maya's **Hypershade**, create a material, connect the file texture to its **Color**, and assign it to the model."]],
     ["tip","Check for stretching","Apply a checker texture first. If the squares look stretched or squashed on the model, fix the UVs before painting."]
   ]],
   ["Practice questions",[
     ["qs",["List four pre-production activities and their purpose.","What is a UV snapshot and why is it used?","Give two standards to follow while modeling.","Draw a flow chart of pre-production activities."]]
   ]]
  ]},

{ id:"mm12-lighting-rigging", unit:2, title:"Lighting and rigging in Maya",
  intro:"Lighting a scene for mood and clarity, and rigging a model with joints and controls so it can be animated.",
  sec:[
   ["Lighting",[
     ["p","Lighting sets the **mood**, shows **depth and shape**, and directs the viewer's attention."],
     ["table",["Three-point lighting","Role"],[["Key light","The main, brightest light; creates the main shadows"],["Fill light","Softer light on the other side to lighten shadows"],["Back (rim) light","Behind the subject; separates it from the background"]]],
     ["p","Maya lights: **ambient**, **directional** (like sunlight), **point** (like a bulb), **spot** (cone-shaped beam), **area** (soft light from a rectangle) and **volume**. A bright image needs a strong key, enough fill and correct exposure."]
   ]],
   ["Rigging",[
     ["ul",["**Joints** form a skeleton in a parent-child **hierarchy** (hip → knee → ankle).","**Skinning (binding)** attaches the mesh to the joints; **weight painting** controls how much each joint moves each part.","**Controls** (usually NURBS curves) are what the animator selects and moves.","**FK (forward kinematics)**: rotate each joint down the chain. **IK (inverse kinematics)**: move the end (hand or foot) and the chain follows.","**Constraints** link objects, e.g. a sword following a hand."]]
   ]],
   ["Rigging standards",[
     ["ul",["Use clear names with side prefixes: **L_arm_jnt**, **R_leg_ctrl**.","Freeze transforms so controls start at zero.","Keep a clean hierarchy and lock attributes animators shouldn't change."]]
   ]],
   ["Practice questions",[
     ["qs",["Explain three-point lighting.","Differentiate between a point light and a directional light.","Differentiate between FK and IK.","What is skinning in rigging?"]]
   ]]
  ]},

{ id:"mm12-postproduction", unit:2, title:"Post-production and rendering",
  intro:"Checking animation with playblasts and animatics, rendering, compositing and exporting the final sequence.",
  sec:[
   ["Checking timing",[
     ["p","An **animatic** shows the planned timing. In Maya, a **Playblast** (Windows > Playblast) quickly records the viewport to a video file (such as **.avi** or .mov) so you can watch the real flow and timing of your animation without a full render."]
   ]],
   ["Post-production process",[
     ["ul",["**Rendering**: Render > Render Settings: choose camera, image format, resolution and frame range, then batch render an image sequence (name.0001.png, name.0002.png …).","**Compositing**: layer the rendered character, background and effects (e.g. in After Effects).","**Colour correction**: match colours and brightness between shots.","**Sound**: add dialogue, music and Foley.","**Export**: produce the final video in the required format."]],
     ["tip","Why render image sequences?","If the computer crashes at frame 150, you keep frames 1–149 and restart from 150. A single video file would be lost."]
   ]],
   ["Practice questions",[
     ["qs",["What is a playblast and why is it useful?","Draw a flow chart of post-production activities.","Why are animations rendered as image sequences?","What is compositing?"]]
   ]]
  ]},

{ id:"mm12-premiere", unit:3, title:"Video editing in Adobe Premiere Pro",
  intro:"Workspaces, projects, the timeline, types of clips and a standard editing workflow.",
  sec:[
   ["Workspaces and panels",[
     ["p","A **workspace** is a saved arrangement of panels for a task: Editing, Assembly, Color, Effects, Audio and Graphics."],
     ["table",["Panel","Use"],[["Project","Holds all imported media and sequences"],["Source monitor","Preview a clip and set in and out points"],["Program monitor","Plays the edited sequence"],["Timeline","Arrange clips on video (V1, V2…) and audio (A1, A2…) tracks"],["Tools","Selection (V), Razor (C), Ripple Edit (B), Track Select (A), Hand (H), Zoom (Z)"],["Effects / Effect Controls","Add and adjust transitions and effects"]]]
   ]],
   ["Types of clips",[
     ["ul",["Video clips, audio clips and still images","Titles and graphics","Subclips (a part of a longer clip)","Nested sequences (a sequence used inside another)"]]
   ]],
   ["Editing workflow",[
     ["ul",["Create a project and import media.","Organise clips into bins.","Create a sequence and assemble a **rough cut**.","Refine to a **fine cut**: trim, reorder, add transitions.","Add titles, effects and colour correction.","Mix the audio: link or unlink audio and video, add background music on an audio track.","Export: File > Export > Media (for example H.264 MP4)."]],
     ["tip","Linking audio","Video with sound comes in **linked**. Right-click > **Unlink** to move or delete the sound separately, for example to replace it with background music."]
   ]],
   ["Practice questions",[
     ["qs",["What is a workspace in Premiere Pro?","Name four panels and their uses.","Explain the video editing workflow.","How do you separate a clip's audio from its video?"]]
   ]]
  ]},

{ id:"mm12-sound", unit:3, title:"Sound editing",
  intro:"Changing volume, trimming and fading audio, multitrack editing, and exporting WAV and MP3 files.",
  sec:[
   ["Sound editing software",[
     ["p","The syllabus mentions **Adobe Soundbooth**, which Adobe discontinued; its successor is **Adobe Audition**. The same ideas also apply in free editors like Audacity."]
   ]],
   ["Basic editing",[
     ["ul",["**Amplitude** is the height of the waveform, heard as loudness.","Select a range and use the **volume control** to raise or lower it (measured in dB).","**Trim** the beginning or end by dragging the start and end points of the clip.","Add **fade in** and **fade out** so sound doesn't start or stop abruptly."]]
   ]],
   ["Multitrack editing",[
     ["p","A **multitrack** session places dialogue, music and sound effects on separate tracks so each can be adjusted independently, then **mixed** down into one final file."]
   ]],
   ["Exporting audio",[
     ["table",["Format","Type","Use"],[["WAV","Uncompressed, lossless, large files","Editing and high-quality masters"],["MP3","Compressed, lossy, small files","Sharing and playback in any media player"]]]
   ]],
   ["Practice questions",[
     ["qs",["What is amplitude?","How do you shorten an audio clip?","What is multitrack sound editing?","Differentiate between WAV and MP3."]]
   ]]
  ]},

{ id:"mm12-keyframes", unit:4, title:"Keyframe animation and the Maya timeline",
  intro:"Frames, timing and frame rate, setting keys, auto key and its drawbacks, and the timeline settings.",
  sec:[
   ["Frames, timing and frame rate",[
     ["ul",["A **frame** is a single image in the sequence.","**Frame rate (fps)**: frames per second: 24 (film), 25 (PAL video), 30 (NTSC video).","**Timing** is how many frames an action takes. Duration = frames ÷ fps; 48 frames at 24 fps = 2 seconds."]]
   ]],
   ["Keyframes and tweening",[
     ["p","A **keyframe** stores an attribute's value (position, rotation, scale, size) at a frame. Maya calculates the frames in between: this is **tweening** (interpolation). The animator sets keys; the software creates in-betweens."],
     ["table",["Action","How"],[["Set key on all keyable attributes","S"],["Key translate / rotate / scale only","Shift + W / E / R"],["Key one attribute","Right-click it in the Channel Box > Key Selected"]]]
   ]],
   ["Auto Key",[
     ["p","With the **Auto Key** button on (red key icon next to the range slider), Maya sets a key automatically whenever you change an attribute that already has a key."],
     ["ul",["Disadvantage: you can create **unwanted keys** by accident while adjusting things.","Keys can end up on the **wrong frame** if you forget to move the time slider first.","It can clutter the timeline and make curves harder to edit."]]
   ]],
   ["The Maya timeline",[
     ["ul",["The **time slider** shows frames; keys appear as red ticks.","The **range slider** sets the visible start and end frames.","**Playback controls** play, step and jump between keys.","Change fps and playback speed in **Preferences > Settings > Time Slider**."]]
   ]],
   ["Practice questions",[
     ["qs",["How long is a 120-frame animation at 24 fps?","Differentiate between a keyframe and an in-between.","Give two disadvantages of Auto Key.","Which key sets a keyframe on all attributes?"]]
   ]]
  ]},

{ id:"mm12-graph-editor", unit:4, title:"The Graph Editor",
  intro:"Seeing and editing animation as curves to control speed, easing and timing.",
  sec:[
   ["What the Graph Editor shows",[
     ["p","Open it with **Windows > Animation Editors > Graph Editor**. The horizontal axis is **time** (frames); the vertical axis is the **value**. Each animated attribute is a curve: **red** for X, **green** for Y, **blue** for Z."],
     ["p","A **steep** curve means fast change; a **flat** curve means slow or no change."]
   ]],
   ["Tangent types",[
     ["table",["Tangent","Effect"],[["Spline / Auto","Smooth ease in and out"],["Linear","Constant speed, sharp changes at keys"],["Flat","Smooth stop at the key (good for the top of a bounce)"],["Stepped","Holds the value until the next key (used for blocking)"],["Clamped / Plateau","Smooth but avoids overshooting"]]]
   ]],
   ["Editing curves",[
     ["ul",["Select keys and move them (W, then middle-mouse drag) to change timing or value.","Insert or delete keys on a curve.","**Break tangents** to make sharp changes, like the instant a ball hits the ground.","Press **F** to frame selected curves, **A** to frame all."]]
   ]],
   ["Practice questions",[
     ["qs",["How do you open the Graph Editor?","What does a steep curve tell you?","Differentiate between linear and stepped tangents.","Which tangent would you use at the top of a bounce, and why?"]]
   ]]
  ]},

{ id:"mm12-bouncing-ball", unit:4, title:"The bouncing ball",
  intro:"The classic animation exercise: timing, arcs, squash and stretch, and ease in and out on a 200-frame bounce.",
  sec:[
   ["Different balls, different bounces",[
     ["table",["Ball","How it bounces"],[["Rubber ball","High bounces, lots of squash and stretch"],["Bowling ball","Heavy: falls fast, barely bounces, almost no squash"],["Ping-pong ball","Light: many quick, small bounces"],["Beach ball","Floaty: slow, soft bounces"]]]
   ]],
   ["Details of a bounce",[
     ["ul",["The ball travels in **arcs**.","It moves **slowly at the top** (ease in/out) and **fastest at contact**.","It **squashes** on contact and **stretches** just before and after, keeping its volume.","Each bounce is **lower and shorter** than the last as energy is lost."]]
   ]],
   ["Animating it in Maya",[
     ["ul",["Create a sphere and set the timeline to 200 frames.","Key the top positions and the contact positions on translate Y (e.g. top at 1, contact at 12, top at 24 …), making each bounce smaller.","Animate translate X steadily so the ball travels forward.","In the **Graph Editor**: make contact keys sharp (break or linear tangents) and top keys **flat** for ease in and out.","Add squash at contact (scale Y down, X and Z up) and stretch near contact.","Use the **middle mouse button**: middle-drag in the time slider to change time without updating the scene, then press S to copy a pose to a new frame.","Playblast to check the timing."]],
     ["tip","Two principles","The practical asks for at least two principles. A good bounce clearly shows **squash and stretch** and **slow in and slow out** (plus timing and arcs)."]
   ]],
   ["Practice questions",[
     ["qs",["Why does each bounce get lower and shorter?","Where does a ball move fastest and slowest in a bounce?","How does a bowling ball's bounce differ from a rubber ball's?","Which Graph Editor tangents create a sharp contact with the ground?"]]
   ]]
  ]}
],

EXTRA.mm12 = { bank:{
 "mm12-preproduction":[
  ["Explain how a texture painted in Photoshop is applied to a model in Maya.","1. Unwrap the model's UVs in Maya's UV Editor.\n2. Export a UV snapshot image.\n3. Paint the texture over the snapshot in Photoshop and save it.\n4. In Hypershade, create a material, connect the file texture to Color.\n5. Assign the material to the model and check it in textured view (6)."],
  ["Give four standards to follow while modeling and texturing.","- Use clean topology with mostly quads.\n- Name objects clearly and freeze transforms.\n- Make UVs without overlap or stretching (test with a checker).\n- Use texture sizes in powers of two (1024, 2048)."]],
 "mm12-lighting-rigging":[
  ["Explain three-point lighting.","- **Key light**: the main light, placed to one side in front; creates the main shadows.\n- **Fill light**: softer, on the opposite side; lightens the shadows.\n- **Back (rim) light**: behind the subject; outlines it and separates it from the background."],
  ["Differentiate between FK and IK.","- **FK (forward kinematics)**: the animator rotates each joint from the top of the chain down (shoulder → elbow → wrist). Good for swinging arcs.\n- **IK (inverse kinematics)**: the animator moves the end of the chain (hand or foot) and the joints above follow automatically. Good for planted feet or hands."]],
 "mm12-postproduction":[
  ["What is a playblast? How is it different from a render?","A **playblast** quickly records the viewport to a video (such as .avi) to check timing and flow. A **render** calculates final-quality images with full lighting, shadows and materials, which takes much longer."],
  ["List the steps of post-production for an animated short.","1. Render the frames as an image sequence.\n2. Composite layers (character, background, effects).\n3. Correct colour across shots.\n4. Add dialogue, music and Foley.\n5. Export the final video."]],
 "mm12-premiere":[
  ["Describe the video editing workflow in Premiere Pro.","Import and organise media in bins → create a sequence → rough cut → fine cut (trim, transitions) → titles, effects and colour → audio mix → export via File > Export > Media."],
  ["Name four Premiere Pro tools with their shortcuts.","- Selection tool (**V**)\n- Razor tool (**C**): cuts clips\n- Ripple Edit tool (**B**): trims and closes gaps\n- Hand tool (**H**): scrolls the timeline\n(Also Track Select A, Zoom Z.)"]],
 "mm12-sound":[
  ["How would you lower the volume of part of an audio track and trim its start?","Select the range on the waveform and lower its level with the volume control (in dB). To trim, drag the clip's start point to the right until the unwanted part is removed. Add a short fade-in so it doesn't start abruptly."],
  ["Differentiate between WAV and MP3.","- **WAV**: uncompressed and lossless; large files; best for editing and masters.\n- **MP3**: compressed and lossy; small files; good for sharing and playing in any media player."]],
 "mm12-keyframes":[
  ["Differentiate between a keyframe and tweening.","A **keyframe** is a frame where the animator sets an attribute's value (for example position or rotation). **Tweening** is the computer calculating all the frames in between two keys, creating smooth motion automatically."],
  ["Give two advantages and two disadvantages of Auto Key.","Advantages: faster posing; you don't need to press S after every change.\nDisadvantages: creates unwanted keys by accident; keys may land on the wrong frame if you forget to move the time slider."]],
 "mm12-graph-editor":[
  ["What do the shape and colour of curves in the Graph Editor tell you?","Colour shows the axis: red X, green Y, blue Z. The slope shows speed: steep means fast change, flat means slow or stopped. Curves bending smoothly into a key show easing."],
  ["How would you use tangents to improve a bouncing ball?","Set the **top** keys to **flat** tangents so the ball slows down and speeds up smoothly (ease in and out). At the **contact** keys, break tangents or use linear tangents so the curve forms a sharp V, giving a crisp impact."]],
 "mm12-bouncing-ball":[
  ["Explain how squash and stretch and ease in/out make a bouncing ball realistic.","- **Squash and stretch**: the ball flattens on impact and stretches while moving fast, showing it's soft and has weight, while keeping its volume.\n- **Ease in/out**: the ball slows at the top of each arc and speeds up as it falls, as gravity would make it."],
  ["Plan a 200-frame bouncing ball with decaying bounces.","Example plan at 24 fps: top at frame 1; contacts at 20, 54, 82, 104, 120 …; tops between contacts, each lower than the last; the gaps shrink as the bounces get smaller; the ball rolls to rest before frame 200. Translate X increases steadily. Use flat tangents at tops and sharp tangents at contacts, with squash on contact."]]
}};
