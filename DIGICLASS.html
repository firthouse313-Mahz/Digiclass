(function(){
  const MORE = {"cs12": {"revision": [["What will be the output?\n```\nL = [10, 20, 30]\nL.insert(1, 15)\nL.extend([40])\nprint(L)\n```", "**[10, 15, 20, 30, 40]**\ninsert(1, 15) puts 15 at index 1; extend adds 40 at the end.", "1 mark"], ["What will be the output?\n```\ns = \"BOARD-EXAM-2027\"\nprint(s.split('-'))\nprint(s[-4:], s[::4])\n```", "**['BOARD', 'EXAM', '2027']**\n**2027 BDA0**\ns[::4] takes indices 0, 4, 8, 12 → B, D, A, 0.", "2 marks"], ["Identify the mutable types: tuple, list, string, dictionary, set.", "Mutable: **list, dictionary, set**. Immutable: tuple, string.", "1 mark"], ["Evaluate: `print(2 + 3 * 4 ** 2 // 8 % 5)`", "4 ** 2 = 16 → 3 * 16 = 48 → 48 // 8 = 6 → 6 % 5 = 1 → 2 + 1 = **3**.\nOrder: ** first, then * // % (left to right), then +.", "1 mark"], ["What will be the output?\n```\nD = {'a': 1, 'b': 2}\nprint(D.get('c', 0) + D.get('b'))\n```", "D.get('c', 0) returns the default 0, D.get('b') returns 2 → **2**.", "1 mark"], ["Rewrite after removing errors, underlining each correction:\n```\ndef reverse(L)\n    for i in range(len(L)/2):\n        L[i], L[len(L)-i] = L[len(L)-i], L[i]\n    return L\n```", "```\ndef reverse(L):\n    for i in range(len(L)//2):\n        L[i], L[len(L)-1-i] = L[len(L)-1-i], L[i]\n    return L\n```\nMissing colon; / gives a float, so use //; the last index is len(L)-1-i.", "2 marks"], ["**Assertion (A):** `t = (5)` creates a tuple.\n**Reason (R):** A tuple with one element needs a trailing comma.", "**A is false, R is true.** (5) is just the int 5; (5,) is a tuple.", "1 mark"]], "functions": [["What will be the output?\n```\ndef fun(x):\n    x = x + 5\n    print(x, end=' ')\nx = 10\nfun(x)\nprint(x)\n```", "**15 10**\nThe x inside fun is local, so the global x stays 10.", "2 marks"], ["Find the error and explain:\n```\ncount = 0\ndef add():\n    count = count + 1\nadd()\n```", "**UnboundLocalError**: assigning to count makes it local inside add(), but it is read before it has a value. Fix: add `global count` as the first line of add().", "2 marks"], ["Write a function CAPS(S) that returns the string with the first letter of every word capitalised, without using title().", "```\ndef CAPS(S):\n    words = S.split()\n    out = []\n    for w in words:\n        out.append(w[0].upper() + w[1:])\n    return ' '.join(out)\n```", "2 marks"], ["Write a function SHIFT(L, n) that shifts the elements of list L to the left by n positions.\nExample: [1, 2, 3, 4, 5], n = 2 → [3, 4, 5, 1, 2]", "```\ndef SHIFT(L, n):\n    n = n % len(L)\n    return L[n:] + L[:n]\n```", "3 marks"]], "exceptions": [["What will be printed?\n```\ntry:\n    x = int('12a')\n    print('A')\nexcept ValueError:\n    print('B')\nelse:\n    print('C')\nfinally:\n    print('D')\n```", "**B**\n**D**\nint('12a') raises ValueError; else is skipped; finally always runs.", "2 marks"], ["Name the exception raised: (i) `[1, 2][5]` (ii) `10/0` (iii) `int('abc')` (iv) `{'a':1}['b']`", "(i) **IndexError** (ii) **ZeroDivisionError** (iii) **ValueError** (iv) **KeyError**", "2 marks"]], "textfiles": [["Differentiate between seek() and tell() with an example.", "- **tell()** returns the current position of the file pointer (in bytes).\n- **seek(offset, whence)** moves the pointer.\n```\nf = open('a.txt')\nf.read(5)\nprint(f.tell())   # 5\nf.seek(0)         # back to start\n```", "2 marks"], ["Write a function COUNT_LINES() that reads 'poem.txt' and displays the lines that start with a vowel, and their count.", "```\ndef COUNT_LINES():\n    n = 0\n    with open('poem.txt') as f:\n        for line in f:\n            if line and line[0].lower() in 'aeiou':\n                print(line, end='')\n                n += 1\n    print('Count:', n)\n```", "3 marks"], ["Write a function LONGWORDS() that displays every word longer than 6 characters from 'notes.txt'.", "```\ndef LONGWORDS():\n    with open('notes.txt') as f:\n        for w in f.read().split():\n            if len(w) > 6:\n                print(w)\n```", "3 marks"], ["**Assertion (A):** Opening a file in 'w' mode erases its existing contents.\n**Reason (R):** 'w' mode places the file pointer at the end of the file.", "**A is true, R is false.** 'w' truncates the file and places the pointer at the start; it is 'a' mode that writes at the end.", "1 mark"]], "binaryfiles": [["A binary file 'student.dat' stores records as [admno, name, fee]. Write a function update_fee(admno, newfee) to change the fee of the given admission number, and display 'Not found' if it is absent.", "```\nimport pickle\ndef update_fee(admno, newfee):\n    recs, found = [], False\n    with open('student.dat', 'rb') as f:\n        try:\n            while True:\n                r = pickle.load(f)\n                if r[0] == admno:\n                    r[2] = newfee\n                    found = True\n                recs.append(r)\n        except EOFError:\n            pass\n    with open('student.dat', 'wb') as f:\n        for r in recs:\n            pickle.dump(r, f)\n    if not found:\n        print('Not found')\n```", "4 marks"], ["Write a function COPY_HIGH() that copies all records from 'emp.dat' (each a dictionary with keys 'name' and 'salary') with salary > 50000 into 'high.dat'.", "```\nimport pickle\ndef COPY_HIGH():\n    with open('emp.dat', 'rb') as src, open('high.dat', 'wb') as dst:\n        try:\n            while True:\n                d = pickle.load(src)\n                if d['salary'] > 50000:\n                    pickle.dump(d, dst)\n        except EOFError:\n            pass\n```", "3 marks"]], "csvfiles": [["A CSV file 'rentals.csv' has rows [VehicleID, Type, Rent]. Write:\n(i) ADD() to append one record input by the user\n(ii) COUNT_CARS() to display how many records have Type 'Car'", "```\nimport csv\ndef ADD():\n    vid = input('ID: ')\n    t = input('Type: ')\n    rent = int(input('Rent: '))\n    with open('rentals.csv', 'a', newline='') as f:\n        csv.writer(f).writerow([vid, t, rent])\n\ndef COUNT_CARS():\n    n = 0\n    with open('rentals.csv') as f:\n        for row in csv.reader(f):\n            if row[1] == 'Car':\n                n += 1\n    print(n)\n```", "4 marks"], ["Why is `newline=''` used when opening a CSV file for writing?", "Without it, Python's newline translation plus the csv writer's own line ending produce **blank lines between rows** on Windows. newline='' stops the extra line break.", "1 mark"]], "stack": [["A list BOOKS contains records [BookID, Title, Price]. Write:\n(i) PUSH_BOOK(BOOKS, S) to push records with Price > 500 onto stack S\n(ii) POP_BOOK(S) to pop and return the top record, or print 'Underflow' if empty\n(iii) PEEK(S) to show the top record without removing it", "```\ndef PUSH_BOOK(BOOKS, S):\n    for b in BOOKS:\n        if b[2] > 500:\n            S.append(b)\n\ndef POP_BOOK(S):\n    if not S:\n        print('Underflow')\n        return None\n    return S.pop()\n\ndef PEEK(S):\n    if S:\n        print(S[-1])\n    else:\n        print('Stack empty')\n```", "3 marks"], ["Write PUSH_EVEN(N, S) to push all even numbers from list N onto stack S, then pop and display them until the stack is empty.", "```\ndef PUSH_EVEN(N, S):\n    for x in N:\n        if x % 2 == 0:\n            S.append(x)\n    while S:\n        print(S.pop(), end=' ')\n    print('\\nStack empty')\n```", "3 marks"]], "networks": [["Expand: (i) MAC (ii) VoIP (iii) PAN (iv) HTTPS", "(i) **Media Access Control** (ii) **Voice over Internet Protocol** (iii) **Personal Area Network** (iv) **HyperText Transfer Protocol Secure**", "2 marks"], ["Differentiate between circuit switching and packet switching (any two points).", "- **Circuit**: a dedicated path is fixed before transfer; resources stay reserved (telephone calls).\n- **Packet**: data is split into packets that may travel by different routes; links are shared (Internet).", "2 marks"], ["Sunrise University is setting up a campus network with four blocks: ADMIN (100 computers), ENGG (60), BUSINESS (40), MEDIA (20). Distances: ADMIN–ENGG 50 m, ADMIN–BUSINESS 70 m, ADMIN–MEDIA 110 m, ENGG–BUSINESS 60 m, ENGG–MEDIA 140 m.\n(i) Suggest the most suitable block for the server, with reason.\n(ii) Draw a cable layout.\n(iii) Where is a repeater needed?\n(iv) Which device connects all computers within a block?\n(v) The university's head office is in another city. Which type of network is formed?", "(i) **ADMIN**: it has the most computers (80–20 rule; most traffic stays local).\n(ii) Star layout from ADMIN to ENGG, BUSINESS and MEDIA.\n(iii) Between **ADMIN and MEDIA** (110 m; Ethernet cable works well up to about 100 m).\n(iv) **Switch**.\n(v) **WAN**.", "5 marks"]], "protocols": [["Which protocol is used: (i) to send email (ii) to receive email to a device (iii) to transfer files (iv) to log in remotely and securely?", "(i) **SMTP** (ii) **POP3** or **IMAP** (iii) **FTP** (iv) **SSH**", "2 marks"]], "dbconcepts": [["Define a foreign key with an example.", "A **foreign key** is an attribute in one table that refers to the primary key of another table, linking them.\nExample: StudentID in RESULT refers to StudentID (primary key) in STUDENT.", "2 marks"], ["Table ITEM has 5 columns and 8 rows; table SUPPLIER has 3 columns and 4 rows. Find the degree and cardinality of ITEM × SUPPLIER.", "Degree = 5 + 3 = **8**. Cardinality = 8 × 4 = **32**.", "1 mark"], ["**Assertion (A):** NULL = NULL in SQL returns TRUE.\n**Reason (R):** NULL represents an unknown value.", "**A is false, R is true.** Comparing NULL with = gives unknown (not TRUE); use IS NULL.", "1 mark"]], "sql": [["Table EMP(EID, Name, Dept, Salary, DOJ). Write queries to:\n(i) show names of employees with salary between 40000 and 60000\n(ii) show the department-wise average salary for departments with more than 2 employees\n(iii) increase the salary of 'HR' employees by 10%\n(iv) show names in descending order of DOJ", "```\nSELECT Name FROM EMP WHERE Salary BETWEEN 40000 AND 60000;\nSELECT Dept, AVG(Salary) FROM EMP GROUP BY Dept HAVING COUNT(*) > 2;\nUPDATE EMP SET Salary = Salary * 1.1 WHERE Dept = 'HR';\nSELECT Name FROM EMP ORDER BY DOJ DESC;\n```", "4 marks"], ["Differentiate between DELETE and DROP with an example.", "- **DELETE** (DML) removes rows; the table structure stays. `DELETE FROM EMP WHERE Dept='HR';`\n- **DROP** (DDL) removes the whole table with its structure. `DROP TABLE EMP;`", "2 marks"], ["Write the command to add a column Email VARCHAR(40) to STUDENT, and then make RollNo the primary key.", "```\nALTER TABLE STUDENT ADD Email VARCHAR(40);\nALTER TABLE STUDENT ADD PRIMARY KEY (RollNo);\n```", "2 marks"], ["Which constraint makes sure a column never accepts values outside a valid range? Which ensures no two rows share a value?", "Range of valid values: the **domain** (enforced with a CHECK constraint). No duplicates: **UNIQUE** (or PRIMARY KEY).", "1 mark"]], "connectivity": [["Write a Python program to display all records from table STUDENT (database SCHOOL) whose Marks > 80. User 'root', password 'tiger'.", "```\nimport mysql.connector as m\ncon = m.connect(host='localhost', user='root', passwd='tiger', database='SCHOOL')\ncur = con.cursor()\ncur.execute('SELECT * FROM STUDENT WHERE Marks > 80')\nfor row in cur.fetchall():\n    print(row)\ncon.close()\n```", "4 marks"], ["Why is commit() needed after an INSERT or UPDATE through Python?", "Changes made through the cursor are held in a transaction. **commit()** saves them permanently to the database; without it, they are lost when the connection closes.", "1 mark"]]}, "ip12": {"ip12-series": [["What will be the output?\n```\nimport pandas as pd\nS = pd.Series([10, 20, 30, 40, 50], index=list('abcde'))\nprint(S['b':'d'])\nprint(S[1:3])\n```", "```\nb    20\nc    30\nd    40\ndtype: int64\nb    20\nc    30\ndtype: int64\n```\nLabel slicing includes the end label; position slicing excludes the end.", "2 marks"], ["What will be the output?\n```\nS1 = pd.Series([1, 2, 3], index=['x', 'y', 'z'])\nS2 = pd.Series([10, 20, 30], index=['y', 'z', 'w'])\nprint(S1 + S2)\n```", "```\nw     NaN\nx     NaN\ny    12.0\nz    23.0\ndtype: float64\n```\nOnly matching labels are added; the rest become NaN.", "2 marks"], ["Write code to create a Series of the squares of 1 to 5 with index 'one' to 'five'.", "```\nimport pandas as pd\nS = pd.Series([1, 4, 9, 16, 25], index=['one', 'two', 'three', 'four', 'five'])\nprint(S)\n```", "2 marks"]], "ip12-dataframe": [["DataFrame df has columns Name, Class, Marks. Write statements to:\n(i) display the first 3 rows\n(ii) add a column Grade with value 'A' for all rows\n(iii) delete the column Class\n(iv) display rows where Marks > 80", "```\nprint(df.head(3))\ndf['Grade'] = 'A'\ndf = df.drop('Class', axis=1)\nprint(df[df['Marks'] > 80])\n```", "4 marks"], ["Write code to add a new row with index 4 and values ['Riya', 12, 91] to the DataFrame df.", "```\ndf.loc[4] = ['Riya', 12, 91]\n```", "1 mark"], ["**Assertion (A):** `df.drop('Marks', axis=1)` removes a column.\n**Reason (R):** axis=1 refers to columns in a DataFrame.", "**Both A and R are true, and R is the correct explanation of A.**", "1 mark"], ["Differentiate between loc and iloc.", "- **loc** selects by **label** and the end label is included.\n- **iloc** selects by **integer position** and the end position is excluded.", "2 marks"]], "ip12-csv": [["Write code to save DataFrame df to 'result.csv' without the index and with ';' as the separator.", "```\ndf.to_csv('result.csv', index=False, sep=';')\n```", "2 marks"], ["Write code to read 'sales.csv' into a DataFrame, using the column 'Month' as the index, and show the shape.", "```\nimport pandas as pd\ndf = pd.read_csv('sales.csv', index_col='Month')\nprint(df.shape)\n```", "2 marks"]], "ip12-plotting": [["Write code to draw a line chart of Months = ['Jan', 'Feb', 'Mar', 'Apr'] against Sales = [120, 150, 90, 180], with title 'Sales', axis labels, and save it as 'sales.png'.", "```\nimport matplotlib.pyplot as plt\nMonths = ['Jan', 'Feb', 'Mar', 'Apr']\nSales = [120, 150, 90, 180]\nplt.plot(Months, Sales, marker='o')\nplt.title('Sales')\nplt.xlabel('Month')\nplt.ylabel('Sales')\nplt.savefig('sales.png')\nplt.show()\n```", "3 marks"], ["Which function sets the label of the y-axis? Which type of chart shows the frequency distribution of continuous data?", "**plt.ylabel()**; a **histogram** (plt.hist()).", "1 mark"]], "ip12-sql-functions": [["Write the output:\n(i) `SELECT LENGTH('DigiClass');`\n(ii) `SELECT INSTR('PROGRAMMING', 'G');`\n(iii) `SELECT RIGHT('INFORMATICS', 4);`\n(iv) `SELECT ROUND(756.389, -2);`", "(i) **9** (ii) **4** (first G is at position 4) (iii) **TICS** (iv) **800**", "2 marks"], ["Write queries using table ORDERS(OrderID, Customer, OrderDate):\n(i) display customer names in lower case\n(ii) display the day and year of each OrderDate\n(iii) display the month name of OrderDate", "```\nSELECT LOWER(Customer) FROM ORDERS;\nSELECT DAY(OrderDate), YEAR(OrderDate) FROM ORDERS;\nSELECT MONTHNAME(OrderDate) FROM ORDERS;\n```", "3 marks"], ["Write the output: `SELECT MID('INFORMATICS', 3, 4), MOD(29, 5), POWER(2, 5);`", "**FORM  4  32**", "1 mark"]], "ip12-sql-aggregate": [["Table PRODUCT(PID, PName, Category, Price, Qty). Write queries to:\n(i) show total quantity in each category\n(ii) show categories whose average price is more than 500\n(iii) show the number of products where Qty is NULL", "```\nSELECT Category, SUM(Qty) FROM PRODUCT GROUP BY Category;\nSELECT Category FROM PRODUCT GROUP BY Category HAVING AVG(Price) > 500;\nSELECT COUNT(*) FROM PRODUCT WHERE Qty IS NULL;\n```", "3 marks"], ["Tables STUDENT(SID, Name, CID) and COURSE(CID, CName). Write a query to show each student's name with the course name.", "```\nSELECT Name, CName FROM STUDENT, COURSE\nWHERE STUDENT.CID = COURSE.CID;\n```", "2 marks"], ["Differentiate between WHERE and HAVING.", "- **WHERE** filters individual rows **before** grouping; it cannot use aggregate functions.\n- **HAVING** filters **groups** after GROUP BY and can use aggregates like COUNT() or AVG().", "2 marks"], ["What is the difference between COUNT(*) and COUNT(column)?", "COUNT(*) counts **all rows**. COUNT(column) counts only rows where that column is **not NULL**.", "1 mark"]], "ip12-networks": [["Differentiate between a website and a web page. What is web hosting?", "A **web page** is a single document; a **website** is a collection of linked web pages under one domain. **Web hosting** is storing a website on a server so it is available on the Internet.", "2 marks"], ["Green Valley School has four wings: ADMIN, SCIENCE, ARTS and SPORTS.\n(i) Suggest a topology and draw the layout.\n(ii) Which device connects the school network to the Internet?\n(iii) Which device converts digital signals to analog for the telephone line?\n(iv) Teachers want to make calls over the Internet. Name the technology.", "(i) **Star** topology centred at ADMIN.\n(ii) **Router**\n(iii) **Modem**\n(iv) **VoIP**", "4 marks"], ["What are cookies? Give one advantage and one risk.", "Small text files a website stores in your browser. **Advantage**: remembers logins and preferences. **Risk**: can be used to track browsing, affecting privacy.", "2 marks"]], "ip12-societal": [["What is a digital footprint? Differentiate between active and passive footprints.", "The trail of data you leave online.\n- **Active**: data you share on purpose (posts, emails).\n- **Passive**: data collected without you noticing (IP address, cookies, browsing history).", "2 marks"], ["Suggest two ways to manage e-waste safely.", "- Give old devices to **authorised e-waste recyclers**.\n- **Reuse/donate** working devices; use buy-back programmes.", "2 marks"], ["Riya found that someone created a fake profile using her photos. Name the cybercrime and suggest two steps she should take.", "**Identity theft / cyberbullying through impersonation.**\n- Report the profile to the platform.\n- Inform parents and file a complaint at **cybercrime.gov.in** (or the local cyber cell).", "3 marks"], ["Define: (i) patent (ii) plagiarism (iii) netiquette", "(i) An exclusive right granted for an **invention**.\n(ii) Presenting **someone else's work** as your own.\n(iii) **Good manners** while communicating online.", "3 marks"]]}, "ma12": {"ma12-relations": [["Let R on Z be R = {(a, b) : a − b is divisible by 3}. Show that R is an equivalence relation.", "**Reflexive**: a − a = 0, divisible by 3.\n**Symmetric**: if 3 | (a − b) then 3 | (b − a) = −(a − b).\n**Transitive**: if 3 | (a − b) and 3 | (b − c), then a − c = (a − b) + (b − c) is divisible by 3.\nSo R is an **equivalence relation**.", "3 marks"], ["Show that f : R → R, f(x) = 3x − 7 is a bijection.", "**One-one**: 3x₁ − 7 = 3x₂ − 7 ⇒ x₁ = x₂.\n**Onto**: for any y ∈ R, x = (y + 7)/3 ∈ R gives f(x) = y.\nSo f is **one-one and onto (bijective)**.", "2 marks"]], "ma12-inverse-trig": [["Find the domain of y = sec⁻¹(2x + 1).", "Need |2x + 1| ≥ 1.\n2x + 1 ≥ 1 ⇒ x ≥ 0; or 2x + 1 ≤ −1 ⇒ x ≤ −1.\nDomain: **(−∞, −1] ∪ [0, ∞)**.", "2 marks"], ["Evaluate sin⁻¹(sin 3π/5).", "3π/5 ∉ [−π/2, π/2]. sin(3π/5) = sin(π − 3π/5) = sin(2π/5), and 2π/5 is in range.\nAnswer: **2π/5**.", "1 mark"]], "ma12-matrices": [["If A = [[0, a, 3], [2, b, −1], [c, 1, 0]] is skew-symmetric, find a, b and c.", "Skew-symmetric ⇒ aᵢⱼ = −aⱼᵢ and diagonal = 0.\nb = 0; a = −2; c = −3.\n**a = −2, b = 0, c = −3**.", "2 marks"], ["If A = [[2, 3], [1, 2]], show that A² − 4A + I = O.", "A² = [[7, 12], [4, 7]]. 4A = [[8, 12], [4, 8]].\nA² − 4A + I = [[7 − 8 + 1, 0], [0, 7 − 8 + 1]] = **O**.", "3 marks"], ["A is a 3 × 3 matrix with |A| = 4. Find |2A| and |adj A|.", "|kA| = kⁿ|A| ⇒ |2A| = 2³ × 4 = **32**.\n|adj A| = |A|ⁿ⁻¹ = 4² = **16**.", "1 mark"]], "ma12-determinants": [["If |A| = 5 for a 3 × 3 matrix A and |B| = 2, find |adj(AB)|.", "|AB| = |A||B| = 10.\n|adj(AB)| = |AB|² = **100**.", "1 mark"], ["A shopkeeper sells three types of fruit baskets. 2 kg apples + 1 kg banana + 1 kg mango cost ₹290; 1 kg apple + 2 kg banana + 1 kg mango cost ₹250; 1 kg apple + 1 kg banana + 2 kg mango cost ₹260. Find the price per kg of each fruit using matrices.", "A = [[2, 1, 1], [1, 2, 1], [1, 1, 2]], B = [290, 250, 260]ᵀ.\n|A| = 2(3) − 1(1) + 1(−1) = 4.\nadj A = [[3, −1, −1], [−1, 3, −1], [−1, −1, 3]].\nX = (1/4)[[3, −1, −1], [−1, 3, −1], [−1, −1, 3]][290, 250, 260]ᵀ = (1/4)[360, 200, 240]ᵀ.\n**Apple ₹90, banana ₹50, mango ₹60** per kg.", "5 marks"]], "ma12-continuity": [["Find dy/dx if x = a sin³t, y = a cos³t.", "dx/dt = 3a sin²t cos t, dy/dt = −3a cos²t sin t.\ndy/dx = (−3a cos²t sin t)/(3a sin²t cos t) = **−cot t**.", "2 marks"], ["Differentiate cos⁻¹(2x² − 1) with respect to cos⁻¹x, for 0 < x < 1.", "Put x = cos θ: cos⁻¹(cos 2θ) = 2θ = 2cos⁻¹x (since 0 < 2θ < π).\nSo u = 2v, where v = cos⁻¹x ⇒ du/dv = **2**.", "2 marks"], ["If y = e^(a sin⁻¹x), prove that (1 − x²)y″ − xy′ − a²y = 0.", "y′ = a y/√(1 − x²) ⇒ √(1 − x²) y′ = a y.\nDifferentiate: √(1 − x²) y″ − x y′/√(1 − x²) = a y′ = a² y/√(1 − x²).\nMultiply by √(1 − x²): **(1 − x²)y″ − xy′ − a²y = 0**.", "3 marks"]], "ma12-app-derivatives": [["A drone rises vertically. Its height is h(t) = 4t² + 2t metres after t seconds. Find its speed at t = 3 s and the rate at which the speed changes.", "Speed = dh/dt = 8t + 2 ⇒ at t = 3: **26 m/s**.\nRate of change of speed = d²h/dt² = **8 m/s²** (constant).", "2 marks"], ["Find the maximum value of f(x) = −x² + 8x + 5 and where it occurs. (A water-quality index model has this form.)", "f′(x) = −2x + 8 = 0 ⇒ x = 4. f″ = −2 < 0 ⇒ maximum.\nf(4) = −16 + 32 + 5 = **21 at x = 4**.", "3 marks"], ["Show that f(x) = x³ − 6x² + 12x − 18 is increasing on R.", "f′(x) = 3x² − 12x + 12 = 3(x − 2)² ≥ 0 for all x (zero only at x = 2).\nSo f is **increasing on R**.", "2 marks"]], "ma12-integrals": [["Find ∫ (3x + 5)/(x² − 3x + 2) dx.", "x² − 3x + 2 = (x − 1)(x − 2).\n(3x + 5)/((x − 1)(x − 2)) = A/(x − 1) + B/(x − 2); A = −8, B = 11.\n**−8 log|x − 1| + 11 log|x − 2| + C**.", "3 marks"], ["Evaluate ∫₀^π x sin x dx.", "By parts: ∫ x sin x dx = −x cos x + sin x.\n[−x cos x + sin x]₀^π = (−π(−1) + 0) − 0 = **π**.", "3 marks"], ["Find ∫ eˣ (1/x − 1/x²) dx.", "Form ∫ eˣ[f(x) + f′(x)] dx = eˣ f(x) + C with f(x) = 1/x.\n**eˣ/x + C**.", "2 marks"]], "ma12-app-integrals": [["Find the area enclosed by the circle x² + y² = 16 using integration.", "Area = 4∫₀⁴ √(16 − x²) dx = 4[(x/2)√(16 − x²) + 8 sin⁻¹(x/4)]₀⁴ = 4(8 · π/2) = **16π sq units**.", "5 marks"], ["Find the area bounded by y = x² and y = x.", "They meet at x = 0 and x = 1.\nArea = ∫₀¹ (x − x²) dx = 1/2 − 1/3 = **1/6 sq units**.", "3 marks"]], "ma12-diff-eq": [["Solve dy/dx = (1 + y²)/(1 + x²).", "dy/(1 + y²) = dx/(1 + x²) ⇒ **tan⁻¹y = tan⁻¹x + C**.", "2 marks"], ["Solve x dy/dx + 2y = x², given y = 1 when x = 1.", "dy/dx + (2/x)y = x. I.F. = x².\nyx² = ∫ x³ dx = x⁴/4 + C. At (1, 1): 1 = 1/4 + C ⇒ C = 3/4.\n**y = x²/4 + 3/(4x²)**.", "3 marks"]], "ma12-vectors": [["If |a| = 3, |b| = 4 and a · b = 6, find the angle between a and b and |a × b|.", "cos θ = 6/12 = ½ ⇒ **θ = π/3**.\n|a × b| = 3 × 4 × sin(π/3) = **6√3**.", "2 marks"], ["Find λ if a = 2î + λĵ + k̂ and b = î − 2ĵ + 3k̂ are perpendicular.", "a · b = 2 − 2λ + 3 = 0 ⇒ **λ = 5/2**.", "1 mark"], ["Find a unit vector perpendicular to both a = î + ĵ + k̂ and b = î + 2ĵ + 3k̂.", "a × b = î(3 − 2) − ĵ(3 − 1) + k̂(2 − 1) = î − 2ĵ + k̂, |a × b| = √6.\n**±(î − 2ĵ + k̂)/√6**.", "3 marks"]], "ma12-3d": [["A laser beam travels along r = (î + ĵ) + λ(2î − ĵ + k̂). A sensor is at P(2, 3, −1). Find the foot of the perpendicular from P to the beam and the shortest distance.", "General point Q = (1 + 2λ, 1 − λ, λ). PQ = (2λ − 1, −λ − 2, λ + 1).\nPQ · (2, −1, 1) = 0 ⇒ 4λ − 2 + λ + 2 + λ + 1 = 0 ⇒ 6λ + 1 = 0 ⇒ λ = −1/6.\nFoot Q = **(2/3, 7/6, −1/6)**.\nPQ = (−4/3, −11/6, 5/6), distance = √(64 + 121 + 25)/6 = **√210/6 units**.", "5 marks"], ["Find the angle between the lines (x − 1)/2 = (y + 1)/1 = z/2 and x/1 = (y − 3)/2 = (z + 1)/(−2).", "cos θ = |2·1 + 1·2 + 2·(−2)|/(3 × 3) = 0 ⇒ **θ = 90°**.", "2 marks"]], "ma12-lpp": [["Maximise Z = 5x + 3y subject to 3x + 5y ≤ 15, 5x + 2y ≤ 10, x, y ≥ 0.", "Intersection: x = 20/19, y = 45/19.\nCorners: (0, 0) → 0, (2, 0) → 10, (0, 3) → 9, (20/19, 45/19) → 235/19.\n**Max Z = 235/19 at (20/19, 45/19)**.", "3 marks"]], "ma12-probability": [["A fitness app detects irregular heartbeats. 2% of users have the condition. The app flags 95% of users who have it and 10% of users who don't. A user is flagged. Find the probability that the user actually has the condition.", "P(C) = 0.02, P(F|C) = 0.95, P(F|C′) = 0.10.\nP(C|F) = (0.02 × 0.95)/(0.02 × 0.95 + 0.98 × 0.10) = 0.019/0.117 = **19/117 ≈ 0.162**.", "5 marks"], ["A random variable X has P(X = 0) = k, P(X = 1) = 2k, P(X = 2) = 3k, P(X = 3) = 4k. Find k and the mean of X.", "k + 2k + 3k + 4k = 1 ⇒ **k = 1/10**.\nMean = 0(0.1) + 1(0.2) + 2(0.3) + 3(0.4) = **2**.", "3 marks"], ["If A and B are independent with P(A) = 0.3 and P(B) = 0.4, find P(A′ ∩ B′).", "Complements of independent events are independent.\nP(A′ ∩ B′) = 0.7 × 0.6 = **0.42**.", "1 mark"]]}};

    ? /(#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?"""|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([=+\-*/%<>!]+)|([\s\S])/g
    : /(--[^\n]*)|('(?:''|[^'\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([=+\-*/%<>!]+)|([\s\S])/g;
  let out="", m;
  while((m=re.exec(code))){
    const [t,c,s,n,w,o] = m;
    if(c) out+=`<span class="tk-c">${esc(c)}</span>`;
    else if(s) out+=`<span class="tk-s">${esc(s)}</span>`;
    else if(n) out+=`<span class="tk-n">${n}</span>`;
    else if(w){
      if(lang==="python"){
        if(PY_KW.has(w)) out+=`<span class="tk-k">${w}</span>`;
        else if(PY_BI.has(w)) out+=`<span class="tk-b">${w}</span>`;
        else if(code[re.lastIndex]==="(") out+=`<span class="tk-f">${w}</span>`;
        else out+=w;
      } else {
        const U=w.toUpperCase();
        if(SQL_KW.has(U)) out+=`<span class="tk-k">${w}</span>`;
        else if(SQL_FN.has(U)) out+=`<span class="tk-b">${w}</span>`;
        else out+=w;
      }
    }
    else if(o) out+=`<span class="tk-o">${esc(o)}</span>`;
    else out+=esc(t);
  }
  return out;
}
const LANG = {python:["Python","#5B8CFF"],sql:["SQL","#22D3EE"],text:["Example","#A78BFA"]};

function solveList(items){
  return `<div class="how-solve"><span>1</span>Try it in your notebook<span>2</span>Stuck? Open the hint<span>3</span>Check every step</div><div class="qa solve">${items.map(([q,h,steps,ans],i)=>`<div class="qa-item"><div class="qa-q"><span class="qa-n">${i+1}</span><div><p>${inline(q)}</p></div></div><details class="hint"><summary>💡 Hint: how to start</summary><div class="hint-b">${inline(h)}</div></details><details><summary>Step-by-step solution</summary><div class="qa-a"><ol class="steps">${steps.map(s=>`<li>${inline(s)}</li>`).join("")}</ol><div class="final"><b>Answer</b><span>${inline(ans)}</span></div></div></details></div>`).join("")}</div>`;
}
function rich(t){
  return String(t).split("```").map((part,i)=>{
    if(i%2) return codeBlock(part.replace(/^\n/,"").replace(/\n$/,""));
    let out="", list=[];
    const flush=()=>{ if(list.length){ out+=`<ul>${list.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`; list=[]; } };
    part.split("\n").forEach(line=>{
      if(!line.trim()) return;
      if(line.startsWith("- ")) list.push(line.slice(2));
      else { flush(); out+=`<p>${inline(line)}</p>`; }
    });
    flush(); return out;
  }).join("");
}

function hashFor(v){
  switch(v.name){
    case "courses": return "#/";
    case "saved": return "#/saved";
    case "subjects": return "#/classes";
    case "grade": return `#/class/${v.grade}`;
    case "practicehub": return v.pc?`#/practice/${v.pc}`:"#/practice";
    case "me": return "#/me";
    case "course": return `#/${v.course}`;
    case "unit": return `#/${v.course}/unit/${v.unit}`;
    case "chapter": return `#/${CHBY[v.id].course.id}/ch/${v.id}${v.q?"/q/"+v.q:""}`;
    case "teacher": return "#/teacher";
    case "practice": return `#/${v.course}/practice`;
    case "paper": return `#/${v.course}/paper`;
  }
  return "#/";
}
function parseHash(){
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!p.length) return {name:"courses"};
  if(p[0]==="saved") return {name:"saved"};
  if(p[0]==="teacher") return {name:"teacher"};
  if(p[0]==="subjects"||p[0]==="classes") return {name:"subjects"};
  if(p[0]==="me"||p[0]==="resources") return {name:"me"};
  if(p[0]==="practice"||p[0]==="quizzes") return {name:"practicehub",pc:BYID[p[1]]?p[1]:null};
  if(p[0]==="class" && GRADES.includes(+p[1])) return {name:"grade",grade:+p[1]};
  const c = BYID[p[0]];
  if(!c) return {name:"courses"};
  if(p[1]==="unit" && c.units[+p[2]]) return {name:"course",course:c.id};
  if(p[1]==="ch" && CHBY[p[2]]) return {name:"chapter",id:p[2],q:p[3]==="q"&&p[4]?p[4]:null};
  if(p[1]==="practice") return {name:"practice",course:c.id};
  if(p[1]==="paper" && paperOf(c.id)) return {name:"paper",course:c.id};
  return {name:"course",course:c.id};
}

/* ===================== scroll effects ===================== */
let spy, revealer;
function setupSpy(){
  if(spy) spy.disconnect();
  const tabs = document.querySelectorAll("#tabs a"); if(!tabs.length) return;
  spy = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){
      const i = en.target.id.slice(1);
      tabs.forEach(t=>t.classList.toggle("active", t.dataset.i===i));
      const a = document.querySelector(`#tabs a[data-i="${i}"]`);
      if(a) a.parentElement.scrollTo({left:a.offsetLeft-12,behavior:RM?"auto":"smooth"});
    }});
  },{rootMargin:"-170px 0px -60% 0px"});
  document.querySelectorAll(".page h2[id]").forEach(h=>spy.observe(h));
}
function setupReveal(){
  if(revealer) revealer.disconnect();
  const els=document.querySelectorAll("#content .reveal");
  if(RM || !("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); }
  else {
    revealer=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); revealer.unobserve(en.target); } }),{rootMargin:"0px 0px -6% 0px"});
    els.forEach((e,i)=>{ e.style.transitionDelay=`${Math.min(i%4,3)*60}ms`; revealer.observe(e); });
  }
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll("#content .bar i[data-w]").forEach(b=>b.style.width=b.dataset.w+"%"),RM?0:120));
}
function readProgress(){
  const bar=$("readbar");
  if(view.name!=="chapter"&&view.name!=="practice"&&view.name!=="paper"){ bar.style.width="0"; return; }
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width = (h>0?Math.min(100,scrollY/h*100):0)+"%";
}
addEventListener("scroll",readProgress,{passive:true});

/* celebratory burst (skipped for reduced motion) */
function burst(el){
  if(RM||!el) return;
  const r=el.getBoundingClientRect(), cols=["#3D7BFF","#8B5CF6","#EC4899","#22D3EE","#A3E635"];
  for(let i=0;i<14;i++){
    const s=document.createElement("i"); s.className="spark";
    const a=Math.random()*Math.PI*2, d=40+Math.random()*50;
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${cols[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;z-index:100`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}

COURSES.forEach(c=>c.chapters.forEach(ch=>ch.sec.forEach((s,i)=>INDEX.push({id:ch.id,i,label:`Class ${c.grade} · ${c.subject}`,title:ch.title,sec:s[0],course:c.id,text:(c.label+" "+c.subject+" "+ch.title+" "+s[0]+" "+JSON.stringify(s[1])).toLowerCase()}))));
$("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase(), r=$("results");
  if(q.length<2){ r.classList.remove("open"); return; }
  const cur = curCourse();
  let hits = INDEX.filter(x=>x.text.includes(q));
  if(cur) hits.sort((a,b)=>(b.course===cur.id)-(a.course===cur.id));
  hits = hits.slice(0,12);
  r.innerHTML = hits.length ? hits.map(h=>`<button data-id="${h.id}" data-i="${h.i}">${esc(h.sec)}<small>${esc(h.label)} · ${esc(h.title)}</small></button>`).join("")
    : `<p style="padding:10px 12px;margin:0;color:var(--soft)">Nothing matches "${esc(q)}". Try a shorter word like "csv" or "join".</p>`;
  r.classList.add("open");
});
$("results").addEventListener("click",e=>{
  const b=e.target.closest("button[data-id]"); if(!b) return;
  $("results").classList.remove("open"); $("search").value=""; $("topbar").classList.remove("searching");

document.addEventListener("click",e=>{ if(!e.target.closest(".topbar")) { $("results").classList.remove("open"); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("results").classList.remove("open"); $("topbar").classList.remove("searching");  } if(e.key==="/" && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); if(innerWidth<=980) $("searchBtn").click(); else $("search").focus(); } });
document.addEventListener("click",e=>{ const b=e.target.closest(".site-foot [data-nav-go]"); if(b && !$("content").contains(b)) navTo(b.dataset.navGo); });

/* ===================== quiz ===================== */
let Q = null;
function openQuiz(id){
  const ch = CHBY[id];
  Q = {id, i:0, right:0, answered:false, col:UC(ch.unit), title:ch.title, qs:quizOf(id), res:[]};
  drawQ(); $("quiz").showModal();
}
function drawQ(){
  const qs = Q.qs, d = $("qd");
  d.style.setProperty("--uc",Q.col);
  const steps = qs.map((_,k)=>`<i class="${k<Q.i?(Q.res[k]?"r":"w"):k===Q.i?"cur":""}"></i>`).join("");
  if(Q.i>=qs.length){
    scores[Q.id] = Math.max(scores[Q.id]??0, Q.right); store.set("cs12-scores",scores);
    const p=Q.right/qs.length, C=2*Math.PI*62;
    const [h,msg] = p===1?["Perfect score! 🏆","You've nailed this chapter. Keep the streak going with the next one."]:p>=.6?["Great effort! 💪","You're nearly there. Re-read the sections you missed and try again."]:["Good start 🌱","Every attempt helps. Go through the notes once more, then have another go."];
    d.innerHTML = `<div class="qd-head"><b>${esc(Q.title)}</b><button class="qd-close" aria-label="Close quiz" data-close>${IC.x}</button></div>
      <div class="qsteps">${steps}</div>
      <div class="done-wrap"><div class="scorering"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="62"/><circle class="fg" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="ringfg"/></svg><b>${Q.right}/${qs.length}</b></div>
      <h3>${h}</h3><p>${msg}</p>
      <div class="qfoot"><button class="btn" data-retry>Try again</button><button class="btn primary" data-close>Back to notes</button></div></div>`;
    requestAnimationFrame(()=>setTimeout(()=>{ const r=$("ringfg"); if(r) r.style.strokeDashoffset=C*(1-p); if(p===1) burst(d.querySelector(".scorering")); },60));
    return;
  }
  const [q,opts] = qs[Q.i];
  Q.answered=false;
  d.innerHTML = `<div class="qd-head"><b>Question ${Q.i+1} of ${qs.length}</b><button class="qd-close" aria-label="Close quiz" data-close>${IC.x}</button></div>
    <div class="qsteps" aria-hidden="true">${steps}</div>
    <p class="qtext">${esc(q)}</p>
    ${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="lt">${String.fromCharCode(65+k)}</span>${esc(o)}</button>`).join("")}
    <div id="qwhy" aria-live="polite"></div><div class="qfoot"></div>`;
  const first=d.querySelector(".opt"); if(first) first.focus({preventScroll:true});
}
$("qd").addEventListener("click",e=>{
  if(e.target.closest("[data-close]")) return $("quiz").close();
  if(e.target.closest("[data-retry]")) return openQuiz(Q.id);
  if(e.target.closest("[data-next]")){ Q.i++; return drawQ(); }
  const o = e.target.closest(".opt"); if(!o || Q.answered) return;
  Q.answered = true;
  const [, , ans, why] = Q.qs[Q.i], k = +o.dataset.k, ok = k===ans;
  if(ok) Q.right++;
  Q.res[Q.i]=ok;
  document.querySelectorAll("#qd .opt").forEach(b=>{ b.disabled=true; const bk=+b.dataset.k; if(bk===ans) b.classList.add("right"); else if(bk===k) b.classList.add("wrong"); });
  const cur=document.querySelector("#qd .qsteps i.cur"); if(cur){ cur.className=ok?"r":"w"; }
  $("qwhy").innerHTML = `<div class="why ${ok?"ok":"no"}"><span class="wi">${ok?"✅":"💡"}</span><span><strong>${ok?"Correct!":"Not quite. Here's why:"}</strong> ${esc(why)}</span></div>`;
  if(ok) burst(o);
  const nb = document.querySelector("#qd .qfoot"); nb.innerHTML = `<button class="btn primary" data-next>${Q.i+1<Q.qs.length?"Next question":"See my score"} ${IC.arrow}</button>`;
  nb.querySelector("button").focus({preventScroll:true});
});
$("quiz").addEventListener("close",()=>{ if(["chapter","practicehub","me","courses"].includes(view.name)) rerender(); });

/* ===================== live mock paper ===================== */
let timerH=null;
function stopTimer(){ if(timerH){ clearInterval(timerH); timerH=null; } }
function flatQs(P){ const out=[]; P.sections.forEach(sec=>sec.qs.forEach(q=>out.push(q))); return out; }
function pState(cid){ return store.get("paper-"+cid,{start:null,ans:{},sub:false,self:{}}); }
function pSave(cid,st){ store.set("paper-"+cid,st); }
function paperScore(cid){
  const P=paperOf(cid), st=pState(cid), qs=flatQs(P);
  let auto=0, autoMax=0, self=0, selfMax=0, pending=0;
  qs.forEach((q,k)=>{
    if(q.o){ autoMax+=q.m; if(st.ans[k]===q.a) auto+=q.m; }
    else { selfMax+=q.m; if(st.self[k]==null) pending++; else self+=st.self[k]; }
  });
  return {auto,autoMax,self,selfMax,pending,got:auto+self,total:autoMax+selfMax};
}
const fmt = ms => { const t=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; };
function vPaper(c){
  const P=paperOf(c.id), st=pState(c.id), qs=flatQs(P);
  const total=qs.reduce((n,q)=>n+q.m,0);
  const head=back(`${c.subject} · Class ${c.grade} practice`,`data-practice="${c.id}"`);
  if(!st.start){
    return `<div class="chap" style="--uc:var(--u3)">${head}
      <section class="chap-head"><span class="chap-num">${IC.clock} Mock paper</span><h1>${esc(P.title)}</h1>
      <div class="chap-meta"><span>${IC.layers}${total} marks</span><span>${IC.clock}${P.mins} minutes</span><span>${IC.target}${qs.length} questions</span></div>
      <p class="intro">This paper follows the board pattern at half length. Treat it like the real exam: find a quiet spot and keep a pen and paper ready for rough work.</p>
      <div class="page" style="padding:0"><ul>
        ${P.sections.map(sec=>`<li><strong>${esc(sec.name)}</strong>: ${esc(sec.note)}</li>`).join("")}
        <li>The timer starts when you press Start and keeps running even if you close the page.</li>
        <li>MCQs are marked automatically. For written questions, type your answer (or write it on paper), then compare with the model answer after submitting and award yourself marks.</li>
        <li>Your answers are saved on this device as you go.</li>
      </ul></div>
      <div class="actions" style="margin-top:18px"><button class="btn primary big" data-pstart="${c.id}">${IC.clock}Start paper</button></div></section></div>`;
  }
  const left=st.start+P.mins*60000-Date.now();
  if(!st.sub && left<=0){ st.sub=true; st.timeUp=true; pSave(c.id,st); }
  const sc=paperScore(c.id);
  const answered=qs.filter((q,k)=>st.ans[k]!=null && st.ans[k]!=="").length;
  const bar = st.sub
    ? `<div class="pbar-sticky done"><div><b>Score: ${sc.got} / ${total}</b><span>MCQs ${sc.auto}/${sc.autoMax} (auto) · written ${sc.self}/${sc.selfMax} (self-marked)${sc.pending?` · ${sc.pending} still to mark`:""}</span></div><button class="btn" data-pretake="${c.id}">Retake paper</button></div>`
    : `<div class="pbar-sticky"><div><b id="ptime">${fmt(left)}</b><span id="pcount">${answered} of ${qs.length} answered</span></div><button class="btn primary" data-psubmit="${c.id}">Submit paper</button></div>`;
  let k=0;
  const body = P.sections.map(sec=>`<div class="paper-sec"><h2>${esc(sec.name)}</h2><span>${esc(sec.note)}</span></div>`+sec.qs.map(q=>{
    const i=k++, a=st.ans[i];
    let inner;
    if(q.o){
      inner = q.o.map((o,j)=>{
        let cls="popt";
        if(st.sub){ if(j===q.a) cls+=" right"; else if(j===a) cls+=" wrong"; }
        else if(j===a) cls+=" sel";
        return `<button class="${cls}" ${st.sub?"disabled":""} data-popt="${i}" data-j="${j}" aria-pressed="${j===a}"><span class="lt" style="width:26px;height:26px;border-radius:8px;background:var(--raise);display:grid;place-items:center;font:800 .75rem Sora,sans-serif;flex:0 0 auto">${String.fromCharCode(65+j)}</span>${inline(o)}</button>`;
      }).join("") + (st.sub?`<div class="why ${a===q.a?"ok":"no"}"><span class="wi">${a===q.a?"✅":"💡"}</span><span><strong>${a===q.a?"Correct!":a==null?"Not answered.":"Not quite."}</strong> ${inline(q.why)}</span></div>`:"");
    } else if(!st.sub){
      inner = `<textarea class="pans" data-w="${i}" rows="${q.m>=3?7:4}" aria-label="Answer to question ${i+1}" placeholder="Type your answer here, or write it on paper and leave this blank">${esc(a||"")}</textarea>`;
    } else {
      inner = `${a?`<div class="youwrote"><b>Your answer</b><pre class="plain">${esc(a)}</pre></div>`:""}
        <details open><summary>Model answer</summary><div class="qa-a">${rich(q.a)}</div></details>
        <div class="selfmark"><span>Marks you award yourself:</span>${Array.from({length:q.m+1},(_,v)=>`<button class="sm ${st.self[i]===v?"on":""}" data-pself="${i}" data-v="${v}" aria-pressed="${st.self[i]===v}">${v}</button>`).join("")}<span>out of ${q.m}</span></div>`;
    }
    return `<div class="pq"><div class="pq-head"><span class="qa-n">${i+1}</span><div class="pq-text">${rich(q.q)}</div><span class="pq-m">${q.m} mark${q.m>1?"s":""}</span></div>${inner}</div>`;
  }).join("")).join("");
  return `<div class="chap" style="--uc:var(--u3)">${head}
    <section class="chap-head"><span class="chap-num">${IC.clock} Mock paper</span><h1>${esc(P.title)}</h1><div class="chap-meta"><span>${IC.layers}${total} marks</span><span>${IC.clock}${P.mins} minutes</span></div></section>
    ${bar}
    ${st.timeUp&&st.sub?`<div class="tip"><span class="ti">${IC.clock}</span><div><b>Time is up</b>The paper was submitted automatically. Check your answers below and mark the written ones.</div></div>`:""}
    ${st.sub?`<div class="tip"><span class="ti">${IC.bulb}</span><div><b>How to self-mark</b>Compare each written answer with the model answer. Give full marks only if your answer has all the key points; give part marks for correct steps.</div></div>`:""}
    ${body}
    ${st.sub?"":`<div class="quizcta"><div><h3>Finished?</h3><p>You can't change answers after submitting.</p></div><div class="cta-row"><button class="btn primary" data-psubmit="${c.id}">Submit paper</button></div></div>`}
  </div>`;
}
function startTimer(cid){
  stopTimer();
  const P=paperOf(cid);
  timerH=setInterval(()=>{
    const st=pState(cid); if(st.sub||!st.start){ stopTimer(); return; }
    const left=st.start+P.mins*60000-Date.now(), el=$("ptime");
    if(el){ el.textContent=fmt(left); el.classList.toggle("low", left<5*60000); }
    if(left<=0){ stopTimer(); rerender(); toast("Time is up. Paper submitted."); }
  },1000);
}
$("content").addEventListener("click",e=>{
  const t=e.target.closest("[data-pstart],[data-popt],[data-psubmit],[data-pself],[data-pretake]"); if(!t) return;
  const cid=view.course, st=pState(cid);
  if(t.dataset.pstart){ st.start=Date.now(); st.ans={}; st.self={}; st.sub=false; st.timeUp=false; pSave(cid,st); render(view); startTimer(cid); return; }
  if(t.dataset.popt!=null && !st.sub){ st.ans[t.dataset.popt]=+t.dataset.j; pSave(cid,st); return rerender(); }
  if(t.dataset.psubmit){
    if(!t.dataset.armed){ document.querySelectorAll("[data-psubmit]").forEach(b=>{b.dataset.armed="1"; b.textContent="Tap again to submit";}); setTimeout(()=>document.querySelectorAll("[data-psubmit]").forEach(b=>{delete b.dataset.armed; b.textContent="Submit paper";}),4000); return; }
    st.sub=true; pSave(cid,st); stopTimer(); window.scrollTo({top:0}); render(view,true); toast("Paper submitted"); return;
  }
  if(t.dataset.pself!=null){ st.self[t.dataset.pself]=+t.dataset.v; pSave(cid,st); return rerender(); }
  if(t.dataset.pretake){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Tap again to clear answers"; setTimeout(()=>{delete t.dataset.armed; t.textContent="Retake paper";},4000); return; }
    store.set("paper-"+cid,{start:null,ans:{},sub:false,self:{}}); render(view);
  }
});
$("content").addEventListener("input",e=>{
  const ta=e.target.closest("textarea[data-w]"); if(!ta) return;
  const cid=view.course, st=pState(cid); if(st.sub) return;
  st.ans[ta.dataset.w]=ta.value; pSave(cid,st);
  const qs=flatQs(paperOf(cid)), n=qs.filter((q,k)=>st.ans[k]!=null&&st.ans[k]!=="").length, el=$("pcount");
  if(el) el.textContent=`${n} of ${qs.length} answered`;
});

/* =====================================================================
   DIGICLASS PLATFORM LAYER (v6)
   Analytics, progress, feedback, ratings, comments, saves, share,
   announcements and the teacher view.

   HOW DATA WORKS
   - REAL data only. Nothing here invents numbers.
   - With no services connected, everything is stored on the student's own
     device (localStorage) and labelled "on this device".
   - Connect free services in DC_CONFIG below and the same features start
     sending data to them. No other code needs to change.
   - Privacy: no names, emails or phone numbers are ever shown publicly.
     Public statistics are totals only.
   ===================================================================== */
const DC_CONFIG = {
  // 1) Public visit counter + aggregated page analytics (free): https://www.goatcounter.com
  //    Put your code here, e.g. "digiclass" for digiclass.goatcounter.com.
  //    In GoatCounter Settings, tick "Allow adding visitor counts on your website".
  analytics: { goatcounter: "" },
  // 2) Feedback inbox (free): e.g. https://formspree.io → New form → copy the endpoint
  //    like "https://formspree.io/f/abcdwxyz". Any endpoint that accepts a JSON POST works
  //    (Formspree, Getform, a Supabase/Firebase function…).
  feedback: { endpoint: "" },
  // 3) Moderated comments (free): https://cusdis.com → New website → copy the app-id.
  //    Comments only appear after the teacher approves them in the Cusdis dashboard.
  comments: { cusdisAppId: "", host: "https://cusdis.com" },
  // 4) Announcements shown under the 🔔 bell. Newest first. Add a line to announce something.
  news: [
    { date:"2026-10-07", icon:"🎨", title:"Calmer dark design for long study sessions", go:"#/" },
    { date:"2026-10-07", icon:"🧮", title:"Every Maths practice question now has a hint and step-by-step solution", go:"#/class/12" },
    { date:"2026-10-07", icon:"📝", title:"New Class 12 Maths mock paper", go:"#/ma12/paper" },
    { date:"2026-10-07", icon:"🎯", title:"90+ new board-style questions for CS, IP and Maths (Class 12)", go:"#/practice" }
  ]
};

const DCP = (()=>{
  const K = { ev:"dc-ev", qa:"dc-qa", days:"dc-days", time:"dc-time", read:"dc-read", recent:"dc-recent",
              savedq:"dc-savedq", votes:"dc-votes", ratings:"dc-ratings", outbox:"dc-outbox", search:"dc-search",
              newsSeen:"dc-news-seen", chal:"dc-challenge", views:"dc-views", fbRate:"dc-fb-rate" };
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const GC = DC_CONFIG.analytics.goatcounter.trim(), FB = DC_CONFIG.feedback.endpoint.trim(), CU = DC_CONFIG.comments.cusdisAppId.trim();

  /* ---------- data adapter (swap "local" for a backend later) ---------- */
  const Data = {
    get:(k,d)=>store.get(k,d), set:(k,v)=>store.set(k,v),
    push(k,item,cap){ const a=store.get(k,[]); a.push(item); if(a.length>cap) a.splice(0,a.length-cap); store.set(k,a); return a; }
  };

  /* ---------- analytics ---------- */
  let gcReady=false, gcQueue=[];
  function loadGC(){
    if(!GC) return;
    window.goatcounter = { no_onload:true, allow_local:false };
    const s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
    s.dataset.goatcounter=`https://${GC}.goatcounter.com/count`;
    s.onload=()=>{ gcReady=true; gcQueue.splice(0).forEach(send); };
    document.head.appendChild(s);
  }
  function send(o){ if(!GC) return; if(!gcReady||!window.goatcounter||!window.goatcounter.count){ gcQueue.push(o); return; } try{ window.goatcounter.count(o); }catch(e){} }
  const Track = {
    page(path,title){ send({path, title}); },
    event(name,title){ send({path:name, title:title||name, event:true}); },
    activity(){ const d=new Set(Data.get(K.days,[])); d.add(today()); Data.set(K.days,[...d].sort().slice(-400)); }
  };
  function publicCount(cb){
    if(!GC) return cb(null);
    fetch(`https://${GC}.goatcounter.com/counter/TOTAL.json`).then(r=>r.ok?r.json():null).then(j=>cb(j&&j.count?String(j.count).trim():null)).catch(()=>cb(null));
  }

  /* ---------- question attempts ---------- */
  function attempt(qid, ok){
    const m=Data.get(K.qa,{}); const r=m[qid]||{a:0,c:0}; r.a++; if(ok) r.c++; m[qid]=r; Data.set(K.qa,m);
    Track.activity(); Track.event(`q/${ok?"right":"wrong"}/${qid}`, `Answered ${qid}`);
  }
  const chOfQ = qid => qid.split(":")[0];

  /* ---------- time on task ---------- */
  let lastAct=Date.now();
  ["scroll","click","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
  setInterval(()=>{
    if(document.visibilityState!=="visible" || Date.now()-lastAct>120000) return;
    const t=Data.get(K.time,{total:0,by:{}}); t.total+=15;
    if(view&&view.name==="chapter"){ t.by[view.id]=(t.by[view.id]||0)+15; Track.activity(); }
    Data.set(K.time,t);
  },15000);

  /* ---------- reading progress per chapter ---------- */
  addEventListener("scroll",()=>{
    if(!view||view.name!=="chapter") return;
    const h=document.documentElement.scrollHeight-innerHeight; if(h<=0) return;
    const p=Math.min(100,Math.round(scrollY/h*100)), r=Data.get(K.read,{});
    if((r[view.id]||0)<p){ r[view.id]=p; Data.set(K.read,r); }
  },{passive:true});

  /* ---------- stats (everything computed from real, local data) ---------- */
  function stats(){
    const qa=Data.get(K.qa,{}), vals=Object.entries(qa);
    const att=vals.reduce((n,[,r])=>n+r.a,0), cor=vals.reduce((n,[,r])=>n+r.c,0);
    const days=new Set(Data.get(K.days,[]));
    let streak=0; const d=new Date(); if(!days.has(today())) d.setDate(d.getDate()-1);
    for(;;){ const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; if(days.has(k)){ streak++; d.setDate(d.getDate()-1);} else break; }
    const byCh={}; vals.forEach(([q,r])=>{ const c=chOfQ(q); if(!CHBY[c]) return; const b=byCh[c]||(byCh[c]={a:0,c:0}); b.a+=r.a; b.c+=r.c; });
    const topics=Object.entries(byCh).filter(([,b])=>b.a>=3).map(([c,b])=>({id:c,acc:Math.round(b.c/b.a*100),a:b.a}));
    const study=COURSES.flatMap(c=>c.study);
    const papers=COURSES.filter(c=>paperOf(c.id)&&store.get("paper-"+c.id,{}).sub).length;
    const sols=Data.get(K.ev,[]).filter(e=>e.t==="sol").length;
    return { att, cor, acc:att?Math.round(cor/att*100):null, done:study.filter(ch=>done.has(ch.id)).length, total:study.length,
      streak, activeDays:days.size, papers, quizzes:Object.keys(scores).length, mins:Math.round(Data.get(K.time,{total:0}).total/60),
      weak:topics.filter(t=>t.acc<60).sort((a,b)=>a.acc-b.acc).slice(0,4), strong:topics.filter(t=>t.acc>=80).sort((a,b)=>b.acc-a.acc).slice(0,4),
      sols, savedQ:Data.get(K.savedq,[]).length };
  }
  const fmtMins = m => m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`;

  /* ---------- UI: progress panel ---------- */
  function progressPanel(){
    const s=stats();
    const tile=(icon,val,label,sub)=>`<div class="pp-tile"><span class="pp-i" aria-hidden="true">${icon}</span><b>${val}</b><span>${label}</span>${sub?`<small>${sub}</small>`:""}</div>`;

  /* ---------- feedback modal ---------- */
  const TYPES = { feedback:["💬","Leave feedback","What do you like? What could be better?"], question:["❓","Ask a question","Ask about a concept or topic you're stuck on."],
    error:["🐞","Report an error","Tell us what's wrong so we can fix it."], topic:["💡","Suggest a topic","What should we add next?"], rating:["⭐","Rating",""] };
  const REASONS = { error:["Incorrect answer","Incorrect explanation","Typo","Question unclear","Broken button or link","Missing content","Technical problem","Other"],
    topic:["Chapter","Topic","Question type","Revision material","Mock test","Programming problem","SQL practice","Other"] };
  const BAD = /\b(idiot|stupid|dumb|loser|shut ?up|hate you|kill|fuck|shit|bitch|bastard|damn|crap|asshole|moron|ugly)\b/i;
  function check(msg,name){
    const all=msg+" "+name;
    if(msg.trim().length<5) return "Please write a little more (at least 5 characters).";
    if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(all)) return "Please don't include email addresses. Your teacher will reply on DigiClass or in class.";
    if(/(\d[\s-]?){8,}/.test(all)) return "Please don't include phone numbers or long ID numbers.";
    if(/(https?:\/\/|www\.|\.(com|net|org|io|xyz|ru|in|ae)\b)/i.test(all)) return "Links aren't allowed. Describe the problem in words instead.";
    if(BAD.test(all)) return "Please keep it kind and respectful.";
    if(/(.)\1{7,}/.test(all)) return "That looks like spam. Please write a normal message.";
    const r=Data.get(K.fbRate,[]).filter(t=>Date.now()-t<86400000);
    if(r.length>=10) return "You've sent a lot of messages today. Please try again tomorrow.";
    if(r.length && Date.now()-r[r.length-1]<20000) return "Please wait a few seconds before sending another message.";
    return null;
  }
  let FBCTX = {};
  function openFb(type, ctx){
    FBCTX = Object.assign({type, page:location.hash||"#/", title:document.title}, ctx||{});

    d.innerHTML = `<form class="fbf" id="fbf" novalidate>

      <p class="fb-sub">${sub}${FBCTX.ref?`<br><span class="fb-ref">About: ${esc(FBCTX.refLabel||FBCTX.ref)}</span>`:""}</p>
      ${reasons?`<label class="fb-l">${type==="error"?"What's the problem?":"What would you like?"}<select id="fbReason">${reasons.map(r=>`<option${FBCTX.reason===r?" selected":""}>${r}</option>`).join("")}</select></label>`:""}
      <label class="fb-l">Your message<textarea id="fbMsg" rows="4" maxlength="800" required placeholder="${type==="error"?"e.g. In question 3 the answer should be 12, not 10.":type==="topic"?"e.g. More SQL JOIN questions please.":type==="question"?"e.g. When do I use iloc instead of loc?":"Tell us what you think…"}">${esc(FBCTX.msg||"")}</textarea></label>
      <label class="fb-l">First name and class <span class="opt">(optional)</span><input id="fbName" maxlength="30" autocomplete="off" placeholder="e.g. Aisha, 12B"></label>
      <input id="fbHp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="fb-safe">🛡️ Don't share your full name, email, phone number or any private information.${FB?" Your teacher reads every message.":""}</p>
      <p class="fb-err" id="fbErr" role="alert"></p>
      <div class="qfoot"><button type="button" class="btn" data-fbclose>Cancel</button><button class="btn primary" type="submit">Send</button></div>
    </form>`;
    $("fb").showModal(); setTimeout(()=>{ const m=$("fbMsg"); if(m) m.focus(); },50);
  }
  function submitFb(){
    if($("fbHp").value) return $("fb").close();
    const msg=$("fbMsg").value.trim(), name=$("fbName").value.trim(), rs=$("fbReason");
    const err=check(msg,name); if(err){ $("fbErr").textContent=err; return; }
    const item={ id:Math.random().toString(36).slice(2,10), ts:new Date().toISOString(), type:FBCTX.type, reason:rs?rs.value:"", message:msg, name, page:FBCTX.page, ref:FBCTX.ref||"", title:FBCTX.title, status:"pending", sent:false };
    deliver(item, ok=>{
      $("fbd").innerHTML = `<div class="fb-done"><div class="fb-big">${ok?"✅":"📥"}</div><h3>${ok?"Thank you!":"Saved on this device"}</h3>

  function deliver(item, cb){
    const r=Data.get(K.fbRate,[]).filter(t=>Date.now()-t<86400000); r.push(Date.now()); Data.set(K.fbRate,r);
    Track.event(`feedback/${item.type}`, item.type);

      </div>
      <h2 class="t-h">Most viewed chapters</h2>${tbl(["Chapter","Views","Time"],topViews.map(([id,n])=>`<tr><td>${esc(CHBY[id].title)} <small>(${CHBY[id].course.short} ${CHBY[id].course.grade})</small></td><td>${n}</td><td>${fmtMins(Math.round((t.by[id]||0)/60))}</td></tr>`))}
      <h2 class="t-h">Question accuracy (lowest first)</h2>${tbl(["Question","Attempts","Correct","Incorrect"],qrows.map(r=>`<tr><td>${esc(qLabel(r.q))}</td><td>${r.a}</td><td>${r.acc}%</td><td>${100-r.acc}%</td></tr>`))}
      <h2 class="t-h">Searches</h2>${tbl(["Search","Times"],Object.entries(srch).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([q,n])=>`<tr><td>${esc(q)}</td><td>${n}</td></tr>`))}
      <h2 class="t-h">Helpful votes</h2>${tbl(["Question","Vote"],Object.entries(votes).filter(([q])=>CHBY[chOfQ(q)]).slice(-10).map(([q,v])=>`<tr><td>${esc(qLabel(q))}</td><td>${v>0?"👍":"👎"}</td></tr>`))}
      <h2 class="t-h">Messages from this device</h2>${tbl(["When","Type","Message","Status"],out.slice(-15).reverse().map(m=>`<tr><td>${esc(m.ts.slice(0,10))}</td><td>${esc(m.type)}${m.reason?` · ${esc(m.reason)}`:""}</td><td>${esc(m.message)}</td><td>${m.sent?"Sent · pending review":"Not sent (inbox not connected)"}</td></tr>`))}
      <h2 class="t-h">Ready for later</h2>
      <p class="meta">The code is organised so student accounts (Firebase or Supabase), an AI tutor, teacher replies and whole-class dashboards can be added without redesigning the site: every action already goes through one tracking function and one data store.</p>
    </div>`;
  }

  /* ---------- after every page render ---------- */
  function after(v){
    if(v.name==="chapter"){
      const r=Data.get(K.recent,[]).filter(x=>x!==v.id); r.unshift(v.id); Data.set(K.recent,r.slice(0,6));
      const vw=Data.get(K.views,{}); vw[v.id]=(vw[v.id]||0)+1; Data.set(K.views,vw);
      Track.activity();
    }
    Track.page((location.hash||"#/").replace(/^#/,"")||"/", document.title);
    decorate(v); bell();
  }

  /* ---------- events ---------- */
  document.addEventListener("click",e=>{
    const t=e.target.closest("[data-fb],[data-vote],[data-saveq],[data-shareq],[data-reportq],[data-sharech],[data-star],[data-ratec],[data-chal],[data-fbclose],[data-fbtype],[data-sharecopy],#bellBtn,.qa details>summary");
    if(!t) return;
    if(t.matches(".qa details>summary")){ const it=t.closest(".qa-item"); if(it&&it.dataset.qid&&!t.parentElement.open&&!t.closest(".hint")){ Data.push(K.ev,{t:"sol",q:it.dataset.qid,ts:Date.now()},1500); Track.activity(); } return; }
    if(t.id==="bellBtn") return openNews();
    if(t.hasAttribute("data-fbclose")){ if(t.tagName!=="A") e.preventDefault(); return $("fb").close(); }
    if(t.dataset.fbtype){ const msg=$("fbMsg")?$("fbMsg").value:""; return openFb(t.dataset.fbtype,Object.assign({},FBCTX,{msg})); }
    if(t.hasAttribute("data-sharecopy")){ const i=document.querySelector(".share-url"); (navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(()=>toast("Link copied ✓")).catch(()=>{ i.select(); toast("Press Ctrl+C to copy"); }); return; }
    if(t.dataset.fb){ const ref=t.dataset.fbref; return openFb(t.dataset.fb, ref?{ref,refLabel:CHBY[ref]?CHBY[ref].title:ref}:{}); }
    const item=t.closest(".qa-item"), qid=item&&item.dataset.qid;
    if(t.dataset.vote&&qid){ const m=Data.get(K.votes,{}), v=+t.dataset.vote; m[qid]=m[qid]===v?0:v; if(!m[qid]) delete m[qid]; Data.set(K.votes,m); Track.event(`vote/${v>0?"up":"down"}/${qid}`); item.querySelectorAll("[data-vote]").forEach(b=>{ const on=m[qid]===+b.dataset.vote; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); }); if(v<0&&m[qid]) toast("Thanks. Tap ⚑ Report to tell us what's wrong."); return; }
    if(t.hasAttribute("data-saveq")&&qid){ let l=Data.get(K.savedq,[]); const has=l.some(x=>x.qid===qid); l=has?l.filter(x=>x.qid!==qid):[...l,{qid,text:qText(item),ts:Date.now()}]; Data.set(K.savedq,l); t.classList.toggle("on",!has); t.setAttribute("aria-pressed",!has); t.textContent=!has?"🔖 Saved":"🔖 Save"; toast(has?"Removed from saved":"Question saved 🔖"); return; }
    if(t.hasAttribute("data-shareq")&&qid){ const ch=CHBY[chOfQ(qid)]; return share(`${hashFor({name:"chapter",id:ch.id})}/q/${qid.split(":")[1]}`, `${ch.title}: ${qText(item).slice(0,60)}`); }
    if(t.hasAttribute("data-reportq")&&qid){ return openFb("error",{ref:qid,refLabel:qText(item).slice(0,80)}); }
    if(t.hasAttribute("data-sharech")){ const ch=CHBY[view.id]; return share(hashFor({name:"chapter",id:ch.id}), `${ch.title} (Class ${ch.course.grade} ${ch.course.subject})`); }
    if(t.dataset.star){ const card=t.closest("[data-rate-ch]"), id=card.dataset.rateCh, n=+t.dataset.star, m=Data.get(K.ratings,{}); m[id]={s:n,c:m[id]&&m[id].c||"",ts:Date.now()}; Data.set(K.ratings,m); Track.event(`rate/${n}/${id}`,`Rated ${id} ${n}/5`); card.outerHTML=ratingCard(id); const nc=document.querySelector(`[data-rate-ch="${id}"]`); if(nc) nc.classList.add("in"); toast("Thanks for rating ⭐"); return; }
    if(t.hasAttribute("data-ratec")){ const card=t.closest("[data-rate-ch]"), id=card.dataset.rateCh, inp=$("rateC"), c=inp.value.trim(); if(!c) return; const err=check(c,""); if(err){ toast(err); return; } const m=Data.get(K.ratings,{}); m[id].c=c; Data.set(K.ratings,m); deliver({id:Math.random().toString(36).slice(2,10),ts:new Date().toISOString(),type:"rating",reason:`${m[id].s}/5`,message:c,name:"",page:location.hash,ref:id,title:document.title,status:"pending"}); card.outerHTML=ratingCard(id); const nc=document.querySelector(`[data-rate-ch="${id}"]`); if(nc) nc.classList.add("in"); toast("Comment sent for review ✓"); return; }
    if(t.dataset.chal!=null){ const st=Data.get(K.chal,{}); if(st.date===today()) return; const [id,i]=challengeQ(), q=quizOf(id)[i], k=+t.dataset.chal; Data.set(K.chal,{date:today(),k}); attempt(`${id}:z${i}`,k===q[2]); $("chal").outerHTML=challengeCard(); if(k===q[2]&&typeof burst==="function") burst(document.querySelector("#chal .right")); return; }
  });
  document.addEventListener("submit",e=>{ if(e.target.id==="fbf"){ e.preventDefault(); submitFb(); } });
  // quiz answers → attempts (runs after the existing quiz handler)
  $("qd").addEventListener("click",e=>{
    if(!Q||!e.target.closest(".opt")) return;
    Q.logged=Q.logged||{}; if(Q.res[Q.i]===undefined||Q.logged[Q.i]) return;
    Q.logged[Q.i]=true; attempt(`${Q.id}:z${Q.i}`,Q.res[Q.i]);
  });
  // search terms (aggregated, no identity)
  let sTimer=null;
  $("search").addEventListener("input",e=>{ clearTimeout(sTimer); const q=e.target.value.trim().toLowerCase(); if(q.length<3) return;
    sTimer=setTimeout(()=>{ const m=Data.get(K.search,{}); m[q]=(m[q]||0)+1; Data.set(K.search,m); Track.event(`search/${q.slice(0,40)}`,`Search: ${q.slice(0,40)}`); },1500); });

  loadGC();
  return { after, progressPanel, continueList, homeStrip, newsHome, helpBlock, vTeacher, stats, openFb };
})();

render(parseHash());

</script>
</body>
</html>
