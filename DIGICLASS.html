{ id:"ip11-computer-system", unit:1, title:"Introduction to computer system",
  intro:"Computing devices, the parts of a computer, memory, data recovery and types of software.",
  sec:[["Evolution of computing devices", [["p", "Computing devices have changed from hand-operated tools to today's smartphones. Knowing the main milestones helps you understand why modern computers work the way they do."], ["table", ["Period", "Device", "Key idea"], [["~500 BC", "Abacus", "Beads on rods for counting"], ["1642", "Pascaline (Blaise Pascal)", "Mechanical adding machine"], ["1830s", "Analytical Engine (Charles Babbage)", "Design of the first general-purpose programmable computer; Babbage is called the **father of the computer**. **Ada Lovelace** wrote the first algorithm for it"], ["1890", "Tabulating machine (Herman Hollerith)", "Punched cards for the US census"], ["1940s", "ENIAC, EDVAC", "Electronic computers using **vacuum tubes**; von Neumann's stored-program idea"], ["1950s–60s", "Transistor computers", "Smaller, faster, more reliable"], ["1970s", "Microprocessor (Intel 4004)", "A whole CPU on one chip; led to personal computers"], ["Today", "Laptops, smartphones, cloud, AI", "Very small, powerful, networked devices"]]], ["p", "Computers are often grouped into **generations**: 1st vacuum tubes, 2nd transistors, 3rd integrated circuits (ICs), 4th microprocessors (VLSI), 5th AI and parallel processing."]]], ["Components of a computer system", [["p", "A computer accepts **input**, **processes** it, **stores** data and gives **output**."], ["table", ["Component", "Function", "Examples"], [["Input devices", "Send data and instructions into the computer", "Keyboard, mouse, scanner, microphone, webcam, touch screen, joystick, barcode reader, OCR/OMR readers, biometric (fingerprint) scanner"], ["CPU", "Processes data and controls the system: **ALU** (calculations and comparisons), **CU** (controls and coordinates), **registers** (fastest tiny memory inside the CPU)", "Intel i5, AMD Ryzen, Apple M3"], ["Memory / storage", "Holds data and programs", "RAM, ROM, cache, HDD, SSD, pen drive"], ["Output devices", "Present results to the user", "Monitor, printer, speaker, projector, plotter, headphones"]]], ["p", "Data is carried between the CPU, memory and devices through a set of wires called the **system bus** (data bus, address bus, control bus)."]]], ["Memory and its units", [["p", "**Units:** bit (0/1) → nibble (4 bits) → byte (8 bits) → KB (1024 bytes) → MB → GB → TB → PB → EB → ZB → YB, each 1024 times the previous one."], ["table", ["Memory", "Volatile?", "Description"], [["Registers", "Yes", "Inside the CPU; fastest; hold the instruction/data being processed"], ["Cache", "Yes", "Very fast memory between CPU and RAM; keeps frequently used data close to the CPU"], ["RAM (primary)", "**Yes**", "Main working memory; holds running programs and their data; lost on power off"], ["ROM (primary)", "**No**", "Read-only; holds the start-up program (BIOS/firmware)"], ["Secondary storage", "No", "Permanent, large, slower: HDD, SSD, pen drive, memory card, CD/DVD, cloud storage"]]], ["p", "**Primary memory** is directly accessible by the CPU and fast but limited and costly. **Secondary memory** is not directly accessible by the CPU, slower, but large, cheap and permanent."]]], ["Data deletion and recovery", [["p", "When you **delete** a file, it usually goes to the Recycle Bin. Even after emptying the bin, the data is often **not physically erased**: the operating system only marks that space as free. Until new data overwrites it, **data recovery software** can bring the file back."], ["ul", ["**Recovery**: useful when files are deleted by mistake; recovery tools scan the disk for unallocated data.", "**Security risk**: if you sell or give away an old phone or computer, someone could recover your photos, chats or passwords.", "**Permanent deletion**: use *data shredding* / secure-erase tools that overwrite the data several times, do a full factory reset with encryption turned on, or physically destroy old drives."]]]], ["Software", [["p", "**Software** is a set of programs that tells the hardware what to do."], ["table", ["Type", "Purpose", "Examples"], [["System software", "Manages hardware and provides a platform for other programs", "Operating systems (Windows, Linux, Android, macOS), device drivers, utilities (antivirus, disk cleanup, backup, compression)"], ["Programming tools / language translators", "Help write programs and translate them into machine code", "Compiler (whole program at once: C++), interpreter (line by line: Python), assembler (assembly → machine code), IDEs"], ["Application software", "Does a specific task for the user", "General purpose: MS Office/LibreOffice, browsers, Photoshop. Customised: school management system, railway reservation software"]]], ["p", "**Operating system:** the most important system software. It acts as an **interface between the user and the hardware**, and manages processes, memory, files, devices and security. Interfaces may be command-based (CLI), graphical (GUI), touch-based, voice-based or gesture-based."], ["p", "Software can also be **proprietary** (owned, paid, closed source), **freeware** (free but closed source) or **open source** (free to use, modify and share: Linux, LibreOffice, Python)."]]], ["Generic and specific-purpose software", [["p", "Application software is further divided by **who it is made for**:"], ["table", ["Generic (general-purpose) software", "Specific-purpose (customised) software"], [["Made for a large number of users with common needs", "Made for one organisation or one particular task"], ["Ready-made, bought off the shelf or downloaded", "Developed to order, as per the client's requirements"], ["Cheaper, widely available", "Costlier, takes time to develop"], ["Examples: word processor, spreadsheet, presentation software, web browser, image editor", "Examples: school management system, hospital management system, railway reservation, payroll of a company"]]], ["tip", "Exam tip", "Hospital management software, school fee software and payroll software are all **specific-purpose**. MS Word, LibreOffice Calc and Chrome are **generic**."]]]]},

{ id:"ip11-python-basics", unit:2, title:"Python fundamentals",
  intro:"Variables, data types, operators, expressions and input/output in Python.",
  sec:[["Introduction to Python", [["p", "**Python** is a high-level, interpreted programming language created by **Guido van Rossum** (1991). In IP it is the main tool for handling and analysing data, together with libraries like NumPy and Pandas."], ["p", "**Features:** simple, English-like syntax; **interpreted** (executes line by line); **free and open source**; **portable** (works on any OS); **case-sensitive**; uses **indentation** for blocks; rich library support; dynamically typed."], ["ul", ["**Interactive mode**: type at the `>>>` prompt; each statement runs immediately. Good for quick testing; nothing is saved.", "**Script mode**: write code in a `.py` file, save it and run it. Used for complete programs."]]]], ["Structure of a Python program", [["p", "A Python program is a sequence of **statements** executed from top to bottom. A typical program has these parts:"], ["code", "# Program to find the area of a circle      ← comment (explains the program)\nimport math                                   # ← import statement (modules used)\n\nPI = 3.14159                                  # ← constant (value that shouldn't change)\nr = float(input('Radius: '))                  # ← input\narea = PI * r * r                             # ← processing (expression + assignment)\nif area > 100:                                # ← control statement with a block\n    print('Large circle')                     #    (block is indented)\nprint('Area =', round(area, 2))               # ← output"], ["ul", ["**Statements** are instructions Python executes. A simple statement fits on one line; a compound statement (if, for, while) has a header ending in `:` followed by an indented block.", "**Indentation** (usually 4 spaces) groups statements into a block. Python uses it instead of curly brackets, and wrong indentation gives an `IndentationError`.", "A long statement can continue on the next line using `\\` or inside brackets; several short statements can share one line separated by `;`."]]]], ["Keywords, identifiers and variables", [["p", "**Keywords** are reserved words with a special meaning: `False, None, True, and, as, break, class, continue, def, del, elif, else, except, for, from, global, if, import, in, is, lambda, not, or, pass, return, try, while, with`. They can't be used as names."], ["p", "**Identifiers** are names for variables, functions etc. Rules: letters, digits and `_` only; must not start with a digit; no keywords; case-sensitive. Valid: `marks_1`, `_total`; invalid: `1marks`, `my name`, `if`."], ["p", "A **variable** is a name that refers to a value in memory. It is created when you first assign a value; no type declaration is needed."], ["code", "name = 'Isha'          # str\nage = 16               # int\nheight = 5.4           # float\nis_member = True       # bool\nx = y = 0              # same value to two variables\na, b = 10, 20          # multiple assignment\nprint(type(height))    # <class 'float'>"], ["p", "**Comments** (`#` …) explain code and are ignored by Python."]]], ["Constants", [["p", "A **constant** is a value that should not change while the program runs, such as π, the GST rate or the number of days in a week. Python has no special keyword for constants; by convention we write their names in **CAPITAL letters** so everyone knows not to change them."], ["code", "PI = 3.14159\nGST_RATE = 18\nDAYS_IN_WEEK = 7\nprice = 500\nprint(price + price * GST_RATE / 100)    # 590.0"], ["p", "**Literals** are the fixed values written directly in code: `500` (integer literal), `3.14` (float literal), `'Delhi'` (string literal), `True` (Boolean literal), `None` (special literal)."]]], ["Data types", [["table", ["Type", "Example", "Description"], [["int", "25, -3", "Whole numbers"], ["float", "3.75, 2.0", "Numbers with a decimal point"], ["complex", "2+3j", "Real and imaginary parts"], ["bool", "True, False", "Logical values (True = 1, False = 0)"], ["str", "'Hello'", "Text, immutable"], ["list", "[1, 2, 'a']", "Ordered, mutable collection"], ["tuple", "(1, 2)", "Ordered, immutable collection"], ["dict", "{'a': 1}", "Key: value pairs, mutable"], ["None", "None", "Absence of a value"]]]]], ["Operators and precedence", [["table", ["Type", "Operators", "Example → result"], [["Arithmetic", "+  −  *  /  //  %  **", "17 / 5 → 3.4,  17 // 5 → 3,  17 % 5 → 2,  2 ** 4 → 16"], ["Relational", "==  !=  >  <  >=  <=", "10 >= 10 → True"], ["Logical", "and  or  not", "(5 > 3) and (2 > 4) → False"], ["Assignment", "=  +=  −=  *=  /=  //=  %=  **=", "x += 5 → x = x + 5"], ["Identity", "is  is not", "a is b → same object?"], ["Membership", "in  not in", "'p' in 'apple' → True"]]], ["p", "**Precedence (high → low):** `()` → `**` → unary `−` → `* / // %` → `+ −` → relational → `not` → `and` → `or`."], ["code", "print(2 + 3 * 4)          # 14\nprint((2 + 3) * 4)        # 20\nprint(10 / 4, 10 // 4)    # 2.5 2\nprint(2 ** 3 ** 2)        # 512 (** is right to left)\nprint(5 > 2 and 3 > 4 or not False)   # (True and False) or True → True"]]], ["Expressions, input/output and type conversion", [["p", "An **expression** is any combination of values, variables and operators that gives a value. A **statement** is a complete instruction."], ["p", "`input()` always returns a **string**. Convert it with `int()` or `float()` before calculating."], ["code", "a = input('Enter a number: ')        # user types 5 → a = '5'\nprint(a * 2)                         # 55  (string repetition!)\nb = int(input('Enter a number: '))\nprint(b * 2)                         # 10"], ["p", "**Explicit conversion** (you do it): `int()`, `float()`, `str()`, `bool()`, `list()`. **Implicit conversion** (Python does it): `3 + 2.5` → `5.5`."], ["code", "print(int(9.99))            # 9   (decimal part dropped)\nprint(float(7))             # 7.0\nprint(str(5) + str(5))      # 55\nprint(int('12') + 3)        # 15\nprint(round(7.456, 2))      # 7.46"], ["p", "`print()` options: `sep` changes the separator between values; `end` changes what is printed at the end."], ["code", "print('2026', '10', '08', sep='-')    # 2026-10-08\nprint('Hello', end='! ')\nprint('IP')                         # Hello! IP"]]], ["Mutable vs immutable, and debugging", [["p", "**Mutable** objects can be changed after creation (list, dict). **Immutable** objects can't (int, float, str, tuple, bool). 'Changing' an immutable value really creates a new object."], ["code", "s = 'data'\ns = s.upper()        # creates a new string 'DATA'\nL = [1, 2]\nL.append(3)          # same list changed → [1, 2, 3]"], ["p", "**Debugging** means finding and fixing errors."], ["table", ["Error", "Meaning", "Example"], [["Syntax error", "Grammar rule broken; program won't start", "print('Hi'"], ["Logical error", "Runs but gives the wrong result", "avg = a + b / 2 instead of (a + b) / 2"], ["Runtime error", "Crashes while running", "5 / 0 (ZeroDivisionError), int('x') (ValueError), undefined name (NameError)"]]]]], ["Strings: basic operations", [["p", "Strings appear in many IP questions even though there is no separate strings chapter. A string is text in quotes; it is **immutable**."], ["table", ["Operation", "Example", "Result"], [["Concatenation +", "'Info' + 'rmatics'", "'Informatics'"], ["Replication *", "3 * 'IP'", "'IPIPIP'"], ["Membership in", "'a' in 'Data'", "True"], ["Length", "len('Python')", "6"], ["Indexing", "'Python'[0], 'Python'[-1]", "'P', 'n'"], ["Slicing", "'Python'[1:4]", "'yth'"], ["Comparison", "'abc' == 'ABC'", "False (case-sensitive)"]]], ["p", "**Escape sequences** put special characters inside strings: `\\n` new line, `\\t` tab, `\\\\` backslash, `\\'` single quote."], ["code", "print('Name:\\tRiya\\nClass:\\t11')\n# Name:   Riya\n# Class:  11\nprint('IP' * 2, 'CS', sep='-', end='!\\n')     # IPIP-CS!\nprint(len('Hello World'), 'Hello'[1:3])        # 11 el"]]], ["== versus is", [["p", "`==` checks whether two values are **equal**. `is` checks whether two names refer to the **same object in memory** (same `id()`)."], ["code", "a = [1, 2]\nb = [1, 2]\nc = a\nprint(a == b)    # True  (same values)\nprint(a is b)    # False (two different list objects)\nprint(a is c)    # True  (c refers to the same object as a)"]]]]},

{ id:"ip11-flow-control", unit:2, title:"Flow of control",
  intro:"Using if statements to make decisions and loops to repeat work.",
  sec:[["Flow of control", [["p", "Statements usually run **sequentially**, top to bottom. **Conditional** statements choose between paths, and **loops** repeat statements. Python groups the statements of a block by **indentation** after a colon."]]], ["if, if-else and if-elif-else", [["code", "age = int(input('Age: '))\nif age >= 18:\n    print('You can vote')\nelse:\n    print('Too young to vote')"], ["code", "# Grade from percentage\np = float(input('Percentage: '))\nif p >= 90:\n    print('A1')\nelif p >= 80:\n    print('A2')\nelif p >= 70:\n    print('B1')\nelif p >= 33:\n    print('Pass')\nelse:\n    print('Fail')"], ["code", "# Absolute value, and the largest of three numbers\nn = int(input('n: '))\nif n < 0:\n    n = -n\nprint('Absolute value', n)\n\na, b, c = 8, 15, 11\nbiggest = a\nif b > biggest: biggest = b\nif c > biggest: biggest = c\nprint(biggest)        # 15"], ["p", "Python checks an `elif` ladder from the top and runs **only the first** true branch. The `else` runs if none are true."]]], ["for loop and range()", [["p", "`range(start, stop, step)` produces numbers from start up to **stop − 1**."], ["table", ["Expression", "Values"], [["range(5)", "0, 1, 2, 3, 4"], ["range(1, 6)", "1, 2, 3, 4, 5"], ["range(2, 11, 2)", "2, 4, 6, 8, 10"], ["range(5, 0, -1)", "5, 4, 3, 2, 1"]]], ["code", "# Sum and average of n numbers\nn = int(input('How many? '))\ntotal = 0\nfor i in range(n):\n    total += float(input('Number: '))\nprint('Sum', total, 'Average', total / n)\n\n# Table of a number\nnum = 6\nfor i in range(1, 11):\n    print(num, 'x', i, '=', num * i)\n\n# Even numbers from 1 to 20\nfor i in range(2, 21, 2):\n    print(i, end=' ')"]]], ["while loop", [["p", "A `while` loop repeats as long as its condition is True. Something inside must change so the condition eventually becomes False."], ["code", "# Count down\nn = 5\nwhile n > 0:\n    print(n, end=' ')     # 5 4 3 2 1\n    n -= 1\n\n# Keep asking until a valid mark is entered\nm = int(input('Marks (0-100): '))\nwhile m < 0 or m > 100:\n    m = int(input('Invalid. Enter again: '))"], ["p", "`break` exits a loop immediately; `continue` skips to the next iteration."], ["code", "for i in range(1, 11):\n    if i == 6:\n        break\n    if i % 2 == 0:\n        continue\n    print(i, end=' ')     # 1 3 5"]]]]},

{ id:"ip11-lists", unit:2, title:"Lists",
  intro:"Creating lists, slicing them, and using list methods and functions.",
  sec:[["Creating and accessing lists", [["p", "A **list** is an ordered, **mutable** collection of items in square brackets. It's the most used structure for holding data in Python: marks of a class, names, prices."], ["code", "marks = [78, 92, 65, 88]\nmixed = ['Isha', 16, 5.4, True]\nempty = []\nletters = list('data')      # ['d', 'a', 't', 'a']\nnums = list(range(1, 6))    # [1, 2, 3, 4, 5]"], ["p", "Items are accessed by **index**: positive from 0, negative from −1. **Slicing** `L[start:stop:step]` returns a new list (stop not included)."], ["code", "L = [10, 20, 30, 40, 50]\nprint(L[0], L[-1])     # 10 50\nprint(L[1:4])          # [20, 30, 40]\nprint(L[::-1])         # [50, 40, 30, 20, 10]\nL[2] = 35              # lists are mutable\nprint(L)               # [10, 20, 35, 40, 50]"]]], ["List operations and traversal", [["table", ["Operation", "Example", "Result"], [["Concatenation (+)", "[1, 2] + [3, 4]", "[1, 2, 3, 4]"], ["Repetition (*)", "['a'] * 3", "['a', 'a', 'a']"], ["Membership (in)", "20 in [10, 20]", "True"], ["Slicing", "[1, 2, 3, 4][1:3]", "[2, 3]"]]], ["code", "marks = [78, 92, 65, 88]\nfor m in marks:              # traverse by value\n    print(m)\nfor i in range(len(marks)):  # traverse by index\n    print('Student', i + 1, ':', marks[i])"]]], ["List methods and built-in functions", [["table", ["Function / method", "Purpose", "Example (L = [4, 2, 7])"], [["len(L)", "Number of items", "3"], ["list()", "Create a list", "list((1, 2))"], ["append(x)", "Add one item at the end", "L.append(9) → [4, 2, 7, 9]"], ["extend(seq)", "Add all items of seq", "L.extend([1, 3]) → [4, 2, 7, 1, 3]"], ["insert(i, x)", "Insert at position i", "L.insert(0, 5) → [5, 4, 2, 7]"], ["count(x)", "Count occurrences", "L.count(2) → 1"], ["index(x)", "Position of first x", "L.index(7) → 2"], ["remove(x)", "Remove first x by value", "L.remove(2) → [4, 7]"], ["pop(i)", "Remove by index and return it", "L.pop(1) → 2"], ["reverse()", "Reverse in place", "[7, 2, 4]"], ["sort()", "Sort in place (reverse=True for descending)", "[2, 4, 7]"], ["sorted(L)", "New sorted list", "[2, 4, 7], L unchanged"], ["min / max / sum", "Smallest / largest / total", "2, 7, 13"]]], ["tip", "Exam tip", "`append([1, 2])` adds **one** item (a list), so the length grows by 1. `extend([1, 2])` adds **two** items."]]], ["Programs with lists", [["code", "# Average and the marks above average\nmarks = []\nn = int(input('How many students? '))\nfor i in range(n):\n    marks.append(float(input('Marks: ')))\navg = sum(marks) / n\nprint('Average:', round(avg, 2))\nprint('Above average:', [m for m in marks if m > avg])"], ["code", "# Maximum, minimum and their positions\nL = [34, 78, 12, 90, 56]\nprint(max(L), L.index(max(L)))    # 90 3\nprint(min(L), L.index(min(L)))    # 12 2\n\n# Search for an element\nkey = 56\nif key in L:\n    print('Found at index', L.index(key))\nelse:\n    print('Not found')"], ["code", "# Count positive, negative and zero values\nL = [5, -2, 0, 8, -7, 0, 3]\npos = neg = zero = 0\nfor x in L:\n    if x > 0: pos += 1\n    elif x < 0: neg += 1\n    else: zero += 1\nprint(pos, neg, zero)      # 3 2 2"]]]]},

{ id:"ip11-dictionaries", unit:2, title:"Dictionaries",
  intro:"Storing data as key–value pairs and working with dictionary methods.",
  sec:[["What is a dictionary?", [["p", "A **dictionary** stores **key: value pairs** inside curly braces. You find a value using its key, which makes dictionaries ideal for records: a student's details, a product's price, a word's meaning."], ["p", "**Keys** must be **unique** and **immutable** (numbers, strings, tuples). **Values** can be any type. Dictionaries are **mutable**."], ["code", "student = {'name': 'Isha', 'class': 11, 'marks': 91}\nprices = {'pen': 10, 'notebook': 45}\nempty = {}\nd = dict(a=1, b=2)"]]], ["Accessing, adding and updating", [["code", "student = {'name': 'Isha', 'class': 11}\nprint(student['name'])       # Isha\nprint(student.get('age'))    # None (no error for a missing key)\nstudent['marks'] = 91        # add a new pair\nstudent['class'] = 12        # update an existing value\ndel student['marks']         # delete a pair\nprint(student)               # {'name': 'Isha', 'class': 12}\nprint('name' in student)     # True: in checks keys"], ["p", "Using `d[key]` with a key that doesn't exist raises **KeyError**; `d.get(key)` returns None (or a default you give) instead."]]], ["Dictionary methods", [["table", ["Method / function", "Purpose", "Example (d = {'a': 1, 'b': 2})"], [["len(d)", "Number of pairs", "2"], ["keys()", "All keys", "dict_keys(['a', 'b'])"], ["values()", "All values", "dict_values([1, 2])"], ["items()", "All (key, value) pairs", "dict_items([('a', 1), ('b', 2)])"], ["get(k, default)", "Safe lookup", "d.get('c', 0) → 0"], ["update(other)", "Add/change pairs from another dict", "d.update({'c': 3})"], ["pop(k)", "Remove k and return its value", "d.pop('a') → 1"], ["clear()", "Remove everything", "{}"], ["del d[k]", "Delete one key", ""]]]]], ["Traversing a dictionary", [["code", "marks = {'Eng': 82, 'IP': 95, 'Eco': 76}\nfor sub in marks:\n    print(sub, marks[sub])\nfor sub, m in marks.items():\n    print(f'{sub}: {m}')\nprint('Total', sum(marks.values()))           # Total 253\nprint('Best subject', max(marks, key=marks.get))   # IP"], ["code", "# Phone book: add entries, then search\nbook = {}\nfor i in range(int(input('Entries: '))):\n    name = input('Name: ')\n    book[name] = input('Phone: ')\nq = input('Search name: ')\nprint(book.get(q, 'Not found'))"], ["code", "# Count how often each item appears\nfruits = ['apple', 'mango', 'apple', 'kiwi', 'mango', 'apple']\ncount = {}\nfor f in fruits:\n    count[f] = count.get(f, 0) + 1\nprint(count)      # {'apple': 3, 'mango': 2, 'kiwi': 1}"]]]]},

{ id:"ip11-numpy", unit:2, title:"Introduction to NumPy",
  intro:"NumPy arrays: what they are, how to create them from lists, and how they differ from lists.",
  sec:[["What is NumPy?", [["p", "**NumPy (Numerical Python)** is a library for fast numerical computing. Its main object is the **ndarray** (n-dimensional array): a grid of values that are **all of the same type**. NumPy is the base on which Pandas, Matplotlib and most data-science tools are built."], ["code", "import numpy as np      # np is the standard alias"]]], ["Creating arrays", [["code", "import numpy as np\na = np.array([10, 20, 30, 40])            # 1-D array from a list\nb = np.array([[1, 2, 3], [4, 5, 6]])      # 2-D array (2 rows, 3 columns)\nc = np.array([1, 2.5, 3])                 # all become float: [1.  2.5 3. ]\nd = np.array([1, 'a'])                    # all become strings\n\nnp.zeros(4)            # [0. 0. 0. 0.]\nnp.ones((2, 3))        # 2×3 array of 1.0\nnp.arange(1, 10, 2)    # [1 3 5 7 9]  (like range)\nnp.linspace(0, 1, 5)   # [0.   0.25 0.5  0.75 1.  ] (5 evenly spaced values)"], ["p", "Because all elements must share one type, NumPy **upcasts** mixed data: int + float → float; anything + string → string."]]], ["Array attributes", [["table", ["Attribute", "Meaning", "For b = [[1, 2, 3], [4, 5, 6]]"], [["ndim", "Number of dimensions (axes)", "2"], ["shape", "Size along each dimension, as a tuple", "(2, 3)"], ["size", "Total number of elements", "6"], ["dtype", "Data type of the elements", "int64"], ["itemsize", "Bytes used by each element", "8"]]], ["code", "print(b.ndim, b.shape, b.size, b.dtype)   # 2 (2, 3) 6 int64\nprint(b[1][2], b[1, 2])                  # 6 6  (row 1, column 2)\nprint(b[:, 0])                           # [1 4] (first column)"]]], ["Operations on arrays", [["p", "Arithmetic on arrays is **element-wise** (vectorised): no loop needed."], ["code", "a = np.array([1, 2, 3, 4])\nprint(a + 10)        # [11 12 13 14]\nprint(a * 2)         # [2 4 6 8]\nprint(a ** 2)        # [ 1  4  9 16]\nprint(a + a)         # [2 4 6 8]\nprint(a.sum(), a.mean(), a.max(), a.min())   # 10 2.5 4 1\nprint(a[a > 2])      # [3 4]  (boolean filtering)"]]], ["Arrays vs lists", [["table", ["List", "NumPy array"], [["Can hold mixed types", "All elements have the same type"], ["`[1, 2] * 2` → [1, 2, 1, 2] (repetition)", "`np.array([1, 2]) * 2` → [2 4] (multiplication)"], ["Needs a loop for maths on every element", "Element-wise maths built in"], ["Slower and uses more memory for numbers", "Faster and compact (stored in one block of memory)"], ["Built into Python", "Needs `import numpy`"]]], ["tip", "Exam tip", "A favourite question: 'What is the output of `[1, 2, 3] * 2` versus `np.array([1, 2, 3]) * 2`?' The list repeats; the array multiplies."]]]]},

{ id:"ip11-database", unit:3, title:"Database concepts",
  intro:"Why databases are used and the language of the relational model.",
  sec:[["Why databases?", [["p", "Imagine a school keeping student details in separate spreadsheets for the office, library and exams. The same student's address is typed three times (**redundancy**); when it changes in one file and not the others, the records no longer agree (**inconsistency**). Searching across files is slow, and anyone with the file can see everything (**poor security**)."], ["p", "A **database** is an organised collection of related data stored so it can be easily accessed and managed. A **DBMS (Database Management System)** is the software used to create and manage it: MySQL, Oracle, PostgreSQL, MS Access, SQLite."], ["ul", ["Less redundancy and inconsistency", "Data can be shared by many users at once", "Security through user accounts and permissions", "Fast searching with queries", "Backup and recovery"]]]], ["The relational model", [["p", "Most databases are **relational**: data is stored in **tables (relations)** made of rows and columns."], ["code", "Table: PRODUCT\n+-----+-----------+-------------+-------+\n| PID | PName     | Category    | Price |\n+-----+-----------+-------------+-------+\n| P01 | Pen       | Stationery  |    10 |\n| P02 | Notebook  | Stationery  |    45 |\n| P03 | Headphone | Electronics |   899 |\n+-----+-----------+-------------+-------+"], ["table", ["Term", "Meaning", "In PRODUCT"], [["Relation", "Table", "PRODUCT"], ["Attribute", "Column", "PID, PName, Category, Price"], ["Tuple", "Row / record", "(P02, Notebook, Stationery, 45)"], ["Domain", "Set of allowed values of an attribute", "Price: positive numbers"], ["Degree", "Number of columns", "4"], ["Cardinality", "Number of rows", "3"]]]]], ["Keys", [["table", ["Key", "Meaning", "Example"], [["Candidate key", "Every column (or combination) that can uniquely identify a row", "PID, Barcode"], ["Primary key", "The candidate key chosen to identify rows; unique and never NULL", "PID"], ["Alternate key", "Candidate keys not chosen as primary", "Barcode"], ["Foreign key", "A column that refers to the primary key of another table, linking the two", "PID in SALES refers to PID in PRODUCT"]]], ["tip", "Remember", "A table can have many candidate keys but only **one** primary key. A foreign key value must match an existing primary key value in the other table (or be NULL)."]]]]},

{ id:"ip11-sql", unit:3, title:"Structured Query Language (SQL)",
  intro:"Why SQL is used, its command categories, and creating, querying and changing tables in MySQL.",
  sec:[["SQL and MySQL", [["p", "**SQL (Structured Query Language)** is the language used to create, change and query relational databases. **MySQL** is a free, open-source RDBMS that understands SQL. SQL keywords are not case-sensitive, and each statement ends with `;`."], ["table", ["Category", "Used to", "Commands"], [["DDL (Data Definition Language)", "Create or change the structure", "CREATE, ALTER, DROP"], ["DML (Data Manipulation Language)", "Add, change, remove or read data", "INSERT, UPDATE, DELETE, SELECT"]]]]], ["Advantages of SQL; DDL, DQL and DML", [["ul", ["**Easy to learn**: uses simple English-like commands (SELECT, INSERT, UPDATE).", "**Fast**: retrieves large amounts of data from a database quickly.", "**Standard language**: the same SQL works in MySQL, Oracle, SQL Server, PostgreSQL with small differences.", "**No coding needed** for most tasks: a single query can search, sort and summarise thousands of records.", "**Portable and interactive**: works on any computer and gives answers immediately; many users can work at the same time."]], ["p", "The 2026-27 syllabus groups SQL commands into **three** categories:"], ["table", ["Category", "Purpose", "Commands"], [["DDL: Data Definition Language", "Create or change the **structure** (database, tables, columns)", "CREATE DATABASE, CREATE TABLE, ALTER TABLE, DROP"], ["DQL: Data Query Language", "**Retrieve** (read) data", "SELECT … FROM … WHERE"], ["DML: Data Manipulation Language", "**Change** the data stored in tables", "INSERT, UPDATE, DELETE"]]], ["tip", "Exam tip", "Some older books put SELECT under DML. In the 2026-27 CBSE syllabus, **SELECT is DQL**."]]], ["Data types and constraints", [["table", ["Data type", "Use", "Example"], [["CHAR(n)", "Fixed-length text", "CHAR(6) for PIN codes"], ["VARCHAR(n)", "Variable-length text up to n characters", "VARCHAR(30) for names"], ["INT", "Whole numbers", "Age, quantity"], ["FLOAT", "Decimal numbers", "Price, percentage"], ["DATE", "Dates as 'YYYY-MM-DD'", "'2026-04-01'"]]], ["table", ["Constraint", "Meaning"], [["NOT NULL", "Value required"], ["UNIQUE", "No duplicate values"], ["DEFAULT", "Value used if none is given"], ["PRIMARY KEY", "Unique + not null; identifies each row"]]]]], ["Data definition: CREATE, ALTER, DROP", [["code", "CREATE DATABASE shop;\nUSE shop;\nSHOW TABLES;\n\nCREATE TABLE ITEM (\n    ItemNo   INT PRIMARY KEY,\n    IName    VARCHAR(25) NOT NULL,\n    Category VARCHAR(15),\n    Price    FLOAT,\n    Qty      INT DEFAULT 0\n);\nDESCRIBE ITEM;\n\nALTER TABLE ITEM ADD Supplier VARCHAR(20);   -- add a column\nALTER TABLE ITEM DROP Supplier;              -- remove a column\nALTER TABLE ITEM MODIFY IName VARCHAR(40);   -- change a column's type/size\nDROP TABLE ITEM;                             -- delete the table completely"]]], ["Data manipulation: INSERT, UPDATE, DELETE", [["code", "INSERT INTO ITEM VALUES (1, 'Pen', 'Stationery', 10, 200);\nINSERT INTO ITEM (ItemNo, IName, Price) VALUES (2, 'Mouse', 499);\n\nUPDATE ITEM SET Price = Price * 1.10 WHERE Category = 'Stationery';\nUPDATE ITEM SET Qty = 50 WHERE ItemNo = 2;\n\nDELETE FROM ITEM WHERE Qty = 0;"], ["tip", "Careful", "UPDATE and DELETE without a WHERE clause affect **every row** in the table."]]], ["Data query: SELECT … FROM … WHERE", [["code", "SELECT * FROM ITEM;\nSELECT IName, Price FROM ITEM;\nSELECT IName, Price * Qty AS StockValue FROM ITEM;\nSELECT DISTINCT Category FROM ITEM;\n\nSELECT * FROM ITEM WHERE Price > 100 AND Category = 'Electronics';\nSELECT * FROM ITEM WHERE Category IN ('Stationery', 'Books');\nSELECT * FROM ITEM WHERE Price BETWEEN 50 AND 500;     -- both ends included\nSELECT * FROM ITEM ORDER BY Price DESC;"], ["p", "**NULL** means a missing or unknown value. Test it with **IS NULL** / **IS NOT NULL**, never `= NULL`."], ["code", "SELECT IName FROM ITEM WHERE Category IS NULL;"], ["p", "**LIKE** with wildcards: `%` matches any number of characters, `_` matches exactly one."], ["code", "SELECT IName FROM ITEM WHERE IName LIKE 'P%';      -- starts with P\nSELECT IName FROM ITEM WHERE IName LIKE '%book%';   -- contains 'book'\nSELECT IName FROM ITEM WHERE IName LIKE '_e%';      -- second letter e"], ["table", ["Clause", "Purpose"], [["DISTINCT", "Remove duplicate values from the result"], ["WHERE", "Filter rows by a condition"], ["IN", "Match any value in a list"], ["BETWEEN", "Match a range (inclusive)"], ["ORDER BY", "Sort ascending (ASC, default) or descending (DESC)"], ["LIKE", "Pattern matching"], ["IS NULL", "Find missing values"], ["AS", "Give a column a temporary name (alias)"]]]]]]},

{ id:"ip11-emerging", unit:4, title:"Emerging trends",
  intro:"New technologies shaping the world: AI, big data, IoT, cloud computing and blockchain.",
  sec:[["Artificial intelligence (AI)", [["p", "**Artificial intelligence** is the ability of machines to perform tasks that normally need human intelligence: understanding language, recognising images, making decisions and learning from experience. Examples: voice assistants, face unlock, Google Maps traffic predictions, chatbots, spam filters."], ["p", "**Machine Learning (ML)** is a part of AI in which computers **learn patterns from data** instead of being explicitly programmed. Given thousands of labelled photos, an ML model learns to tell cats from dogs. Netflix and YouTube recommendations use ML."], ["p", "**Natural Language Processing (NLP)** lets computers understand, interpret and generate human language. Examples: Google Translate, autocorrect, voice typing, chatbots, sentiment analysis of reviews."]]], ["Immersive experiences and robotics", [["p", "**Virtual Reality (VR)** creates a completely computer-generated 3D world that you experience through a headset, shutting out the real world. Used in gaming, flight and surgery training, and virtual tours."], ["p", "**Augmented Reality (AR)** adds digital objects on top of the real world, seen through a phone camera or smart glasses. Examples: Pokémon Go, Snapchat filters, trying furniture in your room with the IKEA app."], ["p", "**Robotics** designs and builds **robots**: machines that can sense their surroundings, process information and act, often on their own. Used in car factories, warehouses, surgery, space exploration (Mars rovers) and cleaning (robot vacuums). Robots combined with AI become smarter, like self-driving cars."]]], ["Big data", [["p", "**Big data** means data sets so huge and complex that traditional software can't store or process them: social-media posts, sensor readings, online transactions. It is described by the **5 Vs**:"], ["table", ["V", "Meaning"], [["Volume", "Enormous amount of data (terabytes to zettabytes)"], ["Velocity", "Generated and processed at very high speed (real time)"], ["Variety", "Many forms: text, images, video, audio, sensor data"], ["Veracity", "Data may be uncertain, noisy or inaccurate"], ["Value", "Useful insights must be extracted from it"]]], ["p", "Big data is analysed to predict trends, personalise ads, detect fraud and improve healthcare."]]], ["Internet of Things (IoT) and smart cities", [["p", "The **Internet of Things** is a network of everyday physical objects (fridges, watches, lights, cars) fitted with **sensors**, software and internet connectivity so they can collect and exchange data and be controlled remotely."], ["p", "**Sensors** detect physical changes and convert them into data: temperature, motion, light, humidity, GPS, heart rate. A smartwatch uses an accelerometer to count steps and an optical sensor to measure heart rate."], ["p", "**Smart cities** use IoT and data analytics to manage traffic lights, parking, street lighting, waste collection, water supply and pollution monitoring, making the city efficient and sustainable."], ["p", "**Concerns:** privacy and security of personal data, hacking of connected devices, and dependence on the internet."]]], ["Cloud computing, grid computing and blockchain", [["p", "**Cloud computing** means using computing resources (storage, servers, software) over the **internet** on demand, paying only for what you use, instead of owning them. Examples: Google Drive, OneDrive, Gmail, AWS, Microsoft Azure."], ["table", ["Service model", "You get", "Example"], [["IaaS (Infrastructure as a Service)", "Virtual machines, storage and networks; you manage the OS and software", "Amazon EC2, Google Compute Engine"], ["PaaS (Platform as a Service)", "A ready platform to build and deploy apps without managing servers", "Google App Engine, Heroku"], ["SaaS (Software as a Service)", "Complete software used through a browser", "Gmail, Google Docs, Zoom, Canva"]]], ["p", "**Grid computing** connects many computers in different places to work together on one large task, sharing their processing power, such as scientific simulations and the SETI@home project. Unlike the cloud (services on demand), a grid pools resources for big computations."], ["p", "**Blockchain** is a shared, **decentralised digital ledger**: records are stored in **blocks** linked together using cryptography, and copies are kept on many computers. Once data is added it is almost impossible to change without everyone noticing, so blockchain is **secure and transparent**. Uses: cryptocurrency (Bitcoin), land records, supply-chain tracking, digital certificates, voting."]]]]}
],
