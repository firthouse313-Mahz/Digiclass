(function(){
  const PRACT = {ip11:{"id": "ip11-practicals", "unit": 0, "title": "Practical file: solved programs", "intro": "Every Python program and SQL query in the CBSE 2026-27 suggested practical list, solved with sample output. Type them yourself before copying.", "sec": [["How to write your practical file", [["p", "Your practical file needs **at least 14 Python programs and 14 SQL queries** (7 marks). For each program write: the aim, the code, and a sample output. Keep variable names meaningful and add a comment line at the top of every program."], ["tip", "Viva tip", "Be ready to explain any line of your own programs: what `input()` returns, why you used `int()` or `float()`, and what a loop or condition does."]]], ["1–3. Grades, discount, shapes", [["code", "# 1. Average and grade for given marks\nm = [float(input(f'Marks in subject {i}: ')) for i in range(1, 6)]\navg = sum(m) / 5\nif avg >= 90: g = 'A'\nelif avg >= 75: g = 'B'\nelif avg >= 60: g = 'C'\nelif avg >= 33: g = 'D'\nelse: g = 'E'\nprint('Average =', avg, 'Grade =', g)\n# Sample: 80 90 70 85 75 → Average = 80.0 Grade = B"], ["code", "# 2. Sale price of an item after discount\ncost = float(input('Cost price: '))\ndisc = float(input('Discount %: '))\nsale = cost - cost * disc / 100\nprint('Sale price =', sale)\n# Sample: 1200, 15 → Sale price = 1020.0"], ["code", "# 3. Perimeter and area of shapes\nimport math\nl, b = 8, 5\nprint('Rectangle: P =', 2 * (l + b), 'A =', l * b)                # 26 40\ns = 6\nprint('Square: P =', 4 * s, 'A =', s * s)                         # 24 36\nr = 7\nprint('Circle: C =', round(2 * math.pi * r, 2), 'A =', round(math.pi * r * r, 2))   # 43.98 153.94\na, b2, c = 3, 4, 5\nsp = (a + b2 + c) / 2                                         # Heron's formula\nprint('Triangle: P =', a + b2 + c, 'A =', (sp * (sp - a) * (sp - b2) * (sp - c)) ** 0.5)   # 12 6.0"]]], ["4–7. Money calculations", [["code", "# 4. Simple and compound interest\np = float(input('Principal: '))\nr = float(input('Rate %: '))\nt = float(input('Time (years): '))\nsi = p * r * t / 100\nci = p * (1 + r / 100) ** t - p\nprint('SI =', round(si, 2), 'CI =', round(ci, 2))\n# Sample: 10000, 8, 2 → SI = 1600.0 CI = 1664.0"], ["code", "# 5. Profit or loss\ncp = float(input('Cost price: '))\nsp = float(input('Selling price: '))\nif sp > cp:\n    print('Profit =', sp - cp, 'Profit % =', round((sp - cp) / cp * 100, 2))\nelif cp > sp:\n    print('Loss =', cp - sp, 'Loss % =', round((cp - sp) / cp * 100, 2))\nelse:\n    print('No profit, no loss')\n# Sample: 500, 650 → Profit = 150.0 Profit % = 30.0"], ["code", "# 6. EMI (Equated Monthly Instalment)\n# EMI = P × r × (1 + r)^n / ((1 + r)^n − 1), r = monthly rate, n = months\np = float(input('Loan amount: '))\nannual = float(input('Annual interest %: '))\nyears = float(input('Years: '))\nr = annual / 12 / 100\nn = years * 12\nemi = p * r * (1 + r) ** n / ((1 + r) ** n - 1)\nprint('EMI =', round(emi, 2))\n# Sample: 500000, 9, 5 → EMI = 10379.18"], ["code", "# 7. GST on a bill\namount = float(input('Amount before GST: '))\nrate = float(input('GST rate % (5/12/18/28): '))\ngst = amount * rate / 100\nprint('CGST =', gst / 2, 'SGST =', gst / 2, 'Total =', amount + gst)\n# Sample: 2000, 18 → CGST = 180.0 SGST = 180.0 Total = 2360.0"]]], ["8–11. Lists and series", [["code", "# 8. Largest and smallest numbers in a list\nL = [int(x) for x in input('Numbers separated by spaces: ').split()]\nprint('Largest =', max(L), 'Smallest =', min(L))\n# Without max/min:\nbig = small = L[0]\nfor x in L:\n    if x > big: big = x\n    if x < small: small = x\nprint(big, small)\n# Sample: 12 45 7 33 → Largest = 45 Smallest = 7"], ["code", "# 9. Third largest and third smallest number in a list\nL = [12, 45, 7, 33, 45, 21, 7]\nu = list(set(L))     # remove repeats\nu.sort()\nprint('Third smallest =', u[2], 'Third largest =', u[-3])\n# u = [7, 12, 21, 33, 45] → Third smallest = 21 Third largest = 21"], ["code", "# 10. Sum of squares of the first 100 natural numbers\ns = 0\nfor i in range(1, 101):\n    s += i * i\nprint(s)                    # 338350"], ["code", "# 11. First n multiples of a number\nnum = int(input('Number: '))\nn = int(input('How many multiples: '))\nfor i in range(1, n + 1):\n    print(num * i, end=' ')\n# Sample: 7, 5 → 7 14 21 28 35"]]], ["12–14. Strings", [["code", "# 12. Count vowels in a string\ns = input('Enter a string: ')\ncount = 0\nfor ch in s.lower():\n    if ch in 'aeiou':\n        count += 1\nprint('Vowels =', count)\n# Sample: Informatics Practices → Vowels = 7"], ["code", "# 13. Words starting with a given letter\ns = input('Sentence: ')\nletter = input('Letter: ').lower()\nfor w in s.split():\n    if w.lower().startswith(letter):\n        print(w)\n# Sample: 'Python makes programming pleasant', 'p' → Python, programming, pleasant"], ["code", "# 14. Occurrences of a given letter in each string\nwords = ['banana', 'apple', 'grape']\nletter = 'a'\nfor w in words:\n    print(w, ':', w.count(letter))\n# banana : 3\n# apple : 1\n# grape : 1"]]], ["15–17. Dictionaries", [["code", "# 15. States and their capitals\ncap = {'Kerala': 'Thiruvananthapuram', 'Tamil Nadu': 'Chennai', 'Maharashtra': 'Mumbai', 'Karnataka': 'Bengaluru'}\nst = input('State: ')\nprint(cap.get(st, 'Not found'))\nfor s, c in cap.items():\n    print(s, '->', c)"], ["code", "# 16. Students and their marks in 5 subjects\nresult = {}\nn = int(input('Number of students: '))\nfor i in range(n):\n    name = input('Name: ')\n    marks = [int(input(f'  Subject {j} marks: ')) for j in range(1, 6)]\n    result[name] = marks\nfor name, marks in result.items():\n    print(name, marks, 'Total =', sum(marks), 'Average =', sum(marks) / 5)"], ["code", "# 17. Highest and lowest values in a dictionary\nscores = {'Riya': 88, 'Arjun': 95, 'Meera': 72, 'Kabir': 81}\nhi = max(scores, key=scores.get)\nlo = min(scores, key=scores.get)\nprint('Highest:', hi, scores[hi])     # Highest: Arjun 95\nprint('Lowest:', lo, scores[lo])      # Lowest: Meera 72"]]], ["SQL practicals", [["code", "-- 1. Create a database\nCREATE DATABASE school;\nUSE school;\n\n-- 2. Student table; StudentID is the primary key\nCREATE TABLE STUDENT (\n    StudentID INT PRIMARY KEY,\n    Class     INT,\n    Section   CHAR(1),\n    Gender    CHAR(1),\n    Name      VARCHAR(30) NOT NULL,\n    DOB       DATE,\n    Marks     FLOAT\n);\n\n-- 3. Insert at least 10 students\nINSERT INTO STUDENT VALUES (1, 11, 'A', 'F', 'Riya',   '2009-04-12', 88);\nINSERT INTO STUDENT VALUES (2, 11, 'A', 'M', 'Arjun',  '2009-11-03', 45);\nINSERT INTO STUDENT VALUES (3, 11, 'B', 'F', 'Meera',  '2008-12-25', 72);\n-- … and so on up to 10 rows\n\n-- 4. Display the entire table\nSELECT * FROM STUDENT;\n\n-- 5. Rno, Name and Marks of students scoring more than 50\nSELECT StudentID, Name, Marks FROM STUDENT WHERE Marks > 50;\n\n-- 6. Students born in a given year\nSELECT StudentID, Name, DOB FROM STUDENT WHERE DOB BETWEEN '2009-01-01' AND '2009-12-31';"], ["code", "-- More queries for your file (14 needed)\nSELECT * FROM STUDENT WHERE Class = 11 AND Section = 'A';\nSELECT Name, Marks FROM STUDENT WHERE Gender = 'F' OR Marks >= 80;\nSELECT * FROM STUDENT WHERE Marks IS NULL;\nSELECT * FROM STUDENT WHERE Marks BETWEEN 60 AND 90;\nUPDATE STUDENT SET Marks = Marks + 5 WHERE Marks < 50;\nDELETE FROM STUDENT WHERE StudentID = 10;\nALTER TABLE STUDENT ADD City VARCHAR(20);\nALTER TABLE STUDENT DROP City;\nDESCRIBE STUDENT;\nDROP TABLE STUDENT;"]]]]}, ip12:{"id": "ip12-practicals", "unit": 0, "title": "Practical file: solved programs", "intro": "Every Pandas, Matplotlib and SQL practical in the CBSE 2026-27 suggested list, solved with output. Your file needs at least 15 Pandas programs, 4 Matplotlib programs and 15 SQL queries.", "sec": [["Data handling with Pandas", [["code", "# 1. Series from a dictionary and from an ndarray\nimport pandas as pd\nimport numpy as np\ns1 = pd.Series({'Jan': 31, 'Feb': 28, 'Mar': 31})\ns2 = pd.Series(np.array([10, 20, 30]), index=['a', 'b', 'c'])\nprint(s1)\nprint(s2)"], ["code", "# 2. Elements above the 75th percentile\nS = pd.Series([45, 67, 89, 72, 91, 38, 56, 84])\nprint(S[S > S.quantile(0.75)])\n# 2    89\n# 4    91"], ["code", "# 3. Quarterly sales: total expenditure per category\nsales = pd.DataFrame({'Category': ['Stationery', 'Electronics', 'Stationery', 'Electronics', 'Books'],\n                      'Item': ['Pen', 'Mouse', 'Notebook', 'Cable', 'Novel'],\n                      'Expenditure': [500, 1200, 800, 300, 650]})\nprint(sales.groupby('Category')['Expenditure'].sum())\n# Books 650, Electronics 1500, Stationery 1300"], ["code", "# 4. Exam result DataFrame: row labels, column labels, data types, dimensions\nres = pd.DataFrame({'Name': ['Riya', 'Arjun', 'Meera'], 'IP': [95, 82, 77], 'Eng': [88, 79, 91]},\n                   index=['S1', 'S2', 'S3'])\nprint(res.index)       # Index(['S1', 'S2', 'S3'], dtype='object')\nprint(res.columns)     # Index(['Name', 'IP', 'Eng'], dtype='object')\nprint(res.dtypes)      # Name object, IP int64, Eng int64\nprint(res.ndim, res.shape)   # 2 (3, 3)"], ["code", "# 5. Filter rows: duplicates and conditions\ndf = pd.DataFrame({'Name': ['Riya', 'Arjun', 'Riya', 'Meera'], 'Marks': [92, 85, 92, 78]})\nprint(df[df.duplicated()])          # the repeated row (index 2)\nprint(df.drop_duplicates())\nprint(df[df['Marks'] > 80])"], ["code", "# 6. Import and export between CSV and DataFrame\ndf.to_csv('marks.csv', index=False)\nnew = pd.read_csv('marks.csv')\nprint(new)"], ["code", "# More programs for your file\nres['Total'] = res['IP'] + res['Eng']          # add a column\nres.loc['S4'] = ['Kabir', 70, 65, 135]          # add a row\nres = res.rename(columns={'Eng': 'English'})     # rename\nres = res.drop('S2')                              # delete a row\nprint(res.head(2), res.tail(1))\nprint(res.loc['S1', 'IP'], res.iloc[0, 1])        # 95 95\nfor idx, row in res.iterrows():\n    print(idx, row['Name'], row['Total'])\nprint(res.sort_values('Total', ascending=False))\nprint(res['IP'].max(), res['IP'].mean())"]]], ["Visualisation with Matplotlib", [["code", "# 1. School result analysis: subject-wise average (bar chart)\nimport matplotlib.pyplot as plt\nsubjects = ['English', 'IP', 'Economics', 'Business']\navg = [78, 86, 72, 81]\nplt.bar(subjects, avg, color='orange')\nplt.title('Subject-wise average marks')\nplt.xlabel('Subject'); plt.ylabel('Average marks')\nplt.savefig('subject_avg.png')\nplt.show()"], ["code", "# 2. Class-wise performance over terms (line chart with legend)\nterms = ['Term 1', 'Term 2', 'Term 3']\nplt.plot(terms, [72, 78, 84], marker='o', label='12A')\nplt.plot(terms, [68, 75, 80], marker='s', label='12B')\nplt.title('Class performance'); plt.xlabel('Term'); plt.ylabel('Average %')\nplt.legend(); plt.grid(True)\nplt.show()"], ["code", "# 3. Open data (e.g. downloaded from data.gov.in as CSV): aggregate and plot\ndata = pd.read_csv('rainfall.csv')              # columns: State, Year, Rainfall\nsummary = data.groupby('State')['Rainfall'].mean()\nsummary.plot(kind='bar', title='Average rainfall by state')\nplt.ylabel('mm')\nplt.show()\ndata['Rainfall'].plot(kind='hist', bins=10, title='Rainfall distribution')\nplt.show()"], ["code", "# 4. Histogram of marks\nmarks = [45, 67, 89, 72, 91, 38, 56, 84, 63, 77, 95, 59]\nplt.hist(marks, bins=[30, 45, 60, 75, 90, 100], edgecolor='black')\nplt.title('Marks distribution'); plt.xlabel('Marks'); plt.ylabel('Students')\nplt.show()"]]], ["SQL practicals", [["code", "-- 1. Student table with StudentID as primary key\nCREATE TABLE STUDENT (StudentID INT PRIMARY KEY, Name VARCHAR(30), Marks INT);\n\n-- 2. Insert a new student\nINSERT INTO STUDENT VALUES (101, 'Riya', 92);\n\n-- 3. Delete a student\nDELETE FROM STUDENT WHERE StudentID = 101;\n\n-- 4. Students with marks more than 80\nSELECT * FROM STUDENT WHERE Marks > 80;\n\n-- 5. Min, max, sum and average of marks\nSELECT MIN(Marks), MAX(Marks), SUM(Marks), AVG(Marks) FROM STUDENT;\n\n-- 6. Number of customers from each country\nSELECT Country, COUNT(*) FROM CUSTOMER GROUP BY Country;\n\n-- 7. Order by marks, highest first\nSELECT StudentID, Marks FROM STUDENT ORDER BY Marks DESC;"], ["code", "-- More queries for your file (15 needed): functions, grouping, joins\nSELECT UPPER(Name), LENGTH(Name), LEFT(Name, 3) FROM STUDENT;\nSELECT ROUND(AVG(Marks), 1), MOD(MAX(Marks), 10) FROM STUDENT;\nSELECT Name, MONTHNAME(DOB), YEAR(DOB) FROM STUDENT;\nSELECT Country, COUNT(*) FROM CUSTOMER GROUP BY Country HAVING COUNT(*) > 2;\nSELECT * FROM STUDENT WHERE Name LIKE 'A%' ORDER BY Name;\nSELECT S.Name, C.CName FROM STUDENT S, COURSE C WHERE S.CID = C.CID;\nSELECT DAYNAME(NOW()), DATE(NOW());\nSELECT INSTR(Name, 'a'), MID(Name, 2, 3) FROM STUDENT;"]]], ["Project work tips", [["ul", ["Choose a real problem: a shop's sales, school results, library issues, sports scores or open data from **data.gov.in**.", "Store the data in a CSV file or MySQL table, load it with Pandas, clean it (remove duplicates, fill or drop missing values), analyse it (groupby, sort, filter) and present it with at least 3 Matplotlib charts.", "Write a short report: aim, data source, code, charts, conclusions. **Reference every data source and image** and avoid plagiarism.", "Start at least 6 months before the deadline; work alone or in a group of 2–3."]]]]]}};
  const BANK = {ip11:{"ip11-computer-system": [["Differentiate between RAM and ROM.", "- **RAM**: volatile (data lost when power is off), read and write, holds programs currently running, larger.\n- **ROM**: non-volatile, read only, holds the start-up (BIOS/firmware) instructions, smaller.", "2 marks"], ["Why can deleted data sometimes be recovered?", "When a file is deleted, the OS only marks its space as **free**; the data stays on the disk until new data **overwrites** it. Recovery software scans these unallocated areas and rebuilds the file.", "2 marks"], ["Differentiate between generic and specific-purpose software.", "- **Generic**: made for many users with common needs; ready-made (word processor, spreadsheet, browser).\n- **Specific-purpose**: made for a particular organisation or task to its requirements (school management, hospital management, payroll).", "2 marks"], ["Name the three types of buses in a computer.", "**Data bus** (carries data), **address bus** (carries memory addresses), **control bus** (carries control signals such as read/write).", "1 mark"], ["Which is the largest: 2048 MB, 1.5 GB, 1,500,000 KB?", "2048 MB = 2 GB; 1,500,000 KB ≈ 1464.8 MB ≈ 1.43 GB. So **2048 MB** is the largest.", "1 mark"], ["**Assertion (A):** ROM is a non-volatile memory.\n**Reason (R):** The contents of ROM are lost when the power is switched off.", "**A is true, R is false.** ROM keeps its contents without power, which is exactly why it is non-volatile.", "1 mark"], ["What is cache memory? Why is it needed?", "Cache is a small, very fast memory between the CPU and RAM. It stores frequently used instructions and data so the CPU doesn't wait for the slower RAM, which **speeds up processing**.", "2 marks"], ["Explain the four main functional units of a computer with a block diagram.", "```\nInput unit → [ CPU: CU + ALU + Registers ] → Output unit\n                     ↕\n               Memory unit\n```\n- **Input unit**: accepts data and instructions (keyboard, mouse).\n- **CPU**: the **ALU** does calculations and comparisons; the **CU** fetches, decodes and controls all units; registers hold data being processed.\n- **Memory unit**: primary memory (RAM/ROM) holds data and programs; secondary storage keeps them permanently.\n- **Output unit**: shows results (monitor, printer).\nAll units are connected by the **system bus**.", "5 marks"], ["Yamini deleted some project files and emptied the Recycle Bin. Later she needed them back.\n(a) How can recovery software help her? (2)\n(b) What is data recovery? (1)\n(c) Suggest one way to delete data permanently before selling a laptop. (1)", "(a) The files' space was only marked free and not yet overwritten, so recovery software scans the disk for such unallocated data and rebuilds the files. She should stop using the drive immediately so the data isn't overwritten.\n(b) **Data recovery** is retrieving deleted, lost or corrupted data from a storage device.\n(c) Use **data-shredding / secure-erase software** that overwrites the drive several times (or physically destroy the old drive).", "4 marks"]], "ip11-python-basics": [["Find the output: `print(2 + 3 * 4 ** 2 // 8)`", "4 ** 2 = 16 → 3 * 16 = 48 → 48 // 8 = 6 → 2 + 6 = **8**", "1 mark"], ["Write a program to convert temperature from Celsius to Fahrenheit.", "```\nc = float(input('Temperature in °C: '))\nf = c * 9 / 5 + 32\nprint('Temperature in °F:', f)\n```\nSample: 37 → 98.6", "2 marks"], ["Differentiate between / and // with examples.", "`/` is **true division** and always gives a float: `7 / 2` → `3.5`.\n`//` is **floor division** and gives the quotient rounded down: `7 // 2` → `3`, `-7 // 2` → `-4`.", "2 marks"], ["Which of these are valid identifiers: `Total_1`, `1total`, `total$`, `_x`, `for`, `my name`?", "Valid: **Total_1**, **_x**.\nInvalid: `1total` (starts with a digit), `total$` (special symbol), `for` (keyword), `my name` (space).", "2 marks"], ["Find the output:\n```\nprint(3 * 'IP')\nprint('Info' + 'rmatics')\nprint(bool(0), bool('0'))\nprint(10 > 5 and 2 > 3)\n```", "```\nIPIPIP\nInformatics\nFalse True\nFalse\n```\n`'0'` is a non-empty string, so it is True.", "2 marks"], ["Differentiate between `==` and `is`.", "`==` compares **values**; `is` checks whether two names refer to the **same object**.\n```\na = [1, 2]; b = [1, 2]\nprint(a == b, a is b)   # True False\n```", "2 marks"], ["Rewrite the code after removing errors:\n```\nn = input('Enter number')\nif n % 2 = 0\n    print('Even')\n```", "```\nn = int(input('Enter number'))\nif n % 2 == 0:\n    print('Even')\n```\nErrors: input() returns a string (convert with int); `=` should be `==`; missing colon.", "2 marks"], ["Evaluate: (i) `17 % 5 * 2` (ii) `2 ** 3 ** 2` (iii) `15 // 4 + 3 ** 2` (iv) `not 5 > 3 or 4 < 2`", "(i) 2 * 2 = **4** (ii) 2 ** 9 = **512** (iii) 3 + 9 = **12** (iv) (not True) or False = **False**", "2 marks"], ["Classify as mutable or immutable: list, string, tuple, dictionary, int, set.", "**Mutable**: list, dictionary, set. **Immutable**: string, tuple, int.", "1 mark"], ["Differentiate between interactive mode and script mode.", "- **Interactive**: commands typed at `>>>` run immediately one at a time; good for testing; not saved.\n- **Script**: the whole program is written in a `.py` file, saved and then run; used for complete programs.", "3 marks"], ["Find the output:\n```\nx = 'Python'\nprint(x[1:4], x[-2:], len(x))\nprint('A', 'B', sep='*', end='#')\nprint('C')\nprint('Tab\\there\\nNew')\n```", "```\nyth on 6\nA*B#C\nTab     here\nNew\n```", "3 marks"], ["State True or False:\n(a) Python is case-sensitive.\n(b) `int('12.5')` gives 12.\n(c) A list can contain another list.\n(d) `del` is a keyword.", "(a) **True** (b) **False**: ValueError; use `int(float('12.5'))` (c) **True** (nested list) (d) **True**", "4 marks"]], "ip11-flow-control": [["Write a program to print the multiplication table of a number.", "```\nn = int(input('Number: '))\nfor i in range(1, 11):\n    print(n, 'x', i, '=', n * i)\n```", "2 marks"], ["Write a program to find the sum of even numbers from 1 to 50.", "```\ns = 0\nfor i in range(2, 51, 2):\n    s += i\nprint(s)      # 650\n```", "2 marks"], ["Find the output: `for i in range(10, 0, -4): print(i)`", "```\n10\n6\n2\n```", "1 mark"], ["Write a program to check whether a year is a leap year.", "```\ny = int(input('Year: '))\nif (y % 4 == 0 and y % 100 != 0) or y % 400 == 0:\n    print('Leap year')\nelse:\n    print('Not a leap year')\n```\n2000 → leap; 1900 → not leap; 2024 → leap.", "3 marks"], ["Find the output:\n```\ni = 1\nwhile i < 20:\n    print(i, end=' ')\n    i = i * 3\n```", "`1 3 9 `", "2 marks"], ["Which loop always runs at least once in many languages but not in Python? How can you get the same effect in Python?", "A **do-while** loop runs at least once. Python has no do-while; use `while True:` with a `break` when the condition fails.", "2 marks"], ["Find the output:\n```\nfor x in range(1, 6):\n    if x == 4:\n        break\n    if x == 2:\n        continue\n    print(x)\n```", "```\n1\n3\n```", "2 marks"], ["Write a program to print whether a number is positive, negative or zero.", "```\nn = float(input('Number: '))\nif n > 0:\n    print('Positive')\nelif n < 0:\n    print('Negative')\nelse:\n    print('Zero')\n```", "2 marks"], ["Write a program to print the factorial of a number using a while loop.", "```\nn = int(input('n: '))\nf, i = 1, 1\nwhile i <= n:\n    f *= i\n    i += 1\nprint(f)        # 5 → 120\n```", "3 marks"], ["Write a program to print the pattern:\n```\n*\n**\n***\n****\n```", "```\nfor i in range(1, 5):\n    print('*' * i)\n```", "2 marks"]], "ip11-lists": [["Differentiate between remove() and pop().", "- `remove(x)` deletes the first item **with value x**; returns None; ValueError if absent.\n- `pop(i)` deletes the item **at index i** (last if no index) and **returns** it; IndexError if out of range.", "2 marks"], ["Write a program to input 5 numbers into a list and display them in descending order.", "```\nL = []\nfor i in range(5):\n    L.append(int(input('Number: ')))\nL.sort(reverse=True)\nprint(L)\n```", "2 marks"], ["Find the output: `L=[3,1,2]; L.insert(1,9); print(L)`", "`[3, 9, 1, 2]`", "1 mark"], ["Write a program to count how many times a value appears in a list without using count().", "```\nL = [2, 5, 2, 7, 2]\nx = int(input('Value: '))\nc = 0\nfor item in L:\n    if item == x:\n        c += 1\nprint(c)      # 2 → 3\n```", "2 marks"], ["Differentiate between append() and extend() with examples.", "`append(x)` adds x as **one** item; `extend(seq)` adds **each** item of seq.\n```\nL = [1, 2]; L.append([3, 4])   # [1, 2, [3, 4]]\nM = [1, 2]; M.extend([3, 4])   # [1, 2, 3, 4]\n```", "2 marks"], ["Find the output:\n```\nL = [10, 20, 30, 40]\nL.append(50)\nL.remove(20)\nprint(L, len(L))\n```", "`[10, 30, 40, 50] 4`", "2 marks"], ["Find the output:\n```\nL = [5, 2, 9, 1]\nx = L.pop()\nL.sort()\nprint(x, L, L.index(9))\n```", "`1 [2, 5, 9] 2`", "3 marks"], ["Fill in the blanks for list `fruits = ['apple', 'mango']`:\n(a) Add 'kiwi' at the end.\n(b) Insert 'banana' at index 1.\n(c) Remove 'apple'.\n(d) Display the number of fruits.", "(a) `fruits.append('kiwi')`\n(b) `fruits.insert(1, 'banana')`\n(c) `fruits.remove('apple')`\n(d) `print(len(fruits))` → 3", "4 marks"], ["Write a program to find the sum and average of numbers in a list, and how many are above average.", "```\nL = [45, 78, 62, 90, 55]\ns = sum(L)\navg = s / len(L)\nabove = [x for x in L if x > avg]\nprint(s, avg, len(above))     # 330 66.0 2\n```", "3 marks"], ["**Assertion (A):** Lists are mutable.\n**Reason (R):** Elements of a list can be changed after it is created.", "**Both A and R are true, and R is the correct explanation of A.**", "1 mark"]], "ip11-dictionaries": [["Write a program to store names and marks of 4 students and display the topper.", "```\nd = {}\nfor i in range(4):\n    name = input('Name: ')\n    d[name] = int(input('Marks: '))\ntop = max(d, key=d.get)\nprint('Topper:', top, d[top])\n```", "3 marks"], ["What happens if you access a key that doesn't exist with D[key]? How can you avoid it?", "Python raises a **KeyError**. Avoid it with `D.get(key)` (returns None or a default) or check first with `if key in D:`.", "2 marks"], ["Differentiate between a list and a dictionary.", "- **List**: ordered collection accessed by **integer index**; `[ ]`; items can repeat.\n- **Dictionary**: collection of **key: value** pairs accessed by **key**; `{ }`; keys must be unique and immutable.", "2 marks"], ["Write a program to count the frequency of each word in a sentence.", "```\ns = input('Sentence: ')\nfreq = {}\nfor w in s.split():\n    freq[w] = freq.get(w, 0) + 1\nprint(freq)\n```\n'to be or not to be' → {'to': 2, 'be': 2, 'or': 1, 'not': 1}", "3 marks"], ["Find the output:\n```\nd = {'a': 10, 'b': 20}\nd['c'] = 30\nd['a'] = 5\nprint(len(d), d)\n```", "`3 {'a': 5, 'b': 20, 'c': 30}`", "2 marks"], ["Find the output:\n```\nd = {'x': 1, 'y': 2}\nd.update({'y': 9, 'z': 3})\ndel d['x']\nprint(list(d.keys()), list(d.values()))\n```", "`['y', 'z'] [9, 3]`", "2 marks"], ["For `student = {'name': 'Ravi', 'class': 11}`, write statements to:\n(a) add key 'marks' with value 88\n(b) display the value of 'name'\n(c) delete 'class'\n(d) remove all items", "(a) `student['marks'] = 88`\n(b) `print(student['name'])`\n(c) `del student['class']`\n(d) `student.clear()`", "4 marks"], ["Differentiate between keys(), values() and items().", "`keys()` returns all keys; `values()` returns all values; `items()` returns all (key, value) pairs as tuples. All three are used in loops.", "2 marks"]], "ip11-numpy": [["Write code to create a NumPy array from a list of 5 marks and print it.", "```\nimport numpy as np\nmarks = np.array([78, 85, 62, 90, 71])\nprint(marks)       # [78 85 62 90 71]\n```", "1 mark"], ["Create a 2-D array from [[2, 4], [6, 8]] and print its shape and size.", "```\nimport numpy as np\na = np.array([[2, 4], [6, 8]])\nprint(a.shape, a.size)     # (2, 2) 4\n```", "2 marks"], ["State two differences between a list and a NumPy array.", "- A list can hold **mixed types**; an array holds **one type**.\n- Arithmetic on an array is **element-wise** (`arr * 2` doubles each value); on a list `* 2` repeats it.\n- Arrays are faster and use less memory for numbers.", "2 marks"], ["Find the output: `print(np.array([1, 2, 3]) * 3)`", "`[3 6 9]`", "1 mark"], ["Write a program to find the mean and maximum of marks stored in a NumPy array.", "```\nimport numpy as np\nm = np.array([56, 78, 91, 64, 83])\nprint('Mean:', m.mean(), 'Max:', m.max())   # Mean: 74.4 Max: 91\n```", "3 marks"], ["Write code to multiply two NumPy arrays element by element.", "```\nimport numpy as np\na = np.array([1, 2, 3])\nb = np.array([4, 5, 6])\nprint(a * b)       # [ 4 10 18]\n```", "2 marks"], ["Find the output:\n```\nimport numpy as np\nx = np.array([2, 5.5, 7])\nprint(x, x.dtype, x.ndim)\n```", "`[2.  5.5 7. ] float64 1`\nAll values become float because one value is a float.", "2 marks"], ["What is NumPy? Why is it used in data analysis?", "**NumPy (Numerical Python)** is a library for fast numerical computing with n-dimensional arrays. It is used because array operations are vectorised (fast, no loops), memory-efficient, and it is the base for Pandas and Matplotlib.", "2 marks"]], "ip11-database": [["A table has 5 columns and 12 rows. What are its degree and cardinality?", "Degree = **5** (columns), cardinality = **12** (rows).", "1 mark"], ["Differentiate between primary key and candidate key.", "A **candidate key** is any attribute that can uniquely identify rows; a table may have several. The **primary key** is the one candidate key **chosen** to identify rows; it must be unique and not NULL.", "2 marks"], ["What problems does a DBMS solve?", "It reduces **data redundancy** and **inconsistency**, allows **sharing** by many users, improves **security**, makes **searching** easy with queries, and supports **backup and recovery**.", "2 marks"], ["Identify the candidate, primary and alternate keys in EMPLOYEE(EmpID, Aadhaar, Name, Dept).", "Candidate keys: **EmpID, Aadhaar**. Primary key: **EmpID**. Alternate key: **Aadhaar**. (Name and Dept can repeat.)", "2 marks"], ["Define: (i) relation (ii) tuple (iii) attribute (iv) domain", "(i) A **table**. (ii) A **row**. (iii) A **column**. (iv) The **set of allowed values** for an attribute.", "2 marks"], ["**Assertion (A):** A primary key column can contain NULL values.\n**Reason (R):** A primary key uniquely identifies each row in a table.", "**A is false, R is true.** A primary key can never be NULL.", "1 mark"], ["Table PRODUCT has 4 attributes and 6 tuples. If 2 rows are deleted and 1 column added, what are the new degree and cardinality?", "Degree = 4 + 1 = **5**; cardinality = 6 − 2 = **4**.", "1 mark"]], "ip11-sql": [["Write a query to display students of class 11 with marks between 60 and 80.", "```\nSELECT * FROM STUDENT WHERE Class = 11 AND Marks BETWEEN 60 AND 80;\n```", "1 mark"], ["Differentiate between DDL and DML with two examples each.", "- **DDL** defines the structure: CREATE, ALTER, DROP.\n- **DML** changes the data: INSERT, UPDATE, DELETE.\n(SELECT is **DQL** in the 2026-27 syllabus.)", "2 marks"], ["Write a query to add a column Phone to the student table.", "```\nALTER TABLE STUDENT ADD Phone VARCHAR(15);\n```", "1 mark"], ["Differentiate between DELETE and DROP TABLE.", "- `DELETE FROM T` (DML) removes **rows**; the table structure remains; can use WHERE.\n- `DROP TABLE T` (DDL) removes the **whole table** including its structure.", "2 marks"], ["Table ITEM(ItemNo, IName, Price, Qty). Write queries to:\n(a) display items with price above 500\n(b) display items with no quantity recorded\n(c) increase price by 10% for all items\n(d) delete items with Qty 0", "```\nSELECT * FROM ITEM WHERE Price > 500;\nSELECT * FROM ITEM WHERE Qty IS NULL;\nUPDATE ITEM SET Price = Price * 1.10;\nDELETE FROM ITEM WHERE Qty = 0;\n```", "4 marks"], ["Write SQL to create table EMP with EmpID (integer, primary key), Name (up to 25 characters, required), Salary (decimal) and DOJ (date).", "```\nCREATE TABLE EMP (\n    EmpID  INT PRIMARY KEY,\n    Name   VARCHAR(25) NOT NULL,\n    Salary FLOAT,\n    DOJ    DATE\n);\n```", "3 marks"], ["Differentiate between CHAR and VARCHAR.", "`CHAR(n)` is **fixed length**: always uses n characters (pads with spaces). `VARCHAR(n)` is **variable length**: uses only as many characters as stored, up to n.", "2 marks"], ["Write queries to (a) display names of employees who joined in 2025 (b) display employees whose salary is not between 30000 and 50000.", "```\nSELECT Name FROM EMP WHERE DOJ BETWEEN '2025-01-01' AND '2025-12-31';\nSELECT * FROM EMP WHERE Salary NOT BETWEEN 30000 AND 50000;\n```", "2 marks"], ["Give two advantages of SQL.", "Easy English-like commands; fast retrieval of large data; a standard language that works on most RDBMS; many users can work at once. (any two)", "1 mark"], ["Write the command to (a) create a database SHOP (b) open it (c) list its tables (d) show the structure of table ITEM.", "```\nCREATE DATABASE SHOP;\nUSE SHOP;\nSHOW TABLES;\nDESCRIBE ITEM;\n```", "2 marks"]], "ip11-emerging": [["Differentiate between AR and VR.", "- **AR** adds digital objects to the **real world** seen through a phone or glasses (Pokémon Go).\n- **VR** puts the user in a **completely virtual** world through a headset, blocking the real world (VR games, flight simulators).", "2 marks"], ["List the 5 Vs of big data.", "**Volume, Velocity, Variety, Veracity, Value.**", "1 mark"], ["Differentiate between SaaS and IaaS with examples.", "- **SaaS**: complete software used through a browser; users just use it (Gmail, Google Docs).\n- **IaaS**: virtual hardware (servers, storage, networks); users install and manage their own OS and software (Amazon EC2).", "2 marks"], ["Give two uses of IoT in a smart city.", "Smart traffic lights that adjust to traffic; smart parking sensors; smart street lights; waste bins that signal when full; air-quality monitors. (any two)", "1 mark"], ["What is Machine Learning? Give one example.", "**ML** is a part of AI where computers **learn patterns from data** and improve without being explicitly programmed. Example: email spam filters, Netflix recommendations.", "2 marks"], ["What is NLP? Give two applications.", "**Natural Language Processing** lets computers understand and generate human language. Applications: Google Translate, voice assistants, chatbots, autocorrect.", "2 marks"], ["Name the cloud service model in each case: (a) Google Drive used by students (b) a developer deploying an app on Google App Engine (c) a company renting virtual servers on AWS.", "(a) **SaaS** (b) **PaaS** (c) **IaaS**", "3 marks"], ["A hospital wants patients' wristbands to send heart rate to doctors automatically.\n(a) Name the technology. (b) What device measures heart rate? (c) Give one concern.", "(a) **Internet of Things (IoT)**. (b) A **sensor** (heart-rate/optical sensor). (c) **Privacy and security** of health data (or dependence on network).", "3 marks"]]}, ip12:{"ip12-series": [["Create a Series of 5 cities' populations (in lakhs) with city names as index.", "```\nimport pandas as pd\npop = pd.Series([204, 184, 123, 85, 70],\n                index=['Delhi', 'Mumbai', 'Bengaluru', 'Chennai', 'Kolkata'])\nprint(pop)\n```", "2 marks"], ["Differentiate between loc and iloc with an example.", "`loc` selects by **label** and includes the end of a slice; `iloc` selects by **position** and excludes the end.\n```\ns = pd.Series([10, 20, 30], index=['a', 'b', 'c'])\ns.loc['a':'b']    # a 10, b 20\ns.iloc[0:1]       # a 10\n```", "2 marks"], ["Why does adding two Series sometimes give NaN?", "Pandas adds values with **matching index labels**. A label present in only one Series has nothing to add to, so the result for that label is **NaN**. Use `s1.add(s2, fill_value=0)` to avoid it.", "2 marks"], ["Write code to display the values greater than 50 in a Series S.", "```\nprint(S[S > 50])\n```", "1 mark"], ["Find the output:\n```\nimport pandas as pd\ns = pd.Series([3, 6, 9, 12], index=['p', 'q', 'r', 's'])\nprint(s['q':'s'])\nprint(s.iloc[1:3])\n```", "```\nq     6\nr     9\ns    12\ndtype: int64\nq    6\nr    9\ndtype: int64\n```", "3 marks"], ["Find the output:\n```\ns1 = pd.Series([5, 10, 15], index=['a', 'b', 'c'])\ns2 = pd.Series([1, 2, 3], index=['b', 'c', 'd'])\nprint(s1 - s2)\n```", "```\na     NaN\nb     9.0\nc    13.0\nd     NaN\ndtype: float64\n```", "2 marks"], ["Write the statements for a Series `marks` of 6 values to:\n(a) display the first 3 values (b) display the last 2 (c) display values in reverse order (d) add 5 to every value", "(a) `marks.head(3)` (b) `marks.tail(2)` (c) `marks[::-1]` (d) `marks + 5` (or `marks = marks + 5` to save)", "4 marks"], ["Create a Series of squares of 1 to 5 using a NumPy array, with index ['one', 'two', 'three', 'four', 'five'].", "```\nimport numpy as np, pandas as pd\nn = np.arange(1, 6)\nS = pd.Series(n ** 2, index=['one', 'two', 'three', 'four', 'five'])\nprint(S)\n```", "2 marks"], ["What will `pd.Series(7, index=[1, 2, 3])` create? What happens without the index?", "A Series with value **7 repeated** at labels 1, 2, 3. Without an index, a scalar creates a Series of **length 1** (index 0).", "1 mark"], ["Find the output:\n```\nimport pandas as pd\nS = pd.Series([12, 24, 36, 48, 60, 72], index=list('abcdef'))\nprint(S.head(2))\nprint(S.tail(3))\nprint(S.head().sum())\n```", "```\na    12\nb    24\ndtype: int64\nd    48\ne    60\nf    72\ndtype: int64\n180\n```\nhead() with no argument takes the first 5 values: 12 + 24 + 36 + 48 + 60 = 180.", "3 marks"], ["What is the use of head() and tail()? What is their default value of n?", "**head(n)** returns the first n elements and **tail(n)** the last n elements of a Series (or rows of a DataFrame). Both use **n = 5** by default.", "1 mark"], ["Write code to create a Series 'rain' from a dictionary of 4 months' rainfall, then display the last 2 months and the rainfall of each month doubled.", "```\nimport pandas as pd\nrain = pd.Series({'Jun': 120, 'Jul': 250, 'Aug': 210, 'Sep': 95})\nprint(rain.tail(2))\nprint(rain * 2)\n```", "2 marks"]], "ip12-dataframe": [["Create a DataFrame of 4 employees with columns Name, Dept and Salary.", "```\nimport pandas as pd\nemp = pd.DataFrame({'Name': ['Asha', 'Ravi', 'Meera', 'John'],\n                    'Dept': ['Sales', 'IT', 'Sales', 'HR'],\n                    'Salary': [40000, 55000, 45000, 35000]})\nprint(emp)\n```", "2 marks"], ["Write code to add a column Bonus that is 10% of Salary.", "```\nemp['Bonus'] = emp['Salary'] * 0.10\n```", "1 mark"], ["Differentiate between iterrows() and items().", "`iterrows()` loops over **rows**, giving (index, row Series). `items()` (iteritems in older Pandas) loops over **columns**, giving (column name, column Series).", "2 marks"], ["Write code to delete rows where Salary is below 40000.", "```\nemp = emp[emp['Salary'] >= 40000]\n# or: emp = emp.drop(emp[emp['Salary'] < 40000].index)\n```", "2 marks"], ["Consider `df`:\n```\n    Name  Marks  Class\n0   Riya     92     12\n1  Arjun     85     12\n2  Meera     78     11\n```\nFind the output of (a) `df.tail(1)` (b) `df.loc[1, 'Name']` (c) `df.iloc[2, 1]` (d) `df[df.Marks > 80].Name.tolist()`", "(a)\n```\n    Name  Marks  Class\n2  Meera     78     11\n```\n(b) `Arjun` (c) `78` (d) `['Riya', 'Arjun']`", "4 marks"], ["Write statements to (a) rename column Marks to Score (b) add a row for 'Kabir' with 70 marks in class 11 (c) delete column Class.", "```\ndf = df.rename(columns={'Marks': 'Score'})\ndf.loc[3] = ['Kabir', 70, 11]\ndf = df.drop('Class', axis=1)\n```", "3 marks"], ["**Assertion (A):** `df.drop('Marks')` removes the Marks column.\n**Reason (R):** By default, drop() works along axis=0 (rows).", "**A is false, R is true.** Without axis=1, Pandas looks for a **row** labelled 'Marks' and raises a KeyError.", "1 mark"], ["Create a DataFrame from a list of dictionaries for two products, where only one has a 'Discount' key. What appears in the missing place?", "```\nd = pd.DataFrame([{'Item': 'Pen', 'Price': 10, 'Discount': 1},\n                  {'Item': 'Book', 'Price': 250}])\n```\nThe missing Discount for Book is **NaN**.", "2 marks"], ["Write code to display (a) the first 2 rows (b) only Name and Marks columns of rows 0 to 1 using loc (c) the last 3 rows.", "```\ndf.head(2)\ndf.loc[0:1, ['Name', 'Marks']]\ndf.tail(3)\n```", "3 marks"], ["Find the output:\n```\ndf = pd.DataFrame({'A': [1, 2, 3], 'B': [4, 5, 6]})\ndf['C'] = df['A'] + df['B']\nprint(df.loc[df['C'] > 6])\n```", "```\n   A  B  C\n1  2  5  7\n2  3  6  9\n```", "2 marks"], ["Create a DataFrame from a dictionary of Series for the marks of Riya and Arjun in English and IP, with student names as row labels.", "```\nimport pandas as pd\neng = pd.Series([80, 75], index=['Riya', 'Arjun'])\nip = pd.Series([95, 88], index=['Riya', 'Arjun'])\ndf = pd.DataFrame({'English': eng, 'IP': ip})\nprint(df)\n```", "2 marks"], ["A text file 'stock.txt' has values separated by spaces with a header row. Write code to read it into a DataFrame and display the first 2 rows.", "```\nimport pandas as pd\ndf = pd.read_csv('stock.txt', sep=' ')\nprint(df.head(2))\n```", "2 marks"], ["Find the output:\n```\nd = pd.DataFrame({'P': [5, 10, 15, 20, 25, 30], 'Q': [1, 2, 3, 4, 5, 6]})\nprint(d.tail(2))\nprint(d.head(3)['P'].sum())\n```", "```\n    P  Q\n4  25  5\n5  30  6\n30\n```\nThe first 3 values of P are 5, 10 and 15.", "2 marks"], ["Write code to display the Name of every student whose Marks are more than 75 using iterrows().", "```\nfor i, row in df.iterrows():\n    if row['Marks'] > 75:\n        print(row['Name'])\n```", "2 marks"]], "ip12-csv": [["Write code to read 'sales.csv' into a DataFrame and display the first 3 rows.", "```\nimport pandas as pd\ndf = pd.read_csv('sales.csv')\nprint(df.head(3))\n```", "2 marks"], ["What does header=None do in read_csv()?", "It tells Pandas the file has **no header row**, so the first line is read as data and columns are numbered 0, 1, 2… (use `names=` to name them).", "1 mark"], ["Write code to save DataFrame df to 'out.csv' without the index.", "```\ndf.to_csv('out.csv', index=False)\n```", "1 mark"], ["Name the function used to export a DataFrame to a CSV file.", "`to_csv()`", "1 mark"], ["Write code to read only the Name and Marks columns of the first 5 rows from 'result.csv'.", "```\ndf = pd.read_csv('result.csv', usecols=['Name', 'Marks'], nrows=5)\n```", "2 marks"], ["A file 'emp.txt' has values separated by semicolons and no header. Write code to read it with column names ID, Name, Salary.", "```\ndf = pd.read_csv('emp.txt', sep=';', header=None, names=['ID', 'Name', 'Salary'])\n```", "2 marks"], ["What will happen if a DataFrame is saved with to_csv() (default settings) and read back with read_csv()?", "The row index is saved as an extra first column, so the new DataFrame gets an extra column named **'Unnamed: 0'**. Use `index=False` when saving (or `index_col=0` when reading).", "2 marks"], ["Write code to read 'marks.csv', add a column Total = IP + English, and save it to 'final.csv' with NaN written as 'NA'.", "```\ndf = pd.read_csv('marks.csv')\ndf['Total'] = df['IP'] + df['English']\ndf.to_csv('final.csv', index=False, na_rep='NA')\n```", "3 marks"]], "ip12-plotting": [["Write code to draw a line chart of temperatures for 7 days with labelled axes.", "```\nimport matplotlib.pyplot as plt\ndays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']\ntemp = [31, 33, 34, 32, 35, 36, 34]\nplt.plot(days, temp, marker='o')\nplt.xlabel('Day'); plt.ylabel('Temperature (°C)')\nplt.title('Weekly temperature')\nplt.show()\n```", "3 marks"], ["What is the purpose of the bins argument in hist()?", "`bins` sets **how many ranges** (or the exact range edges) the data is grouped into. Each bar shows how many values fall in that range.", "1 mark"], ["Differentiate between a bar chart and a histogram.", "- **Bar chart**: compares **categories** (subjects, cities); bars have gaps; `plt.bar()`.\n- **Histogram**: shows the **distribution of numeric data** grouped into ranges; bars touch; `plt.hist()`.", "2 marks"], ["Which function saves a plot as an image? When must it be called?", "`plt.savefig('name.png')`. Call it **before** `plt.show()`, because show() clears the figure.", "1 mark"], ["Fill in the blanks to plot the bar chart with title 'Votes' and save it:\n```\nimport matplotlib.pyplot as ____\nparty = ['A', 'B', 'C']; votes = [120, 90, 150]\nplt.____(party, votes)\nplt.____('Votes')\nplt.____('votes.png')\n```", "`plt`, `bar`, `title`, `savefig`", "2 marks"], ["Write code to plot two lines (Sales 2025 and Sales 2026) for 4 quarters with a legend.", "```\nq = ['Q1', 'Q2', 'Q3', 'Q4']\nplt.plot(q, [120, 150, 130, 170], label='2025')\nplt.plot(q, [140, 160, 155, 190], label='2026')\nplt.legend()\nplt.title('Quarterly sales')\nplt.show()\n```", "3 marks"], ["Name the function to (a) add a title (b) label the x-axis (c) show labels of plotted lines (d) display the chart.", "(a) `plt.title()` (b) `plt.xlabel()` (c) `plt.legend()` (d) `plt.show()`", "2 marks"], ["DataFrame df has columns City and Rainfall. Write one line to draw a horizontal bar chart of Rainfall for each City.", "```\ndf.plot(x='City', y='Rainfall', kind='barh')\n```", "1 mark"]], "ip12-sql-functions": [["Find the output: `SELECT MID('Computer', 4, 3);`", "`put` (characters 4, 5, 6: p, u, t)", "1 mark"], ["Find the output: `SELECT ROUND(273.456, -2), MOD(25, 7);`", "`300   4`", "1 mark"], ["Write a query to show names of students born in the month of March.", "```\nSELECT Name FROM STUDENT WHERE MONTH(DOB) = 3;\n-- or: WHERE MONTHNAME(DOB) = 'March'\n```", "1 mark"], ["Differentiate between LTRIM() and TRIM().", "`LTRIM(s)` removes spaces only from the **left** (start). `TRIM(s)` removes spaces from **both** ends.\n`LTRIM('  Hi  ')` → 'Hi  ', `TRIM('  Hi  ')` → 'Hi'.", "2 marks"], ["Find the output:\n(i) `SELECT LENGTH('  Data  ');`\n(ii) `SELECT LENGTH(TRIM('  Data  '));`\n(iii) `SELECT INSTR('BANANA', 'NA');`\n(iv) `SELECT LEFT('DigiClass', 4), RIGHT('DigiClass', 5);`", "(i) **8** (ii) **4** (iii) **3** (iv) **Digi  Class**", "2 marks"], ["Find the output: `SELECT POWER(2, 4), ROUND(5.5), ROUND(4.35, 1), MOD(-7, 3);`", "`16   6   4.4   -1`", "2 marks"], ["Table ORDERS(OID, Customer, ODate). Write queries to:\n(a) show customer names in upper case\n(b) show the year of each order\n(c) show orders placed on a Sunday\n(d) show the first 3 letters of each customer name", "```\nSELECT UPPER(Customer) FROM ORDERS;\nSELECT YEAR(ODate) FROM ORDERS;\nSELECT * FROM ORDERS WHERE DAYNAME(ODate) = 'Sunday';\nSELECT LEFT(Customer, 3) FROM ORDERS;\n```", "4 marks"], ["Differentiate between a single-row function and an aggregate function with examples.", "A **single-row** function works on each row and returns one value **per row** (UPPER, ROUND, YEAR). An **aggregate** function works on a group of rows and returns **one value** for the group (SUM, AVG, COUNT).", "2 marks"], ["Find the output: `SELECT DAY('2026-12-25'), MONTHNAME('2026-12-25'), DAYNAME('2026-12-25');`", "`25   December   Friday`", "1 mark"], ["Write the output of `SELECT SUBSTR('INFORMATICS PRACTICES', 13);`", "`PRACTICES` (from position 13 to the end).", "1 mark"]], "ip12-sql-aggregate": [["Write a query to show the number of employees in each department having more than 3 employees.", "```\nSELECT Dept, COUNT(*) FROM EMP GROUP BY Dept HAVING COUNT(*) > 3;\n```", "2 marks"], ["Differentiate between COUNT(*) and COUNT(column).", "`COUNT(*)` counts **all rows**, including rows with NULLs. `COUNT(column)` counts only rows where that column is **not NULL**.", "2 marks"], ["Table A has 3 columns and 4 rows; B has 2 columns and 5 rows. Find degree and cardinality of A × B.", "Degree = 3 + 2 = **5**; cardinality = 4 × 5 = **20**.", "1 mark"], ["Write a query to display employee names with their department names using an equi-join on EMP(EName, DeptNo) and DEPT(DeptNo, DName).", "```\nSELECT EName, DName FROM EMP, DEPT WHERE EMP.DeptNo = DEPT.DeptNo;\n```", "2 marks"], ["Table SALES(Region, Product, Amount):\nNorth, Pen, 500 | South, Pen, 300 | North, Book, 700 | East, Book, 400 | South, Book, NULL\nFind the output:\n(a) `SELECT COUNT(*), COUNT(Amount) FROM SALES;`\n(b) `SELECT Region, SUM(Amount) FROM SALES GROUP BY Region;`\n(c) `SELECT AVG(Amount) FROM SALES;`", "(a) **5  4**\n(b) North 1200, South 300, East 400\n(c) (500+300+700+400)/4 = **475**", "3 marks"], ["Write queries on SALES to (a) show the maximum amount for each product (b) show regions whose total sales exceed 1000 (c) list rows in descending order of amount.", "```\nSELECT Product, MAX(Amount) FROM SALES GROUP BY Product;\nSELECT Region FROM SALES GROUP BY Region HAVING SUM(Amount) > 1000;\nSELECT * FROM SALES ORDER BY Amount DESC;\n```", "3 marks"], ["Why can't you write `WHERE SUM(Amount) > 1000`?", "Aggregate functions can't be used in **WHERE**, because WHERE filters single rows before groups are formed. Use **HAVING** after GROUP BY.", "1 mark"], ["**Assertion (A):** AVG(Marks) and SUM(Marks)/COUNT(*) always give the same result.\n**Reason (R):** Aggregate functions other than COUNT(*) ignore NULL values.", "**A is false, R is true.** If some Marks are NULL, AVG divides by the non-NULL count, while COUNT(*) counts all rows, so the results differ.", "1 mark"], ["Tables STUDENT(Rno, Name, CID) and COURSE(CID, Fee). Write a query to show each student's name with the course fee, only for fees above 5000, sorted by fee.", "```\nSELECT S.Name, C.Fee FROM STUDENT S, COURSE C\nWHERE S.CID = C.CID AND C.Fee > 5000\nORDER BY C.Fee;\n```", "3 marks"]], "ip12-networks": [["Differentiate between a hub and a switch.", "A **hub** broadcasts incoming data to **all** connected devices (more traffic, not intelligent). A **switch** sends data only to the **intended** device using its MAC address (efficient, intelligent).", "2 marks"], ["Differentiate between static and dynamic web pages.", "**Static**: same content for everyone; plain HTML/CSS; fast (an 'About us' page). **Dynamic**: content changes per user or time; uses scripts and databases (Gmail inbox, Amazon product page).", "2 marks"], ["What are cookies? Give one advantage and one risk.", "Small text files a website stores in the browser to remember the user. **Advantage**: remembers logins and preferences. **Risk**: tracking of browsing habits (privacy).", "2 marks"], ["Which topology would you suggest for a small office? Why?", "**Star topology**: easy to install and manage, one cable failure affects only one computer, and faults are easy to find.", "2 marks"], ["Expand: (a) URL (b) VoIP (c) WWW (d) MAN", "(a) Uniform Resource Locator (b) Voice over Internet Protocol (c) World Wide Web (d) Metropolitan Area Network", "2 marks"], ["Identify the parts of `https://www.cbse.gov.in/results/2026.html`.", "Protocol: **https**; domain name: **www.cbse.gov.in**; path/file: **/results/2026.html**.", "2 marks"], ["Sunrise School has 4 blocks: Admin (40 PCs), Science (25), Library (10), Sports (5).\n(a) Where should the server be placed? (b) Suggest a topology. (c) Which device connects the school to the internet? (d) Which device boosts signals over a 120 m cable?", "(a) **Admin** (most computers). (b) **Star** with Admin at the centre. (c) **Router** (with a modem). (d) **Repeater**.", "4 marks"], ["What are add-ons and plug-ins?", "**Add-ons/extensions** add extra features to a browser (ad blocker, translator). **Plug-ins** let the browser handle special content it can't show by itself (PDF viewer).", "2 marks"], ["Differentiate between a web server and web hosting.", "A **web server** is a computer/software that stores websites and sends pages to browsers on request. **Web hosting** is a service that rents space on such a server so your website is available online 24×7.", "2 marks"], ["Name four commonly used web browsers and two browser settings you can change.", "Chrome, Firefox, Edge, Safari (Opera). Settings: home page, default search engine, clearing history/cookies, privacy and pop-up blocking, download location.", "2 marks"]], "ip12-societal": [["Differentiate between active and passive digital footprints.", "**Active**: data you share deliberately (posts, comments, emails). **Passive**: data collected without your direct action (IP address, cookies, browsing history, location).", "2 marks"], ["What is identity theft? Suggest two ways to prevent it.", "Stealing someone's personal information to pretend to be them, often for fraud. Prevention: never share OTPs/passwords; use strong passwords and two-factor authentication; don't post personal details publicly.", "2 marks"], ["Why is e-waste hazardous? How should it be disposed of?", "It contains toxic **lead, mercury, cadmium** that pollute soil, water and air and harm health. Dispose through **authorised e-waste recyclers** or take-back schemes; reduce, reuse and recycle.", "3 marks"], ["List three health problems caused by excessive device use and their remedies.", "Eye strain → 20-20-20 rule; back/neck pain → correct posture, screen at eye level; sleep problems → no screens before bed. (Also RSI, internet addiction.)", "3 marks"], ["Differentiate between copyright and patent.", "**Copyright** protects original creative works (books, music, software code) automatically. A **patent** protects a new **invention**; it must be applied for and is granted for about 20 years.", "2 marks"], ["What is plagiarism? How can students avoid it?", "Presenting someone else's work or ideas as your own. Avoid it by citing sources, using quotation marks for exact words, and writing in your own words.", "2 marks"], ["Riya received an email saying she has won a phone and must enter her bank details on a link.\n(a) Name this cyber crime. (b) Give two signs it is fake. (c) What should she do?", "(a) **Phishing**. (b) Unexpected prize, urgency, asks for bank details, suspicious link/sender. (c) Don't click the link or reply; delete/report it; report at **cybercrime.gov.in** or call **1930**.", "3 marks"], ["What is FOSS? Give two examples and two advantages.", "**Free and Open Source Software**: free to use, study, modify and share; source code available. Examples: Linux, LibreOffice, Firefox, Python. Advantages: no cost, can be customised, community support, transparent.", "2 marks"], ["How can technology be made more inclusive for students with disabilities?", "Provide **assistive technologies** (screen readers, Braille keyboards, speech-to-text, captions), accessible websites and documents, and trained teachers. (Gender: encourage girls in computing with role models and equal access.)", "2 marks"], ["Give an overview of India's IT Act.", "The **IT Act, 2000** (amended 2008) gives legal recognition to electronic records and **digital signatures**, supports e-commerce and e-governance, and defines **cyber crimes and penalties** (hacking, identity theft, publishing obscene material, cyber terrorism).", "3 marks"]]}};
