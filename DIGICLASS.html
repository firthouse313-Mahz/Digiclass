  news: [
    { date:"2026-10-08", icon:"🐼", title:"IP Class 12 Pandas: new head() and tail() lessons, matched to the 2026-27 syllabus", go:"#/ip12/ch/ip12-series" },
    { date:"2026-10-08", icon:"💻", title:"CS Class 11 & 12: solved practical file, logic circuits + 160 new practice questions", go:"#/cs12/ch/cs12-practicals" },
    { date:"2026-10-08", icon:"📝", title:"IP Class 11 & 12: solved practical file + 250 new practice questions", go:"#/ip12/ch/ip12-practicals" },
    { date:"2026-10-08", icon:"📘", title:"Every CS and IP chapter now explained in full detail", go:"#/classes" },
    { date:"2026-10-08", icon:"🎨", title:"A cleaner, easier-to-read DigiClass with a classroom chalkboard", go:"#/" },
    { date:"2026-10-07", icon:"🎯", title:"60+ new board-style questions for Class 12 CS and IP", go:"#/practice" },
    { date:"2026-10-07", icon:"📊", title:"Track your progress, streak and weak topics in My Learning", go:"#/me" }
  ]
};

const DCP = (()=>{
  const K = { ev:"dc-ev", qa:"dc-qa", days:"dc-days", time:"dc-time", read:"dc-read", recent:"dc-recent",
              savedq:"dc-savedq", votes:"dc-votes", ratings:"dc-ratings", outbox:"dc-outbox", search:"dc-search",
              newsSeen:"dc-news-seen", chal:"dc-challenge", views:"dc-views", fbRate:"dc-fb-rate" };
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const GC = DC_CONFIG.analytics.goatcounter.trim(), FB = DC_CONFIG.feedback.endpoint.trim(), CU = DC_CONFIG.comments.cusdisAppId.trim();

  /* ---------- data adapter (swap "local" for a backend later) ---------- */
  const Data = {
    get:(k,d)=>store.get(k,d), set:(k,v)=>store.set(k,v),
    push(k,item,cap){ const a=store.get(k,[]); a.push(item); if(a.length>cap) a.splice(0,a.length-cap); store.set(k,a); return a; }
  };

  /* ---------- analytics ---------- */
  let gcReady=false, gcQueue=[];
  function loadGC(){
    if(!GC) return;
    window.goatcounter = { no_onload:true, allow_local:false };
    const s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
    s.dataset.goatcounter=`https://${GC}.goatcounter.com/count`;
    s.onload=()=>{ gcReady=true; gcQueue.splice(0).forEach(send); };
    document.head.appendChild(s);
  }
  function send(o){ if(!GC) return; if(!gcReady||!window.goatcounter||!window.goatcounter.count){ gcQueue.push(o); return; } try{ window.goatcounter.count(o); }catch(e){} }
  const Track = {
    page(path,title){ send({path, title}); },
    event(name,title){ send({path:name, title:title||name, event:true}); },
    activity(){ const d=new Set(Data.get(K.days,[])); d.add(today()); Data.set(K.days,[...d].sort().slice(-400)); }
  };
  function publicCount(cb){
    if(!GC) return cb(null);
    fetch(`https://${GC}.goatcounter.com/counter/TOTAL.json`).then(r=>r.ok?r.json():null).then(j=>cb(j&&j.count?String(j.count).trim():null)).catch(()=>cb(null));
  }

  /* ---------- question attempts ---------- */
  function attempt(qid, ok){
    const m=Data.get(K.qa,{}); const r=m[qid]||{a:0,c:0}; r.a++; if(ok) r.c++; m[qid]=r; Data.set(K.qa,m);
    Track.activity(); Track.event(`q/${ok?"right":"wrong"}/${qid}`, `Answered ${qid}`);
  }
  const chOfQ = qid => qid.split(":")[0];

  /* ---------- time on task ---------- */
  let lastAct=Date.now();
  ["scroll","click","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
  setInterval(()=>{
    if(document.visibilityState!=="visible" || Date.now()-lastAct>120000) return;
    const t=Data.get(K.time,{total:0,by:{}}); t.total+=15;
    if(view&&view.name==="chapter"){ t.by[view.id]=(t.by[view.id]||0)+15; Track.activity(); }
    Data.set(K.time,t);
  },15000);

  /* ---------- reading progress per chapter ---------- */
  addEventListener("scroll",()=>{
    if(!view||view.name!=="chapter") return;
    const h=document.documentElement.scrollHeight-innerHeight; if(h<=0) return;
    const p=Math.min(100,Math.round(scrollY/h*100)), r=Data.get(K.read,{});
    if((r[view.id]||0)<p){ r[view.id]=p; Data.set(K.read,r); }
  },{passive:true});

  /* ---------- stats (everything computed from real, local data) ---------- */
  function stats(){
    const qa=Data.get(K.qa,{}), vals=Object.entries(qa);
    const att=vals.reduce((n,[,r])=>n+r.a,0), cor=vals.reduce((n,[,r])=>n+r.c,0);
    const days=new Set(Data.get(K.days,[]));
    let streak=0; const d=new Date(); if(!days.has(today())) d.setDate(d.getDate()-1);
    for(;;){ const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; if(days.has(k)){ streak++; d.setDate(d.getDate()-1);} else break; }
    const byCh={}; vals.forEach(([q,r])=>{ const c=chOfQ(q); if(!CHBY[c]) return; const b=byCh[c]||(byCh[c]={a:0,c:0}); b.a+=r.a; b.c+=r.c; });
    const topics=Object.entries(byCh).filter(([,b])=>b.a>=3).map(([c,b])=>({id:c,acc:Math.round(b.c/b.a*100),a:b.a}));
    const study=COURSES.flatMap(c=>c.study);
    const papers=COURSES.filter(c=>paperOf(c.id)&&store.get("paper-"+c.id,{}).sub).length;
    const sols=Data.get(K.ev,[]).filter(e=>e.t==="sol").length;
    return { att, cor, acc:att?Math.round(cor/att*100):null, done:study.filter(ch=>done.has(ch.id)).length, total:study.length,
      streak, activeDays:days.size, papers, quizzes:Object.keys(scores).length, mins:Math.round(Data.get(K.time,{total:0}).total/60),
      weak:topics.filter(t=>t.acc<60).sort((a,b)=>a.acc-b.acc).slice(0,4), strong:topics.filter(t=>t.acc>=80).sort((a,b)=>b.acc-a.acc).slice(0,4),
      sols, savedQ:Data.get(K.savedq,[]).length };
  }
  const fmtMins = m => m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`;

  /* ---------- UI: progress panel ---------- */
  function progressPanel(){
    const s=stats();
    const tile=(icon,val,label,sub)=>`<div class="pp-tile"><span class="pp-i" aria-hidden="true">${icon}</span><b>${val}</b><span>${label}</span>${sub?`<small>${sub}</small>`:""}</div>`;
    const tl=(arr,cls)=>arr.map(t=>`<button class="pp-topic ${cls}" data-open="${t.id}"><span>${esc(CHBY[t.id].title)}</span><em>${t.acc}%</em></button>`).join("");
    return `<section class="pp reveal" aria-label="My progress">
      <div class="pp-head"><h2>📊 My Progress</h2><span class="pp-note">Saved on this device</span></div>
      <div class="pp-grid">
        ${tile("🧠",s.att,"Questions answered",s.att?`${s.cor} correct`:"Take a quiz to start")}
        ${tile("🎯",s.acc==null?"–":s.acc+"%","Accuracy",s.att?"across all quiz questions":"")}
        ${tile("📗",`${s.done}<small>/${s.total}</small>`,"Chapters completed","")}
        ${tile("🔥",s.streak,`Day streak`,s.activeDays?`${s.activeDays} active day${s.activeDays>1?"s":""}`:"")}
        ${tile("📝",s.papers,"Mock papers done","")}
        ${tile("⏱️",fmtMins(s.mins),"Time learning","while active on DigiClass")}
        ${tile("✅",s.quizzes,"Chapter quizzes taken","")}
        ${tile("🔖",saved.size+s.savedQ,"Saved",`${saved.size} chapters · ${s.savedQ} questions`)}
      </div>
      ${(s.weak.length||s.strong.length)?`<div class="pp-topics">
        ${s.weak.length?`<div><h3>Needs more practice</h3>${tl(s.weak,"weak")}</div>`:""}
        ${s.strong.length?`<div><h3>Your strong topics</h3>${tl(s.strong,"strong")}</div>`:""}
      </div>`:`<p class="pp-hint">Answer at least 3 quiz questions in a chapter and we'll show your strong and weak topics here.</p>`}
    </section>`;
  }

  /* ---------- UI: continue learning (recent chapters with % read) ---------- */
  function continueList(){
    const rec=Data.get(K.recent,[]).filter(id=>CHBY[id]).slice(0,3), rd=Data.get(K.read,{});
    if(!rec.length) return "";
    return `<section class="cl reveal" aria-label="Continue learning"><h2>Continue learning</h2><div class="cl-row">${rec.map(id=>{ const ch=CHBY[id], p=done.has(id)?100:(rd[id]||0);
      return `<button class="cl-card" data-open="${id}"><span class="cl-ic" aria-hidden="true">${ch.course.subj.icon}</span><span class="cl-t"><b>${esc(ch.title)}</b><small>Class ${ch.course.grade} · ${esc(ch.course.subject)}</small><span class="cl-bar"><i style="width:${p}%"></i></span><small>${p}% ${done.has(id)?"· done ✓":"read"}</small></span><span class="cl-go">Continue →</span></button>`; }).join("")}</div></section>`;
  }

  /* ---------- UI: today's challenge (same question for everyone today) ---------- */
  function challengeQ(){
    const pool=[]; COURSES.forEach(c=>Object.entries(c.quiz).forEach(([id,qs])=>qs.forEach((q,i)=>pool.push([id,i]))));
    let h=0; for(const ch of today()) h=(h*31+ch.charCodeAt(0))>>>0;
    return pool[h%pool.length];
  }
  function challengeCard(){
    const [id,i]=challengeQ(), q=quizOf(id)[i], ch=CHBY[id], st=Data.get(K.chal,{});
    const answered = st.date===today() ? st.k : null;
    return `<div class="hc hc-chal" id="chal"><div class="hc-h"><span>🔥 Today's challenge</span><small>Class ${ch.course.grade} · ${esc(ch.course.subject)}</small></div>
      <p class="chal-q">${esc(q[0])}</p>
      <div class="chal-opts">${q[1].map((o,k)=>`<button class="chal-o ${answered!=null?(k===q[2]?"right":k===answered?"wrong":""):""}" data-chal="${k}" ${answered!=null?"disabled":""}>${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join("")}</div>
      ${answered!=null?`<p class="chal-fb">${answered===q[2]?"✅ <b>Correct!</b>":"💡 <b>Not quite.</b>"} ${esc(q[3])} <button class="linkbtn" data-open="${id}">Read the chapter →</button></p>`:`<p class="chal-fb muted">A new question every day.</p>`}
    </div>`;
  }

  /* ---------- UI: home strip ---------- */
  function homeStrip(){
    const s=stats(), nQ=COURSES.reduce((n,c)=>n+quizCount(c)+bankCount(c),0), nCh=COURSES.reduce((n,c)=>n+c.study.length,0);
    return `<section class="hstrip reveal" aria-label="DigiClass at a glance">
      ${challengeCard()}
      <div class="hc-col">
        <button class="hc hc-link" data-nav-go="me"><span class="hc-h"><span>📈 My progress</span></span>
          ${s.att||s.done?`<span class="hc-big">${s.acc==null?s.done:s.acc+"%"}</span><small>${s.acc==null?`chapters done`:`accuracy · ${s.att} answered`}${s.streak?` · 🔥 ${s.streak}-day streak`:""}</small>`:`<span class="hc-big">Start</span><small>Your progress appears after your first quiz</small>`}</button>
        <div class="hc"><span class="hc-h"><span>📚 On DigiClass</span></span><span class="hc-big">${nCh}</span><small>chapters · ${nQ.toLocaleString()} questions with answers</small>
          <span class="visits" data-visits hidden></span></div>
        <button class="hc hc-link" data-go-saved><span class="hc-h"><span>🔖 Saved</span></span><span class="hc-big">${saved.size+s.savedQ}</span><small>${saved.size} chapter${saved.size===1?"":"s"} · ${s.savedQ} question${s.savedQ===1?"":"s"}</small></button>
      </div>
    </section>`;
  }
  function newsHome(){
    const n=DC_CONFIG.news.slice(0,4); if(!n.length) return "";
    return `<section class="section"><div class="nh"><h2 class="sec-title">🆕 Recently added</h2></div><div class="news-list">${n.map(x=>`<a class="news-item" href="${esc(x.go||"#/")}"><span aria-hidden="true">${x.icon||"🔔"}</span><span><b>${esc(x.title)}</b><small>${esc(niceDate(x.date))}</small></span></a>`).join("")}</div></section>`;
  }
  function helpBlock(){
    return `<section class="helpus reveal"><div><h2>💡 Help us make DigiClass better</h2><p>Found something wrong? Need a topic? Have an idea? Tell us.</p></div>
      <div class="helpus-btns"><button class="btn" data-fb="error">🐞 Report error</button><button class="btn" data-fb="topic">💡 Request topic</button><button class="btn" data-fb="feedback">💬 Give feedback</button><button class="btn" data-fb="question">❓ Ask a question</button></div></section>`;
  }
  const niceDate = s => { const d=new Date(s+"T00:00:00"); return isNaN(d)?s:d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); };

  /* ---------- feedback modal ---------- */
  const TYPES = { feedback:["💬","Leave feedback","What do you like? What could be better?"], question:["❓","Ask a question","Ask about a concept or topic you're stuck on."],
    error:["🐞","Report an error","Tell us what's wrong so we can fix it."], topic:["💡","Suggest a topic","What should we add next?"], rating:["⭐","Rating",""] };
  const REASONS = { error:["Incorrect answer","Incorrect explanation","Typo","Question unclear","Broken button or link","Missing content","Technical problem","Other"],
    topic:["Chapter","Topic","Question type","Revision material","Mock test","Programming problem","SQL practice","Other"] };
  const BAD = /\b(idiot|stupid|dumb|loser|shut ?up|hate you|kill|fuck|shit|bitch|bastard|damn|crap|asshole|moron|ugly)\b/i;
  function check(msg,name){
    const all=msg+" "+name;
    if(msg.trim().length<5) return "Please write a little more (at least 5 characters).";
    if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(all)) return "Please don't include email addresses. Your teacher will reply on DigiClass or in class.";
    if(/(\d[\s-]?){8,}/.test(all)) return "Please don't include phone numbers or long ID numbers.";
    if(/(https?:\/\/|www\.|\.(com|net|org|io|xyz|ru|in|ae)\b)/i.test(all)) return "Links aren't allowed. Describe the problem in words instead.";
    if(BAD.test(all)) return "Please keep it kind and respectful.";
    if(/(.)\1{7,}/.test(all)) return "That looks like spam. Please write a normal message.";
    const r=Data.get(K.fbRate,[]).filter(t=>Date.now()-t<86400000);
    if(r.length>=10) return "You've sent a lot of messages today. Please try again tomorrow.";
    if(r.length && Date.now()-r[r.length-1]<20000) return "Please wait a few seconds before sending another message.";
    return null;
  }
  let FBCTX = {};
  function openFb(type, ctx){
    FBCTX = Object.assign({type, page:location.hash||"#/", title:document.title}, ctx||{});
    const d=$("fbd"), [ic,ttl,sub]=TYPES[type]||TYPES.feedback, reasons=REASONS[type];
    d.innerHTML = `<form class="fbf" id="fbf" novalidate>
      <div class="qd-head"><b>${ic} ${ttl}</b><button type="button" class="qd-close" aria-label="Close" data-fbclose>${IC.x}</button></div>
      <div class="fb-types" role="radiogroup" aria-label="Type">${["feedback","question","error","topic"].map(k=>`<button type="button" role="radio" aria-checked="${k===type}" data-fbtype="${k}">${TYPES[k][0]} ${TYPES[k][1].replace(/^(Leave|Ask|Report|Suggest) (a |an )?/,"").replace(/^./,c=>c.toUpperCase())}</button>`).join("")}</div>
      <p class="fb-sub">${sub}${FBCTX.ref?`<br><span class="fb-ref">About: ${esc(FBCTX.refLabel||FBCTX.ref)}</span>`:""}</p>
      ${reasons?`<label class="fb-l">${type==="error"?"What's the problem?":"What would you like?"}<select id="fbReason">${reasons.map(r=>`<option${FBCTX.reason===r?" selected":""}>${r}</option>`).join("")}</select></label>`:""}
      <label class="fb-l">Your message<textarea id="fbMsg" rows="4" maxlength="800" required placeholder="${type==="error"?"e.g. In question 3 the answer should be 12, not 10.":type==="topic"?"e.g. More SQL JOIN questions please.":type==="question"?"e.g. When do I use iloc instead of loc?":"Tell us what you think…"}">${esc(FBCTX.msg||"")}</textarea></label>
      <label class="fb-l">First name and class <span class="opt">(optional)</span><input id="fbName" maxlength="30" autocomplete="off" placeholder="e.g. Aisha, 12B"></label>
      <input id="fbHp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="fb-safe">🛡️ Don't share your full name, email, phone number or any private information.${FB?" Your teacher reads every message.":""}</p>
      <p class="fb-err" id="fbErr" role="alert"></p>
      <div class="qfoot"><button type="button" class="btn" data-fbclose>Cancel</button><button class="btn primary" type="submit">Send</button></div>
    </form>`;
    $("fb").showModal(); setTimeout(()=>{ const m=$("fbMsg"); if(m) m.focus(); },50);
  }
  function submitFb(){
    if($("fbHp").value) return $("fb").close();
    const msg=$("fbMsg").value.trim(), name=$("fbName").value.trim(), rs=$("fbReason");
    const err=check(msg,name); if(err){ $("fbErr").textContent=err; return; }
    const item={ id:Math.random().toString(36).slice(2,10), ts:new Date().toISOString(), type:FBCTX.type, reason:rs?rs.value:"", message:msg, name, page:FBCTX.page, ref:FBCTX.ref||"", title:FBCTX.title, status:"pending", sent:false };
    deliver(item, ok=>{
      $("fbd").innerHTML = `<div class="fb-done"><div class="fb-big">${ok?"✅":"📥"}</div><h3>${ok?"Thank you!":"Saved on this device"}</h3>
        <p>${ok?"Your message has been sent to your teacher for review. Nothing is published without the teacher's approval.":"Your teacher hasn't connected the DigiClass inbox yet, so your message is saved on this device only. Please tell your teacher in class too."}</p>
        <div class="qfoot"><button class="btn primary" data-fbclose>Close</button></div></div>`;
    });
  }
  function deliver(item, cb){
    const r=Data.get(K.fbRate,[]).filter(t=>Date.now()-t<86400000); r.push(Date.now()); Data.set(K.fbRate,r);
    Track.event(`feedback/${item.type}`, item.type);
    const save=sent=>{ item.sent=sent; Data.push(K.outbox,item,200); cb&&cb(sent); };
    if(!FB){ if(typeof CLS!=="undefined" && CLS.feedback(item)) return save(true); return save(false); }
    fetch(FB,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(Object.assign({_subject:`DigiClass ${item.type}${item.reason?": "+item.reason:""}`},item))})
      .then(res=>save(res.ok)).catch(()=>save(false));
  }

  /* ---------- share ---------- */
  function share(path,title){
    const url=location.href.split("#")[0]+path, text=`${title} on DigiClass`;
    if(navigator.share){ navigator.share({title:text,url}).catch(()=>{}); Track.event("share/native"); return; }
    const d=$("fbd");
    d.innerHTML=`<div class="qd-head"><b>🔗 Share</b><button class="qd-close" aria-label="Close" data-fbclose>${IC.x}</button></div>
      <p class="fb-sub">${esc(title)}</p><input class="share-url" readonly value="${esc(url)}" aria-label="Link">
      <div class="share-row"><button class="btn primary" data-sharecopy>Copy link</button>
      <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text+" "+url)}">WhatsApp</a>
      <a class="btn" href="mailto:?subject=${encodeURIComponent(text)}&body=${encodeURIComponent(url)}">Email</a></div>`;
    $("fb").showModal(); Track.event("share/menu");
  }

  /* ---------- per-question tools ---------- */
  function qText(item){ const p=item.querySelector(".qa-q p, .qa-q div"); return (p?p.innerText:"").replace(/\s+/g," ").trim().slice(0,140); }
  function toolsFor(item){
    const qid=item.dataset.qid, v=Data.get(K.votes,{})[qid], sv=Data.get(K.savedq,[]).some(x=>x.qid===qid);
    const bar=document.createElement("div"); bar.className="qtools";
    bar.innerHTML=`<span class="qt-l">Helpful?</span><button class="qt ${v===1?"on":""}" data-vote="1" aria-pressed="${v===1}" aria-label="Helpful">👍</button><button class="qt ${v===-1?"on":""}" data-vote="-1" aria-pressed="${v===-1}" aria-label="Not helpful">👎</button>
      <span class="qt-sp"></span><button class="qt ${sv?"on":""}" data-saveq aria-pressed="${sv}">🔖 ${sv?"Saved":"Save"}</button><button class="qt" data-shareq>🔗 Share</button><button class="qt" data-reportq>⚑ Report</button>`;
    item.appendChild(bar);
  }
  function decorate(v){
    const content=$("content");
    if(v.name==="chapter"){
      content.querySelectorAll(".qa.solve").forEach((list)=>list.querySelectorAll(".qa-item").forEach((it,i)=>{ it.dataset.qid=`${v.id}:p${i}`; }));
    }
    content.querySelectorAll(".qa-item[data-qid]").forEach(it=>{ it.id="q-"+it.dataset.qid.split(":")[1]+"-"+it.dataset.qid.split(":")[0]; toolsFor(it); });
    if(v.name==="chapter"){
      const ch=CHBY[v.id], acts=content.querySelector(".chap-head .actions");
      if(acts){ acts.insertAdjacentHTML("beforeend",`<button class="btn ghost" data-sharech>🔗 Share</button><button class="btn ghost" data-fb="error" data-fbref="${v.id}">⚑ Report error</button>`); }
      const wn=content.querySelector(".whatnext");
      if(wn){ wn.insertAdjacentHTML("afterend", ratingCard(v.id) + commentsBlock(ch)); }
      mountComments();
      if(v.q){ const el=content.querySelector(`.qa-item[data-qid="${v.id}:${v.q}"]`); if(el){ setTimeout(()=>{ el.scrollIntoView({behavior:"auto",block:"center"}); el.classList.add("qa-flash"); },80); } }
    }
    if(v.name==="saved"){ const w=content.querySelector(".wrap,.empty"); if(w) w.insertAdjacentHTML("afterend", savedQuestions()); }
    const vs=content.querySelector("[data-visits]");
    if(vs) publicCount(n=>{ if(n){ vs.textContent=`👀 ${n} visits`; vs.hidden=false; } });
    const fv=document.querySelector(".site-foot [data-fvisits]");
    if(fv) publicCount(n=>{ if(n){ fv.textContent=`👀 ${n} visits to DigiClass`; fv.hidden=false; } });
  }
  function savedQuestions(){
    const list=Data.get(K.savedq,[]).filter(x=>CHBY[chOfQ(x.qid)]);
    if(!list.length) return "";
    return `<div class="wrap" style="margin-top:22px"><section class="unit" style="--uc:var(--u3)"><div class="unit-head"><span class="u-tag">🔖</span><h2>Saved questions</h2><span class="u-meta">${list.length}</span></div>
      <div class="unit-list">${list.map(x=>{ const ch=CHBY[chOfQ(x.qid)]; return `<a class="chrow" href="${hashFor({name:"chapter",id:ch.id})}/q/${x.qid.split(":")[1]}" style="--uc:var(--u3)"><span class="chnum" style="font-size:1.1rem">${ch.course.subj.icon}</span><span class="chbody"><span class="chtitle">${esc(x.text||"Question")}</span><span class="chmeta">Class ${ch.course.grade} · ${esc(ch.course.subject)} · ${esc(ch.title)}</span></span><span class="st">${IC.chev}</span></a>`; }).join("")}</div></section></div>`;
  }

  /* ---------- rating ---------- */

/* =====================================================================
   DIGICLASS "MY CLASS" (v8): ClassDojo-style class tracking
   - Students join with FIRST NAME + CLASS only (no email/phone).
   - Activity and feedback are sent to the teacher's own Google Sheet
     through a Google Apps Script web app (URL in DC_CLASS.endpoint).
   - Teacher dashboard (#/teacher) reads it back with a PIN.
   - Points and badges are calculated from the student's real activity.
   ===================================================================== */
const DC_CLASS = {
  // Paste the Google Apps Script "Web app URL" here (ends with /exec):
  endpoint: "https://script.google.com/macros/s/AKfycbzpEpFmRbIbacu4-BgICaT3ZN8TIwOgti8pT76gmNmftQbSbJoErzM86G4ikxHgZEfFcg/exec",
  classes: ["11","12"],
  genders: ["Boy","Girl"]
};

const CLS = (()=>{
  const EP = DC_CLASS.endpoint.trim();
  const K = { me:"dc-me", sent:"dc-sent", pin:"dc-tpin" };
  const me = () => { const m = store.get(K.me, null); if(m && m.cls && /^1[12]\D/.test(m.cls)){ m.cls = m.cls.slice(0,2); store.set(K.me, m); } return m; };
  const on = () => !!(EP && me());
  const day = () => new Date().toISOString().slice(0,10);

  function send(event, data){
    const m = me(); if(!EP || !m) return;
    const body = Object.assign({ kind:"activity", ts:new Date().toISOString(), name:m.name, cls:m.cls, sid:m.sid, g:m.g||"", event }, data||{});
    try{ fetch(EP, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(body) }).catch(()=>{}); }catch(e){}
  }
  function once(key, fn){ const s=store.get(K.sent,{}); if(s[key]) return; s[key]=1; const ks=Object.keys(s); if(ks.length>3000) delete s[ks[0]]; store.set(K.sent,s); fn(); }
  function feedback(item){
    const m = me()||{}; if(!EP) return false;
    const body = Object.assign({ kind:"feedback" }, item, { name:item.name||m.name||"", cls:m.cls||"", sid:m.sid||"", g:m.g||"" });
    try{ fetch(EP, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(body) }).catch(()=>{}); }catch(e){}
    return true;
  }

  /* ---------- points and badges (from real local activity) ---------- */
  function points(){
    const s = DCP.stats(), views = Object.keys(store.get("dc-views",{})).length;
    const pts = views*2 + s.done*10 + s.cor*1 + s.papers*25 + Object.keys(scores).length*5 + Math.min(s.streak,30)*3;
    const perfect = Object.entries(scores).some(([id,v])=>{ const q=quizOf(id); return q && v===q.length; });
    const courseDone = COURSES.some(c=>c.study.length && c.study.every(ch=>done.has(ch.id)));
    const badges = [
      ["👣","First steps","Opened your first chapter", views>=1],
      ["📗","Bookworm","Completed 5 chapters", s.done>=5],
      ["🎯","Quiz starter","Took 3 chapter quizzes", Object.keys(scores).length>=3],
      ["💯","Perfect score","Got every answer right in a quiz", perfect],
      ["🧠","Sharp mind","Answered 50 questions correctly", s.cor>=50],
      ["🔥","On fire","3-day study streak", s.streak>=3],
      ["⚡","Unstoppable","7-day study streak", s.streak>=7],
      ["📝","Exam ready","Finished a mock paper", s.papers>=1],
      ["🏆","Course champion","Completed every chapter of a subject", courseDone]
    ];
    return { pts, badges, s };
  }

  /* ---------- UI: join card, my class panel ---------- */
  function joinCard(where){
    const m = me();
    if(m && m.g) return "";
    const pv = m||{};
    return `<section class="join reveal" aria-label="Join your class">
      <div class="join-t"><span class="join-ic" aria-hidden="true">🏫</span><div><h2>Join your class</h2><p>Tell us your first name, grade and whether you are a boy or girl so your teacher can see your progress and you can earn points and badges.${EP?"":" <em>(Your teacher hasn't connected the class sheet yet: your progress stays on this device.)</em>"}</p></div></div>
      <form class="join-f" data-join>
        <label>First name<input name="name" maxlength="20" required autocomplete="given-name" placeholder="e.g. Aisha" value="${esc(pv.name||"")}"></label>
        <label>Grade<select name="cls" required><option value="">Choose…</option>${DC_CLASS.classes.map(c=>`<option value="${c}" ${pv.cls===c?"selected":""}>Grade ${c}</option>`).join("")}</select></label>
        <label>Boy / Girl<select name="g" required><option value="">Choose…</option>${DC_CLASS.genders.map(c=>`<option ${pv.g===c?"selected":""}>${c}</option>`).join("")}</select></label>

    return `<section class="myclass reveal" aria-label="My class">

        <button class="btn" data-leave title="Change name or class">Change</button></div>
      <div class="mc-badges">${badges.map(b=>`<span class="badge2 ${b[3]?"got":""}" title="${esc(b[2])}"><i aria-hidden="true">${b[0]}</i><b>${esc(b[1])}</b><small>${esc(b[2])}</small></span>`).join("")}</div>
      <p class="mc-note">${got.length} of ${badges.length} badges earned. Earn points by reading chapters (+2), finishing them (+10), quizzes (+5 each, +1 per correct answer), mock papers (+25) and daily streaks (+3 a day).</p>
    </section>`;
  }

  /* ---------- teacher dashboard (live, PIN protected) ---------- */
  let TD = null;   // loaded data
  function teacherLive(){
    if(!EP) return `<section class="tlive"><h2 class="t-h">🏫 My Class (live)</h2>
      <div class="tconn"><b>⚪ Class sheet not connected</b><span>Connect your Google Sheet to see every student who joined, what they studied, their quiz scores and all feedback, in one place.</span><small>Follow the setup steps your developer sent, then paste the Web app URL into DC_CLASS.endpoint.</small></div></section>`;
    if(!TD) return `<section class="tlive"><h2 class="t-h">🏫 My Class (live)</h2>
      <form class="tpin" data-tpin><label>Teacher PIN<input name="pin" type="password" inputmode="numeric" autocomplete="off" value="${esc(store.get(K.pin,""))}" required></label><button class="btn primary" type="submit">Open class data</button><span class="tpin-msg" id="tpinMsg"></span></form></section>`;
    return renderTD();
  }
  const fmtD = s => { const d=new Date(s); return isNaN(d)?"":d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); };
  function renderTD(){
    const fixC = r => (r && r.cls && /^1[12]\D/.test(String(r.cls)) ? Object.assign({}, r, {cls:String(r.cls).slice(0,2)}) : r);
    const A = (TD.activity||[]).map(fixC), F = (TD.feedback||[]).map(fixC);
    const now=Date.now(), dayMs=864e5;
    const studs = {};
    A.forEach(r=>{ const k=(r.sid||r.name+"|"+r.cls); const s=studs[k]||(studs[k]={name:r.name,cls:r.cls,g:"",first:r.ts,last:r.ts,opened:new Set(),done:new Set(),quiz:[],papers:[],days:new Set()});
      if(r.ts<s.first) s.first=r.ts; if(r.ts>s.last) s.last=r.ts; s.days.add(String(r.ts).slice(0,10)); if(r.g) s.g=r.g;
      if(r.event==="open") s.opened.add(r.chapter); if(r.event==="done") s.done.add(r.chapter); if(r.event==="undone") s.done.delete(r.chapter);
      if(r.event==="quiz") s.quiz.push(r); if(r.event==="paper") s.papers.push(r); });
    const list = Object.values(studs).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
    const active = (d)=>list.filter(s=>now-new Date(s.last)<d*dayMs).length;
    const classes=[...new Set(list.map(s=>s.cls))].sort();
    const cf = TD.filter||"";
    const gf = TD.gfilter||"";
    const shown = list.filter(s=>(!cf||s.cls===cf)&&(!gf||s.g===gf));
    const nB=list.filter(s=>s.g==="Boy").length, nG=list.filter(s=>s.g==="Girl").length;
    const qavg = s => { if(!s.quiz.length) return "–"; const p=s.quiz.reduce((n,q)=>n+(+q.score)/(+q.total||1),0)/s.quiz.length; return Math.round(p*100)+"%"; };
    const chOpen={}, chDone={}, chQ={};
    A.forEach(r=>{ if(r.event==="open") (chOpen[r.chapter]=chOpen[r.chapter]||new Set()).add(r.sid||r.name); if(r.event==="done") (chDone[r.chapter]=chDone[r.chapter]||new Set()).add(r.sid||r.name); if(r.event==="quiz"){ const q=chQ[r.chapter]||(chQ[r.chapter]={n:0,p:0}); q.n++; q.p+=(+r.score)/(+r.total||1);} });
    const chRows = Object.keys(chOpen).filter(id=>CHBY[id]).sort((a,b)=>chOpen[b].size-chOpen[a].size).slice(0,12);
    const hardQ = Object.entries(chQ).filter(([id,q])=>CHBY[id]&&q.n>=2).map(([id,q])=>[id,Math.round(q.p/q.n*100),q.n]).sort((a,b)=>a[1]-b[1]).slice(0,6);
    return `<section class="tlive"><div class="tl-head"><h2 class="t-h">🏫 My Class (live)</h2><div class="tl-act"><button class="btn" data-trefresh>↻ Refresh</button><button class="btn" data-tcsv>⬇ Download CSV</button><button class="btn ghost" data-tlock>Lock</button></div></div>
      <div class="pp-grid">
        <div class="pp-tile"><b>${list.length}</b><span>Students joined</span></div>
        <div class="pp-tile"><b>${nB} / ${nG}</b><span>Boys / Girls</span></div>
        <div class="pp-tile"><b>${active(1)}</b><span>Active today</span></div>
        <div class="pp-tile"><b>${active(7)}</b><span>Active this week</span></div>
        <div class="pp-tile"><b>${A.filter(r=>r.event==="done").length}</b><span>Chapters completed</span></div>
        <div class="pp-tile"><b>${A.filter(r=>r.event==="quiz").length}</b><span>Quizzes taken</span></div>
        <div class="pp-tile"><b>${F.length}</b><span>Feedback messages</span></div>
      </div>
      <h3 class="t-h">Students <select class="tfilter" data-tfilter aria-label="Filter by grade"><option value="">All grades</option>${classes.map(c=>`<option value="${esc(c)}" ${c===cf?"selected":""}>Grade ${esc(c)}</option>`).join("")}</select> <select class="tfilter" data-tgfilter aria-label="Filter boys or girls"><option value="">Boys and girls</option>${DC_CLASS.genders.map(c=>`<option ${c===gf?"selected":""}>${c}</option>`).join("")}</select></h3>
      ${shown.length?`<div class="tbl"><table><thead><tr><th>Name</th><th>Grade</th><th>Boy/Girl</th><th>Chapters read</th><th>Completed</th><th>Quizzes</th><th>Avg quiz</th><th>Mock papers</th><th>Days active</th><th>Last seen</th></tr></thead><tbody>${shown.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.cls)}</td><td>${esc(s.g||"–")}</td><td>${s.opened.size}</td><td>${s.done.size}</td><td>${s.quiz.length}</td><td>${qavg(s)}</td><td>${s.papers.length?s.papers.map(p=>`${esc(p.course)} ${p.score}/${p.total}`).join(", "):"–"}</td><td>${s.days.size}</td><td>${fmtD(s.last)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="meta">No students have joined yet. Share the link and ask them to tap <b>Join your class</b> on the home page.</p>`}
      <h3 class="t-h">Most studied chapters</h3>
      ${chRows.length?`<div class="tbl"><table><thead><tr><th>Chapter</th><th>Students who opened</th><th>Completed</th><th>Avg quiz</th></tr></thead><tbody>${chRows.map(id=>`<tr><td>${esc(CHBY[id].title)} <small>(${CHBY[id].course.short} ${CHBY[id].course.grade})</small></td><td>${chOpen[id].size}</td><td>${chDone[id]?chDone[id].size:0}</td><td>${chQ[id]?Math.round(chQ[id].p/chQ[id].n*100)+"%":"–"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="meta">No chapter activity yet.</p>`}
      ${hardQ.length?`<h3 class="t-h">Chapters that need re-teaching (lowest quiz scores)</h3><div class="tbl"><table><thead><tr><th>Chapter</th><th>Avg score</th><th>Attempts</th></tr></thead><tbody>${hardQ.map(([id,p,n])=>`<tr><td>${esc(CHBY[id].title)}</td><td>${p}%</td><td>${n}</td></tr>`).join("")}</tbody></table></div>`:""}
      <h3 class="t-h">Feedback from students</h3>
      ${F.length?`<div class="tbl"><table><thead><tr><th>When</th><th>Student</th><th>Type</th><th>Message</th><th>About</th></tr></thead><tbody>${F.slice().reverse().slice(0,60).map(f=>`<tr><td>${fmtD(f.ts)}</td><td>${esc(f.name||"–")} ${esc(f.cls||"")}</td><td>${esc(f.type||"")}${f.reason?` · ${esc(f.reason)}`:""}</td><td>${esc(f.message||"")}</td><td>${esc(f.ref?(CHBY[String(f.ref).split(":")[0]]||{}).title||f.ref:(f.page||""))}</td></tr>`).join("")}</tbody></table></div>`:`<p class="meta">No feedback yet.</p>`}
      <p class="meta">Everything here comes from your Google Sheet. You can also open the sheet directly to sort, filter or print.</p>
    </section>`;
  }
  function loadTD(pin, cb){
    fetch(`${EP}?action=summary&pin=${encodeURIComponent(pin)}`).then(r=>r.json()).then(j=>{
      if(j.error){ cb(j.error==="pin"?"Wrong PIN.":"Error: "+j.error); return; }
      store.set(K.pin,pin); TD={activity:j.activity||[],feedback:j.feedback||[],filter:TD&&TD.filter||"",gfilter:TD&&TD.gfilter||""}; cb(null);
    }).catch(()=>cb("Couldn't reach the class sheet. Check the Web app URL and that access is set to 'Anyone'."));
  }
  function toCSV(){
    const rows=[["time","name","grade","boy/girl","event","course","chapter","score","total"]].concat((TD.activity||[]).map(r=>[r.ts,r.name,r.cls,r.g||"",r.event,r.course||"",r.chapter||"",r.score??"",r.total??""]));
    const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="digiclass-activity.csv"; a.click();
  }

  /* ---------- hooks into existing features ---------- */
  const _after = DCP.after;
  DCP.after = function(v){
    _after(v);
    if(v.name==="chapter"){ const ch=CHBY[v.id]; once(`open:${v.id}:${day()}`, ()=>send("open",{course:ch.course.id, chapter:v.id})); }
    once(`visit:${day()}`, ()=>send("visit",{page:location.hash||"#/"}));
    const host=$("content");
    if(v.name==="courses"){ const hs=host.querySelector(".hstrip"); if(hs) hs.insertAdjacentHTML("beforebegin", joinCard("home")); }
    if(v.name==="me"){ const pp=host.querySelector(".pp"); if(pp) pp.insertAdjacentHTML("beforebegin", classPanel()); }
    if(v.name==="teacher"){ const w=host.querySelector(".teacher-v .hub-head"); if(w) w.insertAdjacentHTML("afterend", teacherLive()); }
    host.querySelectorAll(".join.reveal,.myclass.reveal,.tlive").forEach(e=>e.classList.add("in"));
    const fbName=document.getElementById("fbName"); if(fbName&&me()&&!fbName.value) fbName.value=me().name+", Grade "+me().cls;
  };
  const _drawQ = drawQ;
  drawQ = function(){ _drawQ(); if(Q && Q.i>=Q.qs.length && !Q.sent){ Q.sent=true; const ch=CHBY[Q.id]; send("quiz",{course:ch.course.id, chapter:Q.id, score:Q.right, total:Q.qs.length}); } };
  document.addEventListener("click",e=>{
    const d=e.target.closest("[data-done]");
    if(d){ const id=d.dataset.done; setTimeout(()=>{ const ch=CHBY[id]; if(ch) send(done.has(id)?"done":"undone",{course:ch.course.id, chapter:id}); },0); }
    const ps=e.target.closest("[data-psubmit]");
    if(ps){ const cid=ps.dataset.psubmit; setTimeout(()=>{ const st=pState(cid); if(st.sub){ const sc=paperScore(cid), tot=flatQs(paperOf(cid)).reduce((n,q)=>n+q.m,0); once(`paper:${cid}:${st.start}`, ()=>send("paper",{course:cid, score:sc.got, total:tot})); } },50); }
    if(e.target.closest("[data-leave]")){ if(confirm("Change your name or class on this device?")){ store.set(K.me,null); rerender(); } }
    if(e.target.closest("[data-trefresh]")){ loadTD(store.get(K.pin,""), err=>{ if(err) toast(err); else { toast("Updated ✓"); rerender(); } }); }
    if(e.target.closest("[data-tcsv]")) toCSV();
    if(e.target.closest("[data-tlock]")){ TD=null; store.set(K.pin,""); rerender(); }
  });
  document.addEventListener("change",e=>{ const f=e.target.closest("[data-tfilter]"); if(f&&TD){ TD.filter=f.value; rerender(); } const gf=e.target.closest("[data-tgfilter]"); if(gf&&TD){ TD.gfilter=gf.value; rerender(); } });
  document.addEventListener("submit",e=>{
    const jf=e.target.closest("[data-join]");
    if(jf){ e.preventDefault(); const name=jf.name.value.trim().split(/\s+/)[0].slice(0,20), cls=jf.cls.value, g=jf.g.value;
      if(!/^[\p{L}][\p{L}'.-]{0,19}$/u.test(name)){ toast("Please enter just your first name (letters only)."); return; }
      if(!cls){ toast("Please choose your grade."); return; }
      if(!g){ toast("Please choose boy or girl."); return; }
      const old=me();
      store.set(K.me,{name:name.charAt(0).toUpperCase()+name.slice(1), cls, g, sid:(old&&old.sid)||Math.random().toString(36).slice(2,10)});
      send("join",{}); toast(`Welcome, ${name}! 🎉`); rerender(); return; }
    const tp=e.target.closest("[data-tpin]");
    if(tp){ e.preventDefault(); const msg=$("tpinMsg"); msg.textContent="Loading…"; loadTD(tp.pin.value.trim(), err=>{ if(err) msg.textContent=err; else rerender(); }); }
  });
  if(EP && store.get(K.pin,"") && location.hash.startsWith("#/teacher")) loadTD(store.get(K.pin,""), err=>{ if(!err) rerender(); });

  return { on, send, feedback, me, points };
})();


/* ---------- chalkboard animation (home page only) ---------- */
(function(){
  const SN = [
    ["Python", 'marks = [78, 92, 85]\navg = sum(marks) / len(marks)\nprint("Average:", avg)', ">>> Average: 85.0"],
    ["SQL", "SELECT Name, Marks\nFROM STUDENT\nWHERE Marks > 90;", "Riya    95\nArjun   92"],
    ["Python", 'for i in range(1, 4):\n    print("*" * i)', "*\n**\n***"],
    ["Pandas", "import pandas as pd\ns = pd.Series([10, 20, 30])\nprint(s.sum())", ">>> 60"]
  ];
  let timer = null, k = 0;
  function show(){
    const el = document.getElementById("chalk"), out = document.getElementById("chalkOut"), lang = document.getElementById("chalkLang");
    if(!el) return;
    const [L, code, res] = SN[k % SN.length];
    lang.textContent = L;
    if(RM){ el.textContent = code; out.textContent = res; out.classList.add("show"); return; }
    let i = 0; el.textContent = ""; out.textContent = ""; out.classList.remove("show");
    const type = () => {
      const e = document.getElementById("chalk"); if(!e) return;
      e.textContent = code.slice(0, ++i);
      if(i < code.length) timer = setTimeout(type, code[i-1] === "\n" ? 260 : 55 + Math.random() * 60);
      else timer = setTimeout(() => { const o = document.getElementById("chalkOut"); if(!o) return; o.textContent = res; o.classList.add("show"); timer = setTimeout(() => { k++; show(); }, 3400); }, 450);
    };
    timer = setTimeout(type, 500);
  }
  const _after = DCP.after;
  DCP.after = function(v){ _after(v); clearTimeout(timer); if(v.name === "courses") show(); };
})();

render(parseHash());

</script>

  var mine=(document.querySelector('meta[name="dc-build"]')||{}).content; if(!mine) return;

    fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
      var m=t.match(/name="dc-build" content="(\d+)"/); if(!m||m[1]===mine) return;
      var key='dc-upd-'+m[1]; try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key,'1'); }catch(e){}
      location.replace(location.pathname+'?v='+m[1]+location.hash);
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
