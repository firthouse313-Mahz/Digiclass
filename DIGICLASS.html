{ id:"revision", unit:1, title:"Python revision tour",
  intro:"The Class 11 Python you must know cold: tokens, data types, operators, control flow and the built-in collections.",
  sec:[["Tokens, variables and data types", [["p", "This chapter revises Class 11 Python, which is still tested in Section A and in output questions. A **token** is the smallest unit of a program: **keywords** (if, for, def, True, None…), **identifiers** (names), **literals** (fixed values), **operators** and **punctuators**."], ["p", "Identifiers may contain letters, digits and `_`, cannot start with a digit, cannot be a keyword and are case-sensitive. `_total`, `Roll2` are valid; `2roll`, `my-name`, `class` are not."], ["table", ["Type", "Examples", "Mutable?"], [["int, float, complex", "5, 2.5, 3+4j", "No"], ["bool", "True, False", "No"], ["str", "'CBSE'", "No"], ["tuple", "(1, 2)", "No"], ["list", "[1, 2]", "**Yes**"], ["dict", "{'a': 1}", "**Yes**"], ["set", "{1, 2}", "**Yes**"], ["None", "None", "No"]]], ["p", "**Mutable** objects (list, dict, set) can be changed in place, keeping the same `id()`. **Immutable** objects create a new object when 'changed'."], ["code", "a = [1, 2]\nprint(id(a))\na.append(3)\nprint(id(a))      # same id: list changed in place\n\nx = 10\nprint(id(x))\nx += 1\nprint(id(x))      # different id: a new int object"]]], ["Operators and precedence", [["table", ["Level (high → low)", "Operators"], [["1", "( )"], ["2", "**  (right to left)"], ["3", "+x  -x  (unary)"], ["4", "*  /  //  %"], ["5", "+  -"], ["6", "<  <=  >  >=  !=  ==  is  in"], ["7", "not"], ["8", "and"], ["9", "or"]]], ["code", "print(2 ** 3 ** 2)            # 512, not 64\nprint(15 // 4 * 2 % 3)        # 3*2=6, 6%3 = 0\nprint(5 > 3 and not 2 == 2)   # True and False → False\nprint(-11 // 3, -11 % 3)      # -4 1  (floor division rounds down)\nprint(3 or 0, 0 and 5)        # 3 0   (and/or return an operand)"], ["p", "`==` compares **values**; `is` compares **identity** (same object). `[1] == [1]` is True but `[1] is [1]` is False."]]], ["Strings, lists, tuples and dictionaries: quick review", [["code", "s = 'COMPUTER'\nprint(s[1:6:2], s[-3:], s[::-1][:3])   # OPT TER RET\nprint(s.lower().count('e'), s.find('P'), s.split('P'))\n# 1 3 ['COM', 'UTER']"], ["code", "L = [10, 20, 30]\nL.insert(1, 15)       # [10, 15, 20, 30]\nL.extend([40, 50])    # [10, 15, 20, 30, 40, 50]\nL.remove(20)          # [10, 15, 30, 40, 50]\nprint(L.pop(), L)     # 50 [10, 15, 30, 40]"], ["code", "t = (5,)          # one-item tuple needs a comma\nprint(type((5)), type((5,)))   # <class 'int'> <class 'tuple'>\n\nd = {'a': 1, 'b': 2}\nd['c'] = 3\nprint(d.get('x', 0), list(d.keys()), d.pop('a'))   # 0 ['a', 'b', 'c'] 1"], ["tip", "Board tip", "Section A always has 2–3 one-mark questions on these: list methods (insert, extend, pop), string slicing with negative steps, `split()`, `dict.get()`, and identifying mutable types."]]], ["Flow of control review", [["code", "for i in range(10, 0, -3):\n    print(i, end=' ')        # 10 7 4 1\n\nn, s = 1234, 0\nwhile n:\n    s = s * 10 + n % 10      # reverse the number\n    n //= 10\nprint(s)                     # 4321"], ["p", "`break` leaves the loop; `continue` jumps to the next iteration; a loop's `else` runs only when the loop ends without `break`."]]]]},

{ id:"functions", unit:1, title:"Functions",
  intro:"Writing reusable blocks of code, passing data in and out, and understanding variable scope.",
  sec:[["What is a function and why use one?", [["p", "A **function** is a named block of code that performs a specific task and runs only when it is **called**. Functions let you write code once and reuse it, break a big program into small parts (**modularity**), and make programs easier to read, test and debug."], ["p", "**Types of functions:**"], ["table", ["Type", "Where it comes from", "Examples"], [["Built-in", "Always available in Python", "len(), print(), input(), max(), type(), int(), round()"], ["Functions in modules", "Need to be imported first", "math.sqrt(), random.randint(), statistics.mean()"], ["User-defined", "Written by you using def", "def area(l, b): ..."]]]]], ["Creating and calling a function", [["code", "def greet(name):            # function header: def + name + parameters + colon\n    '''Prints a greeting'''  # optional docstring\n    print('Hello', name)     # function body (indented)\n\ngreet('Riya')                # function call → Hello Riya"], ["p", "**Parameters** are the variables in the function definition (`name`). **Arguments** are the actual values passed in the call (`'Riya'`). Parameters are also called *formal* parameters; arguments are *actual* parameters."], ["p", "**Flow of execution:** Python reads the `def` statement and stores the function, but doesn't run its body. When the function is called, control jumps to the function, runs its body, then returns to the line after the call."], ["code", "def square(x):          # 1. stored, not run\n    return x * x       # 3. runs during the call\n\nprint('Start')         # 2.\nprint(square(4))       # 3 → 4. prints 16\nprint('End')           # 5."]]], ["Types of arguments", [["p", "**1. Positional arguments**: values are matched to parameters by their **order**."], ["code", "def info(name, age):\n    print(name, 'is', age)\ninfo('Aman', 17)       # Aman is 17\ninfo(17, 'Aman')       # 17 is Aman  (wrong order, wrong meaning)"], ["p", "**2. Default arguments**: a parameter gets a default value used when no argument is given. **Default parameters must come after non-default ones.**"], ["code", "def interest(p, r=5, t=1):\n    return p * r * t / 100\nprint(interest(1000))          # 50.0   (r=5, t=1)\nprint(interest(1000, 8))       # 80.0\nprint(interest(1000, 8, 2))    # 160.0\n\ndef f(a=1, b):                 # SyntaxError: non-default after default"], ["p", "**3. Keyword (named) arguments**: you name the parameter in the call, so the order doesn't matter. Keyword arguments must come **after** positional ones in a call."], ["code", "print(interest(t=3, p=2000))         # 300.0\nprint(interest(1000, t=2))           # 100.0\ninterest(p=1000, 5)                  # SyntaxError: positional after keyword"]]], ["Returning values", [["p", "`return` sends a value back to the caller and ends the function immediately. A function with no `return` (or a bare `return`) returns **None**."], ["code", "def area_perimeter(l, b):\n    return l * b, 2 * (l + b)     # returns a tuple\n\na, p = area_perimeter(5, 3)\nprint(a, p)                       # 15 16\nprint(area_perimeter(2, 2))       # (4, 8)\n\ndef show():\n    print('Hi')\nx = show()      # prints Hi\nprint(x)        # None"], ["p", "A function that returns a value is often called a **fruitful function**; one that doesn't is a **void function**."]]], ["Scope of variables: local and global", [["p", "**Scope** is the part of the program where a variable can be used."], ["ul", ["A **local variable** is created inside a function. It exists only while the function runs and can't be used outside it.", "A **global variable** is created outside all functions (at the top level). It can be **read** anywhere, including inside functions."]], ["p", "Python looks up names using the **LEGB rule**: **L**ocal → **E**nclosing → **G**lobal → **B**uilt-in."], ["code", "x = 10                 # global\ndef show():\n    y = 5              # local\n    print(x, y)        # can read global x → 10 5\nshow()\nprint(y)               # NameError: y is local to show()"], ["p", "If you **assign** to a name inside a function, Python treats it as local. To change a global variable, declare it with the `global` keyword."], ["code", "count = 0\ndef add():\n    count = count + 1      # UnboundLocalError: local 'count' used before assignment\n\ndef add2():\n    global count\n    count = count + 1      # now changes the global\nadd2(); add2()\nprint(count)               # 2"], ["code", "# Board-style: local variable hides the global\nx = 5\ndef f():\n    x = 20\n    print('inside', x)\nf()\nprint('outside', x)\n# inside 20\n# outside 5"]]], ["Passing mutable and immutable objects", [["p", "Python passes a **reference to the object**. If the object is **immutable** (int, str, tuple), the function can't change the caller's value. If it is **mutable** (list, dict), changes made in place **are visible** to the caller."], ["code", "def change(n, L):\n    n = n + 10          # new int object; caller's n unchanged\n    L.append(100)       # same list object; caller sees it\n\na = 5\nnums = [1, 2]\nchange(a, nums)\nprint(a, nums)          # 5 [1, 2, 100]"], ["code", "def reset(L):\n    L = [0, 0]          # rebinding creates a NEW local list\nnums = [1, 2]\nreset(nums)\nprint(nums)             # [1, 2]  (unchanged)"], ["tip", "Exam tip", "In output questions, track each variable in a small table: name, value inside the function, value after the call."]]], ["Board-style function programs", [["code", "def COUNT_VOWELS(S):\n    return sum(1 for ch in S.lower() if ch in 'aeiou')\n\ndef is_prime(n):\n    if n < 2:\n        return False\n    for d in range(2, int(n ** 0.5) + 1):\n        if n % d == 0:\n            return False\n    return True\n\ndef LShift(L, n):            # shift list left by n places\n    n %= len(L)\n    return L[n:] + L[:n]\n\nprint(COUNT_VOWELS('Board Exam'), is_prime(29), LShift([1, 2, 3, 4, 5], 2))\n# 4 True [3, 4, 5, 1, 2]"], ["code", "def INDEX_LIST(L):\n    '''Return the indices of all non-zero elements'''\n    return [i for i in range(len(L)) if L[i] != 0]\n\nprint(INDEX_LIST([12, 4, 0, 11, 0, 56]))     # [0, 1, 3, 5]"]]]]},

{ id:"exceptions", unit:1, title:"Exception handling",
  intro:"Catching runtime errors so a program fails gracefully instead of crashing.",
  sec:[["Errors and exceptions", [["p", "Errors fall into three groups. **Syntax errors** break the grammar of Python and are found before the program runs (missing colon, unbalanced brackets). **Logical errors** produce wrong output without crashing. **Exceptions** (runtime errors) happen while the program is running, when Python meets something it can't do."], ["p", "When an exception occurs and is **not handled**, Python stops the program and prints a **traceback** with the exception name. **Exception handling** lets the program catch the problem, respond sensibly, and keep running."], ["table", ["Exception", "Raised when", "Example"], [["ZeroDivisionError", "Dividing by zero", "10 / 0"], ["ValueError", "Right type but invalid value", "int('abc')"], ["TypeError", "Operation on the wrong type", "'5' + 5"], ["NameError", "Using a name that isn't defined", "print(totl)"], ["IndexError", "Index out of range", "[1, 2][5]"], ["KeyError", "Missing dictionary key", "{'a': 1}['b']"], ["FileNotFoundError", "Opening a file that doesn't exist in 'r' mode", "open('x.txt')"], ["ImportError / ModuleNotFoundError", "Module can't be found", "import mathss"], ["EOFError", "input() or pickle.load() reaches end of file", "reading past the end of a binary file"], ["OverflowError", "Result too large", "math.exp(1000)"]]]]], ["try, except, else and finally", [["code", "try:\n    # code that might fail\n    a = int(input('a: '))\n    b = int(input('b: '))\n    print(a / b)\nexcept ZeroDivisionError:\n    print('Cannot divide by zero')\nexcept ValueError:\n    print('Please enter numbers only')\nelse:\n    print('Division done')           # runs only if NO exception occurred\nfinally:\n    print('Program over')            # ALWAYS runs"], ["table", ["Block", "When it runs"], [["try", "Always attempted first"], ["except", "Only if a matching exception happens in try"], ["else", "Only if try finished **without** an exception"], ["finally", "**Always**, whether or not an exception happened; used for clean-up like closing files"]]], ["p", "You can catch several exceptions in one clause with a tuple, catch any exception with a bare `except:` (put it last), and get the error message with `as`:"], ["code", "try:\n    x = [1, 2, 3][5]\nexcept (IndexError, KeyError) as e:\n    print('Problem:', e)        # Problem: list index out of range\nexcept:\n    print('Some other error')"]]], ["Tracing output with exceptions", [["code", "def div(a, b):\n    try:\n        print('A', end=' ')\n        r = a / b\n        print('B', end=' ')\n    except ZeroDivisionError:\n        print('C', end=' ')\n    else:\n        print('D', end=' ')\n    finally:\n        print('E')\n\ndiv(6, 3)     # A B D E\ndiv(6, 0)     # A C E"], ["tip", "Remember", "The line that raises the exception stops the try block at once. Lines after it in try are skipped."]]], ["Raising exceptions", [["p", "You can raise an exception yourself with `raise` when your program finds invalid data, or check a condition with `assert`."], ["code", "def set_age(age):\n    if age < 0:\n        raise ValueError('Age cannot be negative')\n    return age\n\ntry:\n    set_age(-3)\nexcept ValueError as e:\n    print(e)          # Age cannot be negative\n\nmarks = 120\nassert 0 <= marks <= 100, 'Invalid marks'   # AssertionError: Invalid marks"]]]]},

{ id:"textfiles", unit:1, title:"File handling: text files",
  intro:"Storing data permanently, reading it back, and the file modes and methods asked in every board paper.",
  sec:[["Why files? Types of files", [["p", "Variables live in RAM and vanish when the program ends. A **file** stores data **permanently** on a storage device, so it can be used again later."], ["table", ["Type", "Stores data as", "Readable in a text editor?", "Example"], [["Text file", "Characters, organised in lines ending with the EOL character '\\n'", "Yes", "notes.txt, data.csv, program.py"], ["Binary file", "Raw bytes, exactly as in memory (no translation)", "No (shows junk)", "images, audio, .dat files made with pickle"], ["CSV file", "Text file with values separated by commas, one record per line", "Yes; opens in spreadsheets", "students.csv"]]]]], ["Absolute and relative paths", [["p", "An **absolute path** gives the full location from the root of the drive: `C:\\\\Users\\\\Riya\\\\school\\\\notes.txt`. A **relative path** is relative to the **current working directory** (the folder your program runs in): `notes.txt`, `data/marks.txt`, `../report.txt` (`..` means the parent folder)."], ["p", "In Windows paths, use **double backslashes** or a **raw string** so that `\\n` or `\\t` is not treated as a newline/tab: `open(r'C:\\new\\test.txt')`."]]], ["Opening and closing files; file modes", [["code", "f = open('story.txt', 'r')     # file object = open(file_name, mode)\ndata = f.read()\nf.close()                       # always close to save changes and free the file"], ["table", ["Mode", "Meaning", "If file doesn't exist", "File pointer at", "Existing content"], [["'r'", "Read only (default)", "FileNotFoundError", "Start", "Kept"], ["'r+'", "Read and write", "FileNotFoundError", "Start", "Kept (overwritten where you write)"], ["'w'", "Write only", "Created", "Start", "**Erased**"], ["'w+'", "Write and read", "Created", "Start", "**Erased**"], ["'a'", "Append", "Created", "**End**", "Kept; new data added at the end"], ["'a+'", "Append and read", "Created", "End", "Kept"]]], ["p", "Add `b` for binary mode (rb, wb, ab, rb+…)."], ["p", "**The with statement** closes the file automatically, even if an error occurs. It's the recommended way:"], ["code", "with open('story.txt', 'r') as f:\n    print(f.read())\n# file is closed here automatically"]]], ["Writing to a text file", [["table", ["Method", "What it does"], [["write(str)", "Writes one string; returns the number of characters written. Does **not** add '\\n' automatically"], ["writelines(list)", "Writes every string in a list (or other iterable) one after another; also no automatic '\\n'"]]], ["code", "with open('poem.txt', 'w') as f:\n    f.write('Twinkle twinkle\\n')\n    f.writelines(['little star\\n', 'how I wonder\\n'])\n\nwith open('poem.txt', 'a') as f:      # add more lines without erasing\n    n = int(input('How many lines? '))\n    for i in range(n):\n        f.write(input('Line: ') + '\\n')"], ["tip", "Common mistake", "`f.write(25)` is a TypeError: write() needs a string. Use `f.write(str(25))`."]]], ["Reading from a text file", [["table", ["Method", "Returns"], [["read()", "The whole file as **one string**"], ["read(n)", "The next n characters"], ["readline()", "The next line **including '\\n'**; '' at end of file"], ["readlines()", "A **list** of all lines, each ending with '\\n'"]]], ["code", "# Suppose poem.txt contains:\n# Twinkle twinkle\n# little star\n# how I wonder\n\nwith open('poem.txt') as f:\n    print(f.read(7))          # Twinkle\n    print(f.readline())       # ' twinkle\\n' (rest of line 1)\n    print(f.readlines())      # ['little star\\n', 'how I wonder\\n']"], ["code", "# Reading line by line: the most memory-friendly way\nwith open('poem.txt') as f:\n    for line in f:\n        print(line.strip())   # strip() removes the trailing '\\n'"]]], ["seek() and tell()", [["p", "Python keeps a **file pointer** showing where the next read/write will happen. `tell()` returns its current position (in bytes from the start). `seek(offset, whence)` moves it: whence **0** = from the start (default), **1** = from the current position, **2** = from the end. In **text mode** only `seek(n)` / `seek(n, 0)` and zero offsets like `seek(0, 2)` are allowed; non-zero offsets from the current position or the end need **binary mode**."], ["code", "with open('poem.txt') as f:\n    print(f.tell())      # 0\n    f.read(5)\n    print(f.tell())      # 5\n    f.seek(0)            # back to the beginning\n    print(f.read(3))     # Twi"]]], ["Board-favourite text file programs", [["code", "# 1. Count lines starting with 'T' or 't'\ndef count_T():\n    n = 0\n    with open('story.txt') as f:\n        for line in f:\n            if line[:1].upper() == 'T':\n                n += 1\n    print('Lines starting with T:', n)"], ["code", "# 2. Count occurrences of the words 'is' and 'the' (any case)\ndef count_words():\n    with open('story.txt') as f:\n        words = f.read().lower().split()\n    print('is:', words.count('is'), 'the:', words.count('the'))"], ["code", "# 3. Display words shorter than 4 characters, and the longest word\ndef words_info():\n    with open('story.txt') as f:\n        words = f.read().split()\n    print([w for w in words if len(w) < 4])\n    print('Longest:', max(words, key=len))"], ["code", "# 4. Count uppercase, lowercase, digits, spaces and vowels\ndef char_stats():\n    up = lo = dig = sp = vow = 0\n    with open('story.txt') as f:\n        for ch in f.read():\n            if ch.isupper(): up += 1\n            elif ch.islower(): lo += 1\n            elif ch.isdigit(): dig += 1\n            elif ch == ' ': sp += 1\n            if ch.lower() in 'aeiou': vow += 1\n    print(up, lo, dig, sp, vow)"], ["code", "# 5. Copy lines that do NOT contain 'a' into another file\ndef copy_no_a():\n    with open('story.txt') as src, open('new.txt', 'w') as dst:\n        for line in src:\n            if 'a' not in line.lower():\n                dst.write(line)"], ["code", "# 6. Display each line in reverse word order / with '#' between words\ndef hash_words():\n    with open('story.txt') as f:\n        for line in f:\n            print('#'.join(line.split()))"]]]]},

{ id:"binaryfiles", unit:1, title:"File handling: binary files",
  intro:"Saving Python objects like lists and dictionaries using the pickle module, then searching and updating records.",
  sec:[["What is a binary file?", [["p", "A **binary file** stores data as **bytes**, exactly as it is represented in memory. It is not human-readable, but it can store any Python object (lists, dictionaries, tuples) without converting it to text, and reading it back gives the same object."], ["p", "To store Python objects we use the **pickle** module. **Pickling (serialisation)** converts an object into a byte stream to write to a file. **Unpickling (deserialisation)** converts the byte stream back into the object."], ["table", ["Mode", "Meaning"], [["rb", "Read; file must exist"], ["rb+", "Read and write; file must exist; pointer at start"], ["wb", "Write; creates a new file or erases an existing one"], ["wb+", "Write and read; erases existing content"], ["ab", "Append at the end; creates the file if missing"], ["ab+", "Append and read"]]]]], ["pickle.dump() and pickle.load()", [["code", "import pickle\n\n# dump(object, file_object): write one object\nwith open('data.dat', 'wb') as f:\n    pickle.dump([1, 'Riya', 92.5], f)\n\n# load(file_object): read ONE object; raises EOFError at end of file\nwith open('data.dat', 'rb') as f:\n    rec = pickle.load(f)\n    print(rec)          # [1, 'Riya', 92.5]"], ["p", "Each `dump()` writes one object. To read **all** records written one by one, call `load()` in a loop and stop when **EOFError** is raised."]]], ["Create and append records", [["code", "import pickle\n\ndef write_records():\n    with open('student.dat', 'wb') as f:            # 'ab' to add to existing file\n        while True:\n            roll = int(input('Roll: '))\n            name = input('Name: ')\n            marks = float(input('Marks: '))\n            pickle.dump([roll, name, marks], f)\n            if input('More? (y/n) ').lower() != 'y':\n                break"], ["p", "Records may also be dictionaries, for example `{'roll': 1, 'name': 'Riya', 'marks': 92.5}`. Read the question carefully to see which structure it uses."]]], ["Read and display all records", [["code", "import pickle\n\ndef show_all():\n    try:\n        with open('student.dat', 'rb') as f:\n            while True:\n                rec = pickle.load(f)\n                print(rec)\n    except EOFError:\n        pass                    # reached end of file\n    except FileNotFoundError:\n        print('File not found')"]]], ["Search for records", [["code", "import pickle\n\ndef search(roll_no):\n    found = False\n    with open('student.dat', 'rb') as f:\n        try:\n            while True:\n                rec = pickle.load(f)\n                if rec[0] == roll_no:\n                    print('Found:', rec)\n                    found = True\n        except EOFError:\n            pass\n    if not found:\n        print('No such record')\n\ndef above(m):                       # all students scoring more than m\n    with open('student.dat', 'rb') as f:\n        try:\n            while True:\n                rec = pickle.load(f)\n                if rec[2] > m:\n                    print(rec)\n        except EOFError:\n            pass"]]], ["Update records", [["p", "**Method 1: read all, change, rewrite.** Load every record into a list, modify the matching ones, then write the whole list back with 'wb'. Simple and safe."], ["code", "import pickle\n\ndef update_marks(roll_no, new_marks):\n    recs = []\n    with open('student.dat', 'rb') as f:\n        try:\n            while True:\n                recs.append(pickle.load(f))\n        except EOFError:\n            pass\n    for r in recs:\n        if r[0] == roll_no:\n            r[2] = new_marks\n    with open('student.dat', 'wb') as f:\n        for r in recs:\n            pickle.dump(r, f)"], ["p", "**Method 2: update in place with rb+, tell() and seek().** Remember the position before each load; when the record matches, seek back and dump the changed record. This works when the new record has the **same size** in bytes."], ["code", "def update_inplace(roll_no, new_marks):\n    with open('student.dat', 'rb+') as f:\n        try:\n            while True:\n                pos = f.tell()\n                r = pickle.load(f)\n                if r[0] == roll_no:\n                    r[2] = new_marks\n                    f.seek(pos)\n                    pickle.dump(r, f)\n                    break\n        except EOFError:\n            pass"], ["code", "# Copy selected records to another file (also a common question)\ndef copy_toppers():\n    with open('student.dat', 'rb') as src, open('toppers.dat', 'wb') as dst:\n        try:\n            while True:\n                r = pickle.load(src)\n                if r[2] >= 90:\n                    pickle.dump(r, dst)\n        except EOFError:\n            pass"], ["tip", "Exam tip", "Always write `import pickle`, open in the correct mode (rb / wb / ab / rb+), and handle EOFError. These carry marks even if your logic has a small slip."]]]]},

{ id:"csvfiles", unit:1, title:"File handling: CSV files",
  intro:"Reading and writing tabular data with the csv module.",
  sec:[["What is a CSV file?", [["p", "A **CSV (Comma-Separated Values)** file is a plain text file where each line is one **record** and the values (fields) in it are separated by a **delimiter**, usually a comma. It opens in Excel or Google Sheets, so it's a popular way to move tabular data between programs."], ["code", "Roll,Name,Marks\n1,Riya,92\n2,Arjun,85\n3,Meera,78"], ["p", "Python's built-in **csv** module reads and writes these files correctly, even when a value contains a comma (it is then wrapped in quotes)."]]], ["Writing a CSV file", [["p", "Steps: `import csv` → open the file in 'w' or 'a' mode **with newline=''** → create a writer with `csv.writer(f)` → write rows."], ["table", ["Method", "Writes"], [["writerow(list)", "One row (a list or tuple of values)"], ["writerows(list_of_lists)", "Many rows at once"]]], ["code", "import csv\nwith open('students.csv', 'w', newline='') as f:\n    w = csv.writer(f)                        # delimiter=',' by default\n    w.writerow(['Roll', 'Name', 'Marks'])    # header\n    w.writerows([[1, 'Riya', 92], [2, 'Arjun', 85]])\n\n# Append a record entered by the user\nwith open('students.csv', 'a', newline='') as f:\n    csv.writer(f).writerow([int(input('Roll: ')), input('Name: '), int(input('Marks: '))])"], ["p", "**Why newline=''?** The csv writer adds its own line ending. Without `newline=''`, Python's text mode adds another, giving **blank lines between rows** on Windows."], ["p", "Use a different delimiter with `csv.writer(f, delimiter=';')` or `'\\t'` for tab-separated files."]]], ["Reading a CSV file", [["p", "`csv.reader(f)` returns a reader object; looping over it gives **each row as a list of strings**. Convert numbers with `int()`/`float()` before calculations."], ["code", "import csv\nwith open('students.csv', newline='') as f:\n    r = csv.reader(f)\n    header = next(r)          # skip the header row\n    for row in r:\n        print(row)            # ['1', 'Riya', '92'] …"], ["code", "# Count and display students with marks above 80\ndef toppers():\n    n = 0\n    with open('students.csv', newline='') as f:\n        r = csv.reader(f)\n        next(r)\n        for row in r:\n            if int(row[2]) > 80:\n                print(row[1], row[2])\n                n += 1\n    print('Total:', n)\n\n# Search by name\ndef find(name):\n    with open('students.csv', newline='') as f:\n        for row in csv.reader(f):\n            if row[1].lower() == name.lower():\n                return row\n    return None"], ["tip", "Remember", "Every value read from a CSV file is a **string**. `row[2] > 80` would compare a str with an int and raise a TypeError."]]]]},

{ id:"stack", unit:1, title:"Data structure: stack",
  intro:"A Last In, First Out (LIFO) structure, implemented with a Python list.",
  sec:[["Data structures and the stack", [["p", "A **data structure** is a way of organising data so it can be used efficiently. Lists, tuples and dictionaries are built-in ones; a **stack** is a structure we build using a list."], ["p", "A **stack** is a linear data structure that follows **LIFO: Last In, First Out**. Items are added and removed from **one end only**, called the **top**. Think of a stack of plates: you put a plate on top and take the top plate off first."], ["table", ["Term", "Meaning"], [["Push", "Add an item to the top"], ["Pop", "Remove and return the top item"], ["Peek / top", "Look at the top item without removing it"], ["isEmpty", "Check whether the stack has no items"], ["Overflow", "Trying to push into a full stack (only for fixed-size stacks)"], ["Underflow", "Trying to pop from an **empty** stack"]]], ["p", "**Applications:** undo/redo in editors, the browser back button, reversing a string, checking balanced brackets, function calls in programs (the call stack), and evaluating expressions."]]], ["Implementing a stack with a list", [["p", "Use the **end of the list as the top**: `append()` pushes, `pop()` pops, and `S[-1]` peeks."], ["code", "def push(S, item):\n    S.append(item)\n\ndef pop(S):\n    if S == []:              # or: if not S / if len(S) == 0\n        print('Underflow')\n        return None\n    return S.pop()\n\ndef peek(S):\n    if not S:\n        return None\n    return S[-1]\n\ndef display(S):\n    for item in S[::-1]:     # show from top to bottom\n        print(item)\n\nS = []\npush(S, 10); push(S, 20); push(S, 30)\nprint(pop(S), peek(S))       # 30 20\ndisplay(S)                   # 20 then 10"]]], ["Board-style stack questions", [["code", "# Push names of students who scored above 75 from a list of (name, marks)\ndef push_top(R, S):\n    for name, marks in R:\n        if marks > 75:\n            S.append(name)\n\ndef pop_all(S):\n    while S:\n        print(S.pop(), end=' ')\n    print()\n    print('Stack Empty')\n\nR = [('Asha', 82), ('Ravi', 64), ('Meera', 91)]\nS = []\npush_top(R, S)\npop_all(S)          # Meera Asha  then Stack Empty"], ["code", "# Book records [BookID, Title, Price]: push books costing more than 500\ndef PushBook(BOOKS, S):\n    for b in BOOKS:\n        if b[2] > 500:\n            S.append(b)\n\ndef PopBook(S):\n    if S:\n        return S.pop()\n    print('Underflow')\n\n# Push only even numbers, then pop and display them\ndef push_even(N, S):\n    for x in N:\n        if x % 2 == 0:\n            S.append(x)"], ["code", "# Reverse a string using a stack\ndef reverse(s):\n    S = []\n    for ch in s:\n        S.append(ch)\n    out = ''\n    while S:\n        out += S.pop()\n    return out\nprint(reverse('STACK'))   # KCATS"], ["tip", "Exam tip", "Pop questions almost always need an **underflow check** and a final 'Stack Empty' message. Losing that is the most common way students drop marks."]]]]},

{ id:"networks", unit:2, title:"Computer networks",
  intro:"Network evolution, transmission media, devices, topologies and network types.",
  sec:[["Evolution of networking", [["p", "A **computer network** is two or more devices connected so they can share data and resources (files, printers, internet)."], ["table", ["Year", "Network", "Importance"], [["1969", "**ARPANET** (Advanced Research Projects Agency Network), USA", "First network to use packet switching; connected universities and research labs; the ancestor of the internet"], ["1980s", "**NSFNET** (National Science Foundation Network)", "Built a faster backbone for academic research; allowed many more organisations to connect"], ["1990s → now", "**Internet**", "A global 'network of networks' using TCP/IP; opened to the public and businesses; the World Wide Web (1991) made it popular"]]]]], ["Data communication terminologies", [["p", "**Data communication** is the exchange of data between two devices through a transmission medium. Its five **components** are:"], ["ul", ["**Sender**: the device that sends the message (computer, phone).", "**Receiver**: the device that receives it.", "**Message**: the data being sent: text, image, audio, video.", "**Communication medium**: the path the message travels through: cable or wireless.", "**Protocol**: the set of rules both sides agree on so they can understand each other."]], ["p", "**Measuring capacity:**"], ["ul", ["**Bandwidth**: the range of frequencies a channel can carry, measured in **Hertz (Hz)**: kHz, MHz, GHz. Higher bandwidth means more data can be carried.", "**Data transfer rate**: the amount of data transferred per second, measured in **bits per second (bps)**: Kbps, Mbps, Gbps. 1 Kbps = 1024 bps."]], ["p", "An **IP address** is a unique number that identifies each device on a network. **IPv4** is 32 bits written as four numbers 0–255, such as `192.168.1.10`. **IPv6** is 128 bits written in hexadecimal, such as `2001:0db8:85a3::8a2e:0370:7334`, created because IPv4 addresses were running out. A **MAC address** is the 48-bit physical address burnt into the network card, such as `00:1A:2B:3C:4D:5E`."]]], ["Switching techniques", [["table", ["Circuit switching", "Packet switching"], [["A dedicated path is set up between sender and receiver **before** data is sent", "No dedicated path; data is broken into small **packets**"], ["Path stays reserved for the whole session, even when idle", "Each packet may travel by a different route and is reassembled at the destination"], ["Data arrives in order; reliable for continuous communication", "Packets can arrive out of order; they carry sequence numbers"], ["Wasteful when no data is flowing", "Efficient use of the network"], ["Example: traditional telephone calls", "Example: the internet, email, web browsing"]]]]], ["Transmission media", [["p", "**Wired (guided) media:**"], ["table", ["Medium", "Description", "Pros", "Cons"], [["Twisted pair cable", "Pairs of insulated copper wires twisted together to reduce interference; UTP and STP types; uses RJ45 connectors", "Cheap, easy to install, flexible", "Short range (~100 m), affected by noise"], ["Coaxial cable", "A central copper conductor with insulation, metal shield and outer jacket; used for cable TV", "Better shielding and higher bandwidth than twisted pair", "Bulkier, costlier"], ["Optical fibre", "Carries data as **light pulses** through thin glass/plastic fibres", "Very high speed and bandwidth, long distances, immune to electrical interference, secure", "Expensive, fragile, hard to install and join"]]], ["p", "**Wireless (unguided) media:**"], ["table", ["Medium", "Description", "Uses"], [["Radio waves", "Travel in all directions (omnidirectional), can pass through walls", "Wi-Fi, FM radio, mobile phones, Bluetooth"], ["Microwaves", "Travel in straight lines (**line of sight**); need towers or satellites", "Long-distance telephone links, satellite communication, mobile networks"], ["Infrared", "Very short range, line of sight, can't pass through walls", "TV remotes, some short-range device links"]]]]], ["Network devices", [["table", ["Device", "What it does"], [["Modem", "**Mo**dulator-**dem**odulator: converts digital signals from a computer into analog signals for telephone/cable lines and back again"], ["Ethernet card (NIC)", "Network Interface Card: connects a computer to a wired network; has a unique MAC address"], ["RJ45 connector", "8-pin plug used at the end of Ethernet (twisted pair) cables"], ["Repeater", "Regenerates and amplifies weak signals so they can travel further (needed when cable length exceeds ~100 m)"], ["Hub", "Connects several devices; **broadcasts** incoming data to every port (not intelligent, causes traffic)"], ["Switch", "Connects devices in a LAN; sends data only to the **intended device** using MAC addresses (intelligent, efficient)"], ["Router", "Connects **different networks** (for example, a LAN to the internet) and chooses the best path for packets using IP addresses"], ["Gateway", "Connects networks that use **different protocols**; acts as the entry/exit point of a network and often includes firewall functions"], ["Wi-Fi card", "Wireless network adapter that lets a device join a Wi-Fi network"]]], ["tip", "Exam tip", "Hub = broadcasts to all; switch = sends to the right device; router = connects different networks; gateway = connects networks with different protocols."]]], ["Topologies and network types", [["p", "**Topology** is the physical or logical arrangement of devices in a network."], ["table", ["Topology", "Layout", "Advantages", "Disadvantages"], [["Bus", "All devices share one main cable (backbone) with terminators at both ends", "Cheap, uses the least cable, easy to add devices", "If the backbone fails the whole network fails; hard to find faults; slows down with many devices"], ["Star", "Every device connects to a central hub/switch", "Easy to install and manage; one cable failure affects only one device; easy to find faults", "Needs more cable; if the central device fails the whole network stops"], ["Tree", "Star networks connected to a bus backbone in a hierarchy", "Easy to expand; suits large organisations with departments", "If the backbone fails, segments are cut off; more cabling"]]], ["p", "**Types of network by area:**"], ["table", ["Type", "Coverage", "Example"], [["PAN (Personal Area Network)", "About 10 m around a person", "Phone connected to earbuds or a smartwatch by Bluetooth"], ["LAN (Local Area Network)", "A room, building or campus (up to ~1 km)", "School computer lab, office network"], ["MAN (Metropolitan Area Network)", "A city (up to ~100 km)", "Cable TV network, a city-wide bank network"], ["WAN (Wide Area Network)", "Countries and continents", "The internet, a company's offices across countries"]]]]], ["Case-study questions: how to answer", [["p", "A 5-mark case study describes a campus with several blocks, the number of computers in each, and distances between them. Answer each part like this:"], ["ul", ["**Server location**: the block with the **most computers** (most traffic stays local; the 80–20 rule).", "**Cable layout**: draw a **star** from the server block to every other block (or the shortest total cable length if asked).", "**Repeater**: wherever a cable run is **longer than about 100 m**.", "**Hub/switch**: in **every block**, to connect the computers inside it.", "**Best wired medium** between buildings on the same campus: optical fibre for long or high-speed links, twisted pair for short runs.", "**Connecting to a distant office**: the network becomes a **WAN**; suggest the internet, leased lines or satellite links.", "**Video conferencing / calls over the internet**: VoIP; **protection from outside attacks**: a firewall."]]]]]},

{ id:"protocols", unit:2, title:"Network protocols and web services",
  intro:"The rules computers follow to communicate, and the basic vocabulary of the web.",
  sec:[["What is a protocol?", [["p", "A **network protocol** is a set of rules that defines how data is formatted, sent, received and acknowledged. Devices from different companies can communicate only because they follow the same protocols."], ["table", ["Protocol", "Full form", "Used for"], [["HTTP", "HyperText Transfer Protocol", "Transferring web pages from a web server to a browser"], ["HTTPS", "HTTP Secure", "HTTP with **encryption** (SSL/TLS); used for banking, shopping, logins; shows a padlock in the browser"], ["FTP", "File Transfer Protocol", "Uploading and downloading files between computers"], ["SMTP", "Simple Mail Transfer Protocol", "**Sending** email from a client to a mail server and between servers"], ["POP3", "Post Office Protocol version 3", "**Receiving** email: downloads messages to the device and usually deletes them from the server"], ["IMAP", "Internet Message Access Protocol", "Receiving email while keeping it on the server, synced across devices"], ["TCP/IP", "Transmission Control Protocol / Internet Protocol", "The core rules of the internet: IP addresses and routes packets; TCP breaks data into packets, ensures they all arrive, and reassembles them in order"], ["PPP", "Point-to-Point Protocol", "Direct connection between two devices, such as a computer and an ISP over a phone line"], ["TELNET", "Teletype Network", "Logging in to a remote computer and running commands (text-based, not encrypted; SSH is the secure replacement)"], ["VoIP", "Voice over Internet Protocol", "Making voice and video calls over the internet: WhatsApp calls, Zoom, Skype"]]]]], ["Introduction to web services", [["p", "**WWW (World Wide Web)**: a system of interlinked documents and resources (web pages) accessed over the internet using browsers. It was invented by **Tim Berners-Lee** in 1989–91. The internet is the network; the web is one service running on it (others are email, FTP and VoIP)."], ["p", "**HTML (HyperText Markup Language)**: the language used to create web pages. It uses predefined **tags** like `<h1>`, `<p>`, `<a>` to describe the **structure and display** of content."], ["p", "**XML (eXtensible Markup Language)**: a markup language for **storing and transporting data**. Tags are **user-defined** (such as `<student><name>Riya</name></student>`), and the focus is on what the data *is*, not how it looks."], ["table", ["HTML", "XML"], [["Displays data", "Stores and carries data"], ["Predefined tags", "User-defined tags"], ["Not case-sensitive", "Case-sensitive"], ["Some closing tags optional", "Every tag must be closed"]]], ["p", "**Domain name**: the human-friendly name of a website, such as `cbse.gov.in`. **DNS (Domain Name System)** translates domain names into IP addresses. The last part (`.com`, `.org`, `.in`, `.gov`) is the **top-level domain**."], ["p", "**URL (Uniform Resource Locator)**: the full address of a resource on the web. In `https://www.example.com/notes/sql.html`: `https` is the protocol, `www.example.com` is the domain name, and `/notes/sql.html` is the path to the file."], ["p", "**Website**: a collection of related web pages under one domain. **Web page**: a single document. **Web browser**: software that fetches and displays web pages (Chrome, Firefox, Edge, Safari). **Web server**: a computer/software that stores websites and sends pages when browsers request them (Apache, Nginx). **Web hosting**: a service that stores your website on a web server so it is available on the internet 24×7."]]]]},

{ id:"dbconcepts", unit:3, title:"Database concepts and the relational model",
  intro:"Why databases are used, and the vocabulary of tables, rows, columns and keys.",
  sec:[["Why do we need a database?", [["p", "Storing data in separate files (the **file system**) causes problems: the same data repeated in many files (**data redundancy**), copies that don't match (**data inconsistency**), difficulty searching and sharing data, and poor security."], ["p", "A **database** is an organised collection of related data. A **DBMS (Database Management System)** is software to create, store, retrieve and manage that data: MySQL, Oracle, MS Access, PostgreSQL, SQLite."], ["ul", ["Reduces redundancy and inconsistency", "Allows many users to share data at the same time", "Provides security with user permissions", "Makes searching and reporting easy with queries", "Supports backup and recovery"]]]], ["The relational data model", [["p", "In the **relational model**, data is stored in **tables** called **relations**."], ["code", "Table: STUDENT\n+--------+--------+-------+-------+\n| RollNo | Name   | Class | Marks |\n+--------+--------+-------+-------+\n|    101 | Riya   | 12A   |    92 |\n|    102 | Arjun  | 12B   |    85 |\n|    103 | Meera  | 12A   |    78 |\n+--------+--------+-------+-------+"], ["table", ["Term", "Meaning", "In the STUDENT table"], [["Relation", "A table", "STUDENT"], ["Attribute", "A column (field)", "RollNo, Name, Class, Marks"], ["Tuple", "A row (record)", "(101, 'Riya', '12A', 92)"], ["Domain", "The set of allowed values for an attribute", "Marks: 0–100; Class: valid sections"], ["Degree", "**Number of attributes (columns)**", "4"], ["Cardinality", "**Number of tuples (rows)**", "3"]]], ["tip", "Memory trick", "**D**egree goes **D**own the top (columns across the header); **C**ardinality **C**ounts rows. When two tables are combined by a Cartesian product, degrees **add** and cardinalities **multiply**."]]], ["Keys", [["table", ["Key", "Meaning", "Example"], [["Candidate key", "Any attribute (or set of attributes) that can uniquely identify each row", "RollNo, AadhaarNo, Email"], ["Primary key", "The candidate key **chosen** to identify rows; must be unique and **NOT NULL**; only one per table", "RollNo"], ["Alternate key", "Candidate keys **not chosen** as the primary key", "AadhaarNo, Email"], ["Foreign key", "An attribute in one table that refers to the **primary key of another table**; links tables and keeps data consistent (referential integrity)", "StudentID in RESULT refers to RollNo in STUDENT"]]], ["code", "STUDENT(RollNo PK, Name, Class)\nRESULT(ExamID, RollNo FK → STUDENT.RollNo, Subject, Marks)\n\nA RESULT row can only use a RollNo that already exists in STUDENT."], ["p", "A **composite key** is a primary key made of two or more columns, such as (RollNo, Subject) in a marks table."]]]]},

{ id:"sql", unit:3, title:"Structured Query Language (SQL)",
  intro:"Creating tables and querying them in MySQL: the commands and functions in the syllabus.",
  sec:[["SQL, DDL and DML", [["p", "**SQL (Structured Query Language)** is the standard language for working with relational databases. **MySQL** is a popular free, open-source RDBMS that uses SQL. SQL keywords are **not case-sensitive**, but values inside quotes are compared as stored; every statement ends with a semicolon."], ["table", ["Category", "Purpose", "Commands"], [["DDL (Data Definition Language)", "Define or change the **structure** of the database", "CREATE, ALTER, DROP"], ["DML (Data Manipulation Language)", "Work with the **data** in tables", "INSERT, UPDATE, DELETE, SELECT"]]]]], ["Data types and constraints", [["table", ["Data type", "Stores", "Notes"], [["CHAR(n)", "Fixed-length text of n characters", "Shorter values are padded with spaces; fast for fixed sizes like PIN codes"], ["VARCHAR(n)", "Variable-length text, up to n characters", "Uses only as much space as needed; best for names"], ["INT", "Whole numbers", ""], ["FLOAT", "Numbers with decimals", ""], ["DATE", "Dates in 'YYYY-MM-DD' format", "'2026-03-15'"]]], ["p", "**Constraints** are rules applied to columns:"], ["table", ["Constraint", "Meaning"], [["NOT NULL", "The column must always have a value"], ["UNIQUE", "No two rows may have the same value (NULLs are allowed)"], ["PRIMARY KEY", "Unique **and** not null; identifies each row; one per table"]]]]], ["Database and table commands (DDL)", [["code", "CREATE DATABASE school;\nSHOW DATABASES;\nUSE school;\nSHOW TABLES;\n\nCREATE TABLE STUDENT (\n    RollNo INT PRIMARY KEY,\n    Name   VARCHAR(30) NOT NULL,\n    Class  CHAR(3),\n    Marks  FLOAT,\n    DOB    DATE,\n    Email  VARCHAR(40) UNIQUE\n);\nDESCRIBE STUDENT;          -- or DESC STUDENT: shows the structure"], ["code", "ALTER TABLE STUDENT ADD City VARCHAR(20);        -- add a column\nALTER TABLE STUDENT DROP City;                   -- remove a column\nALTER TABLE STUDENT DROP PRIMARY KEY;            -- remove the primary key\nALTER TABLE STUDENT ADD PRIMARY KEY (RollNo);    -- add a primary key\nDROP TABLE STUDENT;                              -- delete the table and its structure\nDROP DATABASE school;                            -- delete the whole database"]]], ["Inserting, updating and deleting rows (DML)", [["code", "INSERT INTO STUDENT VALUES (101, 'Riya', '12A', 92, '2008-05-14', 'riya@x.com');\nINSERT INTO STUDENT (RollNo, Name, Marks) VALUES (102, 'Arjun', 85);  -- other columns get NULL\n\nUPDATE STUDENT SET Marks = Marks + 5 WHERE Class = '12A';\nUPDATE STUDENT SET Class = '12C', Marks = 80 WHERE RollNo = 102;\n\nDELETE FROM STUDENT WHERE Marks < 33;\nDELETE FROM STUDENT;        -- deletes ALL rows; the table structure remains"], ["tip", "Danger", "UPDATE or DELETE **without WHERE** affects every row. In the exam, always check whether a WHERE clause is needed."]]], ["SELECT queries", [["code", "SELECT * FROM STUDENT;                          -- all columns\nSELECT Name, Marks FROM STUDENT;                -- chosen columns\nSELECT Name, Marks * 0.7 AS Weighted FROM STUDENT;  -- arithmetic + alias\nSELECT DISTINCT Class FROM STUDENT;             -- remove duplicate values"], ["p", "**Operators in WHERE:** mathematical (+ − * / %), relational (= <> != > < >= <=) and logical (AND, OR, NOT)."], ["code", "SELECT * FROM STUDENT WHERE Class = '12A' AND Marks >= 80;\nSELECT * FROM STUDENT WHERE Class IN ('12A', '12B');\nSELECT * FROM STUDENT WHERE Marks BETWEEN 60 AND 80;   -- 60 and 80 INCLUDED\nSELECT * FROM STUDENT WHERE Marks NOT BETWEEN 60 AND 80;\nSELECT * FROM STUDENT ORDER BY Marks DESC, Name ASC;   -- ASC is default"], ["p", "**NULL** means 'no value / unknown'. It is **not** zero or an empty string. Comparisons with `= NULL` never match; use **IS NULL** or **IS NOT NULL**."], ["code", "SELECT Name FROM STUDENT WHERE Email IS NULL;\nSELECT Name FROM STUDENT WHERE Email IS NOT NULL;"], ["p", "**LIKE** matches patterns: `%` = any number of characters (including none), `_` = exactly one character."], ["table", ["Pattern", "Matches"], [["'A%'", "Starts with A"], ["'%a'", "Ends with a"], ["'%an%'", "Contains 'an'"], ["'_r%'", "Second letter is r"], ["'____'", "Exactly 4 characters"]]], ["code", "SELECT Name FROM STUDENT WHERE Name LIKE 'M%';\nSELECT Name FROM STUDENT WHERE Name LIKE '_r%';"]]], ["Aggregate functions, GROUP BY and HAVING", [["table", ["Function", "Returns", "Ignores NULL?"], [["COUNT(*)", "Number of rows", "Counts all rows"], ["COUNT(col)", "Number of non-NULL values in col", "Yes"], ["SUM(col)", "Total", "Yes"], ["AVG(col)", "Average", "Yes"], ["MAX(col) / MIN(col)", "Largest / smallest", "Yes"]]], ["code", "SELECT COUNT(*), AVG(Marks), MAX(Marks) FROM STUDENT;\nSELECT COUNT(DISTINCT Class) FROM STUDENT;"], ["p", "**GROUP BY** puts rows with the same value into groups so an aggregate is calculated **for each group**. **HAVING** filters **groups** (it can use aggregates); **WHERE** filters rows **before** grouping (it can't use aggregates)."], ["code", "SELECT Class, COUNT(*), AVG(Marks)\nFROM STUDENT\nWHERE Marks > 40\nGROUP BY Class\nHAVING COUNT(*) >= 2\nORDER BY AVG(Marks) DESC;"], ["p", "**Order of clauses:** SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY. (Remember: **S**ome **F**riends **W**ill **G**ive **H**elp **O**ften.)"]]], ["Joins: working with two tables", [["code", "EMP(EmpID, Name, DeptID)          DEPT(DeptID, DName)\n1, Asha, 10                        10, Sales\n2, Ravi, 20                        20, IT\n3, John, 10                        30, HR"], ["p", "**Cartesian product (cross join)**: every row of the first table combined with every row of the second. Degree = 3 + 2 = 5 columns; cardinality = 3 × 3 = 9 rows."], ["code", "SELECT * FROM EMP, DEPT;              -- 9 rows"], ["p", "**Equi-join**: a join with an equality condition on the common column. The common column appears **twice** in `SELECT *`. Use `table.column` to avoid ambiguity, or table aliases."], ["code", "SELECT Name, DName FROM EMP, DEPT WHERE EMP.DeptID = DEPT.DeptID;\nSELECT E.Name, D.DName FROM EMP E, DEPT D WHERE E.DeptID = D.DeptID AND D.DName = 'Sales';\n-- Asha Sales, John Sales"], ["p", "**Natural join**: joins on columns with the same name automatically and shows the common column **only once**."], ["code", "SELECT * FROM EMP NATURAL JOIN DEPT;   -- columns: DeptID, EmpID, Name, DName"]]]]},

{ id:"connectivity", unit:3, title:"Interface of Python with MySQL",
  intro:"Running SQL from a Python program using mysql.connector.",
  sec:[["Why connect Python with MySQL?", [["p", "Real applications (school portals, shop billing, library systems) use Python for the user interface and logic, and MySQL to store the data. Python talks to MySQL through the **mysql.connector** library (install with `pip install mysql-connector-python`)."], ["p", "**Steps:** (1) import the library → (2) open a connection with `connect()` → (3) create a cursor → (4) execute queries → (5) `commit()` changes (for INSERT/UPDATE/DELETE) or fetch results (for SELECT) → (6) close the connection."]]], ["Key functions", [["table", ["Function / attribute", "What it does"], [["mysql.connector.connect(host, user, passwd, database)", "Opens a connection and returns a connection object"], ["con.is_connected()", "True if the connection worked"], ["con.cursor()", "Creates a cursor object used to run queries and hold results"], ["cur.execute(query)", "Runs one SQL statement"], ["con.commit()", "Saves changes made by INSERT, UPDATE, DELETE permanently"], ["cur.fetchone()", "Returns the next row as a **tuple**, or None if no rows are left"], ["cur.fetchall()", "Returns all remaining rows as a **list of tuples**"], ["cur.fetchmany(n)", "Returns the next n rows as a list"], ["cur.rowcount", "Number of rows fetched so far, or affected by the last INSERT/UPDATE/DELETE"], ["con.close()", "Closes the connection"]]]]], ["Inserting, updating and deleting", [["code", "import mysql.connector as m\ncon = m.connect(host='localhost', user='root', passwd='tiger', database='school')\ncur = con.cursor()\n\nroll = int(input('Roll: '))\nname = input('Name: ')\nmarks = float(input('Marks: '))\n\n# %s placeholders: values are passed separately as a tuple\nq = 'INSERT INTO STUDENT (RollNo, Name, Marks) VALUES (%s, %s, %s)'\ncur.execute(q, (roll, name, marks))\ncon.commit()\nprint(cur.rowcount, 'record inserted')\ncon.close()"], ["code", "# format() style, often seen in CBSE papers\nq = \"UPDATE STUDENT SET Marks = {} WHERE RollNo = {}\".format(95, 101)\ncur.execute(q)\ncon.commit()\n\ncur.execute(\"DELETE FROM STUDENT WHERE Marks < {}\".format(33))\ncon.commit()\nprint(cur.rowcount, 'rows deleted')"], ["tip", "Don't forget", "Without `con.commit()`, INSERT/UPDATE/DELETE changes are **lost** when the connection closes. SELECT queries don't need commit."]]], ["Reading records", [["code", "import mysql.connector as m\ncon = m.connect(host='localhost', user='root', passwd='tiger', database='school')\ncur = con.cursor()\ncur.execute('SELECT * FROM STUDENT WHERE Marks > 80')\n\nrows = cur.fetchall()        # list of tuples\nfor r in rows:\n    print(r[0], r[1], r[2])\nprint('Total:', cur.rowcount)\ncon.close()"], ["code", "cur.execute('SELECT Name, Marks FROM STUDENT ORDER BY Marks DESC')\ntop = cur.fetchone()           # first row only, e.g. ('Riya', 92.0)\nnext_two = cur.fetchmany(2)    # the following two rows\nprint(top, next_two, cur.rowcount)   # rowcount = 3 rows fetched so far"], ["p", "**A complete menu-driven program** (a common 5-mark question) combines these: show a menu (1. Add 2. Display 3. Search 4. Update 5. Delete 6. Exit) in a `while True` loop and call the matching query for each choice."]]]]}
],
