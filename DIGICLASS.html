@keyframes bob{50%{transform:translate(-50%,-56%)}}
.planet{position:absolute;width:31%;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;padding:0;transform:translate(-50%,-50%);animation:float 6s ease-in-out infinite}
.planet>span{width:clamp(60px,9vw,86px);aspect-ratio:1;border-radius:28%;display:grid;place-items:center;font-size:clamp(1.8rem,3.4vw,2.5rem);background:var(--sg);box-shadow:0 18px 36px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .25s}
.planet .sn{display:none}
.planet small{font-weight:800;font-size:.8rem;background:rgba(10,15,46,.65);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(6px)}
.planet:hover>span{transform:scale(1.1) rotate(-6deg)}
.planet.p0{left:50%;top:7%}
.planet.p1{left:93%;top:50%;animation-delay:-1.5s}
.planet.p2{left:50%;top:93%;animation-delay:-3s}
.planet.p3{left:7%;top:50%;animation-delay:-4.5s}
.planet.p4{left:82%;top:15%;animation-delay:-2s}
.planet.p5{left:18%;top:85%;animation-delay:-3.5s}
@keyframes float{50%{margin-top:-8px}}
/* continue */
.continue{display:flex;align-items:center;gap:16px;width:100%;margin:22px 0 0;text-align:left;padding:16px 18px;border-radius:22px;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--sg) border-box;border:2px solid transparent;transition:transform .2s,box-shadow .2s}
.continue:hover{transform:translateY(-3px);box-shadow:0 20px 40px -24px rgba(61,123,255,.8)}
.cont-icon{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:1.7rem;background:var(--sg);flex:0 0 auto}
.cont-txt{flex:1;min-width:0}
.cont-txt small{display:block;font-weight:800;font-size:.78rem;color:var(--muted);text-transform:none}
.cont-txt b{display:block;font:800 1.2rem "Source Sans 3",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-txt span{color:var(--soft);font-size:.88rem;font-weight:600}
.cont-go{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:0 0 auto}
.cont-go svg{width:20px;height:20px}
/* section step headers */
.step-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.step-n{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font:800 1.25rem "Source Sans 3",sans-serif;background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px rgba(139,92,246,.8)}
.step-head .sec-sub{margin-bottom:0}
/* subject tiles */
.stiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s;color:var(--ink)}
.stile::before{content:"";position:absolute;left:0;right:0;top:0;height:110px;background:var(--sg);opacity:.16;pointer-events:none}
.stile:hover{transform:translateY(-5px);box-shadow:0 30px 50px -28px rgba(0,0,0,.7);border-color:var(--line2)}
.stile.pulse{box-shadow:0 0 0 3px var(--cyan),0 30px 50px -28px rgba(0,0,0,.7)}
.stile-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.stile-icon{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:2.2rem;background:var(--sg);box-shadow:0 16px 30px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s}
.stile:hover .stile-icon{transform:rotate(-6deg) scale(1.06)}
.stile-code{font:700 .76rem "Source Code Pro",monospace;color:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:3px 8px;background:var(--surface)}
.stile h3{font-size:1.55rem;margin:6px 0 0;line-height:1.1}
.stile>p{color:var(--soft);margin:0 0 6px;font-size:.95rem}
.stile .bar{margin-top:6px}
.stile-classes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.cbtn{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;column-gap:10px;text-align:left;background:var(--surface2);border:1.5px solid var(--line2);border-radius:18px;padding:14px 14px 12px;transition:all .2s}
.cbtn:hover{border-color:transparent;background:linear-gradient(var(--surface2),var(--surface2)) padding-box,var(--sg) border-box;transform:translateY(-2px)}
.cbtn-g{font:800 1.2rem "Source Sans 3",sans-serif;grid-column:1}
.cbtn-m{grid-column:1;font-size:.8rem;color:var(--muted);font-weight:700}
.cbtn-bar{grid-column:1/-1;height:5px;border-radius:9px;background:var(--raise);overflow:hidden;margin-top:8px}
.cbtn-bar i{display:block;height:100%;width:0;background:var(--sg);transition:width 1s}
.cbtn-go{grid-column:2;grid-row:1/3;align-self:center;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sg);color:#fff;transition:transform .2s}
.cbtn-go svg{width:18px;height:18px}
.cbtn:hover .cbtn-go{transform:translateX(3px)}
/* learning loop */
.loop{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:lp}
.loop li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:4px}
.loop li:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-weight:800;z-index:1;font-size:.9rem}
.lp-i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--pc);color:#0B1030;margin-bottom:8px}
.lp-i svg{width:22px;height:22px}
.loop b{font:800 1.2rem "Source Sans 3",sans-serif;color:var(--pc)}
.loop span:last-child{color:var(--soft);font-size:.94rem}
/* course page */
.course-hero{border-radius:28px}
.ch-top{display:flex;gap:16px;align-items:center}
.ch-top .ch-icon{margin:0;width:70px;height:70px;font-size:2.1rem;border-radius:22px;flex:0 0 auto}
.course-hero h1{margin:0}
.course-hero .actions{margin-top:18px}
.course-hero .mini{margin-top:18px;max-width:420px}
/* units & chapter rows */
.unit{padding:10px}
.unit-head{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;padding:10px 10px 12px}
.unit-head h2{font-size:1.2rem}
.unit-head h2::before{display:none}
.unit-head .u-tag{font:800 .74rem "Source Sans 3",sans-serif;color:#0B1030;background:var(--uc);border-radius:8px;padding:4px 9px}
.u-meta{margin-left:auto;color:var(--muted);font-size:.84rem;font-weight:700}
.unit-list{display:flex;flex-direction:column;gap:6px}
.chrow{grid-template-columns:48px minmax(0,1fr) 36px;background:var(--surface2);border:1px solid var(--line)}
.chrow:hover{transform:translateY(-2px);border-color:var(--uc);background:var(--surface2)}
.chnum{width:46px;height:46px;font-size:1.1rem}
.chbody{min-width:0}
.chtitle{font-size:1.04rem}
.chtitle em{font-style:normal;font-size:.78rem;font-weight:800;color:var(--muted);margin-right:4px}
.chmeta{font-weight:600}
.st{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--raise);color:var(--muted);transition:all .2s}
.st svg{width:17px;height:17px}
.st.done{background:var(--ok);color:#0B1030}
.chrow:hover .st:not(.done){background:var(--uc);color:#0B1030}
.qgo{font-size:.8rem;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--uc);color:#0B1030;white-space:nowrap}
.qgo.ace{background:var(--ok)}
.chrow:has(.qgo){grid-template-columns:48px minmax(0,1fr) auto}
/* practice */
.picker{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 12px}
@media (max-width:640px){.picker{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:4px 14px 12px}}
.picker::-webkit-scrollbar{display:none}
.picker button{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:8px 16px 8px 10px;font-weight:700;font-size:.92rem;color:var(--soft);transition:all .15s}
.picker button span{font-size:1.1rem}
.picker button:hover{color:var(--ink)}
.picker button[aria-selected="true"]{color:#fff;border-color:transparent;background:var(--sg)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0 22px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;transition:transform .2s,border-color .2s,box-shadow .2s}
.mode:hover{transform:translateY(-4px);border-color:var(--pc);box-shadow:0 22px 40px -26px var(--pc)}
.mode-i{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--pc);color:#0B1030;margin-bottom:6px}
.mode-i svg{width:24px;height:24px}
.mode b{font:800 1.2rem "Source Sans 3",sans-serif}
.mode span{color:var(--soft);font-size:.93rem}
.mode em{font-style:normal;margin-top:auto;padding-top:8px;font-size:.8rem;font-weight:800;color:var(--pc)}
.me-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.me-grid .unit{margin-top:18px}
/* chapter */
.chap-head{border-radius:28px}
.chap-head::after{background:var(--sg);opacity:.22}
.chap-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chap-num{margin:0}
.chap-unit{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--soft);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.chap-unit svg{width:14px;height:14px}
.tabs-l{flex:0 0 auto;align-self:center;font-size:.76rem;font-weight:800;color:var(--muted);padding:0 6px 0 8px}
.btn.ghost{background:transparent}
.whatnext{margin-top:44px;padding:24px;border-radius:26px;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box;border:2px solid transparent}
.whatnext h3{margin:0 0 14px;font-size:1.3rem}
.wn-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface2);border:1.5px solid var(--line2);border-radius:18px;padding:14px;transition:all .2s;min-width:0}
.wn:hover{border-color:var(--pc);transform:translateY(-3px)}
.wn span:last-child{min-width:0}
.wn b{display:block;font-size:1rem}
.wn small{display:block;color:var(--muted);font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn-n{width:38px;height:38px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;font:800 1rem "Source Sans 3",sans-serif;background:var(--pc);color:#0B1030}
.wn.is-done{border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:var(--okbg)}
.prevlink{margin-top:16px}
.prevlink button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font-weight:700;padding:6px 0}
.prevlink button:hover{color:var(--ink)}
.prevlink svg{width:16px;height:16px}
/* responsive */
@media (max-width:980px){
  .mainnav{display:none}
  .hero2{grid-template-columns:1fr;min-height:0}
  .orbit{width:min(78%,360px)}
  .loop{grid-template-columns:1fr 1fr}
  .loop li::after{display:none}
  .modes{grid-template-columns:1fr}
  .me-grid{grid-template-columns:1fr}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:55;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:22px;padding:6px;box-shadow:0 16px 40px -14px rgba(0,0,0,.6);max-width:560px;margin:0 auto}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:16px;padding:7px 2px;font-size:.74rem;font-weight:700;color:var(--muted)}
  .tabbar button span{width:24px;height:24px;display:grid;place-items:center}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="true"]{color:#fff;background:var(--grad)}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  .hero2{padding:24px 20px 30px;border-radius:26px;gap:18px}
  .hero2 h1{font-size:3.1rem;margin-top:16px}
  .orbit{width:86%}
  .planet .sn{display:none}
.planet small{font-size:.7rem;padding:2px 8px}
  .teacher{padding:7px 12px 7px 7px;gap:10px}
  .t-av{width:38px;height:38px;border-radius:12px}
  .teacher small{font-size:.74rem}
  .stiles{grid-template-columns:1fr}
  .stile{padding:18px;border-radius:24px}
  .stile-icon{width:62px;height:62px;font-size:1.9rem}
  .stile h3{font-size:1.35rem}
  .loop{grid-template-columns:1fr 1fr;gap:10px}
  .loop li{padding:16px}
  .step-n{width:40px;height:40px;font-size:1.1rem}
  .continue{padding:12px 14px;gap:12px}
  .cont-icon{width:48px;height:48px;font-size:1.4rem}
  .cont-txt b{font-size:1.05rem}
  .ch-top .ch-icon{width:58px;height:58px;font-size:1.7rem}
  .course-hero .actions .btn{flex:1 1 100%}
  .chrow{grid-template-columns:42px minmax(0,1fr) 32px;padding:10px}
  .chrow:has(.qgo){grid-template-columns:42px minmax(0,1fr) auto}
  .badges{display:none}
  .tabs-l{display:none}
  .wn-steps{grid-template-columns:1fr}
}

/* ---- class-first ---- */
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.ctile{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;text-align:left;min-height:190px;padding:26px;border-radius:28px;color:#fff;border:0;background:var(--sg);box-shadow:0 26px 50px -30px rgba(61,123,255,.9);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;isolation:isolate}
.ctile::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.28),transparent 45%),radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.3px) 0 0/20px 20px}
.ctile:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 36px 60px -30px rgba(139,92,246,1)}
.ctile.pulse{box-shadow:0 0 0 4px #fff,0 30px 50px -28px rgba(0,0,0,.7)}
.ct-num{position:absolute;right:-10px;bottom:-46px;font:800 13rem/1 "Source Sans 3",sans-serif;letter-spacing:-.08em;color:rgba(255,255,255,.16);z-index:-1;transition:transform .35s}
.ctile:hover .ct-num{transform:translate(-8px,-8px) rotate(-4deg)}
.ct-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ct-label{font:800 clamp(2rem,4vw,2.6rem)/1 "Source Sans 3",sans-serif;letter-spacing:-.03em}
.ct-subs{display:flex;flex-wrap:wrap;gap:6px}
.ct-subs i{font-style:normal;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:5px 11px 5px 7px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.ct-subs em{font-style:normal}
.ct-meta{font-size:.86rem;font-weight:700;opacity:.92}
.stile .ct-meta{color:var(--muted);opacity:1}
.ctile .bar{background:rgba(255,255,255,.25);max-width:280px}
.ctile .bar i{background:#fff}
.ct-go{width:54px;height:54px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);transition:transform .2s,background .2s}
.ct-go svg{width:24px;height:24px}
.ctile:hover .ct-go{transform:translateX(4px);background:#fff;color:#3D2A9B}
.class-hero{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:20px;padding:clamp(22px,4vw,36px);border-radius:28px;background:var(--sg);color:#fff}
.class-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.25),transparent 50%)}
.ch-big{font:800 clamp(4rem,10vw,6.5rem)/.9 "Source Sans 3",sans-serif;letter-spacing:-.06em;text-shadow:0 10px 30px rgba(0,0,0,.25)}
.class-hero h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem);color:#fff}
.class-hero .meta{color:rgba(255,255,255,.9);font-weight:700}
.stile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.pickers{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.picker-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.picker-cls{flex:0 0 auto;font:800 .82rem "Source Sans 3",sans-serif;color:var(--soft);background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;min-width:74px;text-align:center}
.picker-row .picker{padding:0;flex:1;min-width:0}
.list-cls{margin:10px 6px 2px;font:800 .8rem "Source Sans 3",sans-serif;color:var(--muted)}
.list-cls:first-child{margin-top:0}
@media (max-width:640px){
  .ctile{min-height:0;padding:20px;border-radius:24px}
  .ct-num{font-size:9rem;bottom:-30px}
  .ct-go{width:46px;height:46px;border-radius:15px}
  .picker-row{flex-direction:column;align-items:flex-start;gap:6px}
  .picker-row .picker{width:100%;margin:0}
  .stile-actions .btn{flex:1 1 auto}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
@media print{
  body{background:#fff;color:#000} body::before{display:none}
  .topbar,.coursebar,.tabs,.actions,.quizcta,.pager,.site-foot,.backbar,.copy,.readbar,.chap-prog{display:none!important}
  main{padding:0} .chap-head{border:0;padding:0} .chap-head::after{display:none}
  .codeblock{box-shadow:none}
}

.how-solve{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0 14px;font-size:.88rem;font-weight:600;color:var(--ink2,var(--ink))}
.how-solve span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;font:800 .72rem "Source Sans 3",sans-serif}
.qa.solve details.hint>summary{color:var(--amber);border-color:color-mix(in srgb,var(--u0) 45%,transparent);background:color-mix(in srgb,var(--u0) 10%,transparent);margin-right:8px}
.qa.solve details{display:block}
.hint-b{margin:10px 0 0 46px;padding:10px 14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--u0) 55%,transparent);background:color-mix(in srgb,var(--u0) 8%,transparent);animation:enter .25s}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding:6px 0 6px 38px;line-height:1.6}
ol.steps li::before{content:"Step " counter(st);position:absolute;left:0;top:8px;font:800 .62rem "Source Sans 3",sans-serif;text-transform:uppercase;letter-spacing:.03em;color:var(--u2);width:34px;line-height:1.1}
ol.steps li+li{border-top:1px dashed var(--line)}
.final{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--ok)}
.final b{font:800 .72rem "Source Sans 3",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.final span{font-weight:700}
.qtag{display:inline-block;margin:0 0 6px;padding:2px 9px;border-radius:999px;font:700 .68rem "Source Sans 3",sans-serif;letter-spacing:.02em;color:var(--u4);background:color-mix(in srgb,var(--u4) 12%,transparent);border:1px solid color-mix(in srgb,var(--u4) 35%,transparent)}
[data-theme="light"] .qa.solve details.hint>summary{color:#92400E}
@media (max-width:640px){.hint-b{margin-left:0}}

/* =====================================================================
   CALM STUDY THEME (v5)
   A layer on top of the existing styles: same structure, quieter visuals.
   Dark-first navy, charcoal surfaces, one indigo→purple accent,
   cyan for info, lime only for success. No looping animations.
   ===================================================================== */
:root{
  --bg:#0B1020; --bg2:#0E1428; --surface:#121A2E; --surface2:#172036; --raise:#1E2842;
  --line:rgba(148,163,210,.11); --line2:rgba(148,163,210,.2);
  --ink:#E7EAF4; --soft:#A7AFC6; --muted:#7C859F;
  --blue:#7C9CFF; --purple:#9A86F5; --indigo:#6E73F0; --cyan:#5CC8DF; --pink:#9A86F5; --lime:#A3E635; --amber:#E2B65A; --red:#F08A9B;
  --u0:#E2B65A; --u1:#7C9CFF; --u2:#5CC8DF; --u3:#A895F7; --u4:#8E95F5; --u5:#7FB6F2; --u6:#6FD3B5;
  --ok:#A3E635; --okbg:rgba(163,230,53,.09); --bad:#F08A9B; --badbg:rgba(240,138,155,.1);
  --grad:linear-gradient(120deg,#5E66E8 0%,#7F6BEA 100%);
  --grad-soft:linear-gradient(120deg,rgba(110,115,240,.14),rgba(154,134,245,.14));
  --accent:#8C93FF; --accent-bg:rgba(110,115,240,.14); --accent-line:rgba(124,131,255,.38);
  --glass:rgba(18,26,46,.72);
  --code:#0A0F1E; --code-line:rgba(148,163,210,.1);
  --shadow:0 8px 24px -14px rgba(0,0,0,.6);
  --glow:0 0 0 1px var(--line2),0 14px 30px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#E8EBF2; --bg2:#E1E5EE; --surface:#F3F5F9; --surface2:#ECEFF5; --raise:#E2E6EF;
  --line:rgba(25,35,80,.1); --line2:rgba(25,35,80,.18);
  --ink:#151B33; --soft:#454D68; --muted:#666F8A;
  --blue:#3E5BD8; --purple:#5B47C9; --indigo:#4A50D0; --cyan:#0E7490; --pink:#5B47C9; --amber:#9A6510; --red:#B4233F;
  --u0:#9A6510; --u1:#3E5BD8; --u2:#0E7490; --u3:#5B47C9; --u4:#4A50D0; --u5:#2F6CA8; --u6:#13795B;
  --ok:#3F7D0E; --okbg:rgba(101,163,13,.11); --bad:#B4233F; --badbg:rgba(180,35,63,.08);
  --accent:#4A50D0; --accent-bg:rgba(74,80,208,.1); --accent-line:rgba(74,80,208,.35);
  --glass:rgba(243,245,249,.85);
  --shadow:0 8px 22px -16px rgba(25,35,80,.35);
  --glow:0 0 0 1px var(--line2),0 12px 26px -20px rgba(25,35,80,.35);
}
:root[data-theme="light"] .codeblock{--code:#151B2E}

/* quieter page backdrop */
body::before{background:radial-gradient(1100px 600px at 90% -15%,rgba(110,115,240,.07),transparent 60%)}
:root[data-theme="light"] body::before{background:none}
body{line-height:1.7}
:focus-visible{outline-color:var(--accent)}
a{color:var(--accent)}

/* top bar + nav */
.mainnav button[aria-current="true"]::after{background:var(--accent);height:2px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.iconbtn:hover,.btn:hover{border-color:var(--accent-line)}
.readbar{background:var(--accent)}

/* buttons: one clear primary, no glow */
.btn.primary{background:var(--grad);background-size:100% 100%;box-shadow:none}
.btn.primary:hover{background-position:0 0;box-shadow:0 0 0 3px var(--accent-bg);filter:brightness(1.08)}
.btn:hover{transform:translateY(-1px)}
.eyebrow i{background:var(--accent-bg);color:var(--accent)}

/* number badges: tinted, not neon */
.qa-n,.step-n{background:var(--accent-bg);color:var(--accent);box-shadow:none;border:1px solid var(--accent-line)}
.cont-go,.resume-chip .go{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line)}
.qsteps i.cur{background:var(--accent)}
.bar i{background:var(--sg,var(--accent))}

/* hero: deep navy, one soft light source, nothing moving */
.hero2{background:linear-gradient(160deg,#121A35 0%,#0E1429 100%);border-color:var(--line2)}
.aurora{opacity:.28;filter:blur(90px)}
.aurora i,.orb,.planet,.oring.r2,.minimap,.glyph{animation:none!important}
.aurora i:nth-child(1){background:#4C55D8}
.aurora i:nth-child(2){background:#6B4FD0}
.aurora i:nth-child(3){display:none}
.hero2::after{opacity:.35}
.hero2 h1{text-shadow:none;color:#F1F3FA}
.hero2 .lead{color:#C3C9DD}
.t-av{background:var(--accent-bg);color:#C9CCFF;border:1px solid var(--accent-line)}
.teacher{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.teacher small{color:#AEB5CC}
.hero-tags li{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:#C3C9DD}
.oring{border-color:rgba(255,255,255,.12)}
.oring.r2{border-color:rgba(255,255,255,.06)}
.planet>span{box-shadow:0 10px 24px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.planet:hover>span{transform:scale(1.05)}
.planet small{background:rgba(11,16,32,.8);border-color:rgba(255,255,255,.1)}
.core{box-shadow:none!important;background:linear-gradient(135deg,#4F58D8,#7A63E0)!important}

/* class tiles + class banner: dark cards with an accent edge */
.ctile{box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 36px -28px rgba(0,0,0,.8);border:1px solid var(--line2)}
.ctile::before{background:radial-gradient(circle at 88% 15%,rgba(140,147,255,.16),transparent 50%)}
.ctile:hover{box-shadow:0 0 0 1px var(--accent-line),0 18px 36px -24px rgba(0,0,0,.8)}
.class-hero{border:1px solid var(--line2);box-shadow:none}
.class-hero::before{background:radial-gradient(circle at 85% 10%,rgba(140,147,255,.14),transparent 55%)}

/* subject tiles */
.stile::before{opacity:.07}
.stile:hover{transform:translateY(-3px);box-shadow:0 20px 40px -30px rgba(0,0,0,.8);border-color:var(--accent-line)}
.stile.pulse{box-shadow:0 0 0 2px var(--accent)}
.stile-icon{box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.stile:hover .stile-icon{transform:scale(1.04)}
.cb-course i,.cont-icon{filter:saturate(.85)}

/* cards that used gradient borders: calm single-tone edge */
.pc.paper,.whatnext,.quizcta,.mobilemenu button[aria-current="true"]{background:var(--surface);border:1px solid var(--accent-line)}
.quizcta::after{display:none}
.tip{background:var(--surface2);border:1px solid var(--line2);border-left:3px solid var(--amber)}
.tip .ti{background:rgba(226,182,90,.12);color:var(--amber)}
.pc-ico,.empty .em-ico{background:var(--accent-bg)}
.pc:hover,.pillar:hover,.stat:hover,.hub-card:hover{box-shadow:var(--glow)}
.continue:hover{box-shadow:0 14px 30px -24px rgba(0,0,0,.8)}
.classpick button:hover{background:var(--accent-bg)}
.level:hover .lv-cta{background:var(--accent);color:#fff}

/* bottom tab bar on phones */
.tabbar button[aria-current="true"]{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}

/* reading comfort on chapter pages */
.page p,.page li{max-width:74ch}
.page p,.page li,.qa-a p{line-height:1.75}
.qa-item{background:var(--surface)}
.qa-a{background:color-mix(in srgb,var(--ok) 6%,var(--surface2))}
details>summary{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 35%,transparent);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
mark{background:rgba(226,182,90,.2)}
.qtag{color:var(--accent);background:var(--accent-bg);border-color:var(--accent-line)}
.how-solve span{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-line)}
ol.steps li::before{color:var(--accent)}

/* light theme: soft greys instead of bright white */
:root[data-theme="light"] .hero2{background:linear-gradient(160deg,#1A2240,#141B33)}
:root[data-theme="light"] .qa-item,:root[data-theme="light"] .stile{background:var(--surface)}

/* practice hub */
.mode-i{background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 35%,transparent)}
.picker button[aria-selected="true"]{background:var(--accent-bg);color:var(--ink);border-color:var(--accent-line)}

/* calmer chips: tinted instead of solid */
.qgo,.unit-head .u-tag{background:color-mix(in srgb,var(--uc) 16%,transparent);color:var(--uc);border:1px solid color-mix(in srgb,var(--uc) 38%,transparent)}
.qgo.ace{background:var(--okbg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1!important;transform:none!important}
}

/* ===================== Platform layer (v6) ===================== */
.iconbtn.bell{position:relative}
.iconbtn.bell.has-new::after{content:"";position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
dialog#fb{border:0;padding:0;background:transparent;max-width:min(560px,94vw);width:100%;color:var(--ink)}
dialog#fb::backdrop{background:rgba(5,8,18,.6);backdrop-filter:blur(4px)}
#fbd{background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:20px 22px;box-shadow:var(--shadow)}
.fb-types{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.fb-types button{border:1px solid var(--line2);background:var(--surface2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.86rem;color:var(--soft)}
.fb-types button[aria-checked="true"]{background:var(--accent-bg);border-color:var(--accent-line);color:var(--ink)}
.fb-sub{color:var(--soft);font-size:.92rem;margin:8px 0 10px}
.fb-ref{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--accent);background:var(--accent-bg);border-radius:8px;padding:2px 8px}
.fb-l{display:block;font-weight:700;font-size:.9rem;margin:10px 0 0}
.fb-l .opt{font-weight:500;color:var(--muted)}
.fb-l textarea,.fb-l input,.fb-l select,.rate-c input,.share-url{display:block;width:100%;margin-top:6px;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:500 .95rem "Source Sans 3",sans-serif}
.fb-l textarea:focus,.fb-l input:focus,.fb-l select:focus,.rate-c input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fb-safe{font-size:.8rem;color:var(--muted);margin:12px 0 0}
.fb-err{color:var(--bad);font-weight:700;font-size:.88rem;min-height:1.2em;margin:8px 0 0}
.fb-done{text-align:center;padding:10px 4px}
.fb-big{font-size:2.6rem}
.fb-done .qfoot{justify-content:center}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* question tools */
.qtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 0 46px;padding-top:10px;border-top:1px dashed var(--line)}
.qt-l{font-size:.8rem;color:var(--muted);font-weight:600}
.qt-sp{flex:1}
.qt{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;line-height:1.5}
.qt:hover{border-color:var(--line2);color:var(--ink)}
.qt.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--ink)}
.qa-flash{box-shadow:0 0 0 2px var(--accent)}
@media (max-width:640px){.qtools{margin-left:0}.qt-sp{flex-basis:100%;height:0}}

/* progress panel */
.pp{margin:0 0 22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.pp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.pp-head h2{margin:0;font-size:1.3rem}
.pp-note,.t-badge{font-size:.76rem;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pp-tile{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pp-tile b{font:800 1.5rem "Source Sans 3",sans-serif;line-height:1.1}
.pp-tile b small{font-size:.9rem;color:var(--muted)}
.pp-tile span{font-weight:700;font-size:.86rem;color:var(--soft)}
.pp-tile small{font-size:.76rem;color:var(--muted)}
.pp-i{font-size:1.1rem}
.pp-topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.pp-topics h3{font-size:.95rem;margin:0 0 6px}
.pp-topic{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:600}
.pp-topic em{font-style:normal;font-weight:800}
.pp-topic.weak em{color:var(--amber)} .pp-topic.strong em{color:var(--ok)}
.pp-hint{color:var(--muted);font-size:.88rem;margin:12px 0 0}

/* continue learning */
.cl{margin:22px 0 0}
.cl h2{font-size:1.15rem;margin:0 0 10px}
.cl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cl-card{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;transition:border-color .2s,transform .2s}
.cl-card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.cl-ic{font-size:1.5rem;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);flex:0 0 auto}
.cl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-t small{color:var(--muted);font-size:.78rem;font-weight:600}
.cl-bar{display:block;height:5px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:4px 0 0}
.cl-bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cl-go{font-weight:800;font-size:.82rem;color:var(--accent);white-space:nowrap}

/* home strip */
.hstrip{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin:22px 0 0}
.hc-col{display:grid;gap:10px}
.hc{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink)}
.hc-link{transition:border-color .2s}
.hc-link:hover{border-color:var(--accent-line)}
.hc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:.92rem}
.hc-h small{color:var(--muted);font-weight:600;font-size:.78rem}
.hc-big{font:800 1.5rem "Source Sans 3",sans-serif;line-height:1.1}
.hc small{color:var(--muted);font-size:.8rem}
.visits{font-size:.82rem;font-weight:700;color:var(--soft);margin-top:4px}
.chal-q{font-weight:700;margin:6px 0 10px;line-height:1.5}
.chal-opts{display:grid;gap:8px}
.chal-o{text-align:left;border:1px solid var(--line2);background:var(--surface2);border-radius:12px;padding:9px 12px;font-weight:600;transition:border-color .15s}
.chal-o:hover:not(:disabled){border-color:var(--accent-line)}
.chal-o.right{border-color:var(--ok);background:var(--okbg)}
.chal-o.wrong{border-color:var(--bad);background:var(--badbg)}
.chal-o:disabled{cursor:default}
.chal-fb{font-size:.9rem;margin:10px 0 0;color:var(--soft)}
.chal-fb.muted{color:var(--muted);font-size:.8rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700}
@media (max-width:860px){.hstrip{grid-template-columns:1fr}}

/* news + help */
.nh{display:flex;justify-content:space-between;align-items:baseline}
.news-list{display:grid;gap:8px}
.news-item{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.news-item:hover{border-color:var(--accent-line)}
.news-item b{display:block;font-weight:700}
.news-item small{color:var(--muted);font-size:.78rem}
.news-item.new{border-color:var(--accent-line)}
#fbd .news-list{margin-top:12px}
.helpus{margin:44px 0 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:20px 22px}
.helpus h2{margin:0 0 4px;font-size:1.25rem}
.helpus p{margin:0;color:var(--soft)}
.helpus-btns{display:flex;flex-wrap:wrap;gap:8px}

/* rating + comments */
.rate,.discuss{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.rate{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.rate h3,.discuss h3{margin:0 0 2px;font-size:1.05rem}
.rate p{margin:0;color:var(--soft);font-size:.88rem}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:1.7rem;line-height:1;color:var(--line2);padding:2px;transition:transform .12s,color .12s}
.stars button.on{color:var(--amber)}
.stars button:hover{transform:scale(1.12)}
.rate-c{display:flex;gap:8px;width:100%}
.rate-c input{margin:0}

/* teacher */
.t-h{font-size:1.1rem;margin:26px 0 10px}
.tconns{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tconn{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tconn.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.tconn span{color:var(--soft);font-size:.86rem}
.tconn small{color:var(--muted);font-size:.8rem}
.t-badge{display:inline-block;margin:24px 0 10px;color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.foot-x{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.foot-x button{background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;color:var(--soft);font-weight:700;font-size:.82rem}
.foot-x button:hover{color:var(--ink);border-color:var(--accent-line)}
.foot-x [data-fvisits]{font-size:.82rem;color:var(--soft);font-weight:700}
@media print{.qtools,.rate,.discuss,.helpus{display:none!important}}

.pp + .dash{display:none}

/* ===== My Class (v8) ===== */
.join{margin:22px 0 0;background:linear-gradient(120deg,rgba(22,224,161,.12),rgba(41,182,255,.10)),var(--surface);border:1.5px solid color-mix(in srgb,var(--mint) 45%,transparent);border-radius:22px;padding:18px 20px}
.join-t{display:flex;gap:14px;align-items:flex-start}
.join-ic{font-size:2rem;line-height:1}
.join h2{margin:0 0 4px;font-size:1.25rem}
.join p{margin:0;color:var(--soft)}
.join em{color:var(--muted);font-style:normal;font-size:.88rem}
.join-f{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:14px}
.join-f label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
.join-f input,.join-f select,.tpin input,.tfilter{background:var(--bg2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:500 .95rem "Lexend",sans-serif;min-width:160px}
.join-f input:focus,.join-f select:focus,.tpin input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--accent-bg)}
.join-safe{font-size:.8rem;color:var(--muted)!important;margin-top:10px!important}
.myclass{margin:0 0 18px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--lemon) 40%,transparent);border-radius:22px;padding:18px}
.mc-top{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.mc-av{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font:800 1.5rem "Bricolage Grotesque",sans-serif;background:var(--grad);color:#1C0F06}
.mc-id{flex:1;min-width:160px}
.mc-id b{display:block;font:700 1.25rem "Bricolage Grotesque",sans-serif}
.mc-id span{color:var(--soft);font-size:.86rem}
.mc-pts{text-align:center;background:var(--surface2);border-radius:16px;padding:8px 16px}
.mc-pts b{display:block;font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--lemon)}
.mc-pts span{font-size:.76rem;color:var(--muted);font-weight:600}
.mc-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.badge2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 8px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line2);opacity:.45;filter:grayscale(1)}
.badge2 i{font-style:normal;font-size:1.6rem}
.badge2 b{font-size:.84rem}
.badge2 small{font-size:.7rem;color:var(--muted)}
.badge2.got{opacity:1;filter:none;border:1.5px solid color-mix(in srgb,var(--lemon) 55%,transparent);background:color-mix(in srgb,var(--lemon) 8%,var(--surface2))}
.mc-note{font-size:.8rem;color:var(--muted);margin:12px 0 0}
.tlive{margin:6px 0 10px}
.tl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.tl-act{display:flex;flex-wrap:wrap;gap:8px}
.tpin{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:16px}
.tpin label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
.tpin-msg{color:var(--bad);font-weight:600;font-size:.88rem}
.tfilter{min-width:0;padding:6px 10px;font-size:.85rem;margin-left:8px;vertical-align:middle}
h3.t-h{font-size:1.05rem}

/* =====================================================================
   DIGICLASS THEME (v9): "Notebook & Chalkboard"
   A school study site: white ruled-notebook pages, ink-blue and
   blackboard-green, readable Source Sans / Source Serif type,
   and one animated classroom chalkboard on the home page.
   ===================================================================== */
:root,:root[data-theme="light"]{
  --bg:#F3F5F8; --bg2:#EDF0F4; --surface:#FFFFFF; --surface2:#F7F9FB; --raise:#EEF2F6;
  --line:#E2E6EC; --line2:#CDD4DD;
  --ink:#1C2430; --soft:#4A5565; --muted:#6B7685;
  --brand:#1E5AA8; --brand-d:#174A8B; --green:#2F6B4F; --ink-blue:#1E5AA8;
  --blue:#1E5AA8; --purple:#5B4B9A; --cyan:#1E7FA8; --pink:#B83B5E; --lime:#2F855A; --amber:#B7791F; --red:#C53030;
  --orange:#1E5AA8; --mint:#2F6B4F; --sky:#1E7FA8; --lemon:#B7791F; --on-accent:#FFFFFF;
  --u0:#B7791F; --u1:#1E5AA8; --u2:#2F6B4F; --u3:#7B4BA0; --u4:#B83B5E; --u5:#1E7FA8; --u6:#9C5221;
  --ok:#2F855A; --okbg:#EAF6EF; --bad:#C53030; --badbg:#FDEDED;
  --grad:linear-gradient(0deg,#1E5AA8,#1E5AA8);
  --grad-soft:linear-gradient(0deg,#EEF4FB,#EEF4FB);
  --accent:#1E5AA8; --accent-bg:#EAF1FA; --accent-line:#B9CFEA;
  --code:#1F2630; --code-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);
  --glow:0 1px 2px rgba(16,24,40,.06),0 8px 20px rgba(16,24,40,.08);
  --glass:rgba(255,255,255,.92);
  --radius:12px; --radius-sm:8px;
}
:root[data-theme="dark"]{
  --bg:#141A21; --bg2:#182029; --surface:#1C242E; --surface2:#222B36; --raise:#2A3441;
  --line:#2C3644; --line2:#3A4656;
  --ink:#E6EAF0; --soft:#B4BDC9; --muted:#8B96A5;
  --brand:#6FA3E6; --brand-d:#5B8FD3; --green:#7BC4A0;
  --blue:#6FA3E6; --cyan:#6CC0E0; --pink:#E58AA4; --amber:#E0B25C; --red:#F08080;
  --orange:#6FA3E6; --mint:#7BC4A0; --sky:#6CC0E0; --lemon:#E0B25C; --on-accent:#0E1620;
  --u0:#E0B25C; --u1:#6FA3E6; --u2:#7BC4A0; --u3:#B79BE0; --u4:#E58AA4; --u5:#6CC0E0; --u6:#E09A6A;
  --ok:#7BC4A0; --okbg:rgba(123,196,160,.12); --bad:#F08080; --badbg:rgba(240,128,128,.12);
  --grad:linear-gradient(0deg,#6FA3E6,#6FA3E6);
  --accent:#6FA3E6; --accent-bg:rgba(111,163,230,.14); --accent-line:rgba(111,163,230,.4);
  --code:#11161D; --shadow:0 1px 2px rgba(0,0,0,.3); --glow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.3);
  --glass:rgba(28,36,46,.92);
}
:root[data-theme="dark"] .codeblock{--code:#11161D}

/* ---------- type ---------- */
body{font:400 17px/1.7 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);letter-spacing:0}
body::before{display:none}
h1,h2,h3,.wm{font-family:"Source Serif 4",Georgia,serif;letter-spacing:-.01em;font-weight:700}
h1{line-height:1.15} h2{line-height:1.25}
strong,b{font-weight:600}
code,pre,.codeblock code{font-family:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace}
.page{font-size:1.06rem}
.page p,.page li{line-height:1.75;max-width:72ch;color:var(--ink)}
.page h2{font-size:1.5rem;margin-top:2.2em;padding-bottom:.35em;border-bottom:1px solid var(--line)}
.page h2 small{background:var(--accent-bg);color:var(--brand);border:0;font-family:"Source Sans 3",sans-serif;font-weight:700}
a{color:var(--brand)}
mark{background:#FFF1B8;color:inherit}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.sec-sub,.intro,.meta{color:var(--soft)}

/* ---------- top bar ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 1px 0 rgba(16,24,40,.03)}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand)}
.wm{font-size:1.35rem;color:var(--ink)}
.mainnav button{color:var(--soft);font-weight:600;border-radius:8px}
.mainnav button:hover{background:var(--surface2);color:var(--ink)}
.mainnav button[aria-current="true"]{color:var(--brand)}
.mainnav button[aria-current="true"]::after{background:var(--brand);height:2px;bottom:-1px}
.search,.iconbtn{background:var(--surface2);border:1px solid var(--line2);border-radius:8px}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-bg)}
.coursebar,.tabs{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:none}
.readbar{background:var(--brand);height:3px}
.iconbtn.bell.has-new::after{background:#D64545;box-shadow:0 0 0 2px var(--surface)}

/* ---------- buttons: plain, solid, no glow ---------- */
.btn{border-radius:8px;font-weight:600;border:1px solid var(--line2);background:var(--surface);box-shadow:none;transform:none}
.btn:hover{transform:none;border-color:var(--brand);color:var(--brand);background:var(--surface)}
.btn.primary,:root[data-theme="light"] .btn.primary{background:var(--brand);color:#fff;border:1px solid var(--brand);box-shadow:none;filter:none}
.btn.primary:hover,:root[data-theme="light"] .btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff;box-shadow:none;transform:none}
.btn.primary:active{transform:translateY(1px);box-shadow:none}
:root[data-theme="dark"] .btn.primary{color:#0E1620}
.btn.big{border-radius:10px}
.btn.saved-on{background:#FFF7E0;border-color:#E3B341;color:#8A5A00}

/* ---------- surfaces: quieter cards, less rounding ---------- */
.course-hero,.chap-head,.unit,.stile,.qa-item,.pp,.hc,.cl-card,.news-item,.helpus,.rate,.discuss,.mode,.loop li,.tconn,.myclass,.join,.whatnext,.quizcta,.pc,.stat,.hub-card,.tpin,.qd,#fbd,.tip,.why,.opt,.pp-tile,.badge2,.chrow{border-radius:12px;box-shadow:none}
.course-hero,.chap-head{border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.course-hero::after,.chap-head::after,.stile::before{display:none}
.unit{background:var(--surface);border:1px solid var(--line)}
.chrow{background:var(--surface);border:1px solid var(--line)}
.chrow:hover{border-color:var(--brand);background:var(--surface)}
.chnum{border-radius:8px;font-family:"Source Sans 3",sans-serif;font-weight:700}
.chap-num,.chap-unit{border-radius:6px;font-family:"Source Sans 3",sans-serif;font-weight:700}
.u-tag,.qgo,.unit-head .u-tag{border-radius:6px}
.qa-n,.step-n,:root[data-theme="light"] .qa-n,:root[data-theme="light"] .step-n{background:var(--brand);color:#fff;border:0;border-radius:8px;box-shadow:none;font-family:"Source Sans 3",sans-serif;font-weight:700}
:root[data-theme="dark"] .qa-n,:root[data-theme="dark"] .step-n{color:#0E1620}
.qa-a{background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:10px}
details>summary{border-radius:8px;color:var(--brand);border-color:var(--accent-line);background:var(--accent-bg)}
.tip{background:#FFFBEA;border:1px solid #F2DFA0;border-left:4px solid #E3B341}
.tip .ti{background:#FFF1C2;color:#8A5A00}
:root[data-theme="dark"] .tip{background:rgba(224,178,92,.08);border-color:rgba(224,178,92,.3)}
:root[data-theme="dark"] .tip .ti{background:rgba(224,178,92,.15);color:#E0B25C}
.codeblock{border-radius:10px;box-shadow:none;border:1px solid #2B3340}
.qtag{color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,transparent);border-color:color-mix(in srgb,var(--pink) 35%,transparent);border-radius:6px;font-family:"Source Sans 3",sans-serif;letter-spacing:0}
.how-solve span{background:var(--brand);color:#fff;border:0}
ol.steps li::before{color:var(--brand)}
.final{border-color:var(--ok)}

/* ---------- home hero: intro + chalkboard ---------- */
.hero2,:root[data-theme="light"] .hero2,:root[data-theme="dark"] .hero2{background:none;border:0;border-radius:0;padding:clamp(10px,3vw,28px) 0 8px;color:var(--ink);grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,48px);overflow:visible}
.hero2::after,.hero2 .aurora{display:none}
.hero2 h1{color:var(--ink);font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.08;letter-spacing:-.015em;margin:18px 0 14px;text-shadow:none;font-weight:700}
.hero2 .lead{color:var(--soft);font-size:1.15rem;max-width:42ch;font-weight:400}
.hero2 .teacher{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hero2 .teacher b{color:var(--ink);font-family:"Source Sans 3",sans-serif}
.hero2 .teacher small{color:var(--muted)}
.hero2 .t-av{background:var(--green);color:#fff;border:0;border-radius:10px;font-family:"Source Sans 3",sans-serif}
.hero2 .btn.primary{background:var(--brand);color:#fff;box-shadow:none}
.hero2 .btn.ghost-light{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.hero2 .btn.ghost-light:hover{border-color:var(--brand);color:var(--brand)}
.hero2 .hero-tags{display:none}
.board-wrap{position:relative}
.board{position:relative;background:#2E4A3C;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.18),transparent 60%);border:14px solid #8A5A36;border-radius:10px;box-shadow:inset 0 0 0 2px #6E4628,inset 0 0 40px rgba(0,0,0,.35),0 14px 30px -18px rgba(40,25,10,.55);padding:22px 24px 28px;min-height:300px;color:#F1F1EA}
.board-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:"Kalam",cursive;color:rgba(241,241,234,.75);font-size:1.05rem;border-bottom:1px dashed rgba(241,241,234,.25);padding-bottom:8px;margin-bottom:12px}
.board-top b{font-weight:700;color:#F6E7A3}
.chalk{margin:0;min-height:150px;font:400 1.22rem/1.55 "Kalam",cursive;white-space:pre-wrap;color:#F4F4EC;text-shadow:0 0 1px rgba(255,255,255,.6),0 0 6px rgba(255,255,255,.08)}
.chalk::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.15em;background:rgba(244,244,236,.85);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chalk-out{margin:10px 0 0;font:700 1.15rem/1.45 "Kalam",cursive;color:#F6E7A3;white-space:pre-wrap;min-height:1.6em;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.chalk-out.show{opacity:1;transform:none}
.tray{position:absolute;left:4%;right:4%;bottom:-24px;height:12px;background:#7A4E2E;border-radius:0 0 6px 6px;box-shadow:0 4px 8px -4px rgba(0,0,0,.4)}
.tray i{position:absolute;bottom:9px;height:7px;border-radius:3px;background:#F3F1E6}
.tray i:nth-child(1){left:12%;width:34px}.tray i:nth-child(2){left:22%;width:22px;background:#F6E7A3}.tray i:nth-child(3){right:16%;width:44px;height:12px;bottom:8px;background:#5B5B5B;border-radius:3px}
.hv-subs{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px}
.hv-subs button{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:600 .95rem "Source Sans 3",sans-serif;box-shadow:none}
.hv-subs button:hover{border-color:var(--brand);color:var(--brand)}
@media (max-width:980px){.hero2,:root[data-theme="light"] .hero2,:root[data-theme="dark"] .hero2{grid-template-columns:1fr}}
@media (max-width:520px){.board{border-width:10px;padding:16px;min-height:250px}.chalk{font-size:1.05rem}}

/* ---------- class tiles: notebook covers ---------- */
.ctile{color:#fff;border:0;border-radius:6px 14px 14px 6px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 24px -16px rgba(16,24,40,.45);transform:none}
.ctile::before{background:linear-gradient(90deg,rgba(0,0,0,.22) 0 10px,transparent 10px),repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.04) 22px 23px)}
.ctile:hover{transform:translateY(-2px);box-shadow:0 2px 0 rgba(0,0,0,.08),0 16px 28px -16px rgba(16,24,40,.5)}
.ct-num{color:rgba(255,255,255,.1);font-family:"Source Serif 4",serif}
.ct-label{display:inline-block;align-self:flex-start;background:#FFFDF6;color:#1C2430;border-radius:6px;padding:6px 16px 8px;font-family:"Source Serif 4",serif;font-size:clamp(1.6rem,3vw,2.1rem);box-shadow:inset 0 -2px 0 #D9D2BC;background-image:linear-gradient(transparent calc(100% - 12px),#E8E1CC calc(100% - 12px),#E8E1CC calc(100% - 11px),transparent calc(100% - 11px))}
.ct-subs i{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}
.ct-meta{color:rgba(255,255,255,.88)}
.ct-go{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px}
.ctile:hover .ct-go{background:#fff;color:#1C2430}
.ctile .bar{background:rgba(255,255,255,.25)} .ctile .bar i{background:#fff}
.class-hero{color:#fff;border:0;border-radius:6px 14px 14px 6px;box-shadow:none}
.class-hero::before{background:linear-gradient(90deg,rgba(0,0,0,.22) 0 10px,transparent 10px)}
.class-hero h1,.class-hero .meta,.class-hero *{color:#fff}

/* ---------- subject tiles, practice ---------- */
.stile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sg,var(--brand))}
.stile:hover{transform:none;border-color:var(--line2);box-shadow:var(--glow)}
.stile-icon{border-radius:12px;box-shadow:none}
.stile:hover .stile-icon{transform:none}
.mode{background:var(--surface)}
.mode:hover{transform:none;border-color:var(--brand)}
.mode-i{border-radius:10px}
.picker button{border-radius:8px}
.picker button[aria-selected="true"],:root[data-theme="light"] .picker button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.loop li .lp-i{border-radius:10px;color:#fff}
.cont-go,.resume-chip .go{background:var(--brand);color:#fff;border:0;border-radius:10px}
.cl-bar i{background:var(--brand)}
.hc-chal{background:var(--surface);border-color:var(--line)}
.hc-chal .hc-h span{color:var(--ink)}
.helpus{background:var(--surface);border:1px solid var(--line)}
.join{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green)}
.myclass{border:1px solid var(--line);border-left:4px solid #E3B341}
.mc-av{background:var(--green);color:#fff;font-family:"Source Serif 4",serif;border-radius:12px}
.mc-pts b{color:#B7791F;font-family:"Source Serif 4",serif}
.badge2.got{border:1px solid #E3B341;background:#FFFBEA}
:root[data-theme="dark"] .badge2.got{background:rgba(224,178,92,.1)}
.stars button.on{color:#E3A008}
.tabbar{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(16,24,40,.06)}
.tabbar button[aria-current="true"]{background:var(--accent-bg);color:var(--brand);box-shadow:none}
.site-foot{color:var(--soft)}
.join-f input,.join-f select,.tpin input,.tfilter,.fb-l textarea,.fb-l input,.fb-l select,.rate-c input,.share-url{background:var(--surface);border-radius:8px}

/* ---------- motion: one moment on load, plus feedback to actions ---------- */
.enter>*{animation:enter .28s ease-out both}
.reveal{opacity:1;transform:none;transition:none}
@media (prefers-reduced-motion:reduce){.chalk::after{animation:none}.chalk-out{transition:none}}

/* =====================================================================
   DIGICLASS THEME (v10): "Sunset Chalkboard"
   Warm orange site with the classroom chalkboard, readable Source Sans
   text, and lively (but calm-on-request) motion.
   ===================================================================== */
:root,:root[data-theme="light"]{
  --bg:#FFF4E6; --bg2:#FFEBD4; --surface:#FFFFFF; --surface2:#FFF8F0; --raise:#FFEAD3;
  --line:#F3DCC2; --line2:#E9C7A2;
  --ink:#2A1A0E; --soft:#5A4332; --muted:#86705E;
  --brand:#D9480F; --brand-d:#B23A0A; --green:#0F766E; --ink-blue:#D9480F;
  --orange:#E8590C; --mint:#0F766E; --sky:#1C7ED6; --lemon:#F59F00; --pink:#D6336C;
  --blue:#1C7ED6; --purple:#7048E8; --cyan:#1098AD; --lime:#2B8A3E; --amber:#E67700; --red:#E03131;
  --u0:#E67700; --u1:#E8590C; --u2:#0F766E; --u3:#7048E8; --u4:#D6336C; --u5:#1C7ED6; --u6:#C2410C;
  --grad:linear-gradient(120deg,#FF922B,#F76707 55%,#E8590C);
  --grad-soft:linear-gradient(120deg,#FFF0E0,#FFE3C7);
  --accent:#D9480F; --accent-bg:#FFE8D6; --accent-line:#F8B98C;
  --shadow:0 1px 2px rgba(120,50,0,.06),0 6px 16px rgba(120,50,0,.07);
  --glow:0 2px 4px rgba(120,50,0,.08),0 14px 28px -10px rgba(200,80,0,.28);
  --glass:rgba(255,248,240,.93);
}
:root[data-theme="dark"]{
  --bg:#1A130E; --bg2:#20170F; --surface:#261B13; --surface2:#2E2118; --raise:#38281C;
  --line:#3B2B1F; --line2:#4E3826;
  --ink:#FBEFE3; --soft:#D9C3AE; --muted:#A88E77;
  --brand:#FF922B; --brand-d:#FF7A1A; --green:#38D9A9;
  --orange:#FF922B; --mint:#38D9A9; --sky:#4DABF7; --lemon:#FFD43B;
  --u0:#FFC078; --u1:#FF922B; --u2:#38D9A9; --u3:#B197FC; --u4:#F783AC; --u5:#4DABF7; --u6:#FFA94D;
  --accent:#FF922B; --accent-bg:rgba(255,146,43,.14); --accent-line:rgba(255,146,43,.45);
  --on-accent:#2A1205; --glass:rgba(38,27,19,.93);
}

/* gentle warm glow behind everything */
body{background:var(--bg)}
:root[data-theme="light"] body,:root:not([data-theme]) body{background:radial-gradient(1100px 600px at 100% -10%,#FFE0BF 0,transparent 60%),radial-gradient(900px 500px at -10% 30%,#FFF0DC 0,transparent 60%),var(--bg);background-attachment:fixed}

/* top bar: animated sunset stripe */
.topbar{background:var(--glass);border-bottom:1px solid var(--line)}
.topbar::before{height:4px;background:linear-gradient(90deg,#FFB347,#F76707,#E8590C,#FF922B,#FFB347);background-size:300% 100%;animation:stripe 9s linear infinite}
@keyframes stripe{to{background-position:300% 0}}
.readbar{background:linear-gradient(90deg,#FF922B,#E8590C)}
.wm{color:var(--ink)}
.mainnav button[aria-current="true"]{color:var(--brand)}

/* buttons: orange with a light sweep on hover */
.btn.primary,:root[data-theme="light"] .btn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,#F76707,#E8590C);border:1px solid #D9480F;color:#fff;box-shadow:0 3px 0 #A63A08;transition:transform .15s,box-shadow .15s}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn.primary:hover,:root[data-theme="light"] .btn.primary:hover{background:linear-gradient(180deg,#FF7A1A,#F76707);color:#fff;transform:translateY(-2px);box-shadow:0 5px 0 #A63A08}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #A63A08}
:root[data-theme="dark"] .btn.primary{color:#fff}
.btn{transition:transform .15s,border-color .15s,color .15s}
.btn:not(.primary):hover{transform:translateY(-1px)}

/* ---------- hero: vibrant orange block with the chalkboard ---------- */
.hero2,:root[data-theme="light"] .hero2,:root[data-theme="dark"] .hero2{
  background:linear-gradient(125deg,#FFA94D 0%,#FF7A1A 35%,#F76707 60%,#E8590C 100%);
  background-size:200% 200%;animation:sunset 14s ease-in-out infinite alternate;
  border-radius:24px;padding:clamp(22px,4.5vw,52px);color:#2A1205;overflow:hidden;
  box-shadow:0 24px 50px -28px rgba(200,70,0,.6)}
@keyframes sunset{0%{background-position:0% 40%}100%{background-position:100% 60%}}
.hero2::after{display:block;content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(rgba(60,20,0,.12) 1.2px,transparent 1.6px) 0 0/22px 22px;opacity:.6;pointer-events:none}
.hero2 .aurora{display:block;position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.hero2 .aurora i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
.hero2 .aurora i:nth-child(1){width:340px;height:340px;right:-90px;top:-120px;background:radial-gradient(circle,#FFE066 0,rgba(255,224,102,0) 70%);animation:sun 10s ease-in-out infinite alternate}
.hero2 .aurora i:nth-child(2){width:260px;height:260px;left:-80px;bottom:-110px;background:radial-gradient(circle,#FFD8A8 0,rgba(255,216,168,0) 70%);animation:sun 12s ease-in-out infinite alternate-reverse}
.hero2 .aurora i:nth-child(3){display:none}
@keyframes sun{to{transform:translate(-30px,24px) scale(1.12)}}
.floaters{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-40px;font:700 1.25rem "Source Code Pro",monospace;color:rgba(60,20,0,.22);animation:floatup linear infinite}
.floaters span:nth-child(1){left:6%;animation-duration:16s}
.floaters span:nth-child(2){left:18%;animation-duration:21s;animation-delay:-6s;font-size:1.6rem}
.floaters span:nth-child(3){left:31%;animation-duration:18s;animation-delay:-11s}
.floaters span:nth-child(4){left:44%;animation-duration:24s;animation-delay:-3s;font-size:1.05rem}
.floaters span:nth-child(5){left:57%;animation-duration:19s;animation-delay:-14s;font-size:1.4rem}
.floaters span:nth-child(6){left:70%;animation-duration:22s;animation-delay:-8s}
.floaters span:nth-child(7){left:82%;animation-duration:17s;animation-delay:-2s;font-size:1.5rem}
.floaters span:nth-child(8){left:93%;animation-duration:25s;animation-delay:-17s}
@keyframes floatup{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-560px) rotate(25deg);opacity:0}}
.hero2 h1{color:#2A1205;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.hero2 .lead{color:#3D1D08;font-weight:600}
.hero2 .teacher{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6)}
.hero2 .teacher b{color:#2A1205} .hero2 .teacher small{color:#4A2610}
.hero2 .t-av{background:#2A1205;color:#FFC078}
.hero2 .btn.primary,:root[data-theme="light"] .hero2 .btn.primary,:root[data-theme="dark"] .hero2 .btn.primary{background:#2A1205;border-color:#2A1205;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hero2 .btn.primary:hover{background:#000;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.hero2 .btn.ghost-light{background:rgba(255,255,255,.4);border:1.5px solid rgba(42,18,5,.35);color:#2A1205}
.hero2 .btn.ghost-light:hover{background:rgba(255,255,255,.65);border-color:#2A1205;color:#2A1205}
.hero2 .hv-subs button{background:rgba(255,255,255,.4);border:1.5px solid rgba(42,18,5,.25);color:#2A1205}
.hero2 .hv-subs button:hover{background:#2A1205;color:#fff;border-color:#2A1205;transform:translateY(-2px)}
.board{transform:rotate(-1deg);transition:transform .4s;box-shadow:inset 0 0 0 2px #6E4628,inset 0 0 40px rgba(0,0,0,.35),0 22px 40px -18px rgba(60,20,0,.6)}
.board-wrap:hover .board{transform:rotate(0) scale(1.01)}
.tray{transform:rotate(-1deg)}

/* hero entrance (once, on load) */
.hero2 .hero2-copy>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero2 .hero2-copy>*:nth-child(2){animation-delay:.08s}
.hero2 .hero2-copy>*:nth-child(3){animation-delay:.16s}
.hero2 .hero2-copy>*:nth-child(4){animation-delay:.24s}
.hero2 .hero-side{animation:boardin .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes boardin{from{opacity:0;transform:translateY(24px) rotate(2deg)}to{opacity:1;transform:none}}

/* ---------- scroll reveal (staggered) ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal:nth-child(2){transition-delay:.07s}.reveal:nth-child(3){transition-delay:.14s}.reveal:nth-child(4){transition-delay:.21s}.reveal:nth-child(5){transition-delay:.28s}

/* ---------- class tiles: orange notebook covers ---------- */
.ctile{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.ctile:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 2px 0 rgba(0,0,0,.08),0 22px 34px -16px rgba(170,60,0,.55)}
.ctile:hover .ct-label{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.stile{border-top:4px solid var(--sg,var(--brand));transition:transform .25s,box-shadow .25s}
.stile:hover{transform:translateY(-4px);box-shadow:var(--glow)}
.stile:hover .stile-icon{transform:rotate(-8deg) scale(1.08);transition:transform .25s}
.chrow{transition:transform .2s,border-color .2s,box-shadow .2s}
.chrow:hover{transform:translateX(4px);border-color:var(--brand);box-shadow:var(--shadow)}
.mode{transition:transform .2s,border-color .2s}
.mode:hover{transform:translateY(-3px);border-color:var(--brand)}
.hv-subs button,.cont-go{transition:transform .15s,background .15s}

/* small accents */
.step-n,.qa-n,:root[data-theme="light"] .qa-n,:root[data-theme="light"] .step-n{background:linear-gradient(180deg,#F76707,#D9480F);color:#fff}
.step-n{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(247,103,7,.35)}50%{box-shadow:0 0 0 8px rgba(247,103,7,0)}}
.join{border-left-color:#F76707}
.mc-av,.hero2 .t-av{border-radius:12px}
.mc-av{background:linear-gradient(135deg,#F76707,#D9480F)}
.cl-bar i,.bar i{transition:width 1s cubic-bezier(.2,.8,.2,1)}
.iconbtn.bell.has-new svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
.opt.right{animation:popok .4s}
.opt.right::after{content:"✓";margin-left:auto;font-weight:700;color:var(--ok);animation:popok .4s}
.opt.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.codeblock{transition:box-shadow .2s}
.codeblock:hover{box-shadow:0 10px 24px -14px rgba(120,50,0,.45)}
mark{background:#FFE8B0}
.tip{background:#FFF8E6;border-color:#FBD99A;border-left-color:#F59F00}

@media (max-width:520px){.hero2,:root[data-theme="light"] .hero2,:root[data-theme="dark"] .hero2{border-radius:18px}.floaters span{font-size:1rem}.board{transform:none}}
@media (prefers-reduced-motion:reduce){
  .hero2,.topbar::before,.floaters span,.hero2 .aurora i,.step-n,.iconbtn.bell.has-new svg{animation:none!important}
  .floaters{display:none}
  .hero2 .hero2-copy>*,.hero2 .hero-side{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
  .ctile:hover,.stile:hover,.chrow:hover,.mode:hover,.btn:hover{transform:none}
}

/* =====================================================================
   DIGICLASS THEME (v11): two looks, one toggle
   • Black & Purple (default)   • Orange & Mint (sun/moon button)
   Keeps the chalkboard, readable Source Sans text and all motion.
   ===================================================================== */
:root,:root[data-theme="light"]{
  --bg:#F3FBF7; --bg2:#E9F7F0; --surface:#FFFFFF; --surface2:#F7FCFA; --raise:#E3F5EC;
  --line:#D5EDE2; --line2:#B9E0CF;
  --ink:#16201C; --soft:#3F5049; --muted:#6B7C75;
  --brand:#E8590C; --brand-d:#C2410C; --green:#0CA678; --mint:#0CA678; --orange:#E8590C;
  --u0:#E67700; --u1:#E8590C; --u2:#0CA678; --u3:#7048E8; --u4:#E64980; --u5:#1C7ED6; --u6:#C2410C;
  --accent:#E8590C; --accent-bg:#FFEBDC; --accent-line:#FFC29B;
  --ok:#0B8A62; --okbg:#E3F8EF;
  --c11:linear-gradient(135deg,#FF922B 0%,#F76707 100%);
  --c12:linear-gradient(135deg,#12B886 0%,#087F5B 100%);
  --s-cs:#F76707; --s-ip:#0CA678;
  --glass:rgba(255,255,255,.93);
  --glow:0 2px 4px rgba(10,80,60,.06),0 14px 28px -12px rgba(12,166,120,.3);
}
:root[data-theme="dark"]{
  --bg:#0C0A11; --bg2:#110E18; --surface:#17131F; --surface2:#1E1828; --raise:#291F37;
  --line:#2A2139; --line2:#3D3052;
  --ink:#F6F2FC; --soft:#CFC5DE; --muted:#9A8EAD;
  --brand:#B388FF; --brand-d:#9D6BFF; --green:#4BE3AF; --mint:#4BE3AF; --orange:#FF9A4D; --pink:#FF7AC3;
  --u0:#FFC069; --u1:#B388FF; --u2:#4BE3AF; --u3:#FF9A4D; --u4:#FF7AC3; --u5:#6CC4FF; --u6:#FFA94D;
  --accent:#B388FF; --accent-bg:rgba(179,136,255,.14); --accent-line:rgba(179,136,255,.45);
  --ok:#4BE3AF; --okbg:rgba(75,227,175,.12); --bad:#FF6B81; --badbg:rgba(255,107,129,.12);
  --c11:linear-gradient(135deg,#8B3DFF 0%,#D946EF 100%);
  --c12:linear-gradient(135deg,#5B2BD9 0%,#14B8A6 100%);
  --s-cs:#A66BFF; --s-ip:#2FD4A0;
  --glass:rgba(16,13,22,.9); --on-accent:#14091F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6);
  --glow:0 0 0 1px var(--line2),0 18px 36px -16px rgba(139,61,255,.45);
}

/* page background */
:root[data-theme="light"] body,:root:not([data-theme]) body{background:radial-gradient(1000px 560px at 100% -10%,#FFE3CC 0,transparent 60%),radial-gradient(900px 520px at -10% 25%,#D3F9EA 0,transparent 60%),var(--bg);background-attachment:fixed}
:root[data-theme="dark"] body{background:radial-gradient(1000px 600px at 100% -10%,rgba(139,61,255,.22) 0,transparent 60%),radial-gradient(800px 500px at -10% 40%,rgba(20,184,166,.10) 0,transparent 60%),var(--bg);background-attachment:fixed}

/* top stripe */
:root[data-theme="light"] .topbar::before{background:linear-gradient(90deg,#FF922B,#12B886,#F76707,#38D9A9,#FF922B);background-size:300% 100%}
:root[data-theme="dark"] .topbar::before{background:linear-gradient(90deg,#8B3DFF,#D946EF,#4BE3AF,#FF9A4D,#8B3DFF);background-size:300% 100%}
:root[data-theme="dark"] .readbar{background:linear-gradient(90deg,#8B3DFF,#4BE3AF)}
:root[data-theme="light"] .readbar{background:linear-gradient(90deg,#F76707,#12B886)}

/* primary buttons */
:root[data-theme="dark"] .btn.primary{background:linear-gradient(180deg,#9D5CFF,#7C3AED);border-color:#7C3AED;color:#fff;box-shadow:0 3px 0 #4C1D95}
:root[data-theme="dark"] .btn.primary:hover{background:linear-gradient(180deg,#AE75FF,#8B4BFF);color:#fff;box-shadow:0 5px 0 #4C1D95}
:root[data-theme="dark"] .btn:not(.primary):hover{border-color:var(--brand);color:var(--brand)}

/* ---------- hero: Black & Purple ---------- */
:root[data-theme="dark"] .hero2{background:radial-gradient(600px 380px at 85% 10%,rgba(217,70,239,.35),transparent 65%),radial-gradient(520px 360px at 5% 100%,rgba(20,184,166,.28),transparent 65%),linear-gradient(135deg,#1A1028 0%,#120B1D 60%,#0F0A17 100%);background-size:auto;animation:none;border:1px solid #33264A;box-shadow:0 30px 60px -30px rgba(139,61,255,.55);color:#fff}
:root[data-theme="dark"] .hero2::after{background:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.6px) 0 0/22px 22px;opacity:1}
:root[data-theme="dark"] .hero2 .aurora i:nth-child(1){background:radial-gradient(circle,rgba(139,61,255,.75) 0,rgba(139,61,255,0) 70%)}
:root[data-theme="dark"] .hero2 .aurora i:nth-child(2){background:radial-gradient(circle,rgba(75,227,175,.5) 0,rgba(75,227,175,0) 70%)}
:root[data-theme="dark"] .hero2 .aurora i:nth-child(3){display:block;width:220px;height:220px;left:45%;top:-90px;background:radial-gradient(circle,rgba(255,154,77,.4) 0,rgba(255,154,77,0) 70%);animation:sun 9s ease-in-out infinite alternate}
:root[data-theme="dark"] .floaters span{color:rgba(206,180,255,.28)}
:root[data-theme="dark"] .hero2 h1{color:#fff;background:linear-gradient(100deg,#FFFFFF 0%,#E3D3FF 45%,#B388FF 70%,#4BE3AF 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;animation:rise .7s cubic-bezier(.2,.8,.2,1) both,shimmer 8s ease-in-out 1s infinite alternate}
@keyframes shimmer{to{background-position:100% 0}}
:root[data-theme="dark"] .hero2 .lead{color:#D9CFEA;font-weight:500}
:root[data-theme="dark"] .hero2 .teacher{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
:root[data-theme="dark"] .hero2 .teacher b{color:#fff} :root[data-theme="dark"] .hero2 .teacher small{color:#B9AECB}
:root[data-theme="dark"] .hero2 .t-av{background:linear-gradient(135deg,#8B3DFF,#D946EF);color:#fff}
:root[data-theme="dark"] .hero2 .btn.primary{background:linear-gradient(180deg,#4BE3AF,#20C997);border-color:#20C997;color:#0B1F18;box-shadow:0 4px 0 #087F5B}
:root[data-theme="dark"] .hero2 .btn.primary:hover{background:linear-gradient(180deg,#6CF0C1,#38D9A9);color:#0B1F18;box-shadow:0 6px 0 #087F5B}
:root[data-theme="dark"] .hero2 .btn.ghost-light{background:rgba(255,255,255,.06);border:1.5px solid rgba(179,136,255,.55);color:#fff}
:root[data-theme="dark"] .hero2 .btn.ghost-light:hover{background:rgba(179,136,255,.18);border-color:#B388FF;color:#fff}
:root[data-theme="dark"] .hero2 .hv-subs button{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);color:#fff}
:root[data-theme="dark"] .hero2 .hv-subs button:hover{background:#B388FF;border-color:#B388FF;color:#14091F}
:root[data-theme="dark"] .board{box-shadow:inset 0 0 0 2px #6E4628,inset 0 0 40px rgba(0,0,0,.35),0 24px 50px -18px rgba(139,61,255,.55)}

/* ---------- hero: Orange & Mint ---------- */
:root[data-theme="light"] .hero2{background:linear-gradient(125deg,#FFB061 0%,#FF8A3D 40%,#F76707 75%,#FF6B3D 100%);background-size:200% 200%}
:root[data-theme="light"] .hero2 .aurora i:nth-child(2){width:320px;height:320px;background:radial-gradient(circle,rgba(56,217,169,.85) 0,rgba(56,217,169,0) 70%)}
:root[data-theme="light"] .hero2 .aurora i:nth-child(3){display:block;width:180px;height:180px;left:42%;bottom:-70px;background:radial-gradient(circle,rgba(150,242,215,.8) 0,rgba(150,242,215,0) 70%);animation:sun 11s ease-in-out infinite alternate}
:root[data-theme="light"] .hero2 .btn.primary{background:#16201C;border-color:#16201C}
:root[data-theme="light"] .hero2 .t-av{background:#0CA678;color:#fff}
:root[data-theme="light"] .hero2 .hv-subs button:hover{background:#0CA678;border-color:#0CA678;color:#fff}

/* class tiles + small accents */
.ctile:hover{box-shadow:0 22px 34px -16px color-mix(in srgb,var(--brand) 55%,transparent)}
:root[data-theme="dark"] .ctile{border:1px solid rgba(255,255,255,.08)}
:root[data-theme="dark"] .ct-label{background:#fff;color:#14091F}
:root[data-theme="dark"] .step-n,:root[data-theme="dark"] .qa-n{background:linear-gradient(180deg,#9D5CFF,#7C3AED);color:#fff}
:root[data-theme="light"] .qa-n{background:linear-gradient(180deg,#12B886,#0CA678);color:#fff}
:root[data-theme="dark"] .step-n{animation-name:pulsep}
@keyframes pulsep{0%,100%{box-shadow:0 0 0 0 rgba(157,92,255,.45)}50%{box-shadow:0 0 0 9px rgba(157,92,255,0)}}
:root[data-theme="light"] .join{border-left-color:#0CA678}
:root[data-theme="dark"] .join{border-left-color:#B388FF}
:root[data-theme="dark"] .mc-av{background:linear-gradient(135deg,#8B3DFF,#D946EF)}
:root[data-theme="light"] .mc-av{background:linear-gradient(135deg,#12B886,#0CA678)}
:root[data-theme="dark"] .tip{background:rgba(255,192,105,.07);border-color:rgba(255,192,105,.25);border-left-color:#FFC069}
:root[data-theme="dark"] mark{background:rgba(179,136,255,.3);color:#fff}
:root[data-theme="dark"] .qtag{color:#FF7AC3;background:rgba(255,122,195,.1);border-color:rgba(255,122,195,.35)}
:root[data-theme="dark"] .tabbar button[aria-current="true"]{background:rgba(179,136,255,.16);color:#D7C2FF}
:root[data-theme="dark"] details>summary{color:#4BE3AF;border-color:rgba(75,227,175,.4);background:rgba(75,227,175,.08)}
:root[data-theme="dark"] .codeblock{border-color:#2D2340}
:root[data-theme="dark"] .hc-chal{border-color:rgba(179,136,255,.4)}

/* theme switch button shows the other look */
#themeBtn{position:relative}
#themeBtn::after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--surface)}
:root[data-theme="dark"] #themeBtn::after{background:linear-gradient(135deg,#FF922B 50%,#12B886 50%)}
:root[data-theme="light"] #themeBtn::after{background:linear-gradient(135deg,#0C0A11 50%,#8B3DFF 50%)}
@media (prefers-reduced-motion:reduce){:root[data-theme="dark"] .hero2 h1{animation:none}}
</style>

<div class="readbar" id="readbar" aria-hidden="true"></div>
<header class="topbar" id="topbar">
  <div class="tb-in">

      <svg class="mark" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF922B"/><stop offset=".55" stop-color="#F76707"/><stop offset="1" stop-color="#D9480F"/></linearGradient></defs><rect width="36" height="36" rx="11" fill="url(#mk)"/><path d="M11 9.5h6.2a8.5 8.5 0 0 1 0 17H11z" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><rect x="16" y="14.5" width="2.8" height="7" rx="1.4" fill="#F2B705"/></svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF922B"/><stop offset=".5" stop-color="#F76707"/><stop offset="1" stop-color="#D9480F"/></linearGradient></defs></svg>
<script>
/* =====================================================================
   DigiClass catalogue
   ---------------------------------------------------------------------
   To add a new subject later:
   1. Add its curriculum to CURRICULA (if it is new).
   2. Add the subject to SUBJECTS with a unique id, an emoji icon and
      a gradient (grad) for its card.
   3. Add one COURSES.push({...}) per class, with subjectId set to the
      subject's id. Units, chapters and quizzes use the same format as
      the existing courses. Practice questions and a mock paper go in
      EXTRA[courseId] (optional).
   ===================================================================== */
const CURRICULA = [
  { id:"cbse", name:"CBSE curriculum", note:"Content follows the CBSE 2026-27 syllabus for Classes 11 and 12." }
];
const SUBJECTS = [
  { id:"cs", curriculum:"cbse", name:"Computer Science", code:"083", mark:"</>", icon:"💻", color:"var(--u1)",
    grad:"var(--s-cs)",
    blurb:"Python programming, Boolean logic, file handling, stacks, computer networks and SQL databases." },
  { id:"ip", curriculum:"cbse", name:"Informatics Practices", code:"065", mark:"▦", icon:"📊", color:"var(--u3)",
    grad:"var(--s-ip)",
    blurb:"Python, NumPy and Pandas for data handling, charts with Matplotlib, SQL, networks and the digital society." }
];
const COURSES = [];

COURSES.push({ id:"cs11", subjectId:"cs", short:"CS", grade:11, code:"083",

chapters:[
